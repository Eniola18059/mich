<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grade 4 Math Challenge</title>
<style>
:root{--ink:#1f2540;--mut:#667;--acc:#4f46e5;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--line:#e3e6f2}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(160deg,#eef2ff,#fdf4ff);color:var(--ink);min-height:100vh;display:flex;justify-content:center;padding:18px}
.app{width:100%;max-width:680px}
.card{background:#fff;border-radius:18px;padding:24px;box-shadow:0 6px 24px rgba(60,60,120,.12)}
h1{margin:0 0 6px;font-size:1.8rem}
.sub{color:var(--mut);margin:0 0 18px}
.topics{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 20px}
.topics span{background:#eef2ff;color:var(--acc);padding:4px 10px;border-radius:14px;font-size:.82rem;font-weight:600}
button{font:inherit;cursor:pointer}
.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-weight:700;font-size:1rem}
.btn:hover{filter:brightness(1.08)}
.btn.alt{background:#eef2ff;color:var(--acc)}
.bar{height:10px;background:#e8eaf6;border-radius:6px;overflow:hidden;margin-bottom:6px}
.bar div{height:100%;background:linear-gradient(90deg,#4f46e5,#a855f7);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:.88rem;margin-bottom:14px}
.q{font-size:1.15rem;font-weight:600;margin:6px 0 14px;line-height:1.5}
.vis{margin:0 0 14px;padding:12px;background:#f7f8ff;border-radius:12px;overflow-x:auto}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;font-size:1rem;color:var(--ink)}
.opt:hover:not([disabled]){border-color:var(--acc);background:#f5f6ff}
.opt .l{display:inline-block;width:26px;height:26px;border-radius:50%;background:#eef2ff;color:var(--acc);text-align:center;line-height:26px;font-weight:700;margin-right:10px;font-size:.85rem}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.fb{margin-top:14px;padding:14px;border-radius:12px;font-size:.98rem}
.fb.ok{background:var(--okbg)}.fb.no{background:var(--badbg)}
.fb b.h{display:block;margin-bottom:4px}
.strip{display:flex;border:2px solid #333;height:36px;max-width:380px;background:#fff}
.strip div{display:flex;align-items:center;justify-content:center;border-right:2px solid #333;font-weight:700}
.strip div:last-child{border:0}
.s24{flex:4;background:#cfe0ff}.sd{flex:1;background:#ffe9b8}
.brace{max-width:380px;text-align:center;border-top:2px solid #333;font-weight:700;font-size:.85rem;padding-top:2px}
.dots{display:flex;flex-wrap:wrap;gap:8px}
.g{border:2px solid var(--acc);border-radius:8px;padding:3px 6px;font-size:.7rem;letter-spacing:1px;line-height:1.1;width:62px;text-align:center;background:#fff}
.g.r{border:2px dashed var(--ok);background:var(--okbg)}
.score{font-size:3rem;font-weight:800;color:var(--acc);margin:6px 0}
.rev{margin-top:14px;text-align:left}
.rev div{padding:8px 10px;border-bottom:1px solid var(--line);font-size:.92rem}
.rev .x{color:var(--bad);font-weight:700}.rev .v{color:var(--ok);font-weight:700}
.center{text-align:center}
</style>
</head>
<body>
<div class="app"><div class="card" id="root"></div></div>
<script>
function strip(a,n,d,total){var h='<div class="strip"><div class="s24">'+a+'</div>';for(var i=0;i<n;i++)h+='<div class="sd">'+d+'</div>';return h+'</div><div class="brace">'+total+'</div>';}
function dots(groups,size,left){var h='<div class="dots">';for(var i=0;i<groups;i++)h+='<div class="g">'+'●'.repeat(size)+'</div>';if(left)h+='<div class="g r">'+'●'.repeat(left)+'</div>';return h+'</div>';}

// First option in each list is the correct one; options are shuffled when shown.
var Q=[
{q:"Leo was given $48. He saved half of it and will spend the rest over 4 days, the same amount each day. The strip diagram shows the money. Which equation helps find d, the dollars he spends each day?",
 vis:strip('24 saved',4,'d','48'),
 o:["4 × d = 24","4 × d = 48","d ÷ 4 = 24","24 + 4 = d"],
 e:"Half of 48 is 24 saved, so 24 is left to spend. Four equal days of d make 24, so 4 × d = 24. Then d = 24 ÷ 4 = $6."},
{q:"Which expression has a quotient of about 7?",
 o:["29 ÷ 4","33 ÷ 3","40 ÷ 8","18 ÷ 2"],
 e:"29 ÷ 4 is about 7.25. Check: 33 ÷ 3 = 11, 40 ÷ 8 = 5, and 18 ÷ 2 = 9."},
{q:"Which expression has a quotient of about 8?",
 o:["65 ÷ 8","72 ÷ 6","35 ÷ 7","54 ÷ 9"],
 e:"65 ÷ 8 is a little over 8 (8 × 8 = 64). The others give 12, 5, and 6."},
{q:"In which number is the value of the digit in the tens place 10 times the value of the digit in the ones place?",
 o:["322","458","117","640"],
 e:"In 322 the tens digit is worth 20 and the ones digit is worth 2. Since 10 × 2 = 20, it works. In 458 the values are 50 and 8, and 10 × 8 = 80, not 50."},
{q:"Which number has a tens digit worth 10 times the value of its ones digit?",
 o:["488","848","884","808"],
 e:"In 488 the tens digit is worth 80 and the ones digit is worth 8. 10 × 8 = 80, so it fits. In 884 the values are 80 and 4, but 10 × 4 = 40."},
{q:"Each of 15 pumpkins was cut into 6 pieces. The pieces were shared equally among 9 baskets. How many pieces were in each basket?",
 o:["10","90","21","12"],
 e:"15 × 6 = 90 pieces in all. Then 90 ÷ 9 = 10 pieces in each basket. (90 is the total before sharing.)"},
{q:"Kayla walks 14 kilometers each day during October. October has 31 days. How many kilometers does she walk in all?",
 o:["434","424","444","45"],
 e:"14 × 31 = (14 × 30) + (14 × 1) = 420 + 14 = 434 kilometers."},
{q:"Dev had one $20 bill, one $5 bill, three quarters, and two dimes. He bought a book for $12.40. How much money did he have left?",
 o:["$13.55","$13.45","$14.55","$25.95"],
 e:"Dev's money: 20 + 5 + 0.75 + 0.20 = $25.95. After the book: 25.95 − 12.40 = $13.55. ($25.95 is what he had before buying the book.)"},
{q:"Maya had two $10 bills, one $1 bill, four quarters, and one nickel. She spent $9.85 on lunch. How much money does she have now?",
 o:["$12.20","$12.80","$11.20","$22.05"],
 e:"Four quarters make $1.00, so her money is 20 + 1 + 1.00 + 0.05 = $22.05. Then 22.05 − 9.85 = $12.20."},
{q:"A librarian put 756 books on 6 shelves, the same number on each shelf. How many books were on each shelf?",
 o:["126","106","136","156"],
 e:"756 ÷ 6 = 126. Check: 126 × 6 = 756."},
{q:"How is 72,405,863 written in expanded form?",
 o:["70,000,000 + 2,000,000 + 400,000 + 5,000 + 800 + 60 + 3",
    "70,000,000 + 2,000,000 + 40,000 + 5,000 + 800 + 60 + 3",
    "7,000,000 + 200,000 + 400,000 + 5,000 + 800 + 60 + 3",
    "70,000,000 + 2,000,000 + 400,000 + 500 + 800 + 60 + 3"],
 e:"7 is in the ten-millions place, 2 in millions, 4 in hundred-thousands, 0 in ten-thousands (so skip it), 5 in thousands, 8 in hundreds, 6 in tens, 3 in ones."},
{q:"How is 46,150,297 written in expanded form?",
 o:["40,000,000 + 6,000,000 + 100,000 + 50,000 + 200 + 90 + 7",
    "40,000,000 + 6,000,000 + 10,000 + 5,000 + 200 + 90 + 7",
    "4,000,000 + 600,000 + 100,000 + 50,000 + 200 + 90 + 7",
    "40,000,000 + 6,000,000 + 100,000 + 50,000 + 2,000 + 90 + 7"],
 e:"4 = 40,000,000; 6 = 6,000,000; 1 = 100,000; 5 = 50,000; 0 thousands (skip); 2 = 200; 9 = 90; 7 = 7."},
{q:"In the number 38,214,605, what is the value of the digit 8?",
 o:["8,000,000","80,000,000","800,000","8,000"],
 e:"The 8 is in the millions place (3 is in the ten-millions place). So its value is 8,000,000."},
{q:"The model shows 53 counters. They are put into groups of 8, with some left over. Which equation does the model show?",
 vis:dots(6,8,5),
 o:["53 ÷ 8 = 6 r 5","53 ÷ 8 = 6 r 13","53 ÷ 8 = 7 r 5","53 ÷ 8 = 5 r 3"],
 e:"There are 6 full groups of 8 (48 counters) and 5 left over: 48 + 5 = 53. A remainder must be smaller than 8, so 6 r 13 cannot be right."},
{q:"What is 61 ÷ 7?",
 o:["8 r 5","8 r 4","9 r 2","7 r 12"],
 e:"7 × 8 = 56, and 61 − 56 = 5. So 61 ÷ 7 = 8 r 5. (7 × 9 = 63 is too big.)"},
{q:"What is 6.45 − 3.9?",
 o:["2.55","2.65","3.36","2.06"],
 e:"Line up the decimal points and write 3.9 as 3.90. Then 6.45 − 3.90 = 2.55."},
{q:"Ben's tablet battery lasts 8.2 hours. Cara's tablet battery lasts 2.75 hours. What is the difference in hours?",
 o:["5.45","6.45","5.55","6.55"],
 e:"Write 8.2 as 8.20. Then 8.20 − 2.75 = 5.45 hours."},
{q:"Sara was given $36. She saved half and will spend the rest over 3 days, the same amount each day. How much does she spend each day?",
 o:["$6","$12","$18","$9"],
 e:"Half of 36 is 18, so 18 is left to spend. 18 ÷ 3 = $6 per day. ($12 comes from dividing all 36 by 3.)"},
{q:"Which is the best estimate for 412 ÷ 6?",
 o:["70","700","60","80"],
 e:"412 is close to 420, and 420 ÷ 6 = 70. 6 × 60 = 360 is too low, and 6 × 80 = 480 is too high."},
{q:"A school ordered 24 boxes of pencils with 36 pencils in each box. The pencils were shared equally among 9 classrooms. How many pencils did each classroom get?",
 o:["96","86","106","864"],
 e:"24 × 36 = 864 pencils in all. Then 864 ÷ 9 = 96 pencils per classroom."}
];

var root=document.getElementById('root'),i=0,score=0,log=[];
function shuf(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=a[k];a[k]=a[j];a[j]=t;}return a;}

function start(){i=0;score=0;log=[];
 root.innerHTML='<h1>Grade 4 Math Challenge</h1><p class="sub">20 questions. Take your time and show your thinking on paper first.</p>'+
 '<div class="topics"><span>Strip diagrams</span><span>Division</span><span>Place value</span><span>Expanded form</span><span>Money</span><span>Remainders</span><span>Decimals</span></div>'+
 '<button class="btn" onclick="show()">Start quiz</button>';}

function show(){
 var q=Q[i],opts=shuf(q.o),L=['A','B','C','D'];
 var h='<div class="bar"><div style="width:'+(i/Q.length*100)+'%"></div></div><div class="meta"><span>Question '+(i+1)+' of '+Q.length+'</span><span>Score: '+score+'</span></div>';
 h+='<div class="q">'+q.q+'</div>'+(q.vis?'<div class="vis">'+q.vis+'</div>':'');
 opts.forEach(function(o,k){h+='<button class="opt" data-v="'+k+'"><span class="l">'+L[k]+'</span>'+o+'</button>';});
 h+='<div id="fb"></div>';
 root.innerHTML=h;
 var bs=root.querySelectorAll('.opt');
 bs.forEach(function(b,k){b.onclick=function(){pick(b,opts[k],bs,q)};});
}

function pick(b,val,bs,q){
 var ok=val===q.o[0];
 bs.forEach(function(x){x.disabled=true;if(x.textContent.slice(1)===q.o[0])x.classList.add('right');});
 if(!ok)b.classList.add('wrong');
 if(ok)score++;
 log.push({n:i+1,ok:ok,mine:val,right:q.o[0]});
 var last=i===Q.length-1;
 document.getElementById('fb').innerHTML='<div class="fb '+(ok?'ok':'no')+'"><b class="h">'+(ok?'Correct!':'Not quite.')+'</b>'+q.e+'</div><p><button class="btn" id="nx">'+(last?'See my score':'Next question')+'</button></p>';
 document.getElementById('nx').onclick=function(){i++;last?end():show();};
}

function end(){
 var pct=Math.round(score/Q.length*100);
 var msg=pct>=90?'Excellent work!':pct>=70?'Great job!':pct>=50?'Good effort. Review the explanations and try again.':'Keep practising. Try the quiz again after reviewing.';
 var h='<div class="center"><h1>Quiz complete</h1><div class="score">'+score+' / '+Q.length+'</div><p class="sub">'+pct+'%. '+msg+'</p><button class="btn" onclick="start()">Try again</button></div><div class="rev"><b>Review</b>';
 log.forEach(function(r){h+='<div>'+(r.ok?'<span class="v">✓</span>':'<span class="x">✗</span>')+' Q'+r.n+': '+(r.ok?r.right:'you chose '+r.mine+'. Correct: '+r.right)+'</div>';});
 root.innerHTML=h+'</div>';
}
start();
</script>
</body>
</html>
