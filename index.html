<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Science Quiz Challenge</title>
<style>
  :root{
    --bg1:#e0f7ff; --bg2:#fff4d6; --ink:#1f2a44; --card:#ffffff;
    --blue:#2f80ed; --green:#27ae60; --red:#eb5757; --orange:#f2994a; --purple:#9b51e0;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);
    background:linear-gradient(160deg,var(--bg1),var(--bg2));min-height:100vh}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
  .card{background:var(--card);border-radius:24px;padding:26px;box-shadow:0 10px 30px rgba(31,42,68,.12)}
  h1{margin:0 0 6px;font-size:2.2rem;text-align:center}
  .sub{text-align:center;color:#51608a;margin-bottom:20px}
  .big{font-size:4rem;text-align:center;margin:6px 0}
  .topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:18px 0}
  .topic{border-radius:16px;padding:12px 14px;color:#fff;font-weight:700;display:flex;align-items:center;gap:10px}
  .topic span.e{font-size:1.6rem}
  button{font:inherit;cursor:pointer;border:0}
  .btn{background:var(--blue);color:#fff;font-weight:800;font-size:1.15rem;padding:14px 28px;border-radius:999px;
    box-shadow:0 5px 0 #1d5fbd;transition:transform .08s}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1d5fbd}
  .btn.green{background:var(--green);box-shadow:0 5px 0 #1b8a49}
  .center{text-align:center}
  .top{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:10px;gap:8px;flex-wrap:wrap}
  .pill{background:#eef3ff;border-radius:999px;padding:6px 14px}
  .bar{height:14px;background:#e6ebf5;border-radius:999px;overflow:hidden;margin-bottom:18px}
  .bar>div{height:100%;width:0;background:linear-gradient(90deg,var(--orange),var(--green));transition:width .3s}
  .tag{display:inline-block;color:#fff;font-weight:800;font-size:.85rem;padding:4px 12px;border-radius:999px;margin-bottom:10px}
  .q{font-size:1.4rem;font-weight:800;line-height:1.35;margin:4px 0 18px}
  .opts{display:grid;gap:12px}
  .opt{background:#f5f8ff;border:3px solid #d7e2fb;border-radius:16px;padding:14px 16px;text-align:left;
    font-size:1.1rem;font-weight:700;color:var(--ink);display:flex;gap:12px;align-items:center}
  .opt:hover:not(:disabled){border-color:var(--blue);background:#eaf2ff}
  .opt .l{background:var(--blue);color:#fff;border-radius:50%;width:32px;height:32px;flex:none;display:grid;place-items:center;font-weight:800}
  .opt.right{background:#e3f8ea;border-color:var(--green)}
  .opt.right .l{background:var(--green)}
  .opt.wrong{background:#fde8e8;border-color:var(--red)}
  .opt.wrong .l{background:var(--red)}
  .fb{margin-top:16px;border-radius:16px;padding:14px 16px;font-size:1.05rem;line-height:1.45;display:none}
  .fb.show{display:block}
  .fb.good{background:#e3f8ea}
  .fb.bad{background:#fff0e0}
  .fb b{display:block;font-size:1.15rem;margin-bottom:4px}
  .next{margin-top:16px;display:none;text-align:right}
  .next.show{display:block}
  .stars{font-size:2.4rem;text-align:center;letter-spacing:4px}
  .score{font-size:3rem;font-weight:900;text-align:center;color:var(--purple)}
  .break{display:grid;gap:8px;margin:18px 0}
  .row{display:flex;align-items:center;gap:10px}
  .row .n{width:190px;font-weight:700;font-size:.95rem}
  .row .b{flex:1;height:14px;background:#e6ebf5;border-radius:999px;overflow:hidden}
  .row .b>div{height:100%}
  .row .v{width:48px;text-align:right;font-weight:800}
  .miss{background:#fafbff;border:2px solid #e3e9f7;border-radius:14px;padding:12px 14px;margin:10px 0}
  .miss .a{color:var(--green);font-weight:800}
  @media(max-width:520px){.row .n{width:120px;font-size:.85rem}.q{font-size:1.2rem}h1{font-size:1.8rem}}
</style>
</head>
<body>
<div class="wrap">
  <div id="app"></div>
</div>

<script>
const TOPICS = {
  F:{name:"Forces & Magnets",emoji:"🧲",color:"#2f80ed"},
  L:{name:"Life Cycles & Traits",emoji:"🦋",color:"#27ae60"},
  H:{name:"Habitats & Fossils",emoji:"🦕",color:"#f2994a"},
  W:{name:"Weather & Climate",emoji:"⛈️",color:"#9b51e0"},
  S:{name:"Being a Scientist",emoji:"🔬",color:"#eb5757"}
};

// QUESTIONS_START
const Q = [
{"t":"F","q":"What is a force?","a":"A push or a pull on an object","w":["How fast an object is moving","How much matter an object contains","The path an object travels along"],"e":"A force is a push or a pull. Forces can make things start moving, stop, or change direction."},
{"t":"F","q":"A ball rolls farther on a smooth floor than on thick grass. Why?","a":"There is less friction on the smooth floor","w":["Gravity pulls harder on the ball over the floor","The ball gets heavier when it rolls on grass","The grass pushes the ball forward faster"],"e":"Friction is a force that slows things down when surfaces rub together. Grass makes more friction than a smooth floor."},
{"t":"F","q":"Which force pulls objects toward the center of Earth?","a":"Gravity","w":["Friction","Magnetism","Static electricity"],"e":"Gravity pulls everything toward Earth. It is why a dropped pencil falls down."},
{"t":"F","q":"Two teams pull a rope with the same strength and the rope does not move. What does this tell you?","a":"The forces are balanced","w":["The forces are unbalanced","There are no forces on the rope","Only gravity is acting on the rope"],"e":"When forces on an object are equal and opposite, they are balanced and the object's motion does not change."},
{"t":"F","q":"Which object would a magnet attract?","a":"A steel paper clip","w":["A piece of aluminum foil","A smooth glass marble","A plain wooden pencil"],"e":"Magnets attract some metals that contain iron, like steel. They do not attract glass, wood, or rubber."},
{"t":"F","q":"What happens when you push two north poles of magnets close together?","a":"They push away from each other","w":["They pull together and stick tight","They stay the same with no force","The magnets both lose their power"],"e":"Like poles repel (push apart). Opposite poles attract (pull together)."},
{"t":"F","q":"Which statement about magnetic force is true?","a":"It can act on objects without touching them","w":["It only works when the objects are touching","It attracts every kind of material around it","It only pushes objects and never pulls them"],"e":"Magnetic force works across a gap. A magnet can pull a paper clip without touching it."},
{"t":"F","q":"You push a toy car with a bigger force. What happens?","a":"It speeds up more","w":["It speeds up less","It stays at the same speed","It gets heavier"],"e":"A bigger push changes an object's motion more than a small push does."},
{"t":"F","q":"Which is an example of a force that needs no touching?","a":"A magnet pulling a nail across a table","w":["A foot kicking a soccer ball into a net","A hand pushing a shopping cart forward","A bat hitting a baseball over a fence"],"e":"Magnetism and gravity can act from a distance. Kicking, pushing, and hitting all need contact."},
{"t":"F","q":"How could you reduce friction when moving a heavy box?","a":"Put the box on wheels","w":["Put sandpaper under the box","Drag it across a rough carpet","Add heavy rocks inside the box"],"e":"Wheels roll instead of rubbing, so there is less friction."},
{"t":"F","q":"A swing moves back and forth in the same pattern again and again. How does that help you?","a":"You can predict where it will be next","w":["You can stop gravity from pulling on it","You can make the swing weigh less","You can change how heavy the chains are"],"e":"Patterns of motion are repeating, so scientists can use them to predict what will happen next."},
{"t":"F","q":"You squeeze the brakes on a bike. Which force slows the wheels down?","a":"Friction","w":["Gravity","Magnetism","Static electricity"],"e":"The brake pads rub against the wheel. That rubbing is friction."},
{"t":"F","q":"A box is pushed to the right with a big force and to the left with a small force. Which way does it move?","a":"To the right","w":["To the left","It does not move","Straight up"],"e":"The forces are unbalanced. The bigger force wins, so the box moves in its direction."},
{"t":"F","q":"A book sits still on a table. Gravity pulls it down. Why doesn't it fall?","a":"The table pushes up on it with an equal force","w":["Gravity does not pull on objects that are still","Friction from the table holds it up in the air","Magnetism from the table pulls it upward"],"e":"The table pushes up as hard as gravity pulls down, so the forces are balanced."},
{"t":"L","q":"Which list shows the life cycle of a butterfly in the right order?","a":"Egg, caterpillar, chrysalis, adult butterfly","w":["Egg, chrysalis, caterpillar, adult butterfly","Caterpillar, egg, adult butterfly, chrysalis","Adult butterfly, egg, chrysalis, caterpillar"],"e":"A butterfly starts as an egg, hatches into a caterpillar (larva), becomes a chrysalis (pupa), and then an adult."},
{"t":"L","q":"Which animal goes through a pupa stage?","a":"A ladybug","w":["A grasshopper","A frog","A chicken"],"e":"Ladybugs go through complete metamorphosis with a pupa stage. Grasshoppers, frogs, and chickens do not have a pupa."},
{"t":"L","q":"What is a young frog that lives in water called?","a":"A tadpole","w":["A caterpillar","A nymph","A cub"],"e":"A baby frog is a tadpole. It grows legs and lungs as it changes into an adult frog."},
{"t":"L","q":"What stage comes right after a seed sprouts?","a":"Seedling","w":["Blossom","Seed pod","Pollination"],"e":"A sprouted seed becomes a small seedling, which then grows into an adult plant."},
{"t":"L","q":"What is the main job of a flower?","a":"To help the plant make seeds","w":["To store water for the plant","To hold the plant up","To pull minerals from the soil"],"e":"Flowers help plants reproduce by making seeds."},
{"t":"L","q":"Which is an inherited trait?","a":"Eye color","w":["Knowing how to ride a bike","A scar from a fall","Speaking English"],"e":"Inherited traits are passed from parents to children. Skills and scars are not inherited."},
{"t":"L","q":"Which is a learned behavior for a dog?","a":"Sitting down when told to","w":["Having a thick, furry coat","Having four strong legs","Having a cold wet nose"],"e":"Learned behaviors come from training or experience. Fur, legs, and noses are inherited traits."},
{"t":"L","q":"Why do young animals often look like their parents?","a":"They inherit traits from their parents","w":["They eat the same food as their parents","They live in the same place as their parents","They copy how their parents look"],"e":"Parents pass traits to their offspring, so they often look alike."},
{"t":"L","q":"Puppies in the same litter can look a little different. Why?","a":"Each puppy gets a different mix of traits","w":["The puppies all eat different kinds of food","The puppies are really different animals","Only one parent gives traits to the puppies"],"e":"Each offspring inherits a different combination of traits from both parents."},
{"t":"L","q":"A plant grows tall in a sunny window but stays small in a dark closet. What does this show?","a":"The environment can affect how living things grow","w":["Plants always inherit their height from the seed","Plants can grow without any light at all","Sunlight changes the seeds inside the plant"],"e":"Traits can be affected by the environment, such as how much light a plant gets."},
{"t":"L","q":"What is the first stage in the life cycle of a chicken?","a":"Egg","w":["Chick","Nymph","Adult hen"],"e":"A chicken starts as an egg, hatches into a chick, and grows into an adult."},
{"t":"L","q":"At which stage of its life cycle can an animal have babies of its own?","a":"Adult","w":["Egg","Baby","Larva"],"e":"Adults are fully grown and can reproduce, starting a new life cycle."},
{"t":"L","q":"Which statement is true about the life cycle of every living thing?","a":"They are born, grow, reproduce, and die","w":["They all hatch from eggs and then grow up","They all go through a pupa stage first","They all live for exactly one full year"],"e":"Every living thing has a life cycle, but the stages and the length of life are different."},
{"t":"L","q":"Which set of things do plants need to grow?","a":"Sunlight, water, and air","w":["Sunlight, salt, and wind","Shade, sand, and sugar","Moonlight, milk, and rocks"],"e":"Plants use sunlight, water, and air (carbon dioxide) to make their own food."},
{"t":"H","q":"A polar bear has thick fur and a layer of fat. How does this help it?","a":"It keeps the bear warm in the cold","w":["It helps the bear hide in green grass","It helps the bear swim in warm water","It helps the bear climb tall trees"],"e":"Thick fur and fat are adaptations that protect a polar bear from freezing temperatures."},
{"t":"H","q":"A cactus has a thick stem. How does it help the cactus live in the desert?","a":"It stores water for dry times","w":["It lets the cactus grow in deep shade","It makes the cactus float in floods","It keeps the cactus from getting sunlight"],"e":"Cactus stems store water, so the plant can survive long dry periods."},
{"t":"H","q":"What does camouflage do for an animal?","a":"It helps the animal blend in with its surroundings","w":["It helps the animal run much faster than others","It helps the animal find water in dry places","It helps the animal stay warm in cold weather"],"e":"Camouflage helps animals hide from predators or sneak up on prey."},
{"t":"H","q":"What is a habitat?","a":"A home that gives a living thing food and shelter","w":["A kind of food that one animal likes to eat the most","A tool that an animal uses to dig a hole in soil","A group of animals that travel together every year"],"e":"A habitat is the home environment that meets a living thing's needs."},
{"t":"H","q":"What are gills used for?","a":"Breathing underwater","w":["Swimming faster","Finding food in the dark","Staying warm in cold water"],"e":"Fish use gills to take oxygen out of the water."},
{"t":"H","q":"What is a fossil?","a":"The remains or marks of a living thing from long ago","w":["A rock that fell to Earth from outer space long ago","A plant that has only ever lived in water","A tool that was made by early people long ago"],"e":"Fossils are preserved remains, like bones or footprints, of plants and animals that lived long ago."},
{"t":"H","q":"In which kind of rock are fossils most often found?","a":"Sedimentary rock","w":["Igneous rock","Metamorphic rock","Solid iron ore"],"e":"Sedimentary rock forms in layers from mud and sand that can bury and preserve living things."},
{"t":"H","q":"What can fossils tell scientists?","a":"Which plants and animals lived long ago","w":["What the weather will be like next week","How old a person is when they get sick","Where to find fresh water in the desert today"],"e":"Fossils are clues about the past, such as what animals looked like and where they lived."},
{"t":"H","q":"A lake dries up. What might happen to the fish living there?","a":"Some may move away and some may not survive","w":["All of them will grow legs and live on land","All of them will live there just fine","Every fish will quickly learn to breathe air"],"e":"When an environment changes, some living things move, some adapt over time, and some do not survive."},
{"t":"H","q":"How does living in a group help some animals?","a":"They can find food and stay safe together","w":["They can fly higher when they are together","They never have to look for water again","They do not need a shelter or a home"],"e":"Animals in herds, packs, or flocks can warn each other and work together to find food."},
{"t":"H","q":"Which animal is best suited to a hot, dry desert?","a":"A camel","w":["A penguin","A walrus","A moose"],"e":"Camels can go a long time without water and have feet that work well on sand."},
{"t":"H","q":"How do the webbed feet of a duck help it?","a":"They push water when it swims","w":["They dig tunnels in soil","They grip tree branches","They keep it from sinking in sand"],"e":"Webbed feet work like paddles."},
{"t":"H","q":"Which animal is an herbivore?","a":"A deer","w":["A hawk","A shark","A wolf"],"e":"Herbivores eat only plants. Hawks, sharks, and wolves eat other animals."},
{"t":"H","q":"Which of these is a producer in a food chain?","a":"Grass","w":["A rabbit","A fox","A hawk"],"e":"Producers, like grass, make their own food using sunlight. Animals have to eat to get energy."},
{"t":"W","q":"What is weather?","a":"What the air outside is like at a certain time and place","w":["The usual pattern of conditions in a place over many years","The names of the four seasons in a year","How warm the air is inside of a building"],"e":"Weather can change from hour to hour and day to day. Climate is the long-term pattern."},
{"t":"W","q":"Phoenix, Arizona gets very little rain in most years. That describes its...","a":"Climate","w":["Weather","Forecast","Season"],"e":"Climate is the pattern of weather in a place over many years."},
{"t":"W","q":"Which tool measures temperature?","a":"A thermometer","w":["An anemometer","A barometer","A rain gauge"],"e":"A thermometer tells how hot or cold something is."},
{"t":"W","q":"What does a rain gauge measure?","a":"How much rain has fallen","w":["How fast the wind is blowing","How hot the air is","Which way the wind is blowing"],"e":"A rain gauge collects rain so you can measure the amount."},
{"t":"W","q":"What does a wind vane show?","a":"The direction the wind is blowing","w":["The speed that the wind is blowing at","The amount of rain that has fallen","The temperature of the air outside"],"e":"A wind vane points into the wind. An anemometer measures wind speed."},
{"t":"W","q":"Which weather event can cause a flood?","a":"Heavy rain for many hours","w":["A light breeze blowing all day","A clear sunny sky for many days","A cool morning with heavy dew"],"e":"Too much rain too fast can make rivers overflow and water cover the land."},
{"t":"W","q":"What should you do during a tornado warning?","a":"Go to a low, inside room away from windows","w":["Stand near a large window to watch it pass","Go outside to see where the storm is going","Run to the tallest tree and stay under it"],"e":"A low room in the middle of a building with no windows is the safest place."},
{"t":"W","q":"You hear thunder while playing outside. What is the safest choice?","a":"Go inside a building right away","w":["Stand under a tall tree to stay dry","Keep playing until it starts to rain","Hold up a long metal pole to watch"],"e":"If you can hear thunder, lightning can strike. Go indoors and stay there."},
{"t":"W","q":"In the Northern Hemisphere, which season has the shortest days?","a":"Winter","w":["Summer","Spring","Fall"],"e":"In winter the Sun is up for fewer hours, so the days are short and the nights are long."},
{"t":"W","q":"Which climate is cold with snow and ice most of the year?","a":"Polar","w":["Tropical","Desert","Temperate"],"e":"Polar regions, like Antarctica, are very cold all year."},
{"t":"W","q":"Which describes the climate of a tropical rainforest?","a":"Hot and wet most of the year","w":["Cold and dry most of the year","Hot and dry most of the year","Cool with snow in winter"],"e":"Rainforests near the equator get lots of rain and stay warm."},
{"t":"W","q":"The forecast says 95°F and sunny. What should you wear?","a":"Light clothes, a hat, and sunscreen","w":["A heavy coat, gloves, and warm boots","A raincoat, rain boots, and an umbrella","A wool scarf, a sweater, and long pants"],"e":"Choose clothes that match the weather. For hot, sunny days, dress light and protect your skin."},
{"t":"W","q":"Which change in the sky often comes before rain?","a":"Clouds get thick and dark","w":["The sky turns bright blue","Stars become easier to see","Frost forms on the ground"],"e":"Thick, dark clouds are full of water droplets and often bring rain."},
{"t":"W","q":"What happens when water vapor in the air cools down high in the sky?","a":"It condenses into tiny drops that form clouds","w":["It evaporates into the ground right away","It freezes into big hailstones that stay up high","It turns into dust that floats in the air"],"e":"Cooling water vapor condenses into liquid drops. Many drops together make a cloud."},
{"t":"S","q":"What is an experiment?","a":"A fair test to answer a question","w":["A guess that nobody is able to test","A story about something in nature","A list of facts that you find in a book"],"e":"Scientists do experiments to test ideas and find answers."},
{"t":"S","q":"To make a test fair, how many things should you change at a time?","a":"Only one thing at a time","w":["Two things at the same time","Three things at the same time","As many things as you can"],"e":"If you change only one thing, you can tell what caused the result."},
{"t":"S","q":"Which tool helps you see very small details on a leaf?","a":"A hand lens","w":["A thermometer","A ruler","A balance"],"e":"A hand lens (magnifying glass) makes small things look bigger."},
{"t":"S","q":"Which tool measures the mass of a rock?","a":"A balance scale","w":["A metric ruler","A measuring cup","A thermometer"],"e":"Mass is measured with a balance or scale, in grams or kilograms."},
{"t":"S","q":"Which tool would you use to measure 100 mL of water?","a":"A measuring cup","w":["A ruler or tape","A balance scale","A thermometer"],"e":"A measuring cup or graduated cylinder measures liquid volume."},
{"t":"S","q":"Which of these is an observation?","a":"The leaf is green and has five points","w":["The leaf is the prettiest one of them all","The leaf probably fell off the tree yesterday","Leaves are much better than flowers are"],"e":"An observation is something you notice with your senses. Opinions and guesses are not observations."},
{"t":"S","q":"Why do scientists keep careful records?","a":"So others can check and repeat the results","w":["So their experiments take much longer to finish","So they never make a mistake in a test","So they can hide the mistakes they made"],"e":"Good records help other people trust and repeat an experiment."},
{"t":"S","q":"Which unit is used to measure length?","a":"Centimeters","w":["Kilograms","Milliliters","Degrees Celsius"],"e":"Centimeters, inches, and meters measure length. Grams measure mass and liters measure volume."},
{"t":"S","q":"Why do scientists use bar graphs?","a":"To show and compare data","w":["To hide their results","To change the experiment","To make the test longer"],"e":"A bar graph makes it easy to compare numbers at a glance."},
{"t":"S","q":"What is a prediction?","a":"A guess about what will happen","w":["The results you get after a test","A tool used for measuring things","A fact that can never change"],"e":"A prediction is a guess about what will happen, made before a test using what you already know."},
{"t":"S","q":"You test whether light affects how plants grow. Which thing should stay the same for every plant?","a":"The amount of water each plant gets","w":["The amount of light each plant gets","The final height of each plant","Which plant grows tallest"],"e":"Only the thing you are testing (light) should change. Everything else, like water, should stay the same."},
{"t":"S","q":"What is a conclusion?","a":"What you learn from the results of your test","w":["The question you ask before the test begins","The steps you follow during the experiment","The tools you use to measure the results"],"e":"A conclusion explains what your results tell you."},
{"t":"S","q":"Which is a good safety rule in science class?","a":"Wear safety goggles when your teacher says to","w":["Taste the materials to find out what they are","Run around the room while others are working","Mix chemicals together just to see what happens"],"e":"Follow your teacher's directions and use safety gear. Never taste or mix unknown materials."},
{"t":"S","q":"Which unit measures temperature?","a":"Degrees (°F)","w":["Pounds (lb)","Inches (in)","Gallons (gal)"],"e":"Temperature is measured in degrees, such as °F or °C."}
];
// QUESTIONS_END

const app = document.getElementById("app");
let order=[], idx=0, score=0, answered=false, missed=[], byTopic={};

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}

function home(){
  app.innerHTML=`
  <div class="card">
    <div class="big">🔬🌎🦋</div>
    <h1>Science Quiz Challenge</h1>
    <div class="sub">${Q.length} questions · tap the best answer · learn something new with every question!</div>
    <div class="topics">
      ${Object.values(TOPICS).map(t=>`<div class="topic" style="background:${t.color}"><span class="e">${t.emoji}</span>${t.name}</div>`).join("")}
    </div>
    <div class="center"><button class="btn" onclick="start()">Start Quiz 🚀</button></div>
  </div>`;
}

function start(){
  order=shuffle(Q.map((_,i)=>i));
  idx=0;score=0;missed=[];byTopic={};
  Object.keys(TOPICS).forEach(k=>byTopic[k]={c:0,n:0});
  show();
}

function show(){
  const item=Q[order[idx]], T=TOPICS[item.t];
  answered=false;
  const opts=shuffle([item.a,...item.w]);
  app.innerHTML=`
  <div class="card">
    <div class="top"><span class="pill">Question ${idx+1} of ${Q.length}</span><span class="pill">⭐ ${score}</span></div>
    <div class="bar"><div style="width:${idx/Q.length*100}%"></div></div>
    <span class="tag" style="background:${T.color}">${T.emoji} ${T.name}</span>
    <div class="q">${esc(item.q)}</div>
    <div class="opts">
      ${opts.map((o,i)=>`<button class="opt" data-v="${esc(o).replace(/"/g,"&quot;")}"><span class="l">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`).join("")}
    </div>
    <div class="fb" id="fb"></div>
    <div class="next" id="next"><button class="btn green" onclick="nextQ()">${idx===Q.length-1?"See my results 🏆":"Next ➜"}</button></div>
  </div>`;
  document.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>pick(b,item)));
}

function pick(btn,item){
  if(answered)return;
  answered=true;
  const ok=btn.dataset.v===item.a;
  byTopic[item.t].n++;
  document.querySelectorAll(".opt").forEach(b=>{
    b.disabled=true;
    if(b.dataset.v===item.a)b.classList.add("right");
  });
  const fb=document.getElementById("fb");
  if(ok){score++;byTopic[item.t].c++;btn.classList.add("right");
    fb.className="fb show good";fb.innerHTML=`<b>🎉 Correct!</b>${esc(item.e)}`;}
  else{btn.classList.add("wrong");missed.push(item);
    fb.className="fb show bad";fb.innerHTML=`<b>Good try! The answer is: ${esc(item.a)}</b>${esc(item.e)}`;}
  document.getElementById("next").classList.add("show");
  document.querySelector(".top .pill:last-child").textContent="⭐ "+score;
}

function nextQ(){idx++;idx>=Q.length?results():show();}

function results(){
  const pct=Math.round(score/Q.length*100);
  const stars=pct>=90?"⭐⭐⭐⭐⭐":pct>=75?"⭐⭐⭐⭐":pct>=60?"⭐⭐⭐":pct>=40?"⭐⭐":"⭐";
  const msg=pct>=90?"Super scientist! Amazing work!":pct>=75?"Great job! You really know your science!":pct>=60?"Nice work! Keep exploring!":"Good effort! Practice makes you stronger. Try again!";
  app.innerHTML=`
  <div class="card">
    <div class="big">🏆</div>
    <h1>Quiz Complete!</h1>
    <div class="stars">${stars}</div>
    <div class="score">${score} / ${Q.length}</div>
    <div class="sub">${msg} (${pct}%)</div>
    <div class="break">
      ${Object.entries(TOPICS).map(([k,t])=>{const r=byTopic[k];const p=r.n?Math.round(r.c/r.n*100):0;
        return `<div class="row"><div class="n">${t.emoji} ${t.name}</div><div class="b"><div style="width:${p}%;background:${t.color}"></div></div><div class="v">${r.c}/${r.n}</div></div>`}).join("")}
    </div>
    <div class="center" style="margin:18px 0"><button class="btn" onclick="start()">Play Again 🔁</button></div>
    ${missed.length?`<h2>📝 Questions to review (${missed.length})</h2>`+missed.map(m=>`<div class="miss"><div><b>${esc(m.q)}</b></div><div class="a">✔ ${esc(m.a)}</div><div>${esc(m.e)}</div></div>`).join(""):`<h2 class="center">🌟 You got every question right!</h2>`}
  </div>`;
  window.scrollTo({top:0,behavior:"smooth"});
}

home();
</script>
</body>
</html>
