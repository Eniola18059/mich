<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rhyme Time Quiz</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Comic Sans MS","Trebuchet MS",system-ui,sans-serif;background:linear-gradient(160deg,#fff4d6,#e3f4ff);min-height:100vh;color:#2b2b44;display:flex;justify-content:center;padding:16px}
.app{width:100%;max-width:720px}
.card{background:#fff;border-radius:24px;box-shadow:0 8px 24px rgba(60,60,120,.15);padding:24px;margin-top:12px}
h1{margin:0;text-align:center;font-size:2.2rem;color:#ff6b6b}
.sub{text-align:center;margin:6px 0 0;color:#5a5a7a}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:bold;gap:10px}
.bar{height:14px;background:#e8eaf6;border-radius:10px;overflow:hidden;margin:10px 0 0}
.bar div{height:100%;width:0;background:linear-gradient(90deg,#4dd0a1,#4da6ff);transition:width .3s}
.prompt{font-size:1.4rem;text-align:center;margin:18px 0 6px}
.big{font-size:3rem;font-weight:bold;text-align:center;color:#7c4dff;margin:4px 0 14px}
.line{font-size:1.7rem;text-align:center;font-weight:bold;color:#7c4dff;margin:4px 0 14px;line-height:1.3}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{font:inherit;font-size:1.6rem;font-weight:bold;padding:18px 8px;border:3px solid #d6dcff;background:#f6f8ff;border-radius:18px;cursor:pointer;transition:transform .1s}
.opt:hover:enabled{transform:scale(1.03);border-color:#7c4dff}
.opt.right{background:#c9f7e0;border-color:#2fb87a}
.opt.wrong{background:#ffd9d9;border-color:#ee5a5a}
.opt:disabled{cursor:default}
.btn{font:inherit;font-size:1.2rem;font-weight:bold;border:none;border-radius:16px;padding:12px 22px;cursor:pointer;background:#ff6b6b;color:#fff}
.btn.alt{background:#7c4dff}
.btn.ghost{background:#e8eaf6;color:#3a3a6a}
.row{display:flex;justify-content:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.fb{text-align:center;font-size:1.25rem;min-height:2.2em;margin-top:14px;font-weight:bold}
.fb.ok{color:#1f9d64}.fb.no{color:#d64545}
.score{font-size:4rem;text-align:center;font-weight:bold;color:#ff6b6b}
.stars{font-size:2.2rem;text-align:center}
.miss{background:#fff7e6;border-radius:14px;padding:10px 14px;margin:8px 0;font-size:1.05rem}
.hide{display:none}
@media(max-width:480px){.opt{font-size:1.3rem}.big{font-size:2.4rem}}
</style>
</head>
<body>
<div class="app">
  <h1>🎵 Rhyme Time! 🎵</h1>
  <p class="sub">Rhyming words sound the same at the end, like <b>cat</b> and <b>hat</b>.</p>

  <div id="start" class="card">
    <p style="font-size:1.3rem;text-align:center">50 fun questions about rhyming words.<br>Tap 🔊 if you want the question read aloud!</p>
    <p id="best" class="sub"></p>
    <div class="row"><button class="btn" id="go">Let's Start! 🚀</button></div>
  </div>

  <div id="quiz" class="card hide">
    <div class="top"><span id="qn"></span><span id="sc"></span></div>
    <div class="bar"><div id="pb"></div></div>
    <div class="prompt" id="prompt"></div>
    <div id="visual"></div>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb"></div>
    <div class="row">
      <button class="btn ghost" id="say">🔊 Read to me</button>
      <button class="btn alt hide" id="next">Next ➜</button>
    </div>
  </div>

  <div id="end" class="card hide">
    <div class="stars" id="stars"></div>
    <div class="score" id="final"></div>
    <p class="prompt" id="msg"></p>
    <div id="missed"></div>
    <div class="row"><button class="btn" id="again">Play Again 🔁</button></div>
  </div>
</div>

<script>
/* Question types:
   A = which word rhymes with [word]
   B = which word does NOT rhyme with the others
   C = which pair rhymes
   D = finish the rhyme */
var Q = [
 // A: rhymes with
 {t:'A',w:'cat',a:'hat',o:['cap','cut','cot']},
 {t:'A',w:'dog',a:'log',o:['dig','dot','door']},
 {t:'A',w:'sun',a:'run',o:['sand','sip','moon']},
 {t:'A',w:'bee',a:'tree',o:['bed','bat','bell']},
 {t:'A',w:'pen',a:'ten',o:['pan','pig','pin']},
 {t:'A',w:'bug',a:'hug',o:['bag','big','bun']},
 {t:'A',w:'cake',a:'lake',o:['cap','kite','cook']},
 {t:'A',w:'star',a:'car',o:['stir','step','sun']},
 {t:'A',w:'ball',a:'wall',o:['bell','bill','bat']},
 {t:'A',w:'fish',a:'dish',o:['fit','fist','fan']},
 {t:'A',w:'moon',a:'spoon',o:['man','mop','mouse']},
 {t:'A',w:'king',a:'ring',o:['kick','kid','kite']},
 {t:'A',w:'boat',a:'coat',o:['bat','bone','book']},
 {t:'A',w:'rain',a:'train',o:['ran','run','road']},
 {t:'A',w:'light',a:'night',o:['list','lick','lake']},
 {t:'A',w:'snow',a:'toe',o:['now','snap','sock']},
 {t:'A',w:'mouse',a:'house',o:['moon','mop','mice']},
 {t:'A',w:'bed',a:'red',o:['bad','bud','bone']},
 {t:'A',w:'bell',a:'shell',o:['ball','bed','bill']},
 {t:'A',w:'tent',a:'went',o:['tint','tan','test']},
 {t:'A',w:'duck',a:'truck',o:['dock','deck','dig']},
 {t:'A',w:'clock',a:'sock',o:['cluck','clap','cloud']},
 {t:'A',w:'nest',a:'best',o:['net','nose','neck']},
 {t:'A',w:'bear',a:'chair',o:['bean','bird','bark']},
 {t:'A',w:'blue',a:'shoe',o:['blow','black','bee']},
 {t:'A',w:'jump',a:'bump',o:['jam','jet','junk']},
 {t:'A',w:'pie',a:'sky',o:['pig','pea','pin']},
 {t:'A',w:'hop',a:'top',o:['hip','hog','hope']},
 {t:'A',w:'gate',a:'plate',o:['gap','goat','get']},
 {t:'A',w:'sing',a:'wing',o:['sang','song','sit']},
 // B: odd one out
 {t:'B',a:'cup',o:['cat','hat','bat']},
 {t:'B',a:'pan',o:['pig','wig','dig']},
 {t:'B',a:'sand',o:['sun','run','fun']},
 {t:'B',a:'bed',o:['bell','well','tell']},
 {t:'B',a:'kit',o:['king','ring','wing']},
 {t:'B',a:'cap',o:['car','star','jar']},
 {t:'B',a:'kite',o:['cake','lake','bake']},
 {t:'B',a:'run',o:['rain','train','plane']},
 // C: which pair rhymes
 {t:'C',a:'cat – hat',o:['cat – cut','cat – cot','cat – cap']},
 {t:'C',a:'bed – red',o:['bed – bad','bed – bud','bed – bid']},
 {t:'C',a:'pin – win',o:['pin – pan','pin – pen','pin – pie']},
 {t:'C',a:'hop – mop',o:['hop – hip','hop – hope','hop – hug']},
 {t:'C',a:'box – fox',o:['box – bag','box – book','box – boy']},
 {t:'C',a:'mail – tail',o:['mail – mill','mail – meal','mail – man']},
 // D: finish the rhyme
 {t:'D',line:'Jack and Jill went up the ___',rw:'Jill',a:'hill',o:['hall','hole','hat']},
 {t:'D',line:'Twinkle, twinkle, little star, how I wonder what you ___',rw:'star',a:'are',o:['air','and','our']},
 {t:'D',line:'Humpty Dumpty sat on a ___',rw:'Dumpty',a:'wall',o:['well','wild','wing']},
 {t:'D',line:'The mouse ran up the ___',rw:'dock',a:'clock',o:['cloud','cook','cow']},
 {t:'D',line:'Little Bo Peep has lost her ___',rw:'Peep',a:'sheep',o:['ship','shoe','shop']},
 {t:'D',line:'Jack be nimble, Jack be quick, Jack jump over the candle ___',rw:'quick',a:'stick',o:['stack','step','sock']}
];

function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function $(id){return document.getElementById(id)}

var order,idx,score,missed,locked,cur;

function getBest(){try{return localStorage.getItem('rhymeBest')}catch(e){return null}}
function setBest(v){try{localStorage.setItem('rhymeBest',v)}catch(e){}}
function showBest(){var b=getBest();$('best').textContent=b?('Your best score: '+b+' / 50 ⭐'):''}

function start(){
  order=shuffle(Q);idx=0;score=0;missed=[];
  $('start').classList.add('hide');$('end').classList.add('hide');$('quiz').classList.remove('hide');
  show();
}

function promptFor(q){
  if(q.t==='A')return 'Which word rhymes with…';
  if(q.t==='B')return 'Which word does NOT rhyme with the others?';
  if(q.t==='C')return 'Which two words rhyme?';
  return 'Finish the rhyme!';
}

function show(){
  cur=order[idx];locked=false;
  $('qn').textContent='Question '+(idx+1)+' of 50';
  $('sc').textContent='⭐ '+score;
  $('pb').style.width=(idx/50*100)+'%';
  $('prompt').textContent=promptFor(cur);
  var v=$('visual');
  if(cur.t==='A')v.innerHTML='<div class="big">'+cur.w+'</div>';
  else if(cur.t==='D')v.innerHTML='<div class="line">'+cur.line.replace('___','<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>')+'</div>';
  else v.innerHTML='<div style="height:10px"></div>';
  $('fb').textContent='';$('fb').className='fb';
  $('next').classList.add('hide');
  var box=$('opts');box.innerHTML='';
  shuffle([cur.a].concat(cur.o)).forEach(function(txt){
    var b=document.createElement('button');
    b.className='opt';b.textContent=txt;
    b.onclick=function(){pick(b,txt)};
    box.appendChild(b);
  });
}

function why(q){
  if(q.t==='A')return q.w+' and '+q.a+' rhyme!';
  if(q.t==='B')return q.o.join(', ')+' rhyme. '+q.a+' does not.';
  if(q.t==='C')return q.a.replace(' – ',' and ')+' rhyme!';
  return q.a+' rhymes with '+q.rw+'!';
}

function pick(btn,txt){
  if(locked)return;locked=true;
  var ok=txt===cur.a;
  var all=$('opts').children;
  for(var i=0;i<all.length;i++){
    all[i].disabled=true;
    if(all[i].textContent===cur.a)all[i].classList.add('right');
  }
  if(ok){score++;$('fb').textContent='🎉 Yes! '+why(cur);$('fb').className='fb ok'}
  else{btn.classList.add('wrong');missed.push(cur);$('fb').textContent='Oops! '+why(cur);$('fb').className='fb no'}
  $('sc').textContent='⭐ '+score;
  $('next').textContent=idx===49?'See my score 🏆':'Next ➜';
  $('next').classList.remove('hide');
}

function next(){
  idx++;
  if(idx>=50)finish();else show();
}

function finish(){
  $('quiz').classList.add('hide');$('end').classList.remove('hide');
  $('final').textContent=score+' / 50';
  var s=score>=45?5:score>=38?4:score>=30?3:score>=20?2:1;
  $('stars').textContent=new Array(s+1).join('⭐');
  $('msg').textContent=score>=45?'Amazing rhyming superstar!':score>=38?'Great job! You know your rhymes!':score>=30?'Good work! Keep practicing!':'Nice try! Let\'s practice again!';
  var b=getBest();if(!b||score>parseInt(b,10))setBest(score);
  var m=$('missed');m.innerHTML='';
  if(missed.length){
    var h=document.createElement('div');h.style.fontWeight='bold';h.style.margin='10px 0 4px';h.textContent='Let\'s look at the ones to practice:';m.appendChild(h);
    missed.forEach(function(q){var d=document.createElement('div');d.className='miss';d.textContent=why(q);m.appendChild(d)});
  }
}

function speak(){
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  var parts=[promptFor(cur)];
  if(cur.t==='A')parts.push(cur.w);
  if(cur.t==='D')parts.push(cur.line.replace('___','blank'));
  var opts=$('opts').children;
  for(var i=0;i<opts.length;i++)parts.push(opts[i].textContent.replace(' – ',' and '));
  var u=new SpeechSynthesisUtterance(parts.join('. '));
  u.lang='en-US';u.rate=0.85;
  window.speechSynthesis.speak(u);
}

$('go').onclick=start;
$('again').onclick=function(){showBest();start()};
$('next').onclick=next;
$('say').onclick=speak;
showBest();
</script>
</body>
</html>
