<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math Homework Solutions</title>
<style>
  :root{--bg:#f4f8fb;--card:#fff;--ink:#1d2b3a;--muted:#5b6b7b;--accent:#2563eb;--ok:#15803d;--okbg:#e8f6ec;--line:#dbe4ee}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
  header{background:linear-gradient(135deg,#2563eb,#0ea5e9);color:#fff;padding:32px 20px;text-align:center}
  header h1{margin:0 0 6px;font-size:1.9rem}
  header p{margin:0;opacity:.92}
  main{max-width:820px;margin:0 auto;padding:20px 16px 60px}
  .key{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:20px 0}
  .key h2{margin:0 0 10px;font-size:1.1rem}
  .keygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
  .keygrid a{display:flex;justify-content:space-between;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;text-decoration:none;color:var(--ink);font-weight:600}
  .keygrid a span{color:var(--ok)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin:18px 0;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .tag{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);background:#e7efff;border-radius:999px;padding:3px 10px}
  .card h3{margin:10px 0 12px;font-size:1.1rem;font-weight:600}
  .opts{display:grid;gap:8px;margin:12px 0}
  .opt{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff}
  .opt b{min-width:26px;height:26px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:.85rem}
  .opt.correct{border-color:var(--ok);background:var(--okbg)}
  .opt.correct b{background:var(--ok);color:#fff}
  .opt .viz{flex:1}
  .ans{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--okbg);color:#14532d;font-weight:700}
  .steps{margin:12px 0 0;padding:0;list-style:none;counter-reset:s}
  .steps li{counter-increment:s;position:relative;padding:6px 0 6px 38px}
  .steps li::before{content:counter(s);position:absolute;left:0;top:6px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:.8rem;font-weight:700}
  .wrong{color:var(--muted);font-size:.93rem;margin-top:10px}
  table{border-collapse:collapse;margin:10px 0;width:100%;font-size:.95rem}
  th,td{border:1px solid var(--line);padding:6px 10px;text-align:left}
  th{background:var(--bg)}
  tr.best td{background:var(--okbg);font-weight:600}
  .bar{display:flex;gap:3px;margin:3px 0}
  .bar div{border:1.5px solid #334155;border-radius:3px;text-align:center;font-size:.8rem;padding:2px 0;background:#fff}
  .grid{display:grid;gap:1px;background:#94a3b8;border:1px solid #94a3b8;width:100%;max-width:420px;margin:12px 0}
  .grid i{aspect-ratio:1;background:#bfdbfe}
  .grid i.b{background:#fde68a}.grid i.c{background:#bbf7d0}.grid i.d{background:#fecaca}
  .note{font-size:.85rem;color:var(--muted);margin-top:6px}
  footer{text-align:center;color:var(--muted);font-size:.85rem;padding:10px}
  @media print{header{background:#fff;color:#000}.card{break-inside:avoid;box-shadow:none}}
</style>
</head>
<body>
<header>
  <h1>Math Homework Solutions</h1>
  <p>Due Friday, November 20, 2026 · 10 questions with full working</p>
</header>
<main>
  <section class="key"><h2>Answer key (tap to jump)</h2><div class="keygrid" id="key"></div></section>
  <div id="problems"></div>
</main>
<footer>Each answer is highlighted in green, with the steps shown underneath.</footer>

<script>
function bar(parts){ // parts: [[label, flex],...]
  return '<div class="bar">'+parts.map(p=>`<div style="flex:${p[1]}">${p[0]}</div>`).join('')+'</div>';
}
function dia(top, bottom){ return bar(top)+bar(bottom); }

const P = [
 {
  tag:"Comparing amounts · multiplication",
  q:"Tina has 8 packs of paper. Each of her packs contains 50 sheets. Chaz has 3 packs of paper. Each of his packs contains 125 sheets. Juan has 350 sheets of paper. Which statement is true?",
  opts:[["F","Juan has the most paper."],["G","Tina and Juan have the same amount of paper."],["H","Tina has the most paper."],["J","Tina and Chaz have the same amount of paper."]],
  ans:"H", ansText:"Tina has the most paper.",
  steps:["Tina: 8 packs × 50 sheets = <b>400 sheets</b>.","Chaz: 3 packs × 125 sheets = <b>375 sheets</b>.","Juan: <b>350 sheets</b> (already given).","Compare: 400 &gt; 375 &gt; 350, so Tina has the most."],
  wrong:"F is false (Juan has the least). G is false (400 ≠ 350). J is false (400 ≠ 375)."
 },
 {
  tag:"Area model",
  q:"Look at the area model shown on the sheet. Which expression is represented by the area model?",
  opts:[["A","15 × 12"],["B","16 × 13"],["C","14 × 13"],["D","15 × 13"]],
  ans:"B", ansText:"16 × 13",
  extra:"area",
  steps:["The area model is a rectangle made of small squares.","Count the squares across the top: <b>16 columns</b>.","Count the squares down the side: <b>13 rows</b>.","The area of a rectangle is columns × rows, so the expression is <b>16 × 13</b> (= 208)."],
  wrong:"Check by counting on your sheet: 16 across and 13 down. The other options each have a different count."
 },
 {
  tag:"Estimating sums · rounding",
  q:"A truck hauled 1,487 pounds of stone, 3,292 pounds of bricks, and 4,437 pounds of lumber. The value of which expression is closest to the total weight of the stone, bricks, and lumber?",
  opts:[["F","1,000 + 3,000 + 4,000"],["G","1,500 + 3,300 + 4,400"],["H","2,000 + 3,000 + 5,000"],["J","1,400 + 3,200 + 4,400"]],
  ans:"G", ansText:"1,500 + 3,300 + 4,400",
  extra:"truck",
  steps:["Find the exact total: 1,487 + 3,292 + 4,437 = <b>9,216</b>.","Work out each option's total (see the table).","Find which total is closest to 9,216. G = 9,200 is only 16 away."],
  wrong:"F is 1,216 away, H is 784 away, and J is 216 away."
 },
 {
  tag:"Strip diagram",
  q:"Mr. Delgado paid a total of $18 for 3 large burgers and 1 small burger. Each large burger cost $5. Which diagram best represents this situation where B is the cost of the small burger?",
  opts:[
   ["F","",dia([["$18",1]],[["$5",5],["$5",5],["$5",5],["B",3]])],
   ["G","",dia([["$18",1]],[["$5",1],["$5",1],["$5",1],["B",4]])],
   ["H","",dia([["B",1]],[["$18",3],["$18",3],["$18",3],["$5",3]])],
   ["J","",dia([["B",1]],[["$18",4],["$5",3],["$5",3]])]
  ],
  ans:"F", ansText:"Diagram F",
  steps:["The whole amount is <b>$18</b>, so $18 is the long bar on top.","The whole is made of <b>3 large burgers ($5 each) + 1 small burger (B)</b>: $5, $5, $5, B.","That gives 5 + 5 + 5 + B = 18, so B = 3. B is smaller than $5, so its piece is the smallest. Only diagram F shows this."],
  wrong:"G draws B bigger than each $5 piece, which does not match B = $3. H and J put $18 in the parts and B as the whole, which is backwards."
 },
 {
  tag:"Choosing the equation",
  q:"Ricardo has 18 purple grapes and 14 green grapes. He will give half of these grapes to his brother. Which equation can be used to find B, the number of grapes he will give to his brother?",
  opts:[["A","B = (18 + 14) × 2"],["B","B = (18 + 14) + 2"],["C","B = (18 + 14) ÷ 2"],["D","B = (18 + 14) − 2"]],
  ans:"C", ansText:"B = (18 + 14) ÷ 2",
  steps:["Total grapes: 18 + 14 = <b>32</b>.","\"Half of\" means divide by 2.","So B = (18 + 14) ÷ 2 = 32 ÷ 2 = <b>16 grapes</b>."],
  wrong:"× 2 would double the grapes, + 2 and − 2 only add or take away two grapes. None of these finds half."
 },
 {
  tag:"Place value",
  q:"The population of San Antonio, Texas is 1,409,019. Which shows a way to express the value of the 4 in this number?",
  opts:[["F","4 × 100,000"],["G","4 × 1,000,000"],["H","4 × 1,000"],["J","4 × 10,000"]],
  ans:"F", ansText:"4 × 100,000",
  extra:"place",
  steps:["Read the places from the left: 1 (millions), <b>4 (hundred thousands)</b>, 0 (ten thousands), 9 (thousands), 0 (hundreds), 1 (tens), 9 (ones).","The 4 is in the hundred thousands place.","Its value is 4 × 100,000 = 400,000."],
  wrong:"G would be the millions place, H the thousands place and J the ten thousands place."
 },
 {
  tag:"Division word problem",
  q:"The students in Mr. Schieffer's class used 1,728 toothpicks and 8 ounces of glue to build 6 toothpick bridges. Each bridge was constructed with the same number of toothpicks. How many toothpicks were used to build each bridge?",
  opts:[["A","274"],["B","216"],["C","288"],["D","208"]],
  ans:"C", ansText:"288",
  steps:["Share the toothpicks equally among the bridges: 1,728 ÷ 6. (The 8 ounces of glue is extra information.)","17 ÷ 6 = 2 remainder 5. Bring down 2: 52 ÷ 6 = 8 remainder 4. Bring down 8: 48 ÷ 6 = 8.","1,728 ÷ 6 = <b>288</b>.","Check: 288 × 6 = 1,728 ✓"],
  wrong:"Multiplying each other option by 6 does not give 1,728 (274 × 6 = 1,644, 216 × 6 = 1,296, 208 × 6 = 1,248)."
 },
 {
  tag:"Rounding large numbers",
  q:"Gregorio researched the population of the United States on the Internet and found it to be 318,224,475. Which shows this number rounded to the nearest ten thousand?",
  opts:[["F","320,000,000"],["G","318,200,000"],["H","318,224,000"],["J","318,220,000"]],
  ans:"J", ansText:"318,220,000",
  steps:["Find the ten thousands place in 318,224,475: it is the second 2, in <b>318,2<u>2</u>4,475</b>.","Look at the digit to its right (thousands): it is <b>4</b>.","4 is less than 5, so the 2 stays the same and everything to its right becomes zeros.","The answer is <b>318,220,000</b>."],
  wrong:"F rounds to the nearest ten million, G to the nearest hundred thousand and H to the nearest thousand."
 },
 {
  tag:"Choosing the equation",
  q:"Theater tickets cost $18 each for adults and $7 each for children. Which equation can be used to find T, the total amount of money that tickets for 2 adults and 1 child will cost?",
  opts:[["F","T = (2 × 18) − 7"],["G","T = 2 + 18 + 7"],["H","T = (2 × 18) + 7"],["J","T = (18 ÷ 2) + 7"]],
  ans:"H", ansText:"T = (2 × 18) + 7",
  steps:["2 adults at $18 each: 2 × 18 = <b>$36</b>.","1 child at $7: add <b>$7</b>.","T = (2 × 18) + 7 = 36 + 7 = <b>$43</b>."],
  wrong:"F subtracts the child ticket, G adds instead of multiplying for the 2 adults, and J divides 18 by 2."
 },
 {
  tag:"Estimating quotients",
  q:"In 8 trips, Keisha will carry a total of 158 books to a book room. If she carries about the same number of books on each trip, which is the best estimate of the number of books she will carry on the first trip?",
  opts:[["A","20"],["B","40"],["C","30"],["D","60"]],
  ans:"A", ansText:"20",
  steps:["Round 158 to a friendly number: 158 ≈ <b>160</b>.","Divide by the 8 trips: 160 ÷ 8 = <b>20</b>.","Check: 20 × 8 = 160, which is close to 158 ✓"],
  wrong:"B, C and D are too big: 40 × 8 = 320, 30 × 8 = 240 and 60 × 8 = 480."
 }
];

function extraHTML(kind){
  if(kind==="area"){
    let h='<div class="grid" style="grid-template-columns:repeat(16,1fr)">';
    for(let r=0;r<13;r++)for(let c=0;c<16;c++){
      h+='<i class="'+(r<10?(c<10?'':'b'):(c<10?'c':'d'))+'"></i>';
    }
    h+='</div><div class="note">Picture of a 16 × 13 area model. Split into 16 × 10 = 160 and 16 × 3 = 48, so 160 + 48 = 208 squares in total.</div>';
    return h;
  }
  if(kind==="truck"){
    return `<table><tr><th>Option</th><th>Total</th><th>Distance from 9,216</th></tr>
    <tr><td>F</td><td>8,000</td><td>1,216</td></tr>
    <tr class="best"><td>G</td><td>9,200</td><td>16</td></tr>
    <tr><td>H</td><td>10,000</td><td>784</td></tr>
    <tr><td>J</td><td>9,000</td><td>216</td></tr></table>`;
  }
  if(kind==="place"){
    const d=[["1","millions"],["4","hundred thousands"],["0","ten thousands"],["9","thousands"],["0","hundreds"],["1","tens"],["9","ones"]];
    return '<table><tr>'+d.map((x,i)=>`<th${i==1?' style="background:#bbf7d0"':''}>${x[1]}</th>`).join('')+'</tr><tr>'+d.map((x,i)=>`<td${i==1?' style="background:#bbf7d0;font-weight:700"':''}>${x[0]}</td>`).join('')+'</tr></table>';
  }
  return '';
}

const box=document.getElementById('problems'), key=document.getElementById('key');
P.forEach((p,i)=>{
  const n=i+1;
  key.insertAdjacentHTML('beforeend',`<a href="#q${n}">Q${n} <span>${p.ans}</span></a>`);
  const opts=p.opts.map(o=>`<div class="opt ${o[0]===p.ans?'correct':''}"><b>${o[0]}</b>${o[2]?`<div class="viz">${o[2]}</div>`:`<span>${o[1]}</span>`}${o[0]===p.ans?' <span style="margin-left:auto;color:var(--ok);font-weight:700">✓</span>':''}</div>`).join('');
  box.insertAdjacentHTML('beforeend',`
  <article class="card" id="q${n}">
    <span class="tag">Question ${n} · ${p.tag}</span>
    <h3>${p.q}</h3>
    <div class="opts">${opts}</div>
    <div class="ans">Answer: ${p.ans} — ${p.ansText}</div>
    <ol class="steps">${p.steps.map(s=>`<li>${s}</li>`).join('')}</ol>
    ${p.extra?extraHTML(p.extra):''}
    <div class="wrong"><b>Why the others are wrong:</b> ${p.wrong}</div>
  </article>`);
});
</script>
</body>
</html>
