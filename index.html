<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Little Readers Story Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: sticky header with progress; story card beside the question card on wide screens, stacked on phones. */
:root{
  --bg:#F3F6FA; --card:#FFFFFF; --ink:#1B2A41; --muted:#5B6B82; --line:#D9E1EC;
  --accent:#0F7F86; --accent-ink:#FFFFFF; --sun:#F2B134; --sun-soft:#FFF4D6;
  --good:#1E8E4E; --good-soft:#E1F5E9; --bad:#C23B3B; --bad-soft:#FBE4E4; --story:#FFFDF5;
  --f-display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Nunito','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101826; --card:#192335; --ink:#E8EEF7; --muted:#9BABC2; --line:#2B3A52;
    --accent:#3CC1C8; --accent-ink:#06262A; --sun:#F2B134; --sun-soft:#3A3014;
    --good:#4CCB84; --good-soft:#15342A; --bad:#F27C7C; --bad-soft:#3B1D22; --story:#1D2840; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101826; --card:#192335; --ink:#E8EEF7; --muted:#9BABC2; --line:#2B3A52;
  --accent:#3CC1C8; --accent-ink:#06262A; --sun:#F2B134; --sun-soft:#3A3014;
  --good:#4CCB84; --good-soft:#15342A; --bad:#F27C7C; --bad-soft:#3B1D22; --story:#1D2840; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:20px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.2;text-wrap:balance;margin:0}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:600;font-size:1.15rem;color:var(--accent)}
.stats{display:flex;gap:16px;font-weight:700;font-size:.95rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink)}
.bar{height:10px;border-radius:99px;background:var(--line);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .35s}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

.hero{padding:36px 0 8px;display:grid;gap:20px;max-width:720px}
.hero h1{font-size:clamp(2rem,6vw,3.2rem)}
.hero p{margin:0;color:var(--muted);font-size:1.1rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--sun-soft);border:1px solid var(--sun);border-radius:99px;padding:4px 14px;font-weight:700;font-size:.9rem}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:12px 26px;font-weight:800;font-size:1.05rem;justify-self:start}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:24px;padding:0;list-style:none}
.shelf li{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:700}
.shelf span{display:block;font-weight:600;font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

.quiz{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:start;margin-top:8px}
@media (max-width:820px){.quiz{grid-template-columns:minmax(0,1fr)}}
.story{background:var(--story);border:1px solid var(--line);border-radius:14px;padding:22px 24px}
@media (min-width:821px){.story{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);max-height:calc(100vh - 110px);overflow:auto}}
.tag{font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.story h2{font-size:1.6rem;margin:4px 0 12px}
.story p{margin:0 0 .9em;font-size:1.25rem;line-height:1.85;max-width:62ch}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 24px;display:grid;gap:16px}
.qcard h3{font-size:1.5rem;line-height:1.35}
.opts{display:grid;gap:10px;padding:0;margin:0;list-style:none}
.opt{width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:600}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-weight:800;font-size:.9rem}
.opt:disabled{cursor:default}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.right .k{background:var(--good);color:var(--card)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.wrong .k{background:var(--bad);color:var(--card)}
.fb{border-radius:12px;padding:12px 14px;font-size:.98rem}
.fb.right{background:var(--good-soft)} .fb.wrong{background:var(--bad-soft)}
.fb strong{display:block;font-family:var(--f-display);font-size:1.1rem;margin-bottom:2px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:.9rem}

.result{display:grid;gap:22px;margin-top:20px;max-width:820px}
.big{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;display:grid;gap:8px}
.big .n{font-family:var(--f-display);font-size:3.4rem;line-height:1;font-variant-numeric:tabular-nums}
.break{display:grid;gap:8px;padding:0;margin:0;list-style:none}
.break li{display:grid;grid-template-columns:minmax(0,1fr) 120px 48px;gap:10px;align-items:center;font-weight:700;font-size:.95rem}
.break .m{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.break .m i{display:block;height:100%;background:var(--accent)}
.break .s{text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:480px){.break li{grid-template-columns:minmax(0,1fr) 72px 44px}}
.miss{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--bad);border-radius:10px;padding:12px 16px;display:grid;gap:4px;font-size:.96rem}
.miss em{font-style:normal;color:var(--bad);font-weight:700}.miss u{text-decoration:none;color:var(--good);font-weight:800}
</style>

<div class="wrap">
  <header class="top">
    <div class="top-row">
      <div class="brand">Little Readers</div>
      <div class="stats" id="stats"></div>
    </div>
    <div class="bar" aria-hidden="true"><i id="fill"></i></div>
  </header>
  <main id="app"></main>
</div>

<script>
const STORIES = [
{
 title:"Sam and Max",
 text:["Sam has a big brown dog. The dog is called Max. Max has soft ears and a long tail. Max likes to run and jump.", "Every morning, Sam puts on his shoes and takes Max to the park. They play there until the sun is high in the sky.", "Sam throws the ball far away, and Max runs very fast to get it. Max brings the ball back and wags his tail. Sam gives Max a big hug. Then they walk home, and Max has a long drink of water."],
 qs:[
  {q:"What is the dog called?",o:["Max","Sam","Ben"],e:"The dog is called Max."},
  {q:"What colour is the dog?",o:["Brown","Black","White"],e:"Sam has a big brown dog."},
  {q:"Where do Sam and Max play?",o:["In the park","In the garden","At school"],e:"They play in the park."},
  {q:"What does Max bring back?",o:["The ball","A stick","A shoe"],e:"Sam throws the ball, and Max brings it back."},
  {q:"What does Max like to do?",o:["Run and jump","Sleep all day","Swim in the sea"],e:"Max likes to run and jump."}
 ]
},
{
 title:"Mia in the Rain",
 text:["It is a rainy day. Grey clouds are in the sky, and the rain goes pitter-patter on the roof. Mia cannot wait to go out!", "She puts on her yellow boots. She runs outside and jumps in a big puddle. Splash! Water flies up in the air, and Mia laughs. She jumps in three more puddles.", "Then Mum calls from the door. It is time to come in. Mia takes off her wet boots. Mum gives her hot soup, and Mia feels warm and happy."],
 qs:[
  {q:"What is the weather like?",o:["Rainy","Sunny","Windy"],e:"It is a rainy day."},
  {q:"What does Mia put on?",o:["Yellow boots","A red hat","A blue coat"],e:"Mia puts on her yellow boots."},
  {q:"What does Mia jump in?",o:["A big puddle","A pile of leaves","A little pool"],e:"She jumps in a big puddle."},
  {q:"Who calls Mia in?",o:["Mum","Dad","Her teacher"],e:"Mum calls her in."},
  {q:"What will Mia have to eat?",o:["Hot soup","A sandwich","Some cake"],e:"Mum calls her in for hot soup."}
 ]
},
{
 title:"The Little Seed",
 text:["Ben has a small seed. He puts some soil in a pot. He plants the seed in the soil and pats it down.", "Every day, Ben gives the seed some water. He puts the pot by the window, so it can get the sun. Then Ben waits and waits.", "After one week, a green shoot comes up! Ben is so happy. He gives it more water. Soon a yellow flower grows. It is the best flower Ben has ever seen."],
 qs:[
  {q:"What does Ben plant?",o:["A seed","A small tree","A carrot"],e:"Ben plants a seed in a pot."},
  {q:"What does Ben give the seed every day?",o:["Water","Milk","Juice"],e:"He gives it water every day."},
  {q:"When does the green shoot come up?",o:["After one week","After one day","After one year"],e:"After one week, a green shoot comes up."},
  {q:"What colour is the flower?",o:["Yellow","Red","Pink"],e:"A yellow flower grows."},
  {q:"How does Ben feel when the shoot comes up?",o:["Happy","Sad","Cross"],e:"Ben is so happy."}
 ]
},
{
 title:"Where Is Kiki?",
 text:["Tom's cat, Kiki, is lost. Tom feels sad. He looks under the bed, but Kiki is not there. He looks in the garden, but Kiki is not there. \"Kiki! Kiki!\" Tom calls.", "Mum helps Tom look in the kitchen. There is no cat. Then Tom stops and listens very carefully.", "At last, Tom hears a soft meow. He follows the sound to a box in the corner. Kiki is in the box, fast asleep! Tom is so glad. He gives Kiki a big hug."],
 qs:[
  {q:"Who is lost?",o:["Tom's cat","Tom's dog","Tom's sister"],e:"Tom's cat, Kiki, is lost."},
  {q:"Where does Tom look first?",o:["Under the bed","In the garden","In the kitchen"],e:"Tom looks under the bed, and then in the garden."},
  {q:"How does Tom find Kiki?",o:["He hears a soft meow","He sees little paw prints","Mum tells him where"],e:"Tom hears a soft meow."},
  {q:"Where is Kiki?",o:["In a box","Under the bed","In the garden"],e:"Kiki is in a box."},
  {q:"What is Kiki doing?",o:["Sleeping","Eating","Playing"],e:"Kiki is asleep."}
 ]
},
{
 title:"A Day at the Zoo",
 text:["Ana goes to the zoo with Dad. The sun is hot, and Ana wears her blue hat. First, they see a tall giraffe. The giraffe is eating leaves from a tree.", "Next, they see a funny monkey. The monkey swings on a rope. It makes a silly face at Ana. Ana laughs and laughs.", "After that, they see a big lion who is fast asleep. At the end of the day, Ana and Dad have ice cream."],
 qs:[
  {q:"Who goes to the zoo with Ana?",o:["Dad","Mum","Her teacher"],e:"Ana goes to the zoo with Dad."},
  {q:"What is the giraffe doing?",o:["Eating leaves","Drinking water","Sleeping"],e:"The giraffe is eating leaves."},
  {q:"What is the monkey doing?",o:["Swinging on a rope","Climbing a tree","Eating a banana"],e:"The monkey swings on a rope."},
  {q:"What makes Ana laugh?",o:["The monkey","The giraffe","Dad"],e:"The funny monkey makes Ana laugh."},
  {q:"What do Ana and Dad have at the end?",o:["Ice cream","Some cake","Some popcorn"],e:"At the end, they have ice cream."}
 ]
},
{
 title:"Bedtime for Bo",
 text:["Bo the bear is sleepy. The moon is up, and it is time for bed. First, Bo brushes his teeth. Next, he puts on his blue pyjamas.", "Then he gets into bed. Mum comes in and reads him a story about a little star. Bo yawns and yawns.", "Last, Bo shuts his eyes and goes to sleep. Good night, Bo!"],
 qs:[
  {q:"How does Bo feel at the start?",o:["Sleepy","Hungry","Cross"],e:"Bo the bear is sleepy."},
  {q:"What does Bo do first?",o:["Brushes his teeth","Puts on his pyjamas","Listens to a story"],e:"First, he brushes his teeth."},
  {q:"What colour are Bo's pyjamas?",o:["Blue","Green","Red"],e:"He puts on his blue pyjamas."},
  {q:"Who reads Bo a story?",o:["Mum","Dad","Gran"],e:"Mum reads him a story."},
  {q:"What does Bo do last?",o:["Goes to sleep","Brushes his teeth","Puts on his pyjamas"],e:"Last, Bo shuts his eyes and goes to sleep."}
 ]
},
{
 title:"Lily's Birthday",
 text:["Today is Lily's birthday. She is six years old. Lily wakes up early and puts on her best dress.", "Gran comes to the house. She has baked a pink cake with six candles. Lily's friends come to the party too, and everyone sits at the table.", "Lily blows out the candles and makes a wish. Then everyone sings a song for her. Lily smiles. It is the best day."],
 qs:[
  {q:"How old is Lily?",o:["Six","Five","Seven"],e:"Lily is six years old."},
  {q:"Who bakes the cake?",o:["Gran","Mum","Dad"],e:"Gran bakes the cake."},
  {q:"What colour is the cake?",o:["Pink","White","Brown"],e:"Gran bakes a pink cake."},
  {q:"What does Lily do with the candles?",o:["Blows them out","Counts them","Gives them to Gran"],e:"Lily blows out the candles."},
  {q:"What does everyone do for Lily?",o:["Sing a song","Dance round","Clap loudly"],e:"Everyone sings a song for her."}
 ]
},
{
 title:"The Fish and the Frog",
 text:["A little fish lives in a pond. The water is cool and clear. The fish swims round and round, but he has no one to play with.", "One day, a frog hops onto a big green leaf. \"Hello!\" says the frog. \"Hello!\" says the fish. \"Do you want to play?\" asks the frog. \"Yes!\" says the fish.", "They become friends. The fish splashes, and the frog jumps from leaf to leaf. They play together all summer."],
 qs:[
  {q:"Where does the little fish live?",o:["In a pond","In the sea","In a river"],e:"A little fish lives in a pond."},
  {q:"Where does the frog hop?",o:["Onto a big leaf","Into a little boat","Onto a flat rock"],e:"The frog hops onto a big green leaf."},
  {q:"What colour is the leaf?",o:["Green","Brown","Yellow"],e:"It is a big green leaf."},
  {q:"What do the fish and the frog become?",o:["Friends","Cousins","Neighbours"],e:"They become friends."},
  {q:"When do they play together?",o:["All summer","All winter","Only at night"],e:"They play together all summer."}
 ]
},
{
 title:"Zara at the Shop",
 text:["Zara goes to the shop with Mum. It is a short walk. In the shop, they buy three apples, two bananas and one loaf of bread.", "Mum pays the man at the desk. Zara carries the bread in her hands. Mum carries the apples and the bananas in a bag. Then they walk home.", "At home, Zara puts the fruit in a bowl on the table. Then she eats a slice of bread with butter."],
 qs:[
  {q:"Who goes to the shop with Zara?",o:["Mum","Gran","Dad"],e:"Zara goes to the shop with Mum."},
  {q:"How many apples do they buy?",o:["Three","Two","Four"],e:"They buy three apples."},
  {q:"How many bananas do they buy?",o:["Two","Three","One"],e:"They buy two bananas."},
  {q:"What does Zara carry?",o:["The bread","The apples","The bananas"],e:"Zara carries the bread."},
  {q:"Where does Zara put the fruit?",o:["In a bowl","In the fridge","In a basket"],e:"At home, she puts the fruit in a bowl."}
 ]
},
{
 title:"Kofi's Kite",
 text:["Kofi has a new kite. It is a windy day. The wind blows hard. Kofi runs across the field and lets out the string.", "The kite goes up, up, up! It goes higher than the tree. Kofi smiles and holds on tight.", "Then the wind stops. The kite floats down, down, down. Kofi runs to catch it. He catches it! Now he is ready to fly it again."],
 qs:[
  {q:"What does Kofi have?",o:["A new kite","A new ball","A new hat"],e:"Kofi has a new kite."},
  {q:"What is the weather like?",o:["Windy","Rainy","Snowy"],e:"It is a windy day."},
  {q:"How high does the kite go?",o:["Higher than the tree","Higher than the house","Only to the fence"],e:"It goes higher than the tree."},
  {q:"What happens when the wind stops?",o:["The kite floats down","The kite flies away","The kite breaks"],e:"The kite floats down."},
  {q:"Who catches the kite?",o:["Kofi","His dad","His friend"],e:"Kofi catches it."}
 ]
}
];

const $ = s => document.querySelector(s);
const app = $('#app'), stats = $('#stats'), fill = $('#fill');
const TOTAL = STORIES.reduce((n, s) => n + s.qs.length, 0);
const LETTERS = ['A','B','C','D'];
let S;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function fresh(view){
  STORIES.forEach(st=>st.qs.forEach(q=>{q.opts=shuffle(q.o.map((t,i)=>({t,ok:i===0})));}));
  S={view,s:0,q:0,picked:null,log:[]};
}
function score(){return S.log.filter(x=>x.ok).length;}
function updateTop(){
  const n=S.log.length;
  stats.innerHTML = S.view==='quiz'
    ? `<span>Question <b>${n + (S.picked===null?1:0)}</b> of ${TOTAL}</span><span>Score <b>${score()}</b></span>` : '';
  fill.style.width = (S.view==='done' ? 100 : n/TOTAL*100) + '%';
}

function start(){
  app.innerHTML = `<section class="hero">
    <h1>Read the story. Then answer the questions.</h1>
    <p>There are ${STORIES.length} short stories and ${TOTAL} questions. Each story has 5 questions. The story stays on the page, so you can look back at it any time.</p>
    <div class="chips"><span class="chip">${STORIES.length} stories</span><span class="chip">${TOTAL} questions</span><span class="chip">Grade 1</span></div>
    <button class="btn" id="go">Start reading</button>
  </section>
  <ul class="shelf">${STORIES.map((s,i)=>`<li><span>Story ${i+1}</span>${s.title}</li>`).join('')}</ul>`;
  $('#go').onclick=()=>{S.view='quiz';render();window.scrollTo(0,0);};
}

function quiz(){
  const st=STORIES[S.s], q=st.qs[S.q], answered=S.picked!==null;
  const last=S.s===STORIES.length-1 && S.q===st.qs.length-1;
  const nextLabel = last ? 'See my results' : (S.q===st.qs.length-1 ? 'Next story' : 'Next question');
  let fb='';
  if(answered){
    const ok=q.opts[S.picked].ok;
    fb=`<div class="fb ${ok?'right':'wrong'}" role="status"><strong>${ok?'Correct!':'Not quite.'}</strong>${ok?'':'The right answer is '+LETTERS[q.opts.findIndex(o=>o.ok)]+'. '}${q.e}</div>`;
  }
  app.innerHTML = `<div class="quiz">
    <article class="story">
      <div class="tag">Story ${S.s+1} of ${STORIES.length}</div>
      <h2>${st.title}</h2>
      ${st.text.map(p=>`<p>${p}</p>`).join('')}
    </article>
    <section class="qcard">
      <div class="tag">Question ${S.q+1} of ${st.qs.length}</div>
      <h3>${q.q}</h3>
      <ul class="opts">${q.opts.map((o,i)=>{
        let c='opt';
        if(answered){ if(o.ok) c+=' right'; else if(i===S.picked) c+=' wrong'; }
        return `<li><button class="${c}" data-i="${i}" ${answered?'disabled':''}><span class="k">${LETTERS[i]}</span><span>${o.t}</span></button></li>`;
      }).join('')}</ul>
      ${fb}
      <div class="nav"><span class="hint">${answered?'':'Pick one answer.'}</span>${answered?`<button class="btn" id="next">${nextLabel}</button>`:''}</div>
    </section>
  </div>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;S.picked=i;S.log.push({s:S.s,q:S.q,pick:i,ok:q.opts[i].ok});render();
  });
  const nx=$('#next');
  if(nx) nx.onclick=()=>{
    S.picked=null;
    if(S.q<st.qs.length-1) S.q++;
    else if(S.s<STORIES.length-1){S.s++;S.q=0;window.scrollTo(0,0);}
    else S.view='done';
    render();
  };
}

function results(){
  const sc=score(), pct=Math.round(sc/TOTAL*100);
  const msg = pct>=90?'Outstanding reading! You noticed the details.':pct>=75?'Great job! You are a strong reader.':pct>=50?'Good effort. Re-read the stories you missed and try again.':'Keep going. Read each story slowly and look back at the story.';
  const per=STORIES.map((s,i)=>{const n=S.log.filter(x=>x.s===i&&x.ok).length;return `<li><span>${s.title}</span><span class="m"><i style="width:${n/5*100}%"></i></span><span class="s">${n} / 5</span></li>`;}).join('');
  const missed=S.log.filter(x=>!x.ok).map(x=>{
    const st=STORIES[x.s],q=st.qs[x.q];
    return `<div class="miss"><span class="tag">${st.title}</span><strong>${q.q}</strong><span><em>Your answer:</em> ${q.opts[x.pick].t}</span><span><u>Correct answer:</u> ${q.opts.find(o=>o.ok).t}</span><span class="hint">${q.e}</span></div>`;
  }).join('');
  app.innerHTML=`<section class="result">
    <div class="big"><span class="tag">Your score</span><div class="n">${sc} / ${TOTAL}</div><div><b>${pct}%</b>. ${msg}</div></div>
    <h2>Score for each story</h2>
    <ul class="break">${per}</ul>
    ${missed?`<h2>Questions to review</h2>${missed}`:'<h2>No mistakes. Perfect score!</h2>'}
    <button class="btn" id="again">Play again</button>
  </section>`;
  $('#again').onclick=()=>{fresh('quiz');render();window.scrollTo(0,0);};
}

function render(){
  updateTop();
  if(S.view==='start') start(); else if(S.view==='quiz') quiz(); else results();
}
fresh('start');render();
</script>
