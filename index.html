<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grade 4 Math Quiz</title>
<style>
:root{--ink:#1f2a44;--bg:#eaf4ff;--card:#fff;--blue:#2f6fed;--ok:#1a9d5c;--okbg:#e2f6ea;--bad:#d6384f;--badbg:#fde6ea;--sun:#ffc93c;--line:#c9d9f2}
@media(prefers-color-scheme:dark){:root{--ink:#eef2fb;--bg:#141b2e;--card:#1f2842;--blue:#7ea6ff;--ok:#5fd596;--okbg:#18372a;--bad:#ff8396;--badbg:#42202a;--line:#33406300;--line:#364268}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:18px/1.5 "Trebuchet MS","Segoe UI",system-ui,sans-serif;min-height:100vh;padding:20px 14px 40px}
main{max-width:640px;margin:0 auto}
h1{font-size:2rem;line-height:1.15;margin:0 0 8px}
h2{font-size:1.35rem;line-height:1.35;margin:0 0 18px}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:24px}
.tag{display:inline-block;background:var(--sun);color:#1f2a44;font-weight:700;font-size:.85rem;padding:3px 12px;border-radius:99px;margin-bottom:12px}
.topics{display:grid;gap:8px;margin:18px 0 22px;padding:0;list-style:none}
.topics li{background:var(--bg);border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between}
button{font:inherit;cursor:pointer}
.btn{background:var(--blue);color:#fff;border:0;border-radius:14px;padding:13px 26px;font-weight:700;font-size:1.05rem}
.btn:hover{filter:brightness(1.08)}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.top{display:flex;justify-content:space-between;font-weight:700;margin-bottom:8px}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--blue);width:0;transition:width .3s}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:13px 16px;font-size:1.1rem}
.opt b{background:var(--bg);border-radius:8px;min-width:30px;height:30px;display:grid;place-items:center;font-size:.95rem}
.opt:not(:disabled):hover{border-color:var(--blue)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{margin-top:16px;padding:14px 16px;border-radius:14px;font-size:1rem}
.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.fb strong{display:block;margin-bottom:2px}
.next{margin-top:16px;text-align:right}
.score{font-size:3.2rem;font-weight:800;line-height:1;margin:6px 0}
.rows{margin:18px 0;display:grid;gap:10px}
.row{display:grid;grid-template-columns:1fr 60px;gap:4px 12px;align-items:center}
.row .bar{grid-column:1/-1;height:8px;margin:0}
.rev{margin:22px 0 0;padding:0;list-style:none;display:grid;gap:10px}
.rev li{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:.98rem}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
</style>
</head>
<body>
<main id="app"></main>
<script>
// [topic, question, correct answer, wrong, wrong, wrong, explanation]
const Q=[
["Rounding","Round 3,476 to the nearest hundred.","3,500","3,400","3,000","3,480","The tens digit is 7, so round the hundreds up: 3,500."],
["Rounding","Round 4,832 to the nearest ten.","4,830","4,800","4,840","4,900","The ones digit is 2, so keep the tens the same: 4,830."],
["Rounding","Round 6,500 to the nearest thousand.","7,000","6,000","6,500","7,500","The hundreds digit is 5, so round up to 7,000."],
["Rounding","Round 52,718 to the nearest thousand.","53,000","52,000","52,700","50,000","The hundreds digit is 7, so round up: 53,000."],
["Rounding","Round 285 to the nearest ten.","290","280","300","285","The ones digit is 5, so round up to 290."],
["Rounding","Round 9,964 to the nearest hundred.","10,000","9,900","9,000","9,960","The tens digit is 6, so 9,900 rounds up to 10,000."],
["Rounding","Which number rounds to 400 when rounded to the nearest hundred?","351","349","450","460","351 is closer to 400 than to 300. 349 rounds to 300; 450 and 460 round to 500."],
["Rounding","Round 14,639 to the nearest ten thousand.","10,000","15,000","14,000","20,000","The thousands digit is 4, so round down to 10,000."],
["Rounding","Round 7,350 to the nearest hundred.","7,400","7,300","7,000","8,000","The tens digit is 5, so round up to 7,400."],
["Rounding","Round 99,501 to the nearest thousand.","100,000","99,000","99,500","99,900","The hundreds digit is 5, so 99,000 rounds up to 100,000."],
["Differences","Find the difference: 8,000 − 3,456","4,544","4,656","5,544","4,444","3,456 + 4,544 = 8,000."],
["Differences","Find the difference: 5,203 − 1,876","3,327","3,437","4,327","3,433","1,876 + 3,327 = 5,203."],
["Differences","Find the difference: 700 − 258","442","458","452","542","258 + 442 = 700."],
["Differences","Find the difference: 6,000 − 2,999","3,001","3,011","3,999","2,001","Take 3,000 from 6,000, then add back 1: 3,001."],
["Differences","Find the difference: 12,345 − 2,345","10,000","9,000","10,100","11,000","The 2,345 cancels out, leaving 10,000."],
["Differences","Find the difference: 4,501 − 3,899","602","702","698","612","3,899 + 602 = 4,501."],
["Differences","What is the difference between 9,100 and 4,650?","4,450","5,550","4,550","5,450","9,100 − 4,650 = 4,450."],
["Differences","Find the difference: 30,000 − 14,562","15,438","16,438","15,562","14,438","14,562 + 15,438 = 30,000."],
["Differences","Estimate 6,812 − 2,194 by rounding both numbers to the nearest thousand.","5,000","4,000","6,000","4,600","7,000 − 2,000 = 5,000."],
["Differences","Which subtraction has a difference of 250?","1,000 − 750","900 − 750","1,000 − 650","800 − 500","1,000 − 750 = 250."],
["Multiplication","12 × 6 = ?","72","62","66","78","10 × 6 = 60 and 2 × 6 = 12. 60 + 12 = 72."],
["Multiplication","34 × 5 = ?","170","150","160","175","30 × 5 = 150 and 4 × 5 = 20. 150 + 20 = 170."],
["Multiplication","48 × 3 = ?","144","124","134","154","40 × 3 = 120 and 8 × 3 = 24. 120 + 24 = 144."],
["Multiplication","25 × 12 = ?","300","250","275","320","25 × 4 = 100, so 25 × 12 = 3 × 100 = 300."],
["Multiplication","123 × 4 = ?","492","472","482","512","100 × 4 = 400, 20 × 4 = 80, 3 × 4 = 12. Total 492."],
["Multiplication","60 × 70 = ?","4,200","420","42,000","3,600","6 × 7 = 42, then add two zeros: 4,200."],
["Multiplication","36 × 20 = ?","720","72","7,200","560","36 × 2 = 72, then add a zero: 720."],
["Multiplication","215 × 6 = ?","1,290","1,190","1,260","1,390","200 × 6 = 1,200 and 15 × 6 = 90. Total 1,290."],
["Multiplication","14 × 15 = ?","210","190","200","225","14 × 10 = 140 and 14 × 5 = 70. 140 + 70 = 210."],
["Multiplication","40 × 300 = ?","12,000","1,200","120,000","1,000","4 × 3 = 12, then add three zeros: 12,000."],
["Number expressions","6 + 4 × 3 = ?","18","30","13","24","Multiply first: 4 × 3 = 12. Then 6 + 12 = 18."],
["Number expressions","(6 + 4) × 3 = ?","30","18","13","12","Brackets first: 6 + 4 = 10. Then 10 × 3 = 30."],
["Number expressions","20 − 2 × 5 = ?","10","90","30","0","Multiply first: 2 × 5 = 10. Then 20 − 10 = 10."],
["Number expressions","Which expression means \"5 more than 3 times 8\"?","3 × 8 + 5","3 + 5 × 8","(3 + 8) × 5","5 × 3 + 8","\"3 times 8\" is 3 × 8. \"5 more than\" means add 5."],
["Number expressions","Which expression means \"the sum of 9 and 6, times 2\"?","(9 + 6) × 2","9 + 6 × 2","9 × 6 + 2","(9 × 6) × 2","The sum is in brackets, then multiply by 2."],
["Number expressions","18 ÷ 3 + 4 = ?","10","2","6","14","Divide first: 18 ÷ 3 = 6. Then 6 + 4 = 10."],
["Number expressions","3 × (8 − 5) + 2 = ?","11","17","9","13","Brackets: 8 − 5 = 3. Then 3 × 3 = 9, and 9 + 2 = 11."],
["Number expressions","Which expression is equal to 4 × (3 + 2)?","4 × 3 + 4 × 2","4 × 3 + 2","4 + 3 × 2","4 × 3 × 2","Both 3 and 2 get multiplied by 4. 12 + 8 = 20."],
["Number expressions","50 − (10 + 15) = ?","25","55","75","15","Brackets first: 10 + 15 = 25. Then 50 − 25 = 25."],
["Number expressions","2 × 5 + 3 × 4 = ?","22","32","27","60","Multiply first: 10 and 12. Then 10 + 12 = 22."],
["Word problems","A box holds 24 pencils. How many pencils are in 6 boxes?","144","124","154","30","24 × 6 = 144."],
["Word problems","Ada had 350 stickers and gave away 128. How many stickers does she have left?","222","232","478","228","350 − 128 = 222."],
["Word problems","A school bus carries 45 students. How many students can 8 buses carry?","360","320","53","400","45 × 8 = 40 × 8 + 5 × 8 = 320 + 40 = 360."],
["Word problems","A library had 1,250 books. It bought 375 more. How many books does it have now?","1,625","1,525","875","1,725","1,250 + 375 = 1,625."],
["Word problems","A hall has 9 rows with 15 chairs in each row. 20 chairs are empty. How many chairs are filled?","115","135","155","24","9 × 15 = 135 chairs. Then 135 − 20 = 115."],
["Word problems","A baker makes 3 trays of 12 buns and 2 trays of 10 buns. How many buns is that in all?","56","46","66","22","3 × 12 = 36 and 2 × 10 = 20. 36 + 20 = 56."],
["Word problems","A farmer had 1,000 eggs and sold 4 crates with 125 eggs in each. How many eggs are left?","500","875","600","400","4 × 125 = 500 sold. Then 1,000 − 500 = 500."],
["Word problems","Tunde saved ₦2,400. A bike costs ₦5,000. How much more does he need?","₦2,600","₦2,400","₦3,600","₦7,400","5,000 − 2,400 = 2,600."],
["Word problems","4,872 fans came to a match. Round this to the nearest hundred.","4,900","4,800","5,000","4,870","The tens digit is 7, so round the hundreds up: 4,900."],
["Word problems","Mum buys 5 notebooks at ₦120 each and pays with ₦1,000. How much change does she get?","₦400","₦600","₦880","₦500","5 × 120 = 600 spent. Then 1,000 − 600 = 400."]
];
const TOPICS=[...new Set(Q.map(q=>q[0]))], L="ABCD", app=document.getElementById("app");
let qs,i,score,picked,missed,byTopic;
const shuffle=a=>{a=[...a];for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a};

function start(){
  app.innerHTML=`<div class="card"><span class="tag">Grade 4 Math</span><h1>Math Quiz</h1>
  <p>${Q.length} questions. Pick an answer, read the tip, then move on.</p>
  <ul class="topics">${TOPICS.map(t=>`<li><span>${t}</span><b>${Q.filter(q=>q[0]==t).length} questions</b></li>`).join("")}</ul>
  <button class="btn" id="go">Start quiz</button></div>`;
  document.getElementById("go").onclick=begin;
}
function begin(){
  qs=Q.map(q=>({t:q[0],q:q[1],a:q[2],o:shuffle(q.slice(2,6)),e:q[6]}));
  i=0;score=0;missed=[];byTopic=Object.fromEntries(TOPICS.map(t=>[t,0]));show();
}
function show(){
  const c=qs[i];picked=false;
  app.innerHTML=`<div class="card"><div class="top"><span>${c.t}</span><span>${i+1} of ${qs.length}</span></div>
  <div class="bar"><i style="width:${i/qs.length*100}%"></i></div>
  <h2>${c.q}</h2><div class="opts">${c.o.map((o,k)=>`<button class="opt" data-k="${k}"><b>${L[k]}</b>${o}</button>`).join("")}</div>
  <div id="fb" aria-live="polite"></div></div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(b));
}
function answer(b){
  if(picked)return;picked=true;
  const c=qs[i],ans=c.o[b.dataset.k],right=ans===c.a;
  app.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(c.o[x.dataset.k]===c.a)x.classList.add("ok")});
  if(right){score++;byTopic[c.t]++}else{b.classList.add("bad");missed.push({c,ans})}
  const last=i==qs.length-1;
  document.getElementById("fb").innerHTML=`<div class="fb ${right?"ok":"bad"}"><strong>${right?"Correct!":"Not quite. The answer is "+c.a+"."}</strong>${c.e}</div>
  <div class="next"><button class="btn" id="nx">${last?"See results":"Next question"}</button></div>`;
  const nx=document.getElementById("nx");nx.focus();
  nx.onclick=()=>{i++;last?finish():show()};
}
function finish(){
  const pct=Math.round(score/qs.length*100),
  msg=pct>=90?"Outstanding work!":pct>=70?"Great job!":pct>=50?"Good effort. Keep practising!":"Nice try. Review the tips and try again.";
  app.innerHTML=`<div class="card"><span class="tag">Results</span><div class="score">${score} / ${qs.length}</div>
  <p><b>${pct}%</b>. ${msg}</p>
  <div class="rows">${TOPICS.map(t=>{const n=Q.filter(q=>q[0]==t).length,s=byTopic[t];return`<div class="row"><span>${t}</span><b>${s} / ${n}</b><div class="bar"><i style="width:${s/n*100}%"></i></div></div>`}).join("")}</div>
  ${missed.length?`<h2>Questions to review</h2><ul class="rev">${missed.map(m=>`<li><b>${m.c.q}</b><br>Your answer: ${m.ans}<br>Correct answer: ${m.c.a}<br>${m.c.e}</li>`).join("")}</ul>`:""}
  <div class="acts"><button class="btn" id="again">Try again</button><button class="btn alt" id="home">Home</button></div></div>`;
  document.getElementById("again").onclick=begin;
  document.getElementById("home").onclick=start;
  window.scrollTo(0,0);
}
start();
</script>
</body>
</html>
