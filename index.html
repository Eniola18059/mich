<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Science Quiz</title>
<style>
  :root{
    --bg1:#e0f7ff; --bg2:#fff4d6; --ink:#1f2a44; --card:#ffffff;
    --blue:#2f80ed; --green:#27ae60; --red:#eb5757; --orange:#f2994a; --purple:#9b51e0;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);
    background:linear-gradient(160deg,var(--bg1),var(--bg2));min-height:100vh}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
  .card{background:var(--card);border-radius:24px;padding:26px;box-shadow:0 10px 30px rgba(31,42,68,.12)}
  h1{margin:0 0 6px;font-size:2.2rem;text-align:center}
  .sub{text-align:center;color:#51608a;margin-bottom:20px}
  .big{font-size:4rem;text-align:center;margin:6px 0}
  .topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:18px 0}
  .topic{border-radius:16px;padding:12px 14px;color:#fff;font-weight:700;display:flex;align-items:center;gap:10px}
  .topic span.e{font-size:1.6rem}
  button{font:inherit;cursor:pointer;border:0}
  .btn{background:var(--blue);color:#fff;font-weight:800;font-size:1.15rem;padding:14px 28px;border-radius:999px;
    box-shadow:0 5px 0 #1d5fbd;transition:transform .08s}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1d5fbd}
  .btn.green{background:var(--green);box-shadow:0 5px 0 #1b8a49}
  .center{text-align:center}
  .top{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:10px;gap:8px;flex-wrap:wrap}
  .pill{background:#eef3ff;border-radius:999px;padding:6px 14px}
  .bar{height:14px;background:#e6ebf5;border-radius:999px;overflow:hidden;margin-bottom:18px}
  .bar>div{height:100%;width:0;background:linear-gradient(90deg,var(--orange),var(--green));transition:width .3s}
  .tag{display:inline-block;color:#fff;font-weight:800;font-size:.85rem;padding:4px 12px;border-radius:999px;margin-bottom:10px}
  .q{font-size:1.4rem;font-weight:800;line-height:1.35;margin:4px 0 18px}
  .opts{display:grid;gap:12px}
  .opt{background:#f5f8ff;border:3px solid #d7e2fb;border-radius:16px;padding:14px 16px;text-align:left;
    font-size:1.1rem;font-weight:700;color:var(--ink);display:flex;gap:12px;align-items:center}
  .opt:hover:not(:disabled){border-color:var(--blue);background:#eaf2ff}
  .opt .l{background:var(--blue);color:#fff;border-radius:50%;width:32px;height:32px;flex:none;display:grid;place-items:center;font-weight:800}
  .opt.right{background:#e3f8ea;border-color:var(--green)}
  .opt.right .l{background:var(--green)}
  .opt.wrong{background:#fde8e8;border-color:var(--red)}
  .opt.wrong .l{background:var(--red)}
  .fb{margin-top:16px;border-radius:16px;padding:14px 16px;font-size:1.05rem;line-height:1.45;display:none}
  .fb.show{display:block}
  .fb.good{background:#e3f8ea}
  .fb.bad{background:#fff0e0}
  .fb b{display:block;font-size:1.15rem;margin-bottom:4px}
  .next{margin-top:16px;display:none;text-align:right}
  .next.show{display:block}
  .stars{font-size:2.4rem;text-align:center;letter-spacing:4px}
  .score{font-size:3rem;font-weight:900;text-align:center;color:var(--purple)}
  .break{display:grid;gap:8px;margin:18px 0}
  .row{display:flex;align-items:center;gap:10px}
  .row .n{width:190px;font-weight:700;font-size:.95rem}
  .row .b{flex:1;height:14px;background:#e6ebf5;border-radius:999px;overflow:hidden}
  .row .b>div{height:100%}
  .row .v{width:48px;text-align:right;font-weight:800}
  .miss{background:#fafbff;border:2px solid #e3e9f7;border-radius:14px;padding:12px 14px;margin:10px 0}
  .miss .a{color:var(--green);font-weight:800}
  @media(max-width:520px){.row .n{width:120px;font-size:.85rem}.q{font-size:1.2rem}h1{font-size:1.8rem}}
</style>
</head>
<body>
<div class="wrap">
  <div id="app"></div>
</div>

<script>
const TOPICS = {
  F:{name:"Push, Pull & Magnets",emoji:"🧲",color:"#2f80ed"},
  L:{name:"Plants & Life Cycles",emoji:"🌱",color:"#27ae60"},
  H:{name:"Animals & Their Homes",emoji:"🦁",color:"#f2994a"},
  W:{name:"Weather & Sky",emoji:"🌦️",color:"#9b51e0"},
  S:{name:"Materials & Our Senses",emoji:"👀",color:"#eb5757"}
};

// QUESTIONS_START
const Q = [
{"t":"F","q":"Pushing and pulling are both kinds of what?","a":"Forces","w":["Machines","Materials","Sounds"],"e":"A push or a pull is a force. Forces make things move, stop, or change direction."},
{"t":"F","q":"You open a door by pulling its handle. What did you use?","a":"A pull","w":["A push","A magnet","A spin"],"e":"When you move something toward you, you are pulling it."},
{"t":"F","q":"Which one is a push?","a":"Closing a drawer by pressing it in","w":["Opening a drawer by its handle","Stretching a rubber band","Dragging a bag along the floor"],"e":"Pressing something away from you is a push. Opening, stretching, and dragging are pulls."},
{"t":"F","q":"Which of these will a magnet pick up?","a":"An iron nail","w":["A plastic spoon","A paper cup","A wooden block"],"e":"Magnets pick up things made of iron or steel."},
{"t":"F","q":"A magnet has two ends. What are they called?","a":"Poles","w":["Edges","Sides","Tips"],"e":"The two ends of a magnet are the north pole and the south pole."},
{"t":"F","q":"What happens when the opposite poles of two magnets come close?","a":"They pull together","w":["They push apart","They break in half","They turn into wood"],"e":"Opposite poles attract. Poles that are the same push away from each other."},
{"t":"F","q":"What pulls things down toward the ground?","a":"Gravity","w":["Friction","Wind","Heat"],"e":"Gravity is the force that pulls everything toward the Earth."},
{"t":"F","q":"You let go of a ball in the air. What does it do?","a":"It falls down to the ground","w":["It floats away in the wind","It stays up in the air","It rolls up to the sky"],"e":"Gravity pulls the ball down."},
{"t":"F","q":"Rubbing your hands together makes them feel warm. What force does this?","a":"Friction","w":["Gravity","Magnetism","Pushing"],"e":"Friction happens when two things rub together. It can make heat and slow things down."},
{"t":"F","q":"Which floor is the hardest to slide a box across?","a":"A rough carpet","w":["A smooth ice floor","A wet tile floor","A shiny wooden floor"],"e":"Rough surfaces have more friction, so things slide less easily."},
{"t":"F","q":"A magnet pulls a paper clip without touching it. What does this show?","a":"A magnet can pull from a little way off","w":["A magnet must always touch to pull","A paper clip can pull a magnet harder","A magnet only works in water"],"e":"Magnetic force works across a small gap."},
{"t":"F","q":"Which one is moved by a pull?","a":"A wagon pulled with a rope","w":["A door pushed shut","A ball kicked by a foot","A swing pushed by a friend"],"e":"A rope pulls the wagon toward you."},
{"t":"F","q":"What does a bigger push do to a toy car?","a":"Makes it go faster and farther","w":["Makes it stop sooner","Makes it get lighter","Makes it stay in one place"],"e":"A bigger force changes how something moves more."},
{"t":"F","q":"Which one will a magnet NOT pick up?","a":"A rubber band","w":["A steel key","An iron nail","A steel paper clip"],"e":"Rubber is not magnetic. Iron and steel are."},
{"t":"L","q":"What do plants need to grow?","a":"Sunlight, water, and air","w":["Candy, water, and sand","Darkness, sand, and wind","Sunlight, salt, and plastic"],"e":"Plants use sunlight, water, and air to make their food and grow."},
{"t":"L","q":"Which part of a plant takes in water from the soil?","a":"Roots","w":["Leaves","Flower","Stem"],"e":"Roots grow in the soil and soak up water."},
{"t":"L","q":"What does the stem of a plant do?","a":"Holds it up and carries water","w":["Makes seeds for new plants","Takes in water from the soil","Gives the flower its smell"],"e":"The stem holds the plant up and moves water to the leaves."},
{"t":"L","q":"Which part of a plant uses sunlight to make food?","a":"Leaves","w":["Roots","Stem","Seeds"],"e":"Leaves catch sunlight and use it to make food for the plant."},
{"t":"L","q":"What does a seed need to start growing?","a":"Water and warmth","w":["Only bright sunlight","Only cold air","Salt and sand"],"e":"A seed needs water and warmth to sprout."},
{"t":"L","q":"What is the first stage in a butterfly's life?","a":"Egg","w":["Caterpillar","Wings","Adult butterfly"],"e":"A butterfly starts as an egg. Then it hatches into a caterpillar."},
{"t":"L","q":"What do we call a baby frog?","a":"A tadpole","w":["A caterpillar","A chick","A cub"],"e":"A baby frog is a tadpole. It lives in water and later grows legs."},
{"t":"L","q":"What do we call a baby dog?","a":"A puppy","w":["A kitten","A cub","A calf"],"e":"A baby dog is a puppy."},
{"t":"L","q":"What do we call a baby cow?","a":"A calf","w":["A lamb","A foal","A piglet"],"e":"A baby cow is a calf. A lamb is a baby sheep."},
{"t":"L","q":"Which of these is a living thing?","a":"A tree","w":["A wooden table","A cloud","A river"],"e":"Living things grow and need water. A table is made from a tree, but it is not alive."},
{"t":"L","q":"Which one do all living things need?","a":"Water","w":["Toys","Electricity","Sugar"],"e":"All living things need water to stay alive."},
{"t":"L","q":"What does a flower make that can grow into a new plant?","a":"Seeds","w":["Roots","Leaves","Bark"],"e":"Flowers make seeds. A seed can grow into a new plant."},
{"t":"L","q":"Which of these animals lays eggs?","a":"A duck","w":["A rabbit","A cow","A monkey"],"e":"Birds, like ducks, lay eggs. Rabbits, cows, and monkeys give birth to live babies."},
{"t":"L","q":"Which comes first in a plant's life?","a":"Seed","w":["Flower","Fruit","Big tree"],"e":"A plant starts as a seed."},
{"t":"H","q":"Where does a fish live?","a":"In water","w":["In a nest","In a tree","In a burrow"],"e":"Fish live in water, like rivers, lakes, and the sea."},
{"t":"H","q":"What do we call the place where an animal lives?","a":"Its habitat","w":["Its weather","Its region","Its garden"],"e":"A habitat is a home that gives an animal food, water, and shelter."},
{"t":"H","q":"Which animal lives in a hot, dry desert?","a":"A camel","w":["A penguin","A whale","A polar bear"],"e":"A camel can live a long time without water."},
{"t":"H","q":"Which animal lives where it is very cold and icy?","a":"A penguin","w":["A monkey","A camel","A lion"],"e":"Penguins live in cold places, like Antarctica."},
{"t":"H","q":"What is a bird's nest for?","a":"A safe home for eggs and chicks","w":["A place to find water","A tool to catch fish","A bed for the farmer"],"e":"Birds build nests to keep their eggs and babies safe."},
{"t":"H","q":"Which animal has feathers?","a":"An eagle","w":["A bat","A frog","A snake"],"e":"Birds are the only animals with feathers. A bat has fur."},
{"t":"H","q":"Which animal has fur or hair?","a":"A dog","w":["A fish","A bird","A lizard"],"e":"Dogs are mammals, and mammals have fur or hair."},
{"t":"H","q":"How does a fish breathe?","a":"With gills","w":["With a nose","With lungs","With wings"],"e":"Gills take air from the water so the fish can breathe."},
{"t":"H","q":"Which animal eats only plants?","a":"A cow","w":["A lion","A snake","A crocodile"],"e":"A cow is a herbivore. It eats grass and other plants."},
{"t":"H","q":"Which animal hunts and eats other animals?","a":"A lion","w":["A rabbit","A goat","A horse"],"e":"A lion is a meat eater. A rabbit, goat, and horse eat plants."},
{"t":"H","q":"Which animal has a hard shell to protect its body?","a":"A turtle","w":["A rabbit","A parrot","A cat"],"e":"A turtle can pull its body inside its shell."},
{"t":"H","q":"Which of these animals can fly?","a":"An owl","w":["A penguin","An ostrich","A turtle"],"e":"An owl has wings and can fly. Penguins and ostriches are birds that cannot fly."},
{"t":"H","q":"Which animal lives mostly in trees?","a":"A monkey","w":["A whale","A crab","A camel"],"e":"Monkeys climb and live in trees."},
{"t":"H","q":"Why do some animals have thick fur?","a":"To stay warm","w":["To swim faster","To find food","To be louder"],"e":"Thick fur keeps an animal warm in cold weather."},
{"t":"W","q":"What is the weather like when water falls from the clouds?","a":"Rainy","w":["Windy","Sunny","Foggy"],"e":"Rain is water that falls from clouds."},
{"t":"W","q":"Which tool tells us how hot or cold it is?","a":"A thermometer","w":["A ruler","A clock","A compass"],"e":"A thermometer measures temperature."},
{"t":"W","q":"What do we call air that is moving?","a":"Wind","w":["Rain","Cloud","Fog"],"e":"Moving air is wind."},
{"t":"W","q":"What gives us light and heat during the day?","a":"The Sun","w":["The Moon","The stars","The clouds"],"e":"The Sun is a star that gives Earth light and heat."},
{"t":"W","q":"What is the Moon?","a":"A big rock that moves around Earth","w":["A star that makes its own light","A small cloud in the sky","A planet far away"],"e":"The Moon is a big ball of rock. It shines because the Sun lights it up."},
{"t":"W","q":"Which season is usually the coldest?","a":"Winter","w":["Summer","Spring","Fall"],"e":"Winter has the coldest weather of the year."},
{"t":"W","q":"What falls from the sky when it is very cold and water freezes into flakes?","a":"Snow","w":["Rain","Fog","Dew"],"e":"Snow is made of tiny frozen flakes of water."},
{"t":"W","q":"What should you wear on a rainy day?","a":"A raincoat and boots","w":["A swimsuit and sandals","A scarf and gloves","A sun hat and shorts"],"e":"A raincoat and boots keep you dry."},
{"t":"W","q":"What makes a rainbow?","a":"Sunlight shining through raindrops","w":["Wind blowing through clouds","Snow melting on a hill","Lightning hitting water"],"e":"Sunlight bends in raindrops and shows all its colors."},
{"t":"W","q":"Which one is a sign that a storm is coming?","a":"Dark, heavy clouds","w":["A clear blue sky","A gentle breeze","Bright morning sun"],"e":"Dark, heavy clouds are full of water and often bring storms."},
{"t":"W","q":"What should you do if you hear thunder?","a":"Go inside","w":["Climb a tree","Go swimming","Fly a kite"],"e":"Thunder means lightning is near. Stay inside where it is safe."},
{"t":"W","q":"What do we call water that is in the air as a gas we cannot see?","a":"Water vapor","w":["Smoke","Dust","Ice"],"e":"Water vapor is water in the form of a gas."},
{"t":"W","q":"The Sun heats a puddle. Where does the water go?","a":"Into the air","w":["Into the ground only","It disappears forever","Into the nearby trees"],"e":"The Sun makes the water evaporate into the air."},
{"t":"W","q":"Which planet do we live on?","a":"Earth","w":["Mars","Venus","Jupiter"],"e":"We live on planet Earth."},
{"t":"S","q":"Which sense do we use our eyes for?","a":"Sight","w":["Hearing","Touch","Taste"],"e":"Our eyes help us see. That is the sense of sight."},
{"t":"S","q":"Which body part do we use to hear sounds?","a":"Ears","w":["Eyes","Nose","Skin"],"e":"Ears let us hear."},
{"t":"S","q":"Which sense helps you feel if something is hot or cold?","a":"Touch","w":["Sight","Smell","Hearing"],"e":"Our skin gives us the sense of touch."},
{"t":"S","q":"Which body part helps you smell a flower?","a":"Nose","w":["Tongue","Ears","Eyes"],"e":"We smell with our nose."},
{"t":"S","q":"Which body part helps you taste food?","a":"Tongue","w":["Nose","Teeth","Lips"],"e":"Our tongue can tell if food is sweet, salty, sour, or bitter."},
{"t":"S","q":"Which of these is a solid?","a":"A pencil","w":["Milk","Air","Juice"],"e":"A solid keeps its own shape. Milk and juice are liquids. Air is a gas."},
{"t":"S","q":"Which of these is a liquid?","a":"Juice","w":["An ice cube","A pencil","Sand"],"e":"A liquid flows and takes the shape of its cup."},
{"t":"S","q":"What happens to an ice cube in a warm room?","a":"It melts into water","w":["It turns into steam at once","It gets harder","It turns into snow"],"e":"Heat melts ice into water."},
{"t":"S","q":"What happens when water gets very, very cold?","a":"It freezes into ice","w":["It turns into steam","It turns into sand","It turns into oil"],"e":"Cold turns water into ice."},
{"t":"S","q":"Which material can you see through?","a":"Clear glass","w":["Wood","Metal","Cardboard"],"e":"Clear glass lets light go through, so you can see through it."},
{"t":"S","q":"Which material is best for making a cooking pot?","a":"Metal","w":["Paper","Wool","Plastic"],"e":"Metal can get very hot without melting or burning."},
{"t":"S","q":"Which of these will float on water?","a":"A wooden stick","w":["A stone","A coin","A metal key"],"e":"Wood is light for its size, so it floats."},
{"t":"S","q":"Which one is soft?","a":"A pillow","w":["A rock","A brick","A glass cup"],"e":"A pillow is soft. Rocks, bricks, and glass are hard."},
{"t":"S","q":"Which tool helps you see very small things up close?","a":"A magnifying glass","w":["A ruler","A thermometer","A clock"],"e":"A magnifying glass makes small things look bigger."}
];
// QUESTIONS_END

const app = document.getElementById("app");
let order=[], idx=0, score=0, answered=false, missed=[], byTopic={};

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}

function home(){
  app.innerHTML=`
  <div class="card">
    <div class="big">🔬🌎🦋</div>
    <h1>Science Quiz</h1>
    <div class="sub">${Q.length} questions · tap the best answer · learn something new with every question!</div>
    <div class="topics">
      ${Object.values(TOPICS).map(t=>`<div class="topic" style="background:${t.color}"><span class="e">${t.emoji}</span>${t.name}</div>`).join("")}
    </div>
    <div class="center"><button class="btn" onclick="start()">Start Quiz 🚀</button></div>
  </div>`;
}

function start(){
  order=shuffle(Q.map((_,i)=>i));
  idx=0;score=0;missed=[];byTopic={};
  Object.keys(TOPICS).forEach(k=>byTopic[k]={c:0,n:0});
  show();
}

function show(){
  const item=Q[order[idx]], T=TOPICS[item.t];
  answered=false;
  const opts=shuffle([item.a,...item.w]);
  app.innerHTML=`
  <div class="card">
    <div class="top"><span class="pill">Question ${idx+1} of ${Q.length}</span><span class="pill">⭐ ${score}</span></div>
    <div class="bar"><div style="width:${idx/Q.length*100}%"></div></div>
    <span class="tag" style="background:${T.color}">${T.emoji} ${T.name}</span>
    <div class="q">${esc(item.q)}</div>
    <div class="opts">
      ${opts.map((o,i)=>`<button class="opt" data-v="${esc(o).replace(/"/g,"&quot;")}"><span class="l">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`).join("")}
    </div>
    <div class="fb" id="fb"></div>
    <div class="next" id="next"><button class="btn green" onclick="nextQ()">${idx===Q.length-1?"See my results 🏆":"Next ➜"}</button></div>
  </div>`;
  document.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>pick(b,item)));
}

function pick(btn,item){
  if(answered)return;
  answered=true;
  const ok=btn.dataset.v===item.a;
  byTopic[item.t].n++;
  document.querySelectorAll(".opt").forEach(b=>{
    b.disabled=true;
    if(b.dataset.v===item.a)b.classList.add("right");
  });
  const fb=document.getElementById("fb");
  if(ok){score++;byTopic[item.t].c++;btn.classList.add("right");
    fb.className="fb show good";fb.innerHTML=`<b>🎉 Correct!</b>${esc(item.e)}`;}
  else{btn.classList.add("wrong");missed.push(item);
    fb.className="fb show bad";fb.innerHTML=`<b>Good try! The answer is: ${esc(item.a)}</b>${esc(item.e)}`;}
  document.getElementById("next").classList.add("show");
  document.querySelector(".top .pill:last-child").textContent="⭐ "+score;
}

function nextQ(){idx++;idx>=Q.length?results():show();}

function results(){
  const pct=Math.round(score/Q.length*100);
  const stars=pct>=90?"⭐⭐⭐⭐⭐":pct>=75?"⭐⭐⭐⭐":pct>=60?"⭐⭐⭐":pct>=40?"⭐⭐":"⭐";
  const msg=pct>=90?"Super scientist! Amazing work!":pct>=75?"Great job! You really know your science!":pct>=60?"Nice work! Keep exploring!":"Good effort! Practice makes you stronger. Try again!";
  app.innerHTML=`
  <div class="card">
    <div class="big">🏆</div>
    <h1>Quiz Complete!</h1>
    <div class="stars">${stars}</div>
    <div class="score">${score} / ${Q.length}</div>
    <div class="sub">${msg} (${pct}%)</div>
    <div class="break">
      ${Object.entries(TOPICS).map(([k,t])=>{const r=byTopic[k];const p=r.n?Math.round(r.c/r.n*100):0;
        return `<div class="row"><div class="n">${t.emoji} ${t.name}</div><div class="b"><div style="width:${p}%;background:${t.color}"></div></div><div class="v">${r.c}/${r.n}</div></div>`}).join("")}
    </div>
    <div class="center" style="margin:18px 0"><button class="btn" onclick="start()">Play Again 🔁</button></div>
    ${missed.length?`<h2>📝 Questions to review (${missed.length})</h2>`+missed.map(m=>`<div class="miss"><div><b>${esc(m.q)}</b></div><div class="a">✔ ${esc(m.a)}</div><div>${esc(m.e)}</div></div>`).join(""):`<h2 class="center">🌟 You got every question right!</h2>`}
  </div>`;
  window.scrollTo({top:0,behavior:"smooth"});
}

home();
</script>
</body>
</html>
