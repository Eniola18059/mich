<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Problem Adventure</title>
<style>
  :root{--bg1:#ffe9a8;--bg2:#ffc2d9;--ink:#2b2d42;--green:#2fbf71;--red:#ef476f;--blue:#118ab2;--yellow:#ffd166;--card:#fff}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Comic Sans MS","Trebuchet MS",system-ui,sans-serif;color:var(--ink);
    background:linear-gradient(135deg,var(--bg1),var(--bg2));min-height:100vh;display:flex;justify-content:center;padding:16px}
  .app{width:100%;max-width:640px}
  .card{background:var(--card);border-radius:28px;padding:24px;box-shadow:0 10px 0 rgba(0,0,0,.08);margin-bottom:16px}
  h1{margin:0 0 8px;font-size:2.1rem;text-align:center;color:var(--blue)}
  h2{margin:0 0 12px;text-align:center}
  p.lead{text-align:center;font-size:1.15rem;margin:8px 0 18px}
  .big{font-size:4rem;text-align:center;margin:4px 0}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:20px;font-weight:bold}
  .go{display:block;margin:0 auto;background:var(--green);color:#fff;font-size:1.5rem;padding:14px 36px;box-shadow:0 6px 0 #1f8f53}
  .go:active{transform:translateY(4px);box-shadow:0 2px 0 #1f8f53}
  .top{display:flex;justify-content:space-between;align-items:center;font-weight:bold;margin-bottom:8px}
  .bar{height:16px;background:#eee;border-radius:10px;overflow:hidden;margin-bottom:16px}
  .bar>div{height:100%;background:linear-gradient(90deg,var(--yellow),var(--green));width:0;transition:width .4s}
  .emoji{font-size:3rem;text-align:center;letter-spacing:4px;min-height:3.4rem;word-break:break-all}
  .q{font-size:1.45rem;line-height:1.5;text-align:center;margin:10px 0 18px}
  .listen{display:block;margin:0 auto 14px;background:var(--yellow);font-size:1rem;padding:8px 18px;box-shadow:0 4px 0 #d9a93b}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .opt{background:#e8f4fa;border:4px solid var(--blue);color:var(--ink);font-size:2rem;padding:16px 8px;box-shadow:0 5px 0 rgba(0,0,0,.12)}
  .opt:disabled{cursor:default}
  .opt.right{background:var(--green);border-color:#1f8f53;color:#fff}
  .opt.wrong{background:var(--red);border-color:#b32e50;color:#fff}
  .fb{min-height:3.2rem;text-align:center;font-size:1.25rem;font-weight:bold;margin-top:16px}
  .fb.ok{color:#1f8f53}.fb.no{color:#b32e50}
  .next{display:none;margin:12px auto 0;background:var(--blue);color:#fff;font-size:1.3rem;padding:12px 30px;box-shadow:0 5px 0 #0b6280}
  .stars{font-size:2.6rem;text-align:center}
  .score{font-size:2.6rem;text-align:center;font-weight:bold;color:var(--green)}
  .review{margin-top:14px;font-size:1.05rem}
  .review div{background:#fff4f6;border-left:6px solid var(--red);padding:10px 12px;border-radius:10px;margin-bottom:10px}
  .hidden{display:none}
  @media(max-width:420px){.opt{font-size:1.7rem}.q{font-size:1.25rem}}
</style>
</head>
<body>
<div class="app">

  <div id="start" class="card">
    <div class="big">🦁🐘🐒</div>
    <h1>Word Problem Adventure</h1>
    <p class="lead">Read each story. Add or take away to find the answer!<br>There are <b>50</b> stories. Ready?</p>
    <button class="go" id="startBtn">Let's Go! 🚀</button>
  </div>

  <div id="quiz" class="card hidden">
    <div class="top"><span id="qnum">Story 1 of 50</span><span id="sc">⭐ 0</span></div>
    <div class="bar"><div id="prog"></div></div>
    <div class="emoji" id="pic"></div>
    <div class="q" id="qtext"></div>
    <button class="listen" id="listenBtn">🔊 Read it to me</button>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb"></div>
    <button class="next" id="nextBtn">Next ➜</button>
  </div>

  <div id="end" class="card hidden">
    <div class="stars" id="endStars"></div>
    <h2 id="endMsg"></h2>
    <div class="score" id="endScore"></div>
    <div class="review" id="review"></div>
    <button class="go" id="againBtn" style="margin-top:16px">Play Again 🔁</button>
  </div>

</div>

<script>
// [story text, first number, second number, operation, picture]
const ADD = [
 ["Mia has 3 red apples and 4 green apples. How many apples does she have in all?",3,4,"+","🍎🍎🍎🍏🍏🍏🍏"],
 ["5 birds sit on a fence. 2 more birds fly over to join them. How many birds are on the fence now?",5,2,"+","🐦🐦🐦🐦🐦🐦🐦"],
 ["Tom has 6 toy cars. His dad gives him 3 more toy cars. How many toy cars does Tom have now?",6,3,"+","🚗🚗🚗🚗🚗🚗🚙🚙🚙"],
 ["There are 4 ducks in a pond. 5 more ducks swim in. How many ducks are in the pond now?",4,5,"+","🦆🦆🦆🦆🦆🦆🦆🦆🦆"],
 ["Sara picks 7 flowers in the morning and 2 flowers in the afternoon. How many flowers did she pick?",7,2,"+","🌸🌸🌸🌸🌸🌸🌸🌼🌼"],
 ["8 children are on the bus. 3 more children get on. How many children are on the bus now?",8,3,"+","🚌"],
 ["Ben ate 5 cookies on Monday and 5 cookies on Tuesday. How many cookies did he eat?",5,5,"+","🍪🍪🍪🍪🍪🍪🍪🍪🍪🍪"],
 ["A shelf has 9 books. Mom puts 4 more books on the shelf. How many books are on the shelf now?",9,4,"+","📚"],
 ["6 frogs sit on a log. 6 frogs sit on the grass. How many frogs are there in all?",6,6,"+","🐸🐸🐸🐸🐸🐸🐸🐸🐸🐸🐸🐸"],
 ["Lily has 10 stickers. Her friend gives her 5 more stickers. How many stickers does Lily have now?",10,5,"+","⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐"],
 ["There are 7 red balloons and 8 blue balloons at the party. How many balloons are there altogether?",7,8,"+","🎈🎈🎈🎈🎈🎈🎈"],
 ["A farmer has 9 cows and 7 sheep. How many animals does the farmer have in all?",9,7,"+","🐄🐑"],
 ["There are 12 fish in a tank. The shop puts in 4 more fish. How many fish are in the tank now?",12,4,"+","🐟🐠🐟🐠🐟🐠"],
 ["Omar has 8 pencils. His teacher gives him 6 more pencils. How many pencils does Omar have now?",8,6,"+","✏️✏️✏️✏️✏️✏️✏️✏️"],
 ["11 kids are playing in the park. 5 more kids come to play. How many kids are playing now?",11,5,"+","🛝🧒👧"],
 ["3 cats are sleeping and 9 cats are awake. How many cats are there in all?",3,9,"+","🐱😺🐈"],
 ["Anna drew 4 stars on Monday and 8 stars on Tuesday. How many stars did she draw?",4,8,"+","✨🌟⭐"],
 ["A basket has 13 oranges. Dad puts in 3 more oranges. How many oranges are in the basket now?",13,3,"+","🍊🍊🍊🍊🍊"],
 ["There are 9 boys and 9 girls in Grade 1. How many children are in the class?",9,9,"+","👦👧"],
 ["Jack scored 7 points in the first game and 6 points in the second game. How many points did he score in all?",7,6,"+","⚽🥅"],
 ["A garden has 14 tulips and 5 roses. How many flowers are in the garden?",14,5,"+","🌷🌹"],
 ["There are 10 candies in a bag and 10 candies in a jar. How many candies are there in all?",10,10,"+","🍬🍭🍬🍭"],
 ["6 ants are carrying crumbs. 7 more ants come to help. How many ants are there now?",6,7,"+","🐜🐜🐜🐜🐜🐜🐜"],
 ["There are 15 books on the table and 4 books on the floor. How many books are there in all?",15,4,"+","📖📘📗"],
 ["Zoe has 8 marbles. She finds 9 more marbles in the toy box. How many marbles does she have now?",8,9,"+","🔵🔴🟢🟡"]
];
const SUB = [
 ["Dad had 9 balloons. 4 balloons popped. How many balloons are left?",9,4,"-","🎈🎈🎈🎈🎈💥"],
 ["There are 8 cookies on a plate. Amy eats 3 cookies. How many cookies are left?",8,3,"-","🍪🍪🍪🍪🍪"],
 ["10 birds are in a tree. 6 birds fly away. How many birds are still in the tree?",10,6,"-","🌳🐦🐦🐦🐦"],
 ["Leo has 7 pencils. He gives 2 pencils to his friend. How many pencils does Leo have now?",7,2,"-","✏️✏️✏️✏️✏️"],
 ["There are 12 apples in a basket. Mum takes out 5 apples. How many apples are left?",12,5,"-","🍎🍎🍎🍎🍎🍎🍎"],
 ["15 children are at the park. 8 children go home. How many children are still at the park?",15,8,"-","🌳🧒👧"],
 ["A bakery has 14 muffins. It sells 6 muffins. How many muffins are left?",14,6,"-","🧁🧁🧁🧁🧁🧁🧁🧁"],
 ["Nina has 9 stickers. She gives 3 stickers to her sister. How many stickers does Nina have left?",9,3,"-","⭐⭐⭐⭐⭐⭐"],
 ["11 frogs are on a log. 4 frogs jump into the pond. How many frogs are still on the log?",11,4,"-","🐸🐸🐸🐸🐸🐸🐸"],
 ["Sam has 13 crayons. 7 of them are broken. How many crayons are not broken?",13,7,"-","🖍️🖍️🖍️🖍️🖍️🖍️"],
 ["There are 16 flowers in a vase. 9 flowers are old and thrown away. How many flowers are left?",16,9,"-","💐🌷🌷🌷🌷🌷🌷🌷"],
 ["18 cars are in a parking lot. 10 cars drive away. How many cars are left?",18,10,"-","🚗🚙🚕🚗"],
 ["Kim has 20 stickers. She uses 5 stickers on her notebook. How many stickers does she have left?",20,5,"-","📒⭐⭐⭐⭐⭐"],
 ["A shelf had 17 books. Children borrowed 8 books. How many books are left on the shelf?",17,8,"-","📚📚📚📚📚📚📚📚📚"],
 ["There are 5 candles on a cake. 2 candles are blown out. How many candles are still lit?",5,2,"-","🎂🕯️🕯️🕯️"],
 ["There are 19 children in the class. 9 of them are boys. How many are girls?",19,9,"-","👧👧👧👧👧👧👧👧👧👧"],
 ["A box has 14 pencils. Ravi loses 5 pencils. How many pencils are left in the box?",14,5,"-","📦✏️✏️✏️✏️"],
 ["12 birds are on a wire. 3 birds fly away. How many birds are left on the wire?",12,3,"-","🐦🐦🐦🐦🐦🐦🐦🐦🐦"],
 ["Raj had 15 grapes. He ate 6 grapes. How many grapes does Raj have left?",15,6,"-","🍇🍇🍇🍇🍇🍇🍇🍇🍇"],
 ["There are 8 pizza slices. The family eats 4 slices. How many slices are left?",8,4,"-","🍕🍕🍕🍕"],
 ["Dad blows up 13 balloons. 4 balloons pop. How many balloons are left?",13,4,"-","🎈🎈🎈🎈🎈🎈🎈🎈🎈"],
 ["The class has 18 chairs. 12 chairs have children on them. How many chairs are empty?",18,12,"-","🪑🪑🪑🪑🪑🪑"],
 ["Ella has 16 beads. She loses 7 beads. How many beads does she have now?",16,7,"-","📿🔴🔵🟡🟢"],
 ["There are 10 ice creams in the freezer. 3 ice creams melt. How many ice creams are not melted?",10,3,"-","🍦🍦🍦🍦🍦🍦🍦"],
 ["Frank has 20 coins. He spends 11 coins at the shop. How many coins does he have left?",20,11,"-","🪙🪙🪙🪙🪙🪙🪙🪙🪙"]
];

// Mix: alternate addition and subtraction
const QUESTIONS = [];
for (let i = 0; i < 25; i++) { QUESTIONS.push(ADD[i]); QUESTIONS.push(SUB[i]); }

const $ = id => document.getElementById(id);
let idx = 0, score = 0, answered = false, missed = [];

function shuffle(arr){
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Wrong choices are plausible mistakes: using the wrong sign, being one or two off, or repeating a number from the story.
function makeOptions(q){
  const [, a, b, op] = q;
  const ans = op === "+" ? a + b : a - b;
  const pool = [];
  pool.push(op === "+" ? Math.abs(a - b) : a + b);   // used the wrong operation
  pool.push(ans + 1, ans - 1, ans + 2, ans - 2, a, b);
  const unique = [...new Set(pool)].filter(n => n >= 0 && n <= 25 && n !== ans);
  const wrongOp = pool[0];
  let chosen = [];
  if (unique.includes(wrongOp)) chosen.push(wrongOp);
  const rest = shuffle(unique.filter(n => !chosen.includes(n)));
  while (chosen.length < 3 && rest.length) chosen.push(rest.pop());
  return { ans, options: shuffle([ans, ...chosen]) };
}

function show(el){ el.classList.remove("hidden"); }
function hide(el){ el.classList.add("hidden"); }

function speak(text){
  try{
    if (!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.85; u.pitch = 1.1;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function loadQuestion(){
  answered = false;
  const q = QUESTIONS[idx];
  const { ans, options } = makeOptions(q);
  $("qnum").textContent = "Story " + (idx + 1) + " of " + QUESTIONS.length;
  $("sc").textContent = "⭐ " + score;
  $("prog").style.width = (idx / QUESTIONS.length * 100) + "%";
  $("pic").textContent = q[4];
  $("qtext").textContent = q[0];
  $("fb").textContent = ""; $("fb").className = "fb";
  $("nextBtn").style.display = "none";
  const box = $("opts"); box.innerHTML = "";
  options.forEach(n => {
    const btn = document.createElement("button");
    btn.className = "opt"; btn.textContent = n;
    btn.onclick = () => choose(btn, n, ans, q);
    box.appendChild(btn);
  });
}

function choose(btn, n, ans, q){
  if (answered) return;
  answered = true;
  const eq = q[1] + " " + (q[3] === "+" ? "+" : "−") + " " + q[2] + " = " + ans;
  [...$("opts").children].forEach(b => {
    b.disabled = true;
    if (Number(b.textContent) === ans) b.classList.add("right");
  });
  if (n === ans) {
    score++;
    $("sc").textContent = "⭐ " + score;
    $("fb").textContent = "🎉 Great job! " + eq;
    $("fb").className = "fb ok";
  } else {
    btn.classList.add("wrong");
    missed.push({ text: q[0], eq, picked: n });
    $("fb").textContent = "Good try! The answer is " + ans + ". " + eq;
    $("fb").className = "fb no";
  }
  $("nextBtn").textContent = idx === QUESTIONS.length - 1 ? "See my score 🏆" : "Next ➜";
  $("nextBtn").style.display = "block";
}

function finish(){
  hide($("quiz")); show($("end"));
  const total = QUESTIONS.length;
  const pct = score / total;
  const stars = pct >= .9 ? 5 : pct >= .75 ? 4 : pct >= .6 ? 3 : pct >= .4 ? 2 : 1;
  $("endStars").textContent = "⭐".repeat(stars) + "☆".repeat(5 - stars);
  $("endScore").textContent = score + " / " + total;
  $("endMsg").textContent = pct >= .9 ? "Super star! 🏆" : pct >= .75 ? "Awesome work! 🎉" : pct >= .5 ? "Nice try! Keep practising 💪" : "Good effort! Let's try again 🌈";
  const r = $("review"); r.innerHTML = "";
  if (missed.length) {
    const h = document.createElement("h2"); h.textContent = "Let's look at these again 🔍"; r.appendChild(h);
    missed.forEach(m => {
      const d = document.createElement("div");
      d.innerHTML = "<b></b><br>You picked " + m.picked + ". Right answer: <b>" + m.eq + "</b>";
      d.querySelector("b").textContent = m.text;
      r.appendChild(d);
    });
  } else {
    r.innerHTML = "<p class='lead'>You got every single one right! 🌟</p>";
  }
}

$("startBtn").onclick = () => { hide($("start")); show($("quiz")); idx = 0; score = 0; missed = []; loadQuestion(); };
$("nextBtn").onclick = () => { idx++; if (idx >= QUESTIONS.length) finish(); else loadQuestion(); };
$("listenBtn").onclick = () => speak($("qtext").textContent);
$("againBtn").onclick = () => { hide($("end")); show($("quiz")); idx = 0; score = 0; missed = []; loadQuestion(); window.scrollTo(0,0); };
</script>
</body>
</html>
