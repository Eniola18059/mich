<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find x! Grade 6 Equations Quiz</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:linear-gradient(135deg,#e8f0ff,#f3e8ff);min-height:100vh;display:flex;justify-content:center;padding:20px;color:#1f2a44}
.card{background:#fff;border-radius:20px;box-shadow:0 10px 30px rgba(60,60,120,.15);max-width:640px;width:100%;padding:28px;align-self:flex-start}
h1{margin:0 0 6px;font-size:1.7rem;color:#4338ca}
.sub{color:#5b6585;margin-bottom:18px}
.bar{height:10px;background:#e5e7f5;border-radius:6px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#6366f1,#a855f7);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;font-size:.9rem;color:#5b6585}
.eq{font-size:2rem;font-weight:700;text-align:center;margin:24px 0 8px;color:#111a3a;letter-spacing:.5px}
.eq.word{font-size:1.25rem;line-height:1.5}
.ask{text-align:center;color:#5b6585;margin-bottom:18px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button.opt{font-size:1.25rem;padding:16px;border:2px solid #d6d9f0;background:#f8f9ff;border-radius:14px;cursor:pointer;font-weight:600;color:#1f2a44}
button.opt:hover:not(:disabled){border-color:#6366f1;background:#eef0ff}
button.opt.right{background:#dcfce7;border-color:#22c55e}
button.opt.wrong{background:#fee2e2;border-color:#ef4444}
.fb{margin-top:18px;padding:14px;border-radius:12px;background:#f1f3ff;display:none;line-height:1.6}
.fb b{color:#4338ca}
.go{margin-top:16px;width:100%;padding:14px;font-size:1.05rem;font-weight:700;color:#fff;background:#4f46e5;border:0;border-radius:12px;cursor:pointer;display:none}
.go.start{display:block}
.score{font-size:3rem;text-align:center;font-weight:800;color:#4338ca;margin:12px 0}
.msg{text-align:center;font-size:1.1rem;margin-bottom:16px}
@media(max-width:480px){.opts{grid-template-columns:1fr}.eq{font-size:1.6rem}}
</style>
</head>
<body>
<div class="card" id="app"></div>
<script>
const n=v=>parseFloat(Number(v).toFixed(2));
const Q=[];
function add(q,ans,wrongs,why,word){
  let w=[...new Set(wrongs.map(n))].filter(v=>v!==n(ans)&&v>=0);
  let k=1;
  while(w.length<3){const c=n(ans+(k%2?k:-k)*(Number.isInteger(ans)?1:0.5));k++;if(c!==n(ans)&&c>=0&&!w.includes(c))w.push(c);}
  Q.push({q,ans:n(ans),opts:w.slice(0,3),why,word});
}
// x + a = b
[[7,15],[12,30],[9,41],[18,50],[25,63],[36,90],[8,23]].forEach(([a,b])=>
 add(`x + ${a} = ${b}`,b-a,[b+a,b-a+a>b?a:a,b-a+1,b-a-2,a+b-1],`Subtract ${a} from both sides: x = ${b} − ${a} = ${b-a}.`));
// x - a = b
[[6,9],[14,20],[8,35],[17,33]].forEach(([a,b])=>
 add(`x − ${a} = ${b}`,b+a,[b-a,b,b+a+1,b+a-2],`Add ${a} to both sides: x = ${b} + ${a} = ${b+a}.`));
// ax = b
[[4,28],[7,56],[9,72],[12,60],[5,85]].forEach(([a,b])=>
 add(`${a}x = ${b}`,b/a,[b-a,b*a,b/a+1,b/a-1,b/a+2],`${a}x means ${a} × x. Divide both sides by ${a}: x = ${b} ÷ ${a} = ${b/a}.`));
// x/a = b
[[3,8],[5,6],[7,9],[4,12],[6,11]].forEach(([a,b])=>
 add(`x ÷ ${a} = ${b}`,a*b,[b/a,a+b,a*b-a,a*b+b,a*b-1],`Multiply both sides by ${a}: x = ${b} × ${a} = ${a*b}.`));
// ax + b = c
[[3,5,26],[4,7,35],[2,9,21],[5,3,48],[6,4,52],[3,11,38],[7,2,58],[4,10,46]].forEach(([a,b,c])=>{
 const x=(c-b)/a;
 add(`${a}x + ${b} = ${c}`,x,[(c+b)/a,c-b,c/a-b,x+1,x-1],`Subtract ${b} from both sides: ${a}x = ${c-b}. Then divide by ${a}: x = ${x}.`);});
// ax - b = c
[[3,4,20],[5,6,39],[4,9,31],[6,5,43],[2,7,19]].forEach(([a,b,c])=>{
 const x=(c+b)/a;
 add(`${a}x − ${b} = ${c}`,x,[(c-b)/a,c+b,x+1,x-2,c/a+b],`Add ${b} to both sides: ${a}x = ${c+b}. Then divide by ${a}: x = ${x}.`);});
// x/a + b = c
[[2,5,11],[3,4,10],[5,2,9],[4,6,13]].forEach(([a,b,c])=>{
 const x=(c-b)*a;
 add(`x ÷ ${a} + ${b} = ${c}`,x,[(c-b)/a,(c+b)*a,c*a-b,x+a,x-a],`Subtract ${b}: x ÷ ${a} = ${c-b}. Multiply by ${a}: x = ${x}.`);});
// a(x+b)=c
[[3,4,27],[2,6,24],[5,3,50],[4,2,36]].forEach(([a,b,c])=>{
 const x=c/a-b;
 add(`${a}(x + ${b}) = ${c}`,x,[c/a+b,(c-b)/a,c-b,x+1,x+b],`Divide both sides by ${a}: x + ${b} = ${c/a}. Subtract ${b}: x = ${x}.`);});
// word problems
add("Three times a number, plus 5, equals 20. What is the number?",5,[25/3|0||8,15,7,6,4],"Write it as 3x + 5 = 20. Subtract 5: 3x = 15. Divide by 3: x = 5.",true);
add("A number divided by 4, then decreased by 3, gives 6. What is the number?",36,[9/4,12,27,13,24],"Write it as x ÷ 4 − 3 = 6. Add 3: x ÷ 4 = 9. Multiply by 4: x = 36.",true);
add("Twice the sum of a number and 7 is 30. What is the number?",8,[23,15,11,4,7],"Write it as 2(x + 7) = 30. Divide by 2: x + 7 = 15. Subtract 7: x = 8.",true);
add("A number decreased by 12 is 25. What is the number?",37,[13,12,25,35,38],"Write it as x − 12 = 25. Add 12 to both sides: x = 37.",true);
// decimals
add("x + 2.5 = 7.3",4.8,[9.8,5.8,4.2,4.9,5.2],"Subtract 2.5 from both sides: x = 7.3 − 2.5 = 4.8.");
add("x − 1.6 = 3.4",5,[1.8,2,4.8,5.6,5.2],"Add 1.6 to both sides: x = 3.4 + 1.6 = 5.");
add("4x = 2.8",0.7,[11.2,7,1.2,0.6,0.8],"Divide both sides by 4: x = 2.8 ÷ 4 = 0.7.");
add("2x + 1.5 = 6.5",2.5,[4,5,3.5,2,3],"Subtract 1.5: 2x = 5. Divide by 2: x = 2.5.");

const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let order,i,score,locked;
const app=document.getElementById('app');
function start(){
  app.innerHTML=`<h1>Find x! 🔍</h1><div class="sub">Grade 6 Maths · Solving equations · ${Q.length} questions</div>
  <p>Work out the value of <b>x</b> in each equation. Take your time — use scrap paper and check your answer by putting it back into the equation.</p>
  <button class="go start" onclick="begin()">Start Quiz</button>`;
}
function begin(){order=shuffle(Q.map((_,k)=>k));i=0;score=0;show();}
function show(){
  const q=Q[order[i]];locked=false;
  const opts=shuffle([q.ans,...q.opts]);
  app.innerHTML=`<div class="meta"><span>Question ${i+1} of ${Q.length}</span><span>Score: ${score}</span></div>
  <div class="bar"><i style="width:${i/Q.length*100}%"></i></div>
  <div class="eq ${q.word?'word':''}">${q.q}</div>
  <div class="ask">${q.word?'Choose the correct number.':'What is x?'}</div>
  <div class="opts">${opts.map(o=>`<button class="opt" data-v="${o}">${q.word?'':'x = '}${o}</button>`).join('')}</div>
  <div class="fb" id="fb"></div>
  <button class="go" id="next" onclick="next()">${i===Q.length-1?'See Results':'Next Question →'}</button>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(b,q));
}
function pick(b,q){
  if(locked)return;locked=true;
  const ok=Number(b.dataset.v)===q.ans;
  if(ok)score++;
  app.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(Number(x.dataset.v)===q.ans)x.classList.add('right');});
  if(!ok)b.classList.add('wrong');
  const fb=document.getElementById('fb');
  fb.style.display='block';
  fb.innerHTML=`<b>${ok?'Correct! 🎉':'Not quite.'}</b> The answer is x = ${q.ans}.<br>${q.why}`;
  document.getElementById('next').style.display='block';
}
function next(){i++;i<Q.length?show():finish();}
function finish(){
  const p=Math.round(score/Q.length*100);
  const m=p>=90?'Equation expert! 🏆':p>=70?'Great work! Keep practising the tricky ones.':p>=50?'Good effort — review the steps and try again.':'Keep going! Re-read the worked steps and retry.';
  app.innerHTML=`<h1>Quiz complete!</h1><div class="score">${score} / ${Q.length}</div><div class="msg">${p}% — ${m}</div>
  <button class="go start" onclick="begin()">Try Again</button>`;
}
start();
</script>
</body>
</html>
