<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zion's Number Adventure</title>
<style>
  :root{
    --sky:#dff3ff; --ink:#23305a; --blue:#3b82f6; --green:#22c55e; --red:#ef4444;
    --yellow:#ffd23f; --orange:#ff9f43; --purple:#8b5cf6; --pink:#ff6fa5; --card:#ffffff;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; color:var(--ink);
    font-family:"Trebuchet MS","Comic Sans MS","Segoe UI",system-ui,sans-serif;
    background:linear-gradient(180deg,#bfe9ff 0%,#e9f8ff 55%,#fff7d6 100%);
  }
  .wrap{max-width:760px; margin:0 auto; padding:16px 14px 40px}
  header{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px}
  .logo{font-size:1.25rem; font-weight:800}
  .score-pill{background:var(--yellow); border-radius:999px; padding:6px 14px; font-weight:800; box-shadow:0 3px 0 #e0b100}
  .card{background:var(--card); border-radius:26px; padding:22px 18px; box-shadow:0 8px 0 rgba(35,48,90,.12)}
  .hidden{display:none !important}

  /* start screen */
  .hero{text-align:center}
  .hero .big{font-size:4.2rem; line-height:1}
  .hero h1{margin:8px 0 6px; font-size:2rem}
  .hero p{margin:6px 0 14px; font-size:1.1rem}
  .chapters{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0 20px; text-align:left}
  .chap{border-radius:16px; padding:10px 12px; font-weight:700; font-size:.95rem; color:#fff}
  .chap small{display:block; font-weight:600; opacity:.95}
  .c1{background:var(--blue)} .c2{background:var(--purple)} .c3{background:var(--orange)} .c4{background:var(--pink)}
  button{font-family:inherit; cursor:pointer; border:none}
  .go{background:var(--green); color:#fff; font-size:1.5rem; font-weight:800; padding:14px 38px; border-radius:999px; box-shadow:0 6px 0 #15803d}
  .go:active{transform:translateY(4px); box-shadow:0 2px 0 #15803d}
  .alt{background:var(--blue); box-shadow:0 6px 0 #1d4ed8}

  /* quiz */
  .bar{height:16px; background:#e6edf7; border-radius:999px; overflow:hidden; margin:6px 0 12px}
  .bar > i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--green),var(--yellow)); transition:width .35s}
  .meta{display:flex; justify-content:space-between; align-items:center; font-weight:800; font-size:.95rem}
  .tag{color:#fff; border-radius:999px; padding:4px 12px}
  .qtext{font-size:1.65rem; font-weight:800; margin:16px 0 8px; line-height:1.3}
  .say{background:#eef4ff; color:var(--ink); border-radius:999px; padding:6px 14px; font-weight:700; margin-bottom:6px}
  .visual{background:#f6fbff; border:3px dashed #bcd9f3; border-radius:18px; padding:10px; margin:10px 0; text-align:center; font-size:2.1rem; line-height:1.35; letter-spacing:2px}
  .visual .plus{font-weight:800; margin:0 10px; color:var(--orange)}
  .visual .x{opacity:.28; text-decoration:line-through}
  .bondbox{display:flex; justify-content:center; margin:8px 0}
  .opts{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px}
  .opt{background:#fff; border:4px solid #cfe0f5; border-radius:20px; font-size:1.7rem; font-weight:800; color:var(--ink); padding:16px 8px; min-height:74px; box-shadow:0 5px 0 #cfe0f5; transition:transform .08s}
  .opt:hover{border-color:var(--blue)}
  .opt:active{transform:translateY(3px)}
  .opt.long{font-size:1.25rem}
  .opt.right{background:#d9f9e3; border-color:var(--green); box-shadow:0 5px 0 #15a34a}
  .opt.wrong{background:#ffe0e0; border-color:var(--red); box-shadow:0 5px 0 #c53030}
  .opt:disabled{cursor:default}
  .feedback{margin-top:16px; border-radius:18px; padding:12px 14px; font-size:1.2rem; font-weight:700}
  .feedback.good{background:#d9f9e3} .feedback.bad{background:#ffe9d6}
  .next{margin-top:14px; width:100%; background:var(--blue); color:#fff; font-size:1.4rem; font-weight:800; padding:14px; border-radius:18px; box-shadow:0 5px 0 #1d4ed8}

  /* results */
  .results{text-align:center}
  .results .big{font-size:4rem}
  .score-big{font-size:3rem; font-weight:900; color:var(--purple)}
  .stars{font-size:2.2rem; margin:4px 0 10px}
  .breakdown{text-align:left; margin:16px 0}
  .row{display:flex; align-items:center; gap:10px; margin:8px 0; font-weight:700; font-size:.95rem}
  .row .lbl{flex:0 0 150px}
  .row .meter{flex:1; height:16px; background:#e6edf7; border-radius:999px; overflow:hidden}
  .row .meter i{display:block; height:100%}
  .missed{text-align:left; margin-top:12px}
  .missed li{margin:8px 0; font-size:1rem; background:#fff7f0; border-radius:12px; padding:8px 10px}
  .btns{display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin-top:16px}
  @media (max-width:480px){
    .qtext{font-size:1.4rem} .opt{font-size:1.5rem; min-height:66px} .row .lbl{flex-basis:110px}
    .hero h1{font-size:1.65rem}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🚀 Zion's Number Adventure</div>
    <div class="score-pill" id="scorePill">⭐ 0</div>
  </header>

  <!-- START -->
  <section class="card hero" id="start">
    <div class="big">🦁🔢🌈</div>
    <h1>Hi Zion! Ready to play?</h1>
    <p>50 super-challenge number questions. Think carefully, then tap the best answer!</p>
    <div class="chapters">
      <div class="chap c1">Chapter 5<small>Numbers to 20</small></div>
      <div class="chap c3">Chapter 6<small>Addition to 20</small></div>
    </div>
    <button class="go" id="startBtn">Let's go! ▶</button>
  </section>

  <!-- QUIZ -->
  <section class="card hidden" id="quiz">
    <div class="meta"><span id="qcount">Question 1 of 70</span><span class="tag" id="chTag">Part 1</span></div>
    <div class="bar"><i id="barFill"></i></div>
    <button class="say" id="sayBtn" aria-label="Read the question out loud">🔊 Read to me</button>
    <div class="qtext" id="qtext"></div>
    <div id="visualBox"></div>
    <div class="opts" id="opts"></div>
    <div id="feedback" class="feedback hidden"></div>
    <button class="next hidden" id="nextBtn">Next ▶</button>
  </section>

  <!-- RESULTS -->
  <section class="card results hidden" id="results"></section>
</div>

<script>
// QUESTIONS-START
const CH = [{"name":"Chapter 5: Numbers to 20","color":"#3b82f6"},{"name":"Chapter 6: Addition to 20","color":"#ff9f43"}];
const Q = [{"q":"How many fish are there?","v":{"e":"🐟","n":13},"a":"13","d":["12","11","10"],"e":"1 full row of 10 and 3 more: 13 fish.","ch":0},{"q":"How many stars are there?","v":{"e":"⭐","n":16},"a":"16","d":["17","18","19"],"e":"10 and 6 more make 16 stars.","ch":0},{"q":"How many balloons are there?","v":{"e":"🎈","n":18},"a":"18","d":["17","16","15"],"e":"10 and 8 more make 18 balloons.","ch":0},{"q":"10 and 4 make what number?","a":"14","d":["13","15","24"],"e":"10 + 4 = 14.","math":"10+4","ch":0},{"q":"10 and 7 make what number?","a":"17","d":["16","15","18"],"e":"10 + 7 = 17.","math":"10+7","ch":0},{"q":"Fourteen is ten and how many ones?","a":"4","d":["1","3","2"],"e":"14 is 10 and 4 ones.","ch":0},{"q":"What does the number 16 have?","a":"1 ten and 6 ones","d":["6 tens and 1 one","1 ten and 5 ones","10 tens and 6 ones"],"e":"16 is 1 ten and 6 ones.","long":true,"ch":0},{"q":"18 is 1 ten and __ ones.","a":"8","d":["1","7","9"],"e":"18 is 10 and 8.","ch":0},{"q":"Which number is 1 more than 19?","a":"20","d":["18","10","21"],"e":"Count on 1 from 19: 20.","ch":0},{"q":"What number is 1 less than 15?","a":"14","d":["13","5","16"],"e":"Count back 1 from 15: 14.","ch":0},{"q":"What number is 2 more than 16?","a":"18","d":["19","20","21"],"e":"Count on 2 from 16: 17, 18.","ch":0},{"q":"What number is 2 less than 13?","a":"11","d":["12","15","13"],"e":"Count back 2 from 13: 12, 11.","ch":0},{"q":"Find the missing number:  11, 12, __ , 14, 15","a":"13","d":["12","10","11"],"e":"11, 12, 13, 14, 15.","ch":0},{"q":"Count backwards. Find the missing number:  20, 19, __ , 17, 16","a":"18","d":["17","15","16"],"e":"20, 19, 18, 17, 16.","ch":0},{"q":"Find the missing number:  14, __ , 16, 17, 18","a":"15","d":["14","13","12"],"e":"14, 15, 16, 17, 18.","ch":0},{"q":"Which number comes between 17 and 19?","a":"18","d":["16","20","17"],"e":"17, 18, 19 — 18 is in the middle.","ch":0},{"q":"Which number is greater than 15 but less than 17?","a":"16","d":["15","17","18"],"e":"15, 16, 17 — only 16 fits.","ch":0},{"q":"Which is the greatest number?  12,  19,  15,  9","a":"19","d":["12","15","9"],"e":"19 is more than 12, 15 and 9.","ch":0},{"q":"Which is the smallest number?  17,  11,  20,  14","a":"11","d":["17","20","14"],"e":"11 is smaller than 17, 20 and 14.","ch":0},{"q":"Put the numbers in order from smallest to biggest:  15,  11,  18","a":"11, 15, 18","d":["18, 15, 11","11, 18, 15","15, 11, 18"],"e":"Smallest first: 11, 15, 18.","long":true,"ch":0},{"q":"Which one is true?","a":"13 is less than 16","d":["13 is greater than 16","20 is less than 18","12 is the same as 21"],"e":"13 is less than 16.","long":true,"ch":0},{"q":"Which number is the word “fifteen”?","a":"15","d":["50","16","17"],"e":"Fifteen is written 15.","ch":0},{"q":"Which number is the word “twelve”?","a":"12","d":["11","2","10"],"e":"Twelve is written 12.","ch":0},{"q":"What number is 10 more than 6?","a":"16","d":["15","60","17"],"e":"10 + 6 = 16.","math":"10+6","ch":0},{"q":"9 + 4 = ?","a":"13","d":["12","11","14"],"e":"9 + 4 = 13","math":"9+4","ch":1},{"q":"8 + 5 = ?","a":"13","d":["14","16","15"],"e":"8 + 5 = 13","math":"8+5","ch":1},{"q":"9 + 6 = ?","a":"15","d":["14","16","17"],"e":"9 + 6 = 15","math":"9+6","ch":1},{"q":"8 + 6 = ?","a":"14","d":["13","12","15"],"e":"8 + 6 = 14","math":"8+6","ch":1},{"q":"9 + 9 = ?","a":"18","d":["17","16","15"],"e":"9 + 9 = 18","math":"9+9","ch":1},{"q":"7 + 7 = ?","a":"14","d":["12","15","16"],"e":"7 + 7 = 14","math":"7+7","ch":1},{"q":"6 + 6 = ?","a":"12","d":["11","10","13"],"e":"6 + 6 = 12","math":"6+6","ch":1},{"q":"8 + 8 = ?","a":"16","d":["15","14","18"],"e":"8 + 8 = 16","math":"8+8","ch":1},{"q":"10 + 5 = ?","a":"15","d":["16","50","17"],"e":"10 + 5 = 15","math":"10+5","ch":1},{"q":"10 + 9 = ?","a":"19","d":["18","20","21"],"e":"10 + 9 = 19","math":"10+9","ch":1},{"q":"9 + 8 = ?","a":"17","d":["16","15","18"],"e":"9 + 8 = 17","math":"9+8","ch":1},{"q":"7 + 9 = ?","a":"16","d":["17","18","19"],"e":"7 + 9 = 16","math":"7+9","ch":1},{"q":"5 + 5 + 4 = ?","a":"14","d":["13","10","12"],"e":"5 + 5 = 10, then 10 + 4 = 14.","math":"5+5+4","ch":1},{"q":"6 + 4 + 7 = ?","a":"17","d":["16","18","19"],"e":"6 + 4 = 10, then 10 + 7 = 17.","math":"6+4+7","ch":1},{"q":"8 + __ = 15","a":"7","d":["6","8","9"],"e":"8 + 7 = 15.","math":"15-8","ch":1},{"q":"__ + 6 = 14","a":"8","d":["9","10","11"],"e":"8 + 6 = 14.","math":"14-6","ch":1},{"q":"9 + __ = 18","a":"9","d":["8","7","6"],"e":"9 + 9 = 18.","math":"18-9","ch":1},{"q":"__ + 7 = 16","a":"9","d":["8","10","11"],"e":"9 + 7 = 16.","math":"16-7","ch":1},{"q":"To add 9 + 4, first make 10: 9 + 1 = 10. Then add the 3 that is left. What is 9 + 4?","a":"13","d":["14","15","16"],"e":"9 + 1 = 10, then 10 + 3 = 13.","math":"9+4","ch":1},{"q":"Which one equals 8 + 6?","a":"7 + 7","d":["7 + 6","8 + 7","9 + 4"],"e":"8 + 6 = 14 and 7 + 7 = 14.","long":true,"ch":1},{"q":"Which one is the greatest?","a":"9 + 8","d":["8 + 8","7 + 9","6 + 10"],"e":"9 + 8 = 17. The others all make 16.","long":true,"ch":1},{"q":"Zion has 9 cars. He gets 5 more. How many cars does he have now?","a":"14","d":["13","4","15"],"e":"9 + 5 = 14 cars.","math":"9+5","ch":1},{"q":"8 birds sit in a tree. 7 more birds fly in. How many birds are in the tree?","a":"15","d":["16","17","18"],"e":"8 + 7 = 15 birds.","math":"8+7","ch":1},{"q":"Zion has 6 red balloons, 5 blue balloons and 4 green balloons. How many balloons does he have?","a":"15","d":["14","16","17"],"e":"6 + 5 + 4 = 15 balloons.","math":"6+5+4","ch":1},{"q":"12 children are playing. 6 more children come to play. How many children are playing now?","a":"18","d":["17","19","20"],"e":"12 + 6 = 18 children.","math":"12+6","ch":1},{"q":"10 + 10 = ?","a":"20","d":["30","21","22"],"e":"10 + 10 = 20.","math":"10+10","ch":1}];
// QUESTIONS-END

// ---------- App ----------
const $ = id => document.getElementById(id);
let order, idx, score, wrongList, answered, chScore, chTotal, current;

function shuffle(a){
  a = a.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function repeat(e,n,x){
  let s=""; for(let i=0;i<n;i++){ s += (x && i>=n-x) ? `<span class="x">${e}</span>` : e; if((n>10 && i===9) || (n<=10 && n>6 && i===4)) s+="<br>"; } return s;
}
function bondSVG(b){
  const [w,p1,p2]=b;
  const c=v=> v===null ? "?" : v;
  const fill=v=> v===null ? "#fff3c4" : "#e3f1ff";
  return `<svg width="230" height="170" viewBox="0 0 230 170" role="img" aria-label="number bond">
    <line x1="115" y1="48" x2="60" y2="112" stroke="#23305a" stroke-width="4"/>
    <line x1="115" y1="48" x2="170" y2="112" stroke="#23305a" stroke-width="4"/>
    <circle cx="115" cy="38" r="34" fill="${fill(w)}" stroke="#3b82f6" stroke-width="5"/>
    <circle cx="55" cy="122" r="34" fill="${fill(p1)}" stroke="#8b5cf6" stroke-width="5"/>
    <circle cx="175" cy="122" r="34" fill="${fill(p2)}" stroke="#8b5cf6" stroke-width="5"/>
    <g font-family="Trebuchet MS, sans-serif" font-weight="800" font-size="34" text-anchor="middle" fill="#23305a">
      <text x="115" y="50">${c(w)}</text><text x="55" y="134">${c(p1)}</text><text x="175" y="134">${c(p2)}</text>
    </g></svg>`;
}
function speakText(q){
  let t = q.q.replace(/−/g," minus ").replace(/\+/g," plus ").replace(/=/g," equals ").replace(/__/g," what number ").replace(/\?/g," what number? ");
  if(q.bond) t = q.q + " The whole is " + (q.bond[0]===null?"missing":q.bond[0]) + ". The parts are " + (q.bond[1]===null?"missing":q.bond[1]) + " and " + (q.bond[2]===null?"missing":q.bond[2]) + ".";
  return t;
}

function start(subset){
  const base = subset || Q.map((_,i)=>i);
  order = base.slice();
  idx = 0; score = 0; wrongList = []; chScore=CH.map(()=>0); chTotal=CH.map(()=>0);
  $("start").classList.add("hidden"); $("results").classList.add("hidden"); $("quiz").classList.remove("hidden");
  $("scorePill").textContent = "⭐ 0";
  showQ();
}
function showQ(){
  answered = false;
  current = Q[order[idx]];
  const q = current;
  $("qcount").textContent = `Question ${idx+1} of ${order.length}`;
  const tag = $("chTag"); tag.textContent = CH[q.ch].name; tag.style.background = CH[q.ch].color;
  $("barFill").style.width = (idx/order.length*100)+"%";
  $("qtext").textContent = q.q;
  let vis = "";
  if(q.v && q.v.mix) vis = `<div class="visual">${q.v.mix.map(m=>repeat(m[0],m[1])).join("<br>")}</div>`;
  else if(q.v) vis = `<div class="visual">${repeat(q.v.e,q.v.n,q.v.x)}</div>`;
  if(q.v2) vis = `<div class="visual">${repeat(q.v2[0].e,q.v2[0].n)}<span class="plus">${q.sep||"+"}</span>${repeat(q.v2[1].e,q.v2[1].n)}</div>`;
  if(q.bond) vis = `<div class="bondbox">${bondSVG(q.bond)}</div>`;
  $("visualBox").innerHTML = vis;
  const opts = $("opts"); opts.innerHTML = "";
  shuffle([q.a, ...q.d]).forEach(text=>{
    const b = document.createElement("button");
    b.className = "opt" + (q.long ? " long" : "");
    b.textContent = text;
    b.onclick = () => choose(b, text);
    opts.appendChild(b);
  });
  $("feedback").classList.add("hidden"); $("nextBtn").classList.add("hidden");
  $("nextBtn").textContent = idx===order.length-1 ? "See my score 🎉" : "Next ▶";
  if(window.speechSynthesis) speechSynthesis.cancel();
}
function choose(btn, text){
  if(answered) return;
  answered = true;
  const q = current, ok = text === q.a;
  chTotal[q.ch]++;
  [...$("opts").children].forEach(b=>{
    b.disabled = true;
    if(b.textContent === q.a) b.classList.add("right");
  });
  const fb = $("feedback");
  if(ok){
    score++; chScore[q.ch]++;
    $("scorePill").textContent = "⭐ " + score;
    const cheers = ["Great job, Zion! 🎉","Super! ⭐","You got it! 🌟","Awesome! 👏","Brilliant! 🦁","Yes! Well done! 🚀"];
    fb.className = "feedback good"; fb.textContent = cheers[Math.floor(Math.random()*cheers.length)];
  }else{
    btn.classList.add("wrong");
    wrongList.push(order[idx]);
    fb.className = "feedback bad"; fb.textContent = "Nice try! " + q.e;
  }
  fb.classList.remove("hidden"); $("nextBtn").classList.remove("hidden");
}
function next(){
  idx++;
  if(idx >= order.length) return finish();
  showQ(); window.scrollTo({top:0,behavior:"smooth"});
}
function finish(){
  $("quiz").classList.add("hidden");
  const res = $("results"); res.classList.remove("hidden");
  const total = order.length, pct = Math.round(score/total*100);
  const stars = pct>=90 ? "⭐⭐⭐" : pct>=70 ? "⭐⭐" : pct>=40 ? "⭐" : "🌱";
  const msg = pct>=90 ? "Amazing work, Zion! You are a number superstar!" : pct>=70 ? "Great job! You know lots of number facts!" : pct>=40 ? "Good try! Let's practise a little more." : "Keep practising. You will get better and better!";
  let rows = "";
  CH.forEach((c,i)=>{
    if(!chTotal[i]) return;
    const p = Math.round(chScore[i]/chTotal[i]*100);
    rows += `<div class="row"><span class="lbl">${c.name}</span><span class="meter"><i style="width:${p}%;background:${c.color}"></i></span><span>${chScore[i]}/${chTotal[i]}</span></div>`;
  });
  let missed = "";
  if(wrongList.length){
    missed = `<div class="missed"><h3>Let's look again 👀</h3><ul>` +
      wrongList.map(i=>`<li><b>${Q[i].q.replace(/</g,"&lt;")}</b><br>Answer: <b>${Q[i].a}</b></li>`).join("") + `</ul></div>`;
  }
  res.innerHTML = `<div class="big">🏆</div>
    <div class="score-big">${score} / ${total}</div>
    <div class="stars">${stars}</div>
    <p style="font-size:1.2rem;font-weight:700">${msg}</p>
    <div class="breakdown">${rows}</div>
    <div class="btns">
      <button class="go" id="again">Play again 🔁</button>
      ${wrongList.length ? '<button class="go alt" id="retry">Practise missed ones 💪</button>' : ''}
    </div>${missed}`;
  $("again").onclick = () => start();
  if($("retry")) $("retry").onclick = () => start(shuffle(wrongList));
  window.scrollTo({top:0,behavior:"smooth"});
}

$("startBtn").onclick = () => start();
$("nextBtn").onclick = next;
$("sayBtn").onclick = () => {
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(speakText(current)); u.rate = 0.85; speechSynthesis.speak(u);
};
</script>
</body>
</html>
