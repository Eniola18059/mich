<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find x! Equation Quiz</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --ink:#1f2540; --muted:#6a7094; --accent:#4f46e5; --accent-soft:#eceafd;
    --good:#16a34a; --good-soft:#dcfce7; --bad:#dc2626; --bad-soft:#fee2e2; --line:#e3e6f0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;line-height:1.45;min-height:100vh;display:flex;justify-content:center;padding:24px 14px}
  .wrap{width:100%;max-width:640px}
  .card{background:var(--card);border-radius:20px;padding:28px;box-shadow:0 8px 30px rgba(40,50,110,.10)}
  h1{margin:0 0 6px;font-size:2rem}
  h1 span{color:var(--accent)}
  .sub{color:var(--muted);margin:0 0 20px}
  .tip{background:var(--accent-soft);border-radius:14px;padding:14px 16px;margin:18px 0 24px}
  .tip b{color:var(--accent)}
  button{font:inherit;cursor:pointer}
  .primary{background:var(--accent);color:#fff;border:0;border-radius:14px;padding:14px 26px;font-weight:700;font-size:1.05rem;transition:transform .1s,opacity .2s}
  .primary:hover{transform:translateY(-1px)}
  .primary:disabled{opacity:.4;cursor:default;transform:none}
  .hidden{display:none}
  .top{display:flex;justify-content:space-between;color:var(--muted);font-size:.95rem;margin-bottom:8px;font-weight:600}
  .bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:24px}
  .bar>div{height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .3s}
  .prompt{color:var(--muted);font-weight:600;margin-bottom:8px}
  .eq{font-size:2.2rem;font-weight:800;text-align:center;background:var(--accent-soft);border-radius:16px;padding:24px 10px;margin-bottom:22px;letter-spacing:.5px;overflow-wrap:anywhere}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .opt{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px;font-size:1.2rem;font-weight:700;text-align:left;color:var(--ink);transition:border-color .15s,background .15s}
  .opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
  .opt .k{flex:none;width:30px;height:30px;border-radius:9px;background:var(--line);display:grid;place-items:center;font-size:.9rem;color:var(--muted)}
  .opt.good{border-color:var(--good);background:var(--good-soft)}
  .opt.good .k{background:var(--good);color:#fff}
  .opt.bad{border-color:var(--bad);background:var(--bad-soft)}
  .opt.bad .k{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default}
  .fb{margin-top:20px;border-radius:14px;padding:14px 16px}
  .fb.good{background:var(--good-soft)} .fb.bad{background:var(--bad-soft)}
  .fb strong{display:block;margin-bottom:4px}
  .next{margin-top:18px;text-align:right}
  .score-big{font-size:3.2rem;font-weight:800;color:var(--accent);margin:4px 0}
  .review{margin-top:22px;border-top:1px solid var(--line);padding-top:6px}
  .ri{padding:12px 0;border-bottom:1px solid var(--line)}
  .ri .e{font-weight:800;font-size:1.1rem}
  .ri .x{color:var(--muted);font-size:.95rem}
  .ri .bad{color:var(--bad);font-weight:700} .ri .good{color:var(--good);font-weight:700}
  @media(max-width:480px){.opts{grid-template-columns:1fr}.eq{font-size:1.7rem}.card{padding:20px}}
</style>
</head>
<body>
<div class="wrap">

  <div id="start" class="card">
    <h1>Find <span>x</span>!</h1>
    <p class="sub">50 questions &middot; solve each equation to find the value of x</p>
    <div class="tip"><b>Golden rule:</b> whatever you do to one side of the equation, you must do to the other side. Use the opposite (inverse) operation to get x alone.</div>
    <button class="primary" id="startBtn">Start quiz</button>
  </div>

  <div id="quiz" class="card hidden">
    <div class="top"><span id="qnum"></span><span id="score"></span></div>
    <div class="bar"><div id="prog"></div></div>
    <div class="prompt" id="prompt"></div>
    <div class="eq" id="eq"></div>
    <div class="opts" id="opts"></div>
    <div class="fb hidden" id="fb"></div>
    <div class="next"><button class="primary hidden" id="nextBtn">Next</button></div>
  </div>

  <div id="result" class="card hidden">
    <h1>Quiz complete!</h1>
    <div class="score-big" id="finalScore"></div>
    <p class="sub" id="finalMsg"></p>
    <button class="primary" id="againBtn">Try again</button>
    <div class="review" id="review"></div>
  </div>

</div>

<script>
function r2(v){ return Math.round(v*100)/100; }
function fmt(v){ return String(r2(v)); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function co(a,X){ return X==='x' ? a+'x' : a+'('+X+')'; }

const TYPES = {
  add:  { text:(p,X)=>`${X} + ${p[0]} = ${p[1]}`, f:(x,p)=>x+p[0], rhs:p=>p[1], ans:p=>p[1]-p[0],
          M:p=>[p[1]+p[0], p[1], p[0]],
          steps:(p,a)=>`Subtract ${p[0]} from both sides: x = ${fmt(p[1])} &minus; ${fmt(p[0])} = ${fmt(a)}.` },
  sub:  { text:(p,X)=>`${X} &minus; ${p[0]} = ${p[1]}`, f:(x,p)=>x-p[0], rhs:p=>p[1], ans:p=>p[1]+p[0],
          M:p=>[p[1]-p[0], p[1], p[0]],
          steps:(p,a)=>`Add ${fmt(p[0])} to both sides: x = ${fmt(p[1])} + ${fmt(p[0])} = ${fmt(a)}.` },
  mul:  { text:(p,X)=>`${co(p[0],X)} = ${p[1]}`, f:(x,p)=>p[0]*x, rhs:p=>p[1], ans:p=>p[1]/p[0],
          M:p=>[p[0]*p[1], p[1]-p[0], p[1]+p[0]],
          steps:(p,a)=>`Divide both sides by ${p[0]}: x = ${fmt(p[1])} &divide; ${p[0]} = ${fmt(a)}.` },
  div:  { text:(p,X)=>`${X} &divide; ${p[0]} = ${p[1]}`, f:(x,p)=>x/p[0], rhs:p=>p[1], ans:p=>p[0]*p[1],
          M:p=>[p[0]+p[1], p[1], p[0]*p[1]+p[0], p[0]*p[1]-p[0]],
          steps:(p,a)=>`Multiply both sides by ${p[0]}: x = ${p[1]} &times; ${p[0]} = ${fmt(a)}.` },
  ma:   { text:(p,X)=>`${co(p[0],X)} + ${p[1]} = ${p[2]}`, f:(x,p)=>p[0]*x+p[1], rhs:p=>p[2], ans:p=>(p[2]-p[1])/p[0],
          M:p=>[p[2]-p[1], (p[2]+p[1])/p[0], (p[2]-p[1])*p[0], p[2]/p[0]],
          steps:(p,a)=>`Subtract ${p[1]} from both sides: ${p[0]}x = ${p[2]-p[1]}. Then divide by ${p[0]}: x = ${p[2]-p[1]} &divide; ${p[0]} = ${fmt(a)}.` },
  ms:   { text:(p,X)=>`${co(p[0],X)} &minus; ${p[1]} = ${p[2]}`, f:(x,p)=>p[0]*x-p[1], rhs:p=>p[2], ans:p=>(p[2]+p[1])/p[0],
          M:p=>[p[2]+p[1], (p[2]-p[1])/p[0], (p[2]+p[1])*p[0], p[2]/p[0]],
          steps:(p,a)=>`Add ${p[1]} to both sides: ${p[0]}x = ${p[2]+p[1]}. Then divide by ${p[0]}: x = ${p[2]+p[1]} &divide; ${p[0]} = ${fmt(a)}.` },
  da:   { text:(p,X)=>`${X} &divide; ${p[0]} + ${p[1]} = ${p[2]}`, f:(x,p)=>x/p[0]+p[1], rhs:p=>p[2], ans:p=>(p[2]-p[1])*p[0],
          M:p=>[p[2]-p[1], (p[2]+p[1])*p[0], p[2]*p[0]-p[1], p[2]*p[0]],
          steps:(p,a)=>`Subtract ${p[1]} from both sides: x &divide; ${p[0]} = ${p[2]-p[1]}. Then multiply by ${p[0]}: x = ${p[2]-p[1]} &times; ${p[0]} = ${fmt(a)}.` },
  dist: { text:(p,X)=>`${p[0]}(${X} + ${p[1]}) = ${p[2]}`, f:(x,p)=>p[0]*(x+p[1]), rhs:p=>p[2], ans:p=>p[2]/p[0]-p[1],
          M:p=>[p[2]/p[0]+p[1], p[2]-p[1], (p[2]-p[1])/p[0], p[2]/p[0]],
          steps:(p,a)=>`Divide both sides by ${p[0]}: x + ${p[1]} = ${p[2]/p[0]}. Then subtract ${p[1]}: x = ${p[2]/p[0]} &minus; ${p[1]} = ${fmt(a)}.` }
};

const SPECS = [
  // one-step: x + a = b
  ['add',7,15],['add',12,30],['add',25,61],['add',9,34],['add',48,100],['add',16,40],['add',19,52],['add',33,75],
  // one-step: x - a = b
  ['sub',6,9],['sub',14,20],['sub',8,17],['sub',25,40],['sub',9,31],['sub',13,22],['sub',30,45],['sub',17,18],
  // one-step: ax = b
  ['mul',4,28],['mul',7,63],['mul',9,54],['mul',12,96],['mul',5,85],['mul',8,72],['mul',11,132],['mul',6,108],
  // one-step: x / a = b
  ['div',3,8],['div',5,11],['div',4,9],['div',6,7],['div',8,12],['div',10,15],['div',7,6],
  // two-step: ax + b = c
  ['ma',3,5,23],['ma',4,9,37],['ma',2,11,31],['ma',5,8,53],['ma',6,4,52],['ma',7,3,59],
  // two-step: ax - b = c
  ['ms',2,7,15],['ms',3,4,17],['ms',5,9,36],['ms',4,6,30],['ms',8,10,46],
  // two-step: x / a + b = c
  ['da',2,6,14],['da',3,4,9],['da',5,7,12],
  // parentheses: a(x + b) = c
  ['dist',2,3,18],['dist',3,4,27],
  // decimals
  ['add',3.4,9.1],['sub',2.6,4.1],['mul',4,18.4]
];

const PROMPTS = ['Solve for x:','Find the value of x:','What is x?','Solve the equation:'];

function pickDistractors(M, N, ans, isDec){
  const valid = v => { v=r2(v); return isFinite(v) && v>0 && v!==r2(ans) && (isDec || Number.isInteger(v)); };
  const out = [];
  const add = v => { v=r2(v); if(valid(v) && !out.includes(v)) out.push(v); };
  const m = shuffle(M).filter(valid).map(r2);
  const n = shuffle(N).filter(valid).map(r2);
  // two likely "wrong method" answers, one near-miss, then fill
  m.slice(0,2).forEach(add);
  n.forEach(v=>{ if(out.length<3) add(v); });
  m.forEach(v=>{ if(out.length<3) add(v); });
  return out.slice(0,3);
}

function buildQuestions(){
  return shuffle(SPECS).map(spec=>{
    const t = spec[0], p = spec.slice(1), T = TYPES[t];
    const ans = r2(T.ans(p));
    const isDec = p.some(v=>!Number.isInteger(v));
    const s = isDec ? 0.1 : 1;
    const N = [ans+s, ans-s, ans+2*s, ans-2*s].concat(isDec ? [ans+1, ans-1] : []);
    const dis = pickDistractors(T.M(p), N, ans, isDec);
    return {
      eq: T.text(p,'x'),
      check: T.text(p, fmt(ans)),
      ans: ans,
      opts: shuffle([ans].concat(dis)),
      expl: T.steps(p, ans),
      ok: r2(T.f(ans,p)) === r2(T.rhs(p)) && dis.length===3
    };
  }).map((q,i)=>{ q.prompt = PROMPTS[i%PROMPTS.length]; return q; });
}

if (typeof document !== 'undefined') {
  const $ = id => document.getElementById(id);
  let Q=[], i=0, score=0, locked=false, missed=[];

  function start(){
    Q = buildQuestions(); i=0; score=0; missed=[];
    $('start').classList.add('hidden'); $('result').classList.add('hidden'); $('quiz').classList.remove('hidden');
    show();
  }
  function show(){
    const q=Q[i]; locked=false;
    $('qnum').textContent = `Question ${i+1} of ${Q.length}`;
    $('score').textContent = `Score: ${score}`;
    $('prog').style.width = (i/Q.length*100)+'%';
    $('prompt').textContent = q.prompt;
    $('eq').innerHTML = q.eq;
    $('fb').classList.add('hidden'); $('nextBtn').classList.add('hidden');
    $('opts').innerHTML='';
    q.opts.forEach((v,k)=>{
      const b=document.createElement('button');
      b.className='opt'; b.innerHTML=`<span class="k">${'ABCD'[k]}</span><span>x = ${fmt(v)}</span>`;
      b.onclick=()=>choose(k);
      $('opts').appendChild(b);
    });
  }
  function choose(k){
    if(locked) return; locked=true;
    const q=Q[i], picked=q.opts[k], right = picked===q.ans;
    const btns=$('opts').children;
    q.opts.forEach((v,idx)=>{ btns[idx].disabled=true; if(v===q.ans) btns[idx].classList.add('good'); });
    if(right){ score++; } else { btns[k].classList.add('bad'); missed.push({q,picked}); }
    $('score').textContent = `Score: ${score}`;
    const fb=$('fb'); fb.className='fb '+(right?'good':'bad');
    fb.innerHTML = `<strong>${right?'Correct!':'Not quite.'}</strong>${q.expl}<br><span style="color:#6a7094">Check: ${q.check} &#10003;</span>`;
    $('nextBtn').textContent = (i===Q.length-1) ? 'See results' : 'Next';
    $('nextBtn').classList.remove('hidden');
    $('nextBtn').focus();
  }
  function next(){
    if(!locked) return;
    if(i===Q.length-1) return finish();
    i++; show();
  }
  function finish(){
    $('quiz').classList.add('hidden'); $('result').classList.remove('hidden');
    $('finalScore').textContent = `${score} / ${Q.length}`;
    const pct=score/Q.length;
    $('finalMsg').textContent = pct>=0.9 ? 'Outstanding! You really know how to isolate x.' :
      pct>=0.7 ? 'Great work! Review the ones you missed below and you will be there.' :
      pct>=0.5 ? 'Good effort. Look at the worked steps below and try again.' :
      'Keep practising. Remember: use the opposite operation on both sides.';
    const rv=$('review');
    if(!missed.length){ rv.innerHTML='<p><b>Perfect score &mdash; nothing to review!</b></p>'; }
    else rv.innerHTML = '<h3>Questions to review</h3>' + missed.map(m=>
      `<div class="ri"><div class="e">${m.q.eq}</div>
       <div class="x">Your answer: <span class="bad">x = ${fmt(m.picked)}</span> &middot; Correct: <span class="good">x = ${fmt(m.q.ans)}</span></div>
       <div class="x">${m.q.expl}</div></div>`).join('');
    window.scrollTo(0,0);
  }
  $('startBtn').onclick=start; $('againBtn').onclick=start; $('nextBtn').onclick=next;
  document.addEventListener('keydown',e=>{
    if($('quiz').classList.contains('hidden')) return;
    if(!locked && e.key>='1' && e.key<='4'){ choose(+e.key-1); }
    else if(!locked && 'abcd'.includes(e.key.toLowerCase()) && e.key.length===1){ choose('abcd'.indexOf(e.key.toLowerCase())); }
    else if(locked && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); next(); }
  });
}
</script>
</body>
</html>
