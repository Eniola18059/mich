<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zion's Gator Math Quiz</title>
<style>
:root{
  --bg:#e8f8e0; --card:#ffffff; --ink:#23402a; --green:#2fa84f; --green-d:#1f7a38;
  --orange:#ff9a3c; --blue:#3a8dde; --red:#e55353; --yellow:#ffd23f; --line:#cfe9c4;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:linear-gradient(#d9f3ff 0,#e8f8e0 220px,#e8f8e0 100%);
  color:var(--ink); font-family:"Trebuchet MS","Comic Sans MS","Segoe UI",system-ui,sans-serif;
  display:flex;justify-content:center;padding:14px;
}
#app{width:100%;max-width:760px}
.card{background:var(--card);border-radius:26px;box-shadow:0 6px 0 var(--line),0 12px 30px rgba(0,0,0,.08);padding:22px}
h1{margin:0 0 6px;font-size:2rem;line-height:1.1}
.center{text-align:center}
.gator{font-size:5.5rem;line-height:1;display:inline-block;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}
.btn{
  font:inherit;font-weight:800;font-size:1.3rem;border:0;border-radius:18px;padding:14px 26px;cursor:pointer;
  background:var(--green);color:#fff;box-shadow:0 5px 0 var(--green-d);transition:transform .08s;
}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--green-d)}
.btn.alt{background:var(--orange);box-shadow:0 5px 0 #c9701d}
.btn.small{font-size:1rem;padding:8px 14px;border-radius:12px;box-shadow:0 3px 0 var(--green-d)}
.levels{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;text-align:left}
.lv{background:#f4fbef;border:3px solid var(--line);border-radius:16px;padding:10px 12px;font-weight:700}
.lv small{display:block;font-weight:500;opacity:.8}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar{flex:1;display:flex;gap:4px}
.seg{flex:1;height:14px;background:#e7efe3;border-radius:8px;overflow:hidden}
.seg i{display:block;height:100%;width:0;background:var(--green);transition:width .3s}
.count{font-weight:800;white-space:nowrap}
.chip{display:inline-block;background:var(--yellow);border-radius:999px;padding:5px 14px;font-weight:800;margin-bottom:10px}
.q{font-size:1.55rem;font-weight:800;margin:6px 0 12px}
.vis{display:flex;justify-content:center;align-items:center;margin:8px 0 14px;min-height:70px;flex-wrap:wrap;gap:10px}
.eq{font-size:3.4rem;font-weight:900;letter-spacing:2px;text-align:center}
.eq .box{display:inline-block;min-width:1.1em;border:5px dashed var(--orange);border-radius:14px;color:var(--orange);padding:0 8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{
  font:inherit;font-weight:900;font-size:2rem;padding:16px 10px;border-radius:18px;cursor:pointer;
  background:#fff;border:4px solid var(--blue);color:var(--blue);box-shadow:0 5px 0 #b7d3f2;
}
.opt:active{transform:translateY(3px)}
.opt.right{background:var(--green);border-color:var(--green-d);color:#fff;box-shadow:0 5px 0 var(--green-d)}
.opt.wrong{background:var(--red);border-color:#a93030;color:#fff;box-shadow:0 5px 0 #a93030}
.opt[disabled]{cursor:default}
.fb{margin-top:16px;border-radius:18px;padding:14px 16px;font-size:1.15rem;font-weight:600;display:none}
.fb.good{display:block;background:#e3f8e6;border:3px solid var(--green)}
.fb.bad{display:block;background:#fff0e0;border:3px solid var(--orange)}
.fb b.t{font-size:1.4rem;display:block;margin-bottom:4px}
.dots{margin-top:8px;font-size:1.6rem;letter-spacing:3px}
.dot{display:inline-block;width:20px;height:20px;border-radius:50%;margin:2px;vertical-align:middle}
.dot.a{background:var(--blue)} .dot.b{background:var(--orange)}
.dot.x{background:#fff;border:3px dashed var(--red);position:relative}
.nextrow{margin-top:14px;text-align:right}
.tools{display:flex;gap:8px;justify-content:flex-end;margin-bottom:6px}
.nums{display:flex;align-items:center;gap:14px;font-size:3.6rem;font-weight:900}
.jump{display:flex;align-items:center;gap:6px;font-size:3.4rem;font-weight:900}
.jump .tag{font-size:1.6rem;border:4px dotted #777;border-radius:10px;padding:2px 10px;background:#fffbe6}
.jump .arr{font-size:3rem;color:#777}
.jump .q{margin:0}
.jump .blank{min-width:1.2em;border:5px dashed var(--orange);border-radius:14px;color:var(--orange);text-align:center;padding:0 8px}
.big{font-size:3.6rem;font-weight:900}
.score{font-size:4rem;font-weight:900;color:var(--green-d)}
.stars{font-size:2.6rem}
.review{text-align:left;margin-top:14px}
.review li{margin:6px 0}
.pop{position:fixed;pointer-events:none;font-size:2rem;animation:pop 1s ease-out forwards;z-index:9}
@keyframes pop{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.4)}}
.hide{display:none!important}
@media(max-width:520px){.q{font-size:1.3rem}.eq{font-size:2.7rem}.opt{font-size:1.7rem}.levels{grid-template-columns:1fr}.jump{font-size:2.6rem}}
</style>
</head>
<body>
<div id="app">

  <section id="start" class="card center">
    <div class="gator">🐊</div>
    <h1>Zion's Gator Math Quiz</h1>
    <p style="font-size:1.2rem;margin:6px 0 0">50 questions to help Gator Gus get his lunch!</p>
    <div class="levels">
      <div class="lv">🍎 Level 1<small>Add and subtract within 10</small></div>
      <div class="lv">➡️ Level 2<small>Jump +10 and −10</small></div>
      <div class="lv">🧊 Level 3<small>Tens and ones cubes</small></div>
      <div class="lv">🐊 Level 4<small>Gator eats the greater number</small></div>
    </div>
    <p>Tap the right answer. Take your time. Think first!</p>
    <button class="btn" id="goBtn">Let's go! 🚀</button>
    <p id="best" style="margin-top:14px;font-weight:700"></p>
  </section>

  <section id="quiz" class="card hide">
    <div class="top">
      <div class="count" id="count">1 / 50</div>
      <div class="bar" id="bar"></div>
      <div class="count" id="pts">⭐ 0</div>
    </div>
    <div class="tools">
      <button class="btn small alt" id="readBtn" title="Read the question">🔊 Read to me</button>
      <button class="btn small" id="muteBtn" title="Sounds on/off">🔔</button>
    </div>
    <div class="chip" id="chip"></div>
    <div class="q" id="qtext"></div>
    <div class="vis" id="vis"></div>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb"></div>
    <div class="nextrow"><button class="btn hide" id="nextBtn">Next ➡️</button></div>
  </section>

  <section id="result" class="card center hide">
    <div class="gator" id="rGator">🐊</div>
    <h1 id="rTitle">All done!</h1>
    <div class="score" id="rScore"></div>
    <div class="stars" id="rStars"></div>
    <p id="rMsg" style="font-size:1.25rem;font-weight:700"></p>
    <div id="rBreak" class="review"></div>
    <div id="rReview" class="review"></div>
    <p><button class="btn" id="againBtn">Play again 🔄</button></p>
  </section>

</div>

<script>
(function(){
"use strict";

/* ---------- helpers ---------- */
var $ = function(id){return document.getElementById(id)};
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
// pick 3 wrong numbers from candidates (plausible mistakes first), then fill with near numbers
function opts(correct,cands){
  var w=[],i;
  for(i=0;i<cands.length&&w.length<3;i++){var c=cands[i];if(c!==correct&&c>=0&&w.indexOf(c)<0)w.push(c)}
  var k=1;
  while(w.length<3){
    [correct+k,correct-k].forEach(function(c){if(w.length<3&&c>=0&&c!==correct&&w.indexOf(c)<0)w.push(c)});
    k++;
  }
  return shuffle([correct].concat(w)).map(String);
}
function dotsFor(a,op,b){
  var h='<div class="dots">',i;
  for(i=0;i<a;i++){
    h+='<span class="dot '+((op==='-'&&i>=a-b)?'x':'a')+'"></span>';
  }
  if(op==='+'){for(i=0;i<b;i++)h+='<span class="dot b"></span>'}
  return h+'</div>';
}
function eqHtml(s){return '<div class="eq">'+s+'</div>'}

/* ---------- cube pictures ---------- */
function cubes(t,o){
  var u=18, gap=6, rodW=u, x=4, h='', i, j;
  var rodH=u*10, W, H=rodH+8;
  for(i=0;i<t;i++){
    for(j=0;j<10;j++){
      h+='<rect x="'+x+'" y="'+(4+j*u)+'" width="'+u+'" height="'+u+'" fill="#7cc5ff" stroke="#2a6fb0" stroke-width="1.5"/>';
    }
    x+=rodW+gap;
  }
  x+=10;
  var cols=2;
  for(i=0;i<o;i++){
    var cx=x+(i%cols)*(u+4), cy=4+Math.floor(i/cols)*(u+4);
    h+='<rect x="'+cx+'" y="'+cy+'" width="'+u+'" height="'+u+'" rx="3" fill="#ffb86b" stroke="#c9701d" stroke-width="1.5"/>';
  }
  W=x+Math.min(o,cols)*(u+4)+6;
  return '<svg viewBox="0 0 '+W+' '+H+'" width="'+Math.min(W*1.1,300)+'" height="'+Math.min(H*1.1,230)+'" aria-label="cubes">'+h+'</svg>';
}

/* ---------- question bank ---------- */
function build(){
  var Q=[];
  var S1="Level 1 · Add and subtract 🍎", S2="Level 2 · Jump +10 or −10 ➡️",
      S3="Level 3 · Tens and ones 🧊",   S4="Level 4 · Gator eats the greater number 🐊";

  /* Level 1: 18 standard + 4 missing number (22) */
  var std=[[3,'+',2],[5,'+',2],[4,'-',1],[9,'-',5],[7,'+',1],[7,'-',1],[8,'+',1],[6,'-',2],[3,'+',5],
           [5,'+',4],[7,'-',4],[10,'-',1],[9,'-',2],[5,'+',3],[6,'+',3],[5,'-',4],[1,'+',9],[10,'-',7]];
  var L1=[];
  std.forEach(function(p){
    var a=p[0],op=p[1],b=p[2],r=op==='+'?a+b:a-b;
    var alt=op==='+'?Math.abs(a-b):a+b;
    var sym=op==='+'?'+':'−';
    L1.push({sec:S1,text:"What is the answer?",
      vis:eqHtml(a+' '+sym+' '+b+' = <span class="box">?</span>'),
      options:opts(r,[alt,r+1,r-1,r+2,r-2]),answer:String(r),
      say:a+(op==='+'?' plus ':' minus ')+b+'. What is the answer?',
      explain:(op==='+'?'Start at '+a+' and count up '+b+'. You land on <b>'+r+'</b>.':'Start with '+a+' and take away '+b+'. <b>'+r+'</b> are left.')+dotsFor(a,op,b)});
  });
  [
    {a:6,op:'+',b:'☐',t:10,ans:4,wrong:[16,5,3],ex:'6 and what makes 10? 6 + <b>4</b> = 10.'},
    {a:'☐',op:'+',b:3,t:10,ans:7,wrong:[13,6,8],ex:'What and 3 make 10? <b>7</b> + 3 = 10.'},
    {a:9,op:'-',b:'☐',t:4,ans:5,wrong:[13,4,6],ex:'9 take away what leaves 4? 9 − <b>5</b> = 4.'},
    {a:'☐',op:'-',b:1,t:6,ans:7,wrong:[5,6,8],ex:'What minus 1 is 6? <b>7</b> − 1 = 6.'}
  ].forEach(function(m){
    var sym=m.op==='+'?'+':'−';
    var left=(m.a==='☐'?'<span class="box">?</span>':m.a), right=(m.b==='☐'?'<span class="box">?</span>':m.b);
    L1.push({sec:S1,text:"Which number goes in the box?",
      vis:eqHtml(left+' '+sym+' '+right+' = '+m.t),
      options:opts(m.ans,m.wrong),answer:String(m.ans),
      say:"Which number goes in the box?",explain:m.ex});
  });
  Q=Q.concat(shuffle(L1));

  /* Level 2: arrows (10) */
  var arrows=[[23,'-',null],[22,'+',null],[28,'-',null],[18,'+',null],[17,'-',null],
              [null,'-',24],[null,'-',27],[null,'+',30],[null,'-',25],[null,'+',21]];
  var L2=[];
  arrows.forEach(function(p){
    var s=p[0],op=p[1],e=p[2],ans,opp,vis,ex;
    var tag=(op==='+'?'+10':'−10');
    if(s!==null){
      ans=op==='+'?s+10:s-10; opp=op==='+'?s-10:s+10;
      vis='<div class="jump"><span>'+s+'</span><span class="tag">'+tag+'</span><span class="arr">➜</span><span class="blank">?</span></div>';
      ex=op==='+'?'+10 means one more ten. The tens digit goes up by 1 and the ones stay the same: '+s+' → <b>'+ans+'</b>.'
                 :'−10 means one less ten. The tens digit goes down by 1 and the ones stay the same: '+s+' → <b>'+ans+'</b>.';
    }else{
      ans=op==='+'?e-10:e+10; opp=op==='+'?e+10:e-10;
      vis='<div class="jump"><span class="blank">?</span><span class="tag">'+tag+'</span><span class="arr">➜</span><span>'+e+'</span></div>';
      ex='Work backwards! To end at '+e+' after '+tag+', you must start at <b>'+ans+'</b>.';
    }
    L2.push({sec:S2,text:s!==null?"Follow the arrow. What number goes in the blank?":"Which number did we start with?",
      vis:vis,options:opts(ans,[opp,ans+1,ans-1,ans+2]),answer:String(ans),
      say:s!==null?"Follow the arrow. What number goes in the blank?":"Which number did we start with?",explain:ex});
  });
  Q=Q.concat(shuffle(L2));

  /* Level 3: cubes (9) + tens digit (1) */
  var cb=[[3,2],[2,5],[2,8],[4,1],[1,5],[2,0],[3,4],
          {t:3,o:10,wrong:[30,13,31],tricky:true},
          {t:1,o:12,wrong:[12,13,21],tricky:true}];
  var L3=[];
  cb.forEach(function(c){
    var t,o,w,tricky=false;
    if(Array.isArray(c)){t=c[0];o=c[1]}else{t=c.t;o=c.o;w=c.wrong;tricky=c.tricky}
    var total=t*10+o;
    var swapped=(o%10)*10+t;
    var cands=w||[swapped,total+1,total-1,total+10,total-10];
    var ex=tricky
      ? '<b>Tricky!</b> 10 loose cubes make 1 more ten. So '+(t+Math.floor(o/10))+' tens and '+(o%10)+' ones = <b>'+total+'</b>.'
      : t+' tens and '+o+' ones. That is '+t*10+' and '+o+' more = <b>'+total+'</b>.';
    L3.push({sec:S3,text:"Count the tens and ones. How many cubes are there?",
      vis:cubes(t,o),options:opts(total,cands),answer:String(total),
      say:"Count the tens and ones. How many cubes are there?",explain:ex});
  });
  L3.push({sec:S3,text:"How many TENS are in the number 41?",
    vis:'<div class="big">41</div>',options:opts(4,[1,14,5]),answer:"4",
    say:"How many tens are in the number 41?",explain:'In 41 the first digit is the tens. 41 = <b>4</b> tens and 1 one.'});
  Q=Q.concat(shuffle(L3));

  /* Level 4: alligator (8) */
  var L4=[];
  [[29,28],[14,41],[30,29],[4,40]].forEach(function(p){
    var a=p[0],b=p[1],g=Math.max(a,b),s=Math.min(a,b);
    var pair=shuffle([a,b]);
    L4.push({sec:S4,text:"The alligator is hungry! He eats the GREATER number. Which number does he eat?",
      vis:'<div class="nums"><span>'+pair[0]+'</span><span style="font-size:4rem">🐊</span><span>'+pair[1]+'</span></div>',
      options:shuffle([String(g),String(s)]),answer:String(g),
      say:"The alligator is hungry. He eats the greater number. Which number does he eat?",
      explain:g+' is greater than '+s+'. Look at the tens first: '+(Math.floor(g/10))+' tens is more than '+(Math.floor(s/10))+(Math.floor(g/10)===Math.floor(s/10)?' (the same! so look at the ones)':'')+'. Gator eats <b>'+g+'</b>.'});
  });
  [
    {text:"Which number is the GREATEST?",vis:[27,31,17,13],ans:31,wrong:[27,17,13],ex:'31 has 3 tens. The others have 2 tens or 1 ten. <b>31</b> is greatest.'},
    {text:"Which number is the SMALLEST?",vis:[14,41,27,17],ans:14,wrong:[17,27,41],ex:'14 has only 1 ten, but 17 also has 1 ten. Compare the ones: 4 is less than 7. <b>14</b> is smallest.'},
    {text:"Which number is greater than 29?",vis:[],ans:30,wrong:[28,27,19],ex:'30 comes right after 29. <b>30</b> is greater than 29.'},
    {text:"Which number is the GREATEST?",vis:[35,36,29,28],ans:36,wrong:[35,29,28],ex:'35 and 36 both have 3 tens. Compare the ones: 6 is more than 5. <b>36</b> is greatest.'}
  ].forEach(function(m){
    var v=m.vis.length?'<div class="nums" style="font-size:2.6rem;gap:18px">'+shuffle(m.vis).join('<span style="opacity:.35">·</span>')+'</div>':'<div class="big">? &gt; 29</div>';
    var o=shuffle([m.ans].concat(m.wrong)).map(String);
    L4.push({sec:S4,text:m.text,vis:v,options:o,answer:String(m.ans),say:m.text,explain:m.ex});
  });
  Q=Q.concat(shuffle(L4));
  return Q;
}

/* ---------- audio ---------- */
var muted=false,actx=null;
function tone(freqs,dur){
  if(muted)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    var t=actx.currentTime;
    freqs.forEach(function(f,i){
      var o=actx.createOscillator(),g=actx.createGain();
      o.type="triangle";o.frequency.value=f;o.connect(g);g.connect(actx.destination);
      g.gain.setValueAtTime(.18,t+i*dur);g.gain.exponentialRampToValueAtTime(.001,t+i*dur+dur);
      o.start(t+i*dur);o.stop(t+i*dur+dur);
    });
  }catch(e){}
}
function speak(txt){
  try{
    if(!window.speechSynthesis)return;
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(txt);u.rate=.85;u.pitch=1.1;speechSynthesis.speak(u);
  }catch(e){}
}
function burst(x,y,emojis){
  for(var i=0;i<10;i++){
    var s=document.createElement('span');s.className='pop';s.textContent=emojis[i%emojis.length];
    s.style.left=x+'px';s.style.top=y+'px';
    s.style.setProperty('--dx',(Math.random()*300-150)+'px');s.style.setProperty('--dy',(-Math.random()*200-20)+'px');
    document.body.appendChild(s);setTimeout(function(el){el.remove()}.bind(null,s),1000);
  }
}

/* ---------- state + flow ---------- */
var qs=[],idx=0,score=0,missed=[],answered=false,secStats={};
var SEC_ORDER=[];

function showScreen(id){["start","quiz","result"].forEach(function(s){$(s).classList.toggle("hide",s!==id)});window.scrollTo(0,0)}

function start(){
  qs=build();idx=0;score=0;missed=[];secStats={};SEC_ORDER=[];
  qs.forEach(function(q){if(SEC_ORDER.indexOf(q.sec)<0)SEC_ORDER.push(q.sec);secStats[q.sec]=secStats[q.sec]||{ok:0,n:0}; secStats[q.sec].n++});
  var bar=$("bar");bar.innerHTML="";
  SEC_ORDER.forEach(function(s,i){
    var d=document.createElement("div");d.className="seg";d.innerHTML='<i id="seg'+i+'"></i>';bar.appendChild(d);
  });
  showScreen("quiz");render();
}

function updateBar(){
  SEC_ORDER.forEach(function(s,i){
    var total=secStats[s].n,done=0;
    for(var k=0;k<qs.length;k++){if(qs[k].sec===s&&k<idx+(answered?1:0))done++}
    $("seg"+i).style.width=(done/total*100)+"%";
  });
}

function render(){
  var q=qs[idx];answered=false;
  $("count").textContent=(idx+1)+" / "+qs.length;
  $("pts").textContent="⭐ "+score;
  $("chip").textContent=q.sec;
  $("qtext").textContent=q.text;
  $("vis").innerHTML=q.vis;
  var o=$("opts");o.innerHTML="";
  q.options.forEach(function(v){
    var b=document.createElement("button");b.className="opt";b.textContent=v;
    b.onclick=function(ev){choose(b,v,ev)};o.appendChild(b);
  });
  $("fb").className="fb";$("fb").innerHTML="";
  $("nextBtn").classList.add("hide");
  $("nextBtn").textContent=idx===qs.length-1?"See my score 🏆":"Next ➡️";
  updateBar();
}

var CHEERS=["Great job!","You got it!","Super!","Awesome!","Yes! Well done!","Brilliant!"];
function choose(btn,v,ev){
  if(answered)return;answered=true;
  var q=qs[idx],ok=v===q.answer;
  var all=$("opts").children;
  for(var i=0;i<all.length;i++){
    all[i].disabled=true;
    if(all[i].textContent===q.answer)all[i].classList.add("right");
  }
  var fb=$("fb");
  if(ok){
    score++;secStats[q.sec].ok++;
    tone([523,659,784],.12);
    var r=btn.getBoundingClientRect();burst(r.left+r.width/2,r.top,["⭐","🐊","✨"]);
    fb.className="fb good";
    fb.innerHTML='<b class="t">🎉 '+CHEERS[Math.floor(Math.random()*CHEERS.length)]+'</b>'+q.explain;
  }else{
    btn.classList.add("wrong");
    missed.push({q:q,chosen:v});
    tone([330,262],.18);
    fb.className="fb bad";
    fb.innerHTML='<b class="t">Oops! Let\'s learn from it 💡</b>The answer is <b>'+q.answer+'</b>.<br>'+q.explain;
  }
  $("pts").textContent="⭐ "+score;
  $("nextBtn").classList.remove("hide");
  updateBar();
  setTimeout(function(){$("nextBtn").scrollIntoView({behavior:"smooth",block:"nearest"})},80);
}

function next(){
  if(idx<qs.length-1){idx++;render()}else finish();
}

function plain(h){var d=document.createElement("div");d.innerHTML=h;return d.textContent}

function finish(){
  showScreen("result");
  var pct=Math.round(score/qs.length*100);
  $("rScore").textContent=score+" / "+qs.length;
  var st=pct>=90?5:pct>=75?4:pct>=60?3:pct>=40?2:1;
  $("rStars").textContent="⭐".repeat(st)+"☆".repeat(5-st);
  var msg=pct>=90?"WOW! You are a math superstar! Gator Gus is full and happy! 🐊💚"
         :pct>=75?"Great work! Gator Gus is very proud of you!"
         :pct>=60?"Good job! A little more practice and you will be a star."
         :"Nice try! Look at the missed questions below and try again.";
  $("rMsg").textContent=msg;
  var h='<h3>How you did in each level</h3><ul>';
  SEC_ORDER.forEach(function(s){h+='<li>'+s+': <b>'+secStats[s].ok+' / '+secStats[s].n+'</b></li>'});
  $("rBreak").innerHTML=h+'</ul>';
  var rv='';
  if(missed.length){
    rv='<h3>Questions to practise</h3><ol>';
    missed.forEach(function(m){
      rv+='<li><b>'+m.q.text+'</b> '+plain(m.q.vis).replace(/\s+/g,' ').trim()+'<br>You said <b>'+m.chosen+'</b>. Right answer: <b>'+m.q.answer+'</b></li>';
    });
    rv+='</ol>';
  }else rv='<h3>🌟 No mistakes! Perfect score!</h3>';
  $("rReview").innerHTML=rv;
  tone([523,659,784,1047],.14);
  burst(window.innerWidth/2,window.innerHeight/2,["⭐","🎉","🐊","✨"]);
  try{
    var best=parseInt(localStorage.getItem("zionGatorBest")||"0",10);
    if(score>best)localStorage.setItem("zionGatorBest",String(score));
  }catch(e){}
}

/* ---------- wiring ---------- */
$("goBtn").onclick=start;
$("againBtn").onclick=start;
$("nextBtn").onclick=next;
$("readBtn").onclick=function(){var q=qs[idx];speak(q.say+" "+q.options.join(", "))};
$("muteBtn").onclick=function(){muted=!muted;this.textContent=muted?"🔕":"🔔";if(muted)try{speechSynthesis.cancel()}catch(e){}};
try{
  var b=parseInt(localStorage.getItem("zionGatorBest")||"0",10);
  if(b>0)$("best").textContent="🏆 Best score so far: "+b+" / 50";
}catch(e){}

/* expose for testing */
if(typeof window!=="undefined")window.__build=build;
})();
</script>
