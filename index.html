<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Energy Transfer & Transformation Quiz – Grade 6</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#1f2a44;--muted:#5b6785;--brand:#3b6cf6;--brand-d:#2a52c9;--ok:#1a9d5c;--okbg:#e4f6ec;--bad:#d64545;--badbg:#fdeaea;--line:#dfe5f1}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 48px}
.card{background:var(--card);border-radius:18px;padding:28px 24px;box-shadow:0 4px 18px rgba(31,42,68,.08)}
h1{font-size:1.7rem;margin:0 0 8px}
h2{font-size:1.25rem;margin:0 0 16px;line-height:1.4}
p{margin:0 0 14px;color:var(--muted)}
.badge{display:inline-block;background:#e8eefe;color:var(--brand-d);font-weight:600;font-size:.8rem;padding:4px 10px;border-radius:99px;margin-bottom:12px}
button{font:inherit;cursor:pointer}
.primary{background:var(--brand);color:#fff;border:0;border-radius:12px;padding:12px 24px;font-weight:600}
.primary:hover{background:var(--brand-d)}
.primary:disabled{opacity:.4;cursor:default}
.top{display:flex;justify-content:space-between;font-size:.9rem;color:var(--muted);margin-bottom:8px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:22px}
.bar>div{height:100%;background:var(--brand);width:0;transition:width .3s}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:13px 16px;margin-bottom:10px;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--brand);background:#f6f8ff}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
.fb{margin:6px 0 18px;padding:14px 16px;border-radius:12px;font-size:.95rem}
.fb.ok{background:var(--okbg);color:#0f6b3d}
.fb.bad{background:var(--badbg);color:#8f2b2b}
.score{font-size:3rem;font-weight:800;color:var(--brand);margin:6px 0}
.rev{border-top:1px solid var(--line);padding:14px 0}
.rev b{display:block;margin-bottom:4px}
.rev span{font-size:.92rem;color:var(--muted);display:block}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">

<div id="start" class="card">
  <span class="badge">Grade 6 Science</span>
  <h1>Energy Transfer & Transformation</h1>
  <p>50 questions on how energy moves between objects, changes form, and where it goes. Questions and answer choices are mixed up every time you play.</p>
  <p>Pick an answer to see right away whether you got it right, and why.</p>
  <button class="primary" onclick="startQuiz()">Start Quiz</button>
</div>

<div id="quiz" class="card hide">
  <div class="top"><span id="count"></span><span id="scoreLive"></span></div>
  <div class="bar"><div id="prog"></div></div>
  <h2 id="qtext"></h2>
  <div id="opts"></div>
  <div id="fb" class="fb hide"></div>
  <button id="next" class="primary hide" onclick="nextQ()">Next</button>
</div>

<div id="end" class="card hide">
  <span class="badge">Quiz complete</span>
  <div class="score" id="final"></div>
  <p id="msg"></p>
  <div id="review"></div>
  <button class="primary" onclick="startQuiz()">Try Again</button>
</div>

</div>

<script>
// Each item: [question, correct answer, [3 wrong answers], explanation]
const BANK = [
["Which statement best describes energy TRANSFER?",
 "Energy moves from one object or place to another",
 ["Energy changes into a completely new form inside one object","Energy is made new whenever an object starts moving","Energy disappears once it has done its work"],
 "In a transfer, energy moves from one place or object to another. A transformation is when it changes form."],
["Which statement best describes energy TRANSFORMATION?",
 "Energy changes from one form into another form",
 ["Energy moves between objects without any change","Energy is destroyed and replaced by new energy","Energy is stored and never used again"],
 "Transformation means the form of energy changes, for example electrical energy becoming light energy."],
["What does the Law of Conservation of Energy say?",
 "Energy cannot be created or destroyed, only transferred or transformed",
 ["Energy can be created by machines but never destroyed","Energy is lost each time it changes from one form to another","Energy can be destroyed by friction but never created"],
 "The total amount of energy stays the same. Friction does not destroy energy, it changes some into thermal energy."],
["What is the main energy transformation in an electric toaster?",
 "Electrical energy → thermal energy",
 ["Thermal energy → electrical energy","Electrical energy → sound energy","Chemical energy → electrical energy"],
 "The toaster's heating wires turn electrical energy into thermal (heat) energy, plus some light."],
["What energy change happens in a solar panel?",
 "Light energy → electrical energy",
 ["Thermal energy → chemical energy","Electrical energy → light energy","Light energy → sound energy"],
 "Solar panels capture light energy from the Sun and transform it into electrical energy."],
["Which sequence shows the energy changes in a battery-powered flashlight?",
 "Chemical → electrical → light",
 ["Electrical → chemical → light","Chemical → light → electrical","Light → chemical → electrical"],
 "The battery stores chemical energy, which becomes electrical energy in the wires, which the bulb turns into light."],
["During photosynthesis, a plant transforms light energy into which form?",
 "Chemical energy stored in sugars",
 ["Kinetic energy used to move its leaves","Electrical energy stored in its roots","Sound energy released from its stem"],
 "Plants capture light energy and store it as chemical energy in glucose (sugar)."],
["You rub your hands together quickly and they feel warm. What energy change is this?",
 "Kinetic energy → thermal energy",
 ["Thermal energy → kinetic energy","Chemical energy → light energy","Sound energy → kinetic energy"],
 "The motion of your hands (kinetic) is transformed into thermal energy by friction."],
["A roller coaster car is stopped at the top of the first hill. Which energy is greatest at that moment?",
 "Gravitational potential energy",
 ["Kinetic energy","Thermal energy","Sound energy"],
 "At the highest point the car has the most stored energy because of its height. Kinetic energy is smallest there."],
["As the roller coaster car rolls down the hill, what is the main energy change?",
 "Gravitational potential energy → kinetic energy",
 ["Kinetic energy → gravitational potential energy","Chemical energy → gravitational potential energy","Thermal energy → kinetic energy"],
 "Going down, the stored height energy turns into energy of motion."],
["A stretched rubber band stores which type of energy?",
 "Elastic potential energy",
 ["Gravitational potential energy","Chemical energy","Kinetic energy"],
 "Stretching or compressing an elastic object stores elastic potential energy."],
["Which type of energy is stored in food and fuels such as gasoline?",
 "Chemical energy",
 ["Nuclear energy","Elastic energy","Thermal energy"],
 "Food and fuels store energy in the bonds between their atoms, which is chemical energy."],
["What is the main energy change in a loudspeaker?",
 "Electrical energy → sound energy",
 ["Sound energy → electrical energy","Electrical energy → light energy","Kinetic energy → chemical energy"],
 "Electrical signals make the speaker cone vibrate, producing sound."],
["What is the main energy change in a microphone?",
 "Sound energy → electrical energy",
 ["Electrical energy → sound energy","Light energy → electrical energy","Sound energy → chemical energy"],
 "A microphone is the opposite of a speaker: sound vibrations become an electrical signal."],
["What energy change happens in a wind turbine?",
 "Kinetic energy of wind → electrical energy",
 ["Thermal energy of wind → chemical energy","Electrical energy → kinetic energy of blades","Light energy → electrical energy"],
 "Moving air spins the blades, and the generator turns that kinetic energy into electrical energy."],
["In a hydroelectric dam, what is the correct order of energy changes?",
 "Gravitational potential → kinetic → electrical",
 ["Kinetic → gravitational potential → electrical","Electrical → kinetic → gravitational potential","Chemical → thermal → electrical"],
 "Water stored high up falls (kinetic), spins turbines, and the generators make electrical energy."],
["Thermal energy moving through direct contact between objects is called…",
 "Conduction",
 ["Convection","Radiation","Insulation"],
 "Conduction happens when particles in a warmer object pass energy to a cooler object they are touching."],
["Thermal energy moving through the circulation of a heated liquid or gas is called…",
 "Convection",
 ["Conduction","Radiation","Reflection"],
 "In convection, warmer fluid rises and cooler fluid sinks, carrying thermal energy around."],
["Thermal energy traveling as electromagnetic waves, even through empty space, is called…",
 "Radiation",
 ["Convection","Conduction","Vibration"],
 "Radiation needs no material to travel through, which is how the Sun's energy reaches Earth."],
["A metal spoon left in a pot of hot soup becomes hot at the handle. Which transfer is this?",
 "Conduction",
 ["Convection","Radiation","Transformation only"],
 "Thermal energy passes along the metal spoon particle by particle."],
["How does energy from the Sun reach Earth across space?",
 "By radiation, because space has no particles to carry heat",
 ["By conduction through the particles in space","By convection currents in space","By sound waves traveling through space"],
 "Space is almost a vacuum, so only radiation (electromagnetic waves) can cross it."],
["When water is heated in a pot, the warm water at the bottom rises and cooler water sinks. This is…",
 "Convection",
 ["Conduction","Radiation","Condensation"],
 "Circulating warm and cool fluid is a convection current."],
["Why are pot handles often made of plastic or wood?",
 "They are insulators, so thermal energy moves through them slowly",
 ["They are conductors, so heat spreads away quickly","They radiate more heat than metal does","They store thermal energy for later use"],
 "Insulators slow down the transfer of thermal energy, which keeps your hand safe."],
["In an incandescent light bulb, most of the electrical energy becomes…",
 "Thermal energy (heat)",
 ["Light energy","Sound energy","Chemical energy"],
 "Only a small amount becomes light. Most is released as heat, which is why these bulbs get hot."],
["What does the efficiency of a device tell you?",
 "How much of the input energy becomes useful output energy",
 ["How much total energy the device can create","How quickly the device uses up all its energy","How much energy the device stores forever"],
 "Efficiency = useful output energy ÷ total input energy."],
["A device takes in 200 J of electrical energy and gives out 50 J as light. If energy is conserved, how much energy became other forms (like heat)?",
 "150 J",
 ["250 J","50 J","200 J"],
 "200 J − 50 J = 150 J. The energy is not lost, it is just transformed into other forms such as thermal energy."],
["Using the same device (200 J in, 50 J useful light out), what is its efficiency?",
 "25%",
 ["75%","50%","4%"],
 "50 ÷ 200 = 0.25, which is 25%."],
["Why is an LED bulb more efficient than an incandescent bulb?",
 "It turns more of the electrical energy into light and less into heat",
 ["It creates extra energy from the electricity supply","It stores electrical energy in its glass for later","It turns heat into light after the bulb switches off"],
 "LEDs waste far less energy as heat, so more of the input becomes useful light."],
["A pendulum swings lower and lower until it stops. Where did its energy go?",
 "Into thermal energy (and a little sound) from friction and air resistance",
 ["It was destroyed when the pendulum stopped","It was stored inside the string as chemical energy","It was transferred back to the Sun"],
 "Friction and air resistance transform the pendulum's mechanical energy into thermal energy in the surroundings."],
["At the lowest point of a pendulum's swing, which energy is greatest?",
 "Kinetic energy",
 ["Gravitational potential energy","Chemical energy","Elastic energy"],
 "At the bottom the bob is moving fastest, so kinetic energy is at its maximum."],
["A basketball bounces lower each time it hits the floor. Which explains this best?",
 "Some energy is transformed into sound and thermal energy at each bounce",
 ["The ball creates less energy every time it bounces","Gravity destroys a little of the ball's energy each time","The floor absorbs energy and keeps it forever as motion"],
 "Energy is conserved, but with each bounce some becomes sound and heat instead of motion."],
["How does sound energy travel?",
 "As vibrations passing through particles of a material",
 ["As electromagnetic waves through empty space","As a flow of electrons through wires only","By heating the air in a straight line"],
 "Sound needs a medium (solid, liquid or gas). It cannot travel through a vacuum."],
["Which type of energy can travel through the vacuum of space?",
 "Light energy",
 ["Sound energy","Thermal energy by conduction","Thermal energy by convection"],
 "Light is an electromagnetic wave and needs no material to travel through."],
["In a simple electric circuit, how does energy get from the battery to the bulb?",
 "It is carried by the electric current through the wires",
 ["It jumps through the air from the battery to the bulb","It is carried by sound waves in the wires","It stays inside the battery and the bulb makes its own"],
 "The current carries electrical energy around the circuit, and the bulb transforms it to light and heat."],
["What is the original source of energy for most food chains on Earth?",
 "The Sun",
 ["The soil","The water in oceans","Animals at the top of the chain"],
 "Plants capture the Sun's energy, and every other organism gets energy from plants directly or indirectly."],
["When a rabbit eats grass, what kind of energy is passed to the rabbit?",
 "Chemical energy stored in the grass",
 ["Light energy stored in the grass","Electrical energy stored in the grass","Sound energy stored in the grass"],
 "The grass stored the Sun's energy as chemical energy, and the rabbit gets it by eating."],
["Roughly how much energy passes from one level of a food chain to the next?",
 "About 10%",
 ["About 90%","About 50%","About 100%"],
 "Most energy is used for life processes or released as heat, so only about 10% is passed up."],
["Which sequence best describes what happens in a car engine?",
 "Chemical (fuel) → thermal → kinetic",
 ["Kinetic → thermal → chemical (fuel)","Electrical → chemical → kinetic","Thermal → light → kinetic"],
 "Burning fuel releases thermal energy, which is used to make the car move."],
["Which energy transformations happen in a hair dryer?",
 "Electrical → thermal, kinetic (fan) and sound",
 ["Chemical → electrical and light","Thermal → electrical and kinetic","Sound → thermal and chemical"],
 "The heater makes heat, the motor spins the fan, and some energy is lost as sound."],
["When a cyclist brakes, the bike slows down. What happens to the kinetic energy?",
 "It is transformed into thermal energy in the brakes",
 ["It is destroyed by the brake pads","It is turned into chemical energy in the tyres","It is turned into light energy in the wheels"],
 "Friction in the brakes changes the kinetic energy to thermal energy, which is why brakes get hot."],
["Which energy changes happen when a match is struck and burns?",
 "Chemical → thermal and light",
 ["Thermal → chemical and sound","Light → chemical and thermal","Kinetic → electrical and light"],
 "Chemicals on the match head react, releasing heat and light."],
["Which of these is an example of energy being mainly TRANSFERRED, with its form staying the same?",
 "A moving ball hits a still ball and the second ball starts rolling",
 ["A solar panel powers a calculator","A battery lights a bulb","A campfire gives off light and heat"],
 "Kinetic energy moves from one ball to the other. In the other examples the form of energy changes."],
["A hot drink cools down on a table. In which direction does thermal energy move?",
 "From the warm drink to the cooler surroundings",
 ["From the cooler surroundings to the warm drink","Back and forth equally until the drink is empty","It stays in the drink and disappears"],
 "Thermal energy always flows from warmer objects to cooler ones."],
["An ice cube melts in your hand. What is happening?",
 "Thermal energy is transferred from your hand to the ice",
 ["Cold energy is transferred from the ice to your hand","The ice creates thermal energy as it melts","Thermal energy is transferred from the ice to your hand"],
 "Your hand is warmer, so thermal energy flows from your hand into the ice, melting it."],
["Kinetic energy depends on which two things?",
 "The mass and the speed of the object",
 ["The mass and the height of the object","The height and the temperature of the object","The speed and the colour of the object"],
 "More mass or more speed means more kinetic energy."],
["Which of these has the MOST kinetic energy?",
 "A truck moving at 20 m/s",
 ["A bicycle moving at 20 m/s","A truck moving at 5 m/s","A truck parked on the road"],
 "The truck has far more mass than the bike, and 20 m/s is faster than 5 m/s. A parked truck has no kinetic energy."],
["Which of these has the MOST gravitational potential energy?",
 "A 5 kg box on a 2 m high shelf",
 ["A 5 kg box on the floor","A 1 kg box on a 2 m high shelf","A 2 kg box on a 1 m high shelf"],
 "Gravitational potential energy increases with both mass and height. 5 kg at 2 m is greatest."],
["A wind-up toy car is wound tightly and then released. What is the main energy change?",
 "Elastic potential energy → kinetic energy",
 ["Kinetic energy → elastic potential energy","Chemical energy → light energy","Gravitational potential energy → sound energy"],
 "The wound spring stores elastic energy, which becomes motion when released."],
["Which pair contains only renewable energy sources?",
 "Wind and geothermal",
 ["Coal and wind","Solar and natural gas","Oil and geothermal"],
 "Wind, solar and geothermal are renewable. Coal, oil and natural gas are fossil fuels and will run out."],
["In a power station, what does the steam do?",
 "It spins a turbine connected to a generator",
 ["It is changed directly into electricity inside the pipes","It cools the generator by taking in electrical energy","It carries the electricity to homes through the air"],
 "Steam's kinetic energy turns the turbine, and the generator transforms that motion into electrical energy."],
["What is the main energy change in an electric fan?",
 "Electrical energy → kinetic energy",
 ["Kinetic energy → electrical energy","Electrical energy → chemical energy","Thermal energy → kinetic energy"],
 "The motor turns electrical energy into the motion of the blades (with a little heat and sound as waste)."],
["When you charge a phone, which energy change is stored in the battery?",
 "Electrical energy → chemical energy",
 ["Chemical energy → electrical energy","Electrical energy → kinetic energy","Light energy → chemical energy"],
 "Charging stores energy as chemical energy, which the battery later releases as electrical energy."]
];

let order, idx, score, missed, locked;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const $=id=>document.getElementById(id);

function startQuiz(){
  order=shuffle(BANK.map((_,i)=>i));
  idx=0;score=0;missed=[];
  $('start').classList.add('hide');$('end').classList.add('hide');$('quiz').classList.remove('hide');
  showQ();
}

function showQ(){
  locked=false;
  const q=BANK[order[idx]];
  $('count').textContent='Question '+(idx+1)+' of '+BANK.length;
  $('scoreLive').textContent='Score: '+score;
  $('prog').style.width=(idx/BANK.length*100)+'%';
  $('qtext').textContent=q[0];
  $('fb').className='fb hide';$('next').classList.add('hide');
  const box=$('opts');box.innerHTML='';
  shuffle([q[1]].concat(q[2])).forEach(t=>{
    const b=document.createElement('button');
    b.className='opt';b.textContent=t;
    b.onclick=()=>pick(b,t,q);
    box.appendChild(b);
  });
}

function pick(btn,t,q){
  if(locked)return;locked=true;
  const right=t===q[1];
  if(right){score++;btn.classList.add('ok')}
  else{btn.classList.add('bad');missed.push({q:q[0],yours:t,ans:q[1],why:q[3]})}
  document.querySelectorAll('.opt').forEach(o=>{o.disabled=true;if(o.textContent===q[1])o.classList.add('ok')});
  const fb=$('fb');
  fb.className='fb '+(right?'ok':'bad');
  fb.textContent=(right?'Correct! ':'Not quite. The answer is "'+q[1]+'". ')+q[3];
  $('scoreLive').textContent='Score: '+score;
  const n=$('next');n.textContent=idx===BANK.length-1?'See Results':'Next';n.classList.remove('hide');
}

function nextQ(){
  idx++;
  if(idx>=BANK.length)return finish();
  showQ();
}

function finish(){
  $('quiz').classList.add('hide');$('end').classList.remove('hide');
  $('final').textContent=score+' / '+BANK.length;
  const pct=score/BANK.length;
  $('msg').textContent=pct>=.9?'Outstanding! You really understand how energy moves and changes.':pct>=.7?'Well done! Review the questions below to lock in the rest.':pct>=.5?'Good effort. Go through the ones you missed and try again.':'Keep practising. Read each explanation below, then try again.';
  const r=$('review');r.innerHTML='';
  if(missed.length){
    const h=document.createElement('h2');h.textContent='Questions to review';r.appendChild(h);
    missed.forEach(m=>{
      const d=document.createElement('div');d.className='rev';
      const b=document.createElement('b');b.textContent=m.q;
      const a=document.createElement('span');a.textContent='Correct answer: '+m.ans;
      const w=document.createElement('span');w.textContent=m.why;
      d.append(b,a,w);r.appendChild(d);
    });
    const sp=document.createElement('div');sp.style.height='16px';r.appendChild(sp);
  }
}
</script>
</body>
</html>
