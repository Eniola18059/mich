<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Number Quest</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff8ec;--card:#fff;--ink:#2b2350;--mut:#6d6890;--pri:#6c4cf1;--ok:#1fa971;--bad:#e5484d;--line:#e6dfff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17142b;--card:#231f3f;--ink:#f1eeff;--mut:#a9a3d0;--pri:#8b73ff;--line:#383263}}
:root[data-theme="dark"]{--bg:#17142b;--card:#231f3f;--ink:#f1eeff;--mut:#a9a3d0;--pri:#8b73ff;--line:#383263}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;min-height:100vh}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{margin:8px 0 4px;font-size:2rem;text-align:center}
.sub{text-align:center;color:var(--mut);margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}
.lv{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center;cursor:pointer;color:var(--ink);font:inherit}
.lv:hover{border-color:var(--pri)}.lv b{display:block;font-size:1.1rem}.lv span{font-size:.85rem;color:var(--mut)}
.stars{letter-spacing:2px;color:#f5a623;min-height:1.2em}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:20px}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0 16px}.bar i{display:block;height:100%;background:var(--pri);width:0;transition:width .3s}
.top{display:flex;justify-content:space-between;color:var(--mut);font-size:.95rem}
.q{font-size:1.25rem;line-height:1.5;margin:6px 0 18px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{padding:16px;font:inherit;font-size:1.2rem;font-weight:700;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--pri)}.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}.opt.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn{margin-top:16px;padding:12px 22px;font:inherit;font-weight:700;font-size:1rem;border:0;border-radius:12px;background:var(--pri);color:#fff;cursor:pointer}
.btn.alt{background:transparent;color:var(--pri);border:2px solid var(--pri);margin-left:8px}
.fb{min-height:1.5em;margin-top:12px;font-weight:700}
.big{font-size:3rem;text-align:center}.center{text-align:center}
</style></head><body><main id="app"></main>
<script>
const RAW=`Mia has 8 apples. She picks 7 more. How many apples does she have now?~15
There are 14 birds on a fence. 6 fly away. How many birds are left?~8
Tom has 9 marbles and Sam has 12 marbles. How many marbles do they have together?~21
A bakery made 25 cookies in the morning and 18 in the afternoon. How many cookies did it make in all?~43
Lina had 30 stickers. She gave 12 to her friend. How many stickers does she have left?~18
A bus has 36 seats. 29 seats are full. How many seats are empty?~7
Ben read 17 pages on Monday and 15 pages on Tuesday. How many pages did he read in all?~32
A farmer has 48 hens and 23 ducks. How many birds does he have?~71
There were 52 children at the park. 27 went home. How many are still at the park?~25
Ada scored 38 points in game one and 45 points in game two. What is her total score?~83
A school library has 245 storybooks and 130 science books. How many books is that in all?~375
A train carried 428 passengers. At the next stop 115 got off. How many passengers are still on board?~313
Kemi saved 150 coins in May and 275 coins in June. How many coins did she save in all?~425
A shop had 600 pencils. It sold 240. How many pencils are left?~360
A stadium has 356 seats in one section and 289 in another. How many seats are there altogether?~645
A book has 500 pages. Dayo has read 175. How many pages are left?~325
A garden has 312 red flowers and 408 yellow flowers. How many flowers is that?~720
A truck carried 750 boxes. It dropped off 380 boxes. How many boxes are still on the truck?~370
Rita collected 164 shells and her brother collected 189. How many shells did they collect together?~353
A market had 900 mangoes. It sold 465. How many mangoes remain?~435
There are 5 baskets with 6 oranges in each. How many oranges are there in all?~30
Each table has 4 chairs. How many chairs are at 7 tables?~28
A pack has 8 pencils. How many pencils are in 3 packs?~24
Chidi buys 9 boxes of crayons. Each box has 5 crayons. How many crayons does he have?~45
A spider has 8 legs. How many legs do 6 spiders have?~48
There are 7 days in a week. How many days are in 4 weeks?~28
A carton holds 12 eggs. How many eggs are in 3 cartons?~36
Each bike has 2 wheels. How many wheels do 9 bikes have?~18
A row has 10 seats. How many seats are in 8 rows?~80
Ola plants 6 rows of beans with 7 plants in each row. How many plants is that?~42
20 cookies are shared equally among 4 kids. How many cookies does each kid get?~5
A teacher puts 18 books into 3 equal piles. How many books are in each pile?~6
35 students sit in groups of 5. How many groups are there?~7
24 flowers are put equally into 6 vases. How many flowers are in each vase?~4
A rope 45 metres long is cut into pieces of 9 metres. How many pieces are there?~5
32 players form teams of 8. How many teams are there?~4
28 candies are shared equally among 7 friends. How many does each friend get?~4
54 stickers are put on pages with 6 stickers each. How many pages are used?~9
40 oranges are packed 5 to a bag. How many bags are needed?~8
72 chairs are set in 9 equal rows. How many chairs are in each row?~8
A pen costs 15 naira and a ruler costs 20 naira. How much do both cost?~35
Ayo has 100 naira and buys a toy for 65 naira. How much money is left?~35
A notebook costs 25 naira. How much do 4 notebooks cost?~100
Practice lasts 45 minutes and the warm-up lasts 15 minutes. How many minutes is that in all?~60
An hour has 60 minutes. How many minutes are in 2 hours?~120
Bola has 3 coins of 10 naira and 2 coins of 5 naira. How much money does she have?~40
A movie started at 2:00 and ended at 4:00. How many hours long was the movie?~2
A snack costs 35 naira. Tunde pays with 50 naira. How much change does he get?~15
Kunle sleeps 9 hours each night. How many hours does he sleep in 3 nights?~27
Juice costs 40 naira and a cake costs 60 naira. Sam has 90 naira. How much more money does he need to buy both?~10
A square garden has sides of 6 metres. What is its perimeter in metres?~24
A rectangle is 8 cm long and 3 cm wide. What is its perimeter in cm?~22
A rectangle is 5 cm long and 4 cm wide. What is its area in square cm?~20
A square tile has sides of 7 cm. What is its area in square cm?~49
A triangle has sides of 9 cm, 12 cm and 15 cm. What is its perimeter in cm?~36
A room is 6 metres long and 5 metres wide. How many square metres is the floor?~30
A rectangular field is 10 m long and 7 m wide. What is the perimeter in metres?~34
A mat is made of 4 rows of 8 squares. How many squares are on the mat?~32
A fence goes around a square pen with sides of 12 m. How many metres of fence are needed?~48
A rectangle has an area of 36 square cm and is 9 cm long. How wide is it in cm?~4
Ife buys 3 packs of 6 stickers and then gives away 5. How many stickers does she have left?~13
There are 4 boxes with 8 toys each. 10 toys are broken. How many toys still work?~22
A baker makes 5 trays of 12 buns and sells 45. How many buns are left?~15
Musa had 50 naira. He bought 2 sweets at 10 naira each. How much money is left?~30
A class has 24 boys and 18 girls. They sit in groups of 6. How many groups are there?~7
Sade reads 9 pages a day for 5 days, then 8 more pages. How many pages did she read?~53
A shop has 6 shelves with 9 books each. 14 books are sold. How many books are left?~40
30 apples are shared equally by 5 kids, then each kid eats 2. How many apples does each kid have left?~4
A farmer collects 36 eggs in the morning and 28 in the evening. He packs them in boxes of 8. How many boxes can he fill?~8
Emeka buys 4 pens at 12 naira each and pays with 50 naira. How much change does he get?~2
A school has 10 classrooms with 9 desks in each. How many desks are there?~90
A hall has 20 rows with 5 seats in each row. How many seats are there?~100
A box holds 30 pencils. How many pencils are in 3 boxes?~90
A farmer plants 40 trees in each of 2 fields. How many trees is that?~80
A bus carries 25 passengers. How many passengers can 3 buses carry?~75
Each packet has 50 sweets. How many sweets are in 4 packets?~200
A truck carries 60 bags of rice. How many bags can 5 trucks carry?~300
A theatre has 8 rows of 30 seats. How many seats are there in all?~240
Jide runs 20 minutes each day. How many minutes does he run in 6 days?~120
A garden has 7 rows of 20 flowers. How many flowers are there?~140
Farmer Bisi has 47 apples. About how many is that, rounded to the nearest ten?~50
A pattern goes 5, 10, 15, 20. What number comes next?~25
What is the 6th number in the pattern 4, 8, 12, 16, ...?~24
A hall has 1000 seats and 678 are taken. How many seats are free?~322
A number has 4 hundreds, 3 tens and 2 ones. What is the number?~432
Ada is 8 years old. Her father is 4 times as old. How old is her father?~32
Lola has 3 times as many beads as Kayode. Kayode has 15 beads. How many beads does Lola have?~45
There are 24 hours in a day. How many hours are in 3 days?~72
A stadium holds 283 fans. Rounded to the nearest hundred, about how many fans is that?~300
A jar has 76 beads. Ngozi adds 24 more beads. How many beads are in the jar?~100
Tola has 6 bags with 8 oranges in each and 9 loose oranges. How many oranges does she have in all?~57
A class of 28 children is split into teams of 4. Each team gets 3 balls. How many balls are needed?~21
Femi has 85 naira. He buys 3 pencils at 20 naira each. How much money does he have left?~25
A rope is 100 m long. Two pieces of 35 m each are cut off. How many metres are left?~30
A cinema has 9 rows of 10 seats and 7 extra seats at the back. How many seats are there?~97
Ruth is 9. Her brother is 5 years older and her sister is 3 years younger than Ruth. What is the sum of all three ages?~29
A water tank holds 250 litres. Mum uses 75 litres, then Dad uses 90 litres. How many litres are left?~85
A baker makes 7 trays of 8 cupcakes. He sells 4 trays. How many cupcakes are left?~24
Seun walked 3 km each day for 6 days and then 4 km more. How many km did he walk in all?~22
Zainab has 5 packs of 10 cards and 3 packs of 6 cards. How many cards does she have?~68`;
const Q=RAW.split("\n").map(l=>{const [t,a]=l.split("~");return{t,a:+a}});
const $=document.getElementById("app");
let best=null;try{best=JSON.parse(localStorage.getItem("nq100"))}catch(e){}
const save=()=>{try{localStorage.setItem("nq100",JSON.stringify(best))}catch(e){}};
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function opts(a){const c=[...new Set([a+1,a-1,a+2,a-2,a+10,a-10,a*2,a+5,a-5].filter(x=>x>0&&x!==a))];return shuf([a,...shuf(c).slice(0,3)])}
const N=Q.length;let i,s,locked;
function home(){
 $.innerHTML=`<div class="card center"><div class="big">🚀</div><h1>Number Quest</h1><p class="sub">100 story puzzles. Can you solve them all?</p>${best!=null?`<p>Best score: <b>${best} / ${N}</b></p>`:""}<button class="btn" onclick="start()">Start</button></div>`}
function start(){i=0;s=0;show()}
function show(){
 const q=Q[i];locked=false;
 $.innerHTML=`<div class="card"><div class="top"><span>Score: ${s}</span><span>Question ${i+1} of ${N}</span></div><div class="bar"><i style="width:${i/N*100}%"></i></div><p class="q">${q.t}</p><div class="opts">${opts(q.a).map(o=>`<button class="opt" onclick="pick(this,${o})">${o}</button>`).join("")}</div><div class="fb" id="fb"></div><div id="nx"></div></div>`}
function pick(btn,v){
 if(locked)return;locked=true;const q=Q[i],ok=v===q.a;
 if(ok){s++;btn.classList.add("ok")}else btn.classList.add("bad");
 document.querySelectorAll(".opt").forEach(o=>{o.disabled=true;if(+o.textContent===q.a)o.classList.add("ok")});
 document.getElementById("fb").textContent=ok?"🎉 Correct! Great job!":"Not quite — the answer is "+q.a+".";
 document.getElementById("nx").innerHTML=`<button class="btn" onclick="next()">${i<N-1?"Next →":"See results"}</button>`}
function next(){i++;i<N?show():end()}
function end(){
 if(best==null||s>best){best=s;save()}
 const st=s>=90?3:s>=70?2:s>=40?1:0;
 $.innerHTML=`<div class="card center"><div class="big">${s>=70?"🏆":"💪"}</div><h2>You got ${s} out of ${N}!</h2><div class="stars" style="font-size:2rem">${"★".repeat(st)+"☆".repeat(3-st)}</div><p>${s>=90?"Amazing work!":s>=70?"Awesome effort!":"Keep practicing — you can do it!"}</p><button class="btn" onclick="start()">Play again</button></div>`}
home();
</script></body></html>
