<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fraction Addition Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EAF6FB;
    --card: #FFFFFF;
    --navy: #1F2A44;
    --coral: #FF6F59;
    --coral-dark: #E85A45;
    --sun: #FFC857;
    --leaf: #3FAE7A;
    --leaf-bg: #E4F6EC;
    --oops-bg: #FDE9E7;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #10151F;
      --card: #1B2333;
      --navy: #EDEFF5;
      --leaf-bg: #16321F;
      --oops-bg: #3A1E1A;
    }
  }
  :root[data-theme="dark"]{
    --bg: #10151F;
    --card: #1B2333;
    --navy: #EDEFF5;
    --leaf-bg: #16321F;
    --oops-bg: #3A1E1A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    font-family:'Nunito',sans-serif;
    color:var(--navy);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .wrap{ width:100%; max-width:520px; }
  h1{
    font-family:'Baloo 2',sans-serif;
    font-size:clamp(1.5rem,5vw,2rem);
    text-align:center;
    margin:0 0 4px;
  }
  .sub{ text-align:center; margin:0 0 20px; opacity:.75; font-weight:600; font-size:.95rem;}
  .track{
    height:10px; background:rgba(0,0,0,.08); border-radius:999px; overflow:hidden; margin-bottom:24px;
  }
  .fill{ height:100%; background:var(--sun); width:0%; transition:width .35s ease; }
  .card{
    background:var(--card);
    border-radius:20px;
    padding:32px 28px;
    box-shadow:0 10px 30px rgba(15,30,60,.08);
  }
  .qnum{ font-weight:800; color:var(--coral); font-size:.9rem; margin-bottom:10px;}
  .question{
    display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap;
    font-family:'Baloo 2',sans-serif; font-size:1.9rem; margin:14px 0 28px;
  }
  .frac{ display:inline-flex; flex-direction:column; align-items:center; line-height:1.05; font-size:1.4rem;}
  .frac .num, .frac .den{ padding:0 6px; }
  .frac .num{ border-bottom:3px solid var(--navy); padding-bottom:2px; }
  .mixed{ display:inline-flex; align-items:center; gap:4px; }
  .whole{ font-size:1.9rem; }
  .options{
    display:grid; grid-template-columns:1fr 1fr; gap:12px;
  }
  .opt{
    background:var(--bg);
    border:2px solid transparent;
    border-radius:14px;
    padding:14px 8px;
    font-family:'Nunito',sans-serif;
    font-weight:800;
    font-size:1.1rem;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:6px;
    color:var(--navy);
    transition:transform .12s ease, border-color .12s ease;
  }
  .opt:hover{ transform:translateY(-2px); }
  .opt:focus-visible{ outline:3px solid var(--coral); outline-offset:2px; }
  .opt.correct{ background:var(--leaf-bg); border-color:var(--leaf); }
  .opt.wrong{ background:var(--oops-bg); border-color:var(--coral-dark); }
  .opt[disabled]{ cursor:default; }
  .opt .of{ display:inline-flex; flex-direction:column; font-size:.95rem; line-height:1; }
  .opt .of .n{ border-bottom:2px solid currentColor; padding:0 3px; }
  .opt .of .d{ padding:0 3px; }
  .feedback{
    min-height:26px; text-align:center; font-weight:700; margin-top:16px; font-size:.95rem;
  }
  .feedback.good{ color:var(--leaf); }
  .feedback.bad{ color:var(--coral-dark); }
  .next-btn{
    display:block; margin:18px auto 0; background:var(--coral); color:#fff; border:none;
    padding:12px 28px; border-radius:999px; font-family:'Baloo 2',sans-serif; font-size:1rem;
    cursor:pointer; opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .next-btn.show{ opacity:1; pointer-events:auto; }
  .result{ text-align:center; }
  .result .big{ font-family:'Baloo 2',sans-serif; font-size:3rem; color:var(--coral); margin:8px 0; }
  .result p{ font-weight:600; }
  .restart{
    margin-top:18px; background:var(--navy); color:var(--card); border:none;
    padding:12px 30px; border-radius:999px; font-family:'Baloo 2',sans-serif; font-size:1rem; cursor:pointer;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Adding Fractions</h1>
  <p class="sub">40 questions &middot; give every answer in simplest form</p>
  <div class="track"><div class="fill" id="fill"></div></div>
  <div class="card" id="card"></div>
</div>

<script>
// Each question: aW/bW = whole part of addend (0 if none), aF/bF = fraction part [num,den]
// correct/opts: {w, f} where f is [num,den] or null (whole number only)
const questions = [
  {aF:[1,4], bF:[1,4], correct:{w:0,f:[1,2]}, opts:[{w:0,f:[1,2]},{w:0,f:[2,8]},{w:0,f:[2,4]},{w:0,f:[1,8]}]},
  {aF:[2,6], bF:[1,6], correct:{w:0,f:[1,2]}, opts:[{w:0,f:[3,12]},{w:0,f:[1,2]},{w:0,f:[3,6]},{w:0,f:[1,6]}]},
  {aF:[1,3], bF:[1,3], correct:{w:0,f:[2,3]}, opts:[{w:0,f:[2,6]},{w:0,f:[2,3]},{w:0,f:[2,9]},{w:0,f:[1,3]}]},
  {aF:[1,5], bF:[2,5], correct:{w:0,f:[3,5]}, opts:[{w:0,f:[3,5]},{w:0,f:[3,10]},{w:0,f:[3,25]},{w:0,f:[1,5]}]},
  {aF:[3,8], bF:[2,8], correct:{w:0,f:[5,8]}, opts:[{w:0,f:[5,16]},{w:0,f:[5,8]},{w:0,f:[5,64]},{w:0,f:[1,8]}]},
  {aF:[1,2], bF:[1,4], correct:{w:0,f:[3,4]}, opts:[{w:0,f:[2,6]},{w:0,f:[3,4]},{w:0,f:[1,8]},{w:0,f:[2,4]}]},
  {aF:[1,3], bF:[1,6], correct:{w:0,f:[1,2]}, opts:[{w:0,f:[2,9]},{w:0,f:[1,9]},{w:0,f:[1,2]},{w:0,f:[2,18]}]},
  {aF:[2,5], bF:[1,10], correct:{w:0,f:[1,2]}, opts:[{w:0,f:[3,15]},{w:0,f:[1,2]},{w:0,f:[3,10]},{w:0,f:[3,50]}]},
  {aF:[1,4], bF:[1,8], correct:{w:0,f:[3,8]}, opts:[{w:0,f:[2,12]},{w:0,f:[3,8]},{w:0,f:[2,32]},{w:0,f:[1,8]}]},
  {aF:[2,3], bF:[1,9], correct:{w:0,f:[7,9]}, opts:[{w:0,f:[3,12]},{w:0,f:[7,9]},{w:0,f:[3,27]},{w:0,f:[3,9]}]},
  {aF:[1,2], bF:[1,3], correct:{w:0,f:[5,6]}, opts:[{w:0,f:[2,5]},{w:0,f:[5,6]},{w:0,f:[2,6]},{w:0,f:[3,6]}]},
  {aF:[3,4], bF:[1,8], correct:{w:0,f:[7,8]}, opts:[{w:0,f:[4,12]},{w:0,f:[4,32]},{w:0,f:[7,8]},{w:0,f:[3,8]}]},
  {aF:[1,6], bF:[1,3], correct:{w:0,f:[1,2]}, opts:[{w:0,f:[2,9]},{w:0,f:[1,2]},{w:0,f:[2,18]},{w:0,f:[1,9]}]},
  {aF:[2,7], bF:[3,7], correct:{w:0,f:[5,7]}, opts:[{w:0,f:[5,14]},{w:0,f:[5,7]},{w:0,f:[5,49]},{w:0,f:[1,7]}]},
  {aF:[1,10], bF:[3,10], correct:{w:0,f:[2,5]}, opts:[{w:0,f:[4,20]},{w:0,f:[2,5]},{w:0,f:[4,100]},{w:0,f:[1,5]}]},
  {aF:[5,12], bF:[1,4], correct:{w:0,f:[2,3]}, opts:[{w:0,f:[6,16]},{w:0,f:[2,3]},{w:0,f:[8,48]},{w:0,f:[1,3]}]},
  {aW:1, aF:[1,4], bF:[1,4], correct:{w:1,f:[1,2]}, opts:[{w:1,f:[2,8]},{w:1,f:[1,2]},{w:2,f:[1,4]},{w:0,f:[1,2]}]},
  {aF:[2,9], bF:[1,3], correct:{w:0,f:[5,9]}, opts:[{w:0,f:[3,12]},{w:0,f:[3,27]},{w:0,f:[5,9]},{w:0,f:[1,9]}]},
  {aF:[3,5], bF:[1,10], correct:{w:0,f:[7,10]}, opts:[{w:0,f:[4,15]},{w:0,f:[7,10]},{w:0,f:[4,50]},{w:0,f:[2,5]}]},
  {aW:1, aF:[1,2], bF:[1,2], correct:{w:2,f:null}, opts:[{w:1,f:[2,2]},{w:2,f:null},{w:2,f:[1,2]},{w:1,f:null}]},
  {aF:[1,4], bF:[3,4], correct:{w:1,f:null}, opts:[{w:0,f:[4,8]},{w:0,f:[4,4]},{w:2,f:null},{w:1,f:null}]},
  {aF:[3,10], bF:[7,10], correct:{w:1,f:null}, opts:[{w:0,f:[10,20]},{w:0,f:[10,10]},{w:2,f:null},{w:1,f:null}]},
  {aF:[5,8], bF:[3,8], correct:{w:1,f:null}, opts:[{w:0,f:[8,16]},{w:0,f:[8,8]},{w:2,f:null},{w:1,f:null}]},
  {aF:[2,9], bF:[7,9], correct:{w:1,f:null}, opts:[{w:0,f:[9,18]},{w:0,f:[9,9]},{w:0,f:[5,9]},{w:1,f:null}]},
  {aF:[1,6], bF:[5,6], correct:{w:1,f:null}, opts:[{w:0,f:[6,12]},{w:0,f:[6,6]},{w:0,f:[4,6]},{w:1,f:null}]},
  {aF:[3,7], bF:[4,7], correct:{w:1,f:null}, opts:[{w:0,f:[7,14]},{w:0,f:[7,7]},{w:0,f:[1,7]},{w:1,f:null}]},
  {aF:[1,5], bF:[4,5], correct:{w:1,f:null}, opts:[{w:0,f:[5,10]},{w:0,f:[5,5]},{w:0,f:[3,5]},{w:1,f:null}]},
  {aF:[5,12], bF:[7,12], correct:{w:1,f:null}, opts:[{w:0,f:[12,24]},{w:0,f:[12,12]},{w:0,f:[2,12]},{w:1,f:null}]},
  {aF:[2,5], bF:[3,10], correct:{w:0,f:[7,10]}, opts:[{w:0,f:[5,15]},{w:0,f:[7,10]},{w:0,f:[5,10]},{w:0,f:[1,2]}]},
  {aF:[1,6], bF:[1,4], correct:{w:0,f:[5,12]}, opts:[{w:0,f:[2,10]},{w:0,f:[5,12]},{w:0,f:[2,12]},{w:0,f:[1,3]}]},
  {aF:[3,8], bF:[1,4], correct:{w:0,f:[5,8]}, opts:[{w:0,f:[4,12]},{w:0,f:[5,8]},{w:0,f:[4,8]},{w:0,f:[1,2]}]},
  {aF:[1,9], bF:[2,3], correct:{w:0,f:[7,9]}, opts:[{w:0,f:[3,12]},{w:0,f:[7,9]},{w:0,f:[3,9]},{w:0,f:[1,3]}]},
  {aF:[5,6], bF:[1,12], correct:{w:0,f:[11,12]}, opts:[{w:0,f:[6,18]},{w:0,f:[11,12]},{w:0,f:[6,12]},{w:0,f:[1,2]}]},
  {aF:[1,2], bF:[2,5], correct:{w:0,f:[9,10]}, opts:[{w:0,f:[3,7]},{w:0,f:[9,10]},{w:0,f:[3,10]},{w:0,f:[2,5]}]},
  {aF:[3,4], bF:[1,12], correct:{w:0,f:[5,6]}, opts:[{w:0,f:[4,16]},{w:0,f:[5,6]},{w:0,f:[4,12]},{w:0,f:[1,3]}]},
  {aF:[1,3], bF:[5,12], correct:{w:0,f:[3,4]}, opts:[{w:0,f:[6,15]},{w:0,f:[3,4]},{w:0,f:[6,12]},{w:0,f:[1,2]}]},
  {aW:2, aF:[1,3], bF:[1,3], correct:{w:2,f:[2,3]}, opts:[{w:2,f:[2,6]},{w:3,f:[2,3]},{w:2,f:[1,3]},{w:2,f:[2,3]}]},
  {aW:1, aF:[3,4], bF:[1,4], correct:{w:2,f:null}, opts:[{w:1,f:[4,4]},{w:1,f:[4,8]},{w:2,f:[1,4]},{w:2,f:null}]},
  {aF:[3,10], bF:[1,5], correct:{w:0,f:[1,2]}, opts:[{w:0,f:[4,10]},{w:0,f:[4,15]},{w:0,f:[1,2]},{w:0,f:[1,5]}]},
  {aF:[4,11], bF:[3,11], correct:{w:0,f:[7,11]}, opts:[{w:0,f:[7,22]},{w:0,f:[1,11]},{w:0,f:[7,11]},{w:0,f:[3,11]}]}
];

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

let order = [];
let current = 0;
let score = 0;

function fracHTML(f){
  return `<span class="frac"><span class="num">${f[0]}</span><span class="den">${f[1]}</span></span>`;
}
function addendHTML(w, f){
  if(w){
    return `<span class="mixed"><span class="whole">${w}</span>${fracHTML(f)}</span>`;
  }
  return fracHTML(f);
}
function optFracHTML(f){
  return `<span class="of"><span class="n">${f[0]}</span><span class="d">${f[1]}</span></span>`;
}
function optHTML(o){
  if(o.f){
    return o.w ? `<span class="whole">${o.w}</span>${optFracHTML(o.f)}` : optFracHTML(o.f);
  }
  return `<span class="whole">${o.w}</span>`;
}
function sameAnswer(x,y){
  const xw = x.w||0, yw = y.w||0;
  if(xw !== yw) return false;
  if(!x.f && !y.f) return true;
  if(!x.f || !y.f) return false;
  return x.f[0]===y.f[0] && x.f[1]===y.f[1];
}

function renderQuestion(){
  const card = document.getElementById('card');
  const q = questions[order[current]];
  document.getElementById('fill').style.width = ((current)/questions.length*100)+'%';

  const qHTML = `${addendHTML(q.aW, q.aF)} <span>+</span> ${addendHTML(q.bW, q.bF)}`;

  const opts = shuffle(q.opts);

  const optsHTML = opts.map((o,i)=>{
    return `<button class="opt" data-i="${i}">${optHTML(o)}</button>`;
  }).join('');

  card.innerHTML = `
    <div class="qnum">Question ${current+1} of ${questions.length}</div>
    <div class="question">${qHTML} <span>=</span> <span>?</span></div>
    <div class="options">${optsHTML}</div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn">${current === questions.length-1 ? 'See results' : 'Next question'}</button>
  `;

  const buttons = card.querySelectorAll('.opt');
  buttons.forEach((btn,i)=>{
    btn.addEventListener('click', ()=>{
      buttons.forEach(b=>b.disabled = true);
      const chosen = opts[i];
      const isCorrect = sameAnswer(chosen, q.correct);
      const fb = document.getElementById('feedback');
      if(isCorrect){
        btn.classList.add('correct');
        fb.textContent = "That's right! Nicely done.";
        fb.className = 'feedback good';
        score++;
      } else {
        btn.classList.add('wrong');
        fb.textContent = "Not quite — check the simplest form.";
        fb.className = 'feedback bad';
        buttons.forEach((b,j)=>{
          if(sameAnswer(opts[j], q.correct)) b.classList.add('correct');
        });
      }
      document.getElementById('nextBtn').classList.add('show');
    });
  });

  document.getElementById('nextBtn').addEventListener('click', ()=>{
    current++;
    if(current < questions.length){
      renderQuestion();
    } else {
      showResults();
    }
  });
}

function showResults(){
  document.getElementById('fill').style.width = '100%';
  const card = document.getElementById('card');
  const pct = Math.round((score/questions.length)*100);
  let msg;
  if(pct === 100) msg = "Perfect score! Fractions have nothing on you.";
  else if(pct >= 80) msg = "Great work — you've really got this.";
  else if(pct >= 50) msg = "Good effort — a bit more practice and you'll have it down.";
  else msg = "Keep practicing — try again to build your confidence.";

  card.innerHTML = `
    <div class="result">
      <div class="qnum">Quiz complete</div>
      <div class="big">${score} / ${questions.length}</div>
      <p>${msg}</p>
      <button class="restart" id="restartBtn">Try again</button>
    </div>
  `;
  document.getElementById('restartBtn').addEventListener('click', startQuiz);
}

function startQuiz(){
  order = shuffle(questions.map((_,i)=>i));
  current = 0;
  score = 0;
  renderQuestion();
}

startQuiz();
</script>
</body>
</html>
