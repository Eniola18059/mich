<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math Quiz Set 2 – Operations & Algebraic Thinking</title>
<style>
  :root{
    --bg1:#fff4d6; --bg2:#d9f0ff; --ink:#1f2a44; --card:#ffffff;
    --blue:#3b82f6; --green:#22a559; --red:#e5484d; --orange:#ff9f1c; --purple:#7c5cff;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
    color:var(--ink); background:linear-gradient(160deg,var(--bg1),var(--bg2)); padding:16px;
  }
  .wrap{max-width:720px; margin:0 auto}
  .card{background:var(--card); border-radius:24px; padding:26px; box-shadow:0 8px 28px rgba(31,42,68,.12)}
  h1{margin:0 0 6px; font-size:2rem; line-height:1.15}
  h2{margin:0 0 14px; font-size:1.45rem; line-height:1.35}
  .sub{color:#4b587a; margin:0 0 18px}
  .emoji-big{font-size:3.2rem}
  .topics{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 22px; padding:0; list-style:none}
  .topics li{background:#eef3ff; border-radius:999px; padding:7px 14px; font-weight:700; font-size:.92rem}
  button{font:inherit; cursor:pointer; border:none}
  .btn{background:var(--blue); color:#fff; font-weight:800; font-size:1.1rem; padding:14px 28px; border-radius:16px; box-shadow:0 4px 0 #2563c9}
  .btn:active{transform:translateY(2px); box-shadow:0 2px 0 #2563c9}
  .btn.green{background:var(--green); box-shadow:0 4px 0 #17803f}
  .btn.orange{background:var(--orange); box-shadow:0 4px 0 #cc7a00}
  .top{display:flex; justify-content:space-between; align-items:center; font-weight:800; margin-bottom:10px}
  .bar{height:14px; background:#e6ebf7; border-radius:999px; overflow:hidden; margin-bottom:20px}
  .bar>div{height:100%; width:0; background:linear-gradient(90deg,var(--purple),var(--blue)); border-radius:999px; transition:width .35s}
  .tag{display:inline-block; background:#fff1d6; color:#a35a00; font-weight:800; font-size:.8rem; padding:4px 12px; border-radius:999px; margin-bottom:12px}
  .art{font-size:1.7rem; line-height:1.5; letter-spacing:4px; margin:0 0 14px; text-align:center; background:#f6f9ff; border-radius:16px; padding:10px}
  .opts{display:grid; gap:12px; grid-template-columns:1fr 1fr}
  @media(max-width:520px){.opts{grid-template-columns:1fr} h1{font-size:1.65rem}}
  .opt{background:#f4f7ff; border:3px solid #d6e0fb; border-radius:16px; padding:16px; font-weight:800; font-size:1.15rem; color:var(--ink); text-align:center}
  .opt:hover:not(:disabled){border-color:var(--blue); background:#eaf1ff}
  .opt.correct{background:#dcf7e6; border-color:var(--green)}
  .opt.wrong{background:#ffe3e4; border-color:var(--red)}
  .opt:disabled{cursor:default}
  .fb{margin-top:18px; padding:14px 16px; border-radius:16px; font-weight:700; display:none}
  .fb.good{display:block; background:#dcf7e6; color:#0f5c2c}
  .fb.bad{display:block; background:#ffe9d6; color:#7a3b00}
  .next{margin-top:18px; text-align:right; display:none}
  .score-big{font-size:3.4rem; font-weight:900; color:var(--purple); margin:6px 0}
  .stars{font-size:2.2rem; margin-bottom:8px}
  .review{margin-top:20px; text-align:left}
  .review .item{border-left:6px solid var(--red); background:#fff5f5; padding:10px 14px; border-radius:10px; margin-bottom:10px; font-size:.95rem}
  .review .item b{display:block; margin-bottom:4px}
  .center{text-align:center}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">

  <div id="start" class="card center">
    <div class="emoji-big">🧮🌟</div>
    <h1>Math Quiz · Set 2</h1>
    <p class="sub"><b>Part 1: Operations & Algebraic Thinking</b><br>50 brand-new questions · Pick the best answer · No timer, take your time!</p>
    <ul class="topics" style="justify-content:center">
      <li>➕ Word problems within 100</li>
      <li>⚡ Facts within 20</li>
      <li>🔟 Sums of two digits</li>
      <li>⚖️ Odd &amp; even</li>
      <li>🔲 Equal groups &amp; arrays</li>
    </ul>
    <button class="btn" id="startBtn">Let's Start! 🚀</button>
  </div>

  <div id="quiz" class="card hidden">
    <div class="top"><span id="qnum">Question 1 of 50</span><span id="scoreNow">⭐ 0</span></div>
    <div class="bar"><div id="prog"></div></div>
    <span class="tag" id="tag"></span>
    <h2 id="qtext"></h2>
    <div class="art hidden" id="art"></div>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb"></div>
    <div class="next" id="nextWrap"><button class="btn green" id="nextBtn">Next ➜</button></div>
  </div>

  <div id="result" class="card center hidden">
    <div class="stars" id="stars"></div>
    <h1 id="rtitle"></h1>
    <div class="score-big" id="rscore"></div>
    <p class="sub" id="rmsg"></p>
    <div id="topicScores" class="topics" style="justify-content:center"></div>
    <button class="btn orange" id="againBtn">Try Again 🔁</button>
    <div class="review" id="review"></div>
  </div>

</div>

<script>
// Each question: [topic, question, correctAnswer, [three wrong answers], explanation, optional picture]
const Q = [
// ---------- Word problems within 100 ----------
["Word Problems","Nora has 52 beads. She buys 29 more beads. How many beads does she have now?","81",["71","83","23"],"52 + 29 = 81. Add the tens (50 + 20 = 70), then the ones (2 + 9 = 11), then 70 + 11 = 81."],
["Word Problems","A farmer had 91 eggs. He sold 56 eggs. How many eggs are left?","35",["45","147","25"],"91 − 56 = 35. Count up from 56: 4 to reach 60, 30 more to reach 90, and 1 more to reach 91. That is 4 + 30 + 1 = 35."],
["Word Problems","Kai scored 37 points in game one and 48 points in game two. How many points did he score in all?","85",["75","95","11"],"37 + 48 = 85. Tens: 30 + 40 = 70. Ones: 7 + 8 = 15. Then 70 + 15 = 85."],
["Word Problems","There are 63 children at the park. 27 children go home. How many children are still at the park?","36",["46","90","34"],"63 − 27 = 36. Take away 20 to get 43, then take away 7 more to get 36."],
["Word Problems","A library had some books. Then 34 new books arrived. Now the library has 90 books. How many books were there at first?","56",["124","66","46"],"Start + 34 = 90, so 90 − 34 = 56."],
["Word Problems","Ella had some stickers. She gave 26 stickers away. Now she has 38 stickers. How many stickers did Ella start with?","64",["12","54","74"],"Start − 26 = 38, so 38 + 26 = 64. She gave some away, so she had more at the start."],
["Word Problems","Omar has 47 cards. Ravi has 15 more cards than Omar. How many cards does Ravi have?","62",["32","52","61"],"\"15 more than\" means add: 47 + 15 = 62."],
["Word Problems","Team Red has 74 players. Team Blue has 19 fewer players than Team Red. How many players does Team Blue have?","55",["93","65","45"],"\"19 fewer than\" means subtract: 74 − 19 = 55. Take away 20, then add 1 back."],
["Word Problems","A store sold 18 hats on Monday, 25 hats on Tuesday, and 30 hats on Wednesday. How many hats did it sell in all?","73",["63","83","43"],"18 + 25 = 43, then 43 + 30 = 73."],
["Word Problems","Mom had $72. She spent $38 on food. How much money does Mom have left?","$34",["$44","$110","$36"],"72 − 38 = 34. Take away 40 to get 32, then add 2 back."],
["Word Problems","Max had 40 marbles. He won 17 more marbles. Then he gave 9 marbles to his sister. How many marbles does Max have now?","48",["57","66","49"],"First: 40 + 17 = 57. Then: 57 − 9 = 48. This problem has two steps."],
["Word Problems","Tia had 45 pencils. She bought 30 more pencils. Which number sentence shows how many pencils Tia has now?","45 + 30 = 75",["45 − 30 = 15","45 + 20 = 65","45 + 35 = 80"],"Bought more means add. 45 + 30 = 75 (4 tens + 3 tens = 7 tens, and the 5 ones stay)."],
["Word Problems","What number makes this true? 29 + ___ = 72","43",["101","53","57"],"Think 72 − 29 = 43. Check: 29 + 43 = 72."],
["Word Problems","A hall has 86 seats. 49 seats are filled. How many seats are empty?","37",["47","135","43"],"86 − 49 = 37. Take away 50 to get 36, then add 1 back."],

// ---------- Facts within 20 ----------
["Facts within 20","8 + 6 = ?","14",["13","15","12"],"Make a ten: 8 + 2 = 10, then add the other 4 to get 14."],
["Facts within 20","14 − 6 = ?","8",["7","9","20"],"Think 6 + 8 = 14, so 14 − 6 = 8."],
["Facts within 20","17 − 8 = ?","9",["8","10","25"],"Think 8 + 9 = 17, so 17 − 8 = 9."],
["Facts within 20","9 + 8 = ?","17",["16","18","15"],"Make a ten: 9 + 1 = 10, then add the other 7 to get 17."],
["Facts within 20","11 − 4 = ?","7",["6","8","15"],"Subtract to 10 first: 11 − 1 = 10, then 10 − 3 = 7."],
["Facts within 20","Use doubles plus one. 7 + 8 = ?","15",["14","16","13"],"7 + 7 = 14, and one more makes 15."],
["Facts within 20","Making a ten helps us add. Which number sentence has the same total as 8 + 5?","10 + 3",["10 + 5","8 + 3","10 + 2"],"Move 2 from the 5 to the 8: 8 + 5 = 10 + 3 = 13."],
["Facts within 20","12 − 8 = ?","4",["3","5","20"],"Think 8 + 4 = 12, so 12 − 8 = 4."],
["Facts within 20","Which fact belongs to the same fact family as 9 + 5 = 14?","14 − 5 = 9",["14 − 6 = 8","9 + 6 = 15","14 + 5 = 19"],"A fact family uses the same three numbers: 9, 5 and 14."],
["Facts within 20","Which number sentence is a doubles fact with a total of 16?","8 + 8 = 16",["9 + 7 = 16","10 + 6 = 16","8 + 9 = 17"],"A doubles fact adds the same number twice. 8 + 8 = 16."],

// ---------- Sums of two one-digit numbers ----------
["Addition Facts","7 + 6 = ?","13",["12","14","11"],"7 + 3 = 10, then add 3 more to make 13."],
["Addition Facts","9 + 5 = ?","14",["13","15","4"],"Take 1 from the 5 to make 9 into 10. Then 10 + 4 = 14."],
["Addition Facts","9 + 7 = ?","16",["15","17","14"],"9 + 1 = 10, then add the other 6 to make 16."],
["Addition Facts","6 + 6 = ?","12",["11","13","14"],"Doubles: 6 + 6 = 12."],
["Addition Facts","4 + 7 = ?","11",["10","12","13"],"7 + 3 = 10, then add the other 1 to make 11."],
["Addition Facts","3 + 9 = ?","12",["11","13","6"],"Take 1 from the 3 to make 9 into 10. Then 10 + 2 = 12."],
["Addition Facts","7 + ___ = 16. What number is missing?","9",["8","10","23"],"16 − 7 = 9. Check: 7 + 9 = 16."],
["Addition Facts","___ + 8 = 14. What number is missing?","6",["5","7","22"],"14 − 8 = 6. Check: 6 + 8 = 14."],

// ---------- Odd and even ----------
["Odd & Even","Which of these numbers is odd?","57",["52","60","78"],"57 ends in 7, so when you make pairs there is 1 left over."],
["Odd & Even","Which of these numbers is even?","36",["29","51","73"],"36 can be split into two equal groups (18 and 18), and it ends in 6."],
["Odd & Even","Ruby has 16 balloons. She shares them equally between 2 friends. What does this show?","16 is even, because each friend gets 8 with none left over",["16 is odd, because each friend gets 8","16 is even, because 1 balloon is left over","16 is odd, because 1 balloon is left over"],"Each friend gets 8 and no balloons are left. When nothing is left over, the number is even."],
["Odd & Even","Which number sentence shows that 14 is an even number?","7 + 7 = 14",["7 + 8 = 15","6 + 7 = 13","4 + 4 = 8"],"An even number is a double. 7 + 7 = 14."],
["Odd & Even","Which number sentence shows that 9 is odd, with 1 left over after making groups of 2?","2 + 2 + 2 + 2 + 1 = 9",["2 + 2 + 2 + 2 = 8","2 + 2 + 2 + 2 + 2 = 10","3 + 3 + 3 = 9"],"Four groups of 2 make 8, and there is 1 left over. So 9 is odd."],
["Odd & Even","Which list has only odd numbers?","31, 45, 59, 63",["31, 45, 58, 63","32, 45, 59, 63","31, 44, 59, 62"],"Every number in 31, 45, 59, 63 ends in 1, 5, 9 or 3."],
["Odd & Even","Which list has only even numbers?","22, 46, 70, 88",["22, 46, 71, 88","24, 36, 50, 99","20, 42, 65, 80"],"Every number in 22, 46, 70, 88 ends in 2, 6, 0 or 8."],
["Odd & Even","What is the next odd number after 49?","51",["50","52","53"],"After 49 comes 50 (even), then 51 (odd)."],
["Odd & Even","I am an even number. I am more than 30 and less than 35. My ones digit is greater than 3. Which number am I?","34",["32","33","31"],"The numbers between 30 and 35 are 31, 32, 33 and 34. Only 34 is even with a ones digit greater than 3."],

// ---------- Equal groups and arrays ----------
["Equal Groups & Arrays","An array has 3 rows with 5 in each row. How many are there in all?","15",["8","12","18"],"5 + 5 + 5 = 15. Add the rows, do not add 3 + 5.","arr:3x5"],
["Equal Groups & Arrays","What is 10 + 10 + 10?","30",["20","40","3"],"Count by 10s: 10, 20, 30."],
["Equal Groups & Arrays","An array has 4 rows with 4 in each row. How many are there in all?","16",["8","12","20"],"4 + 4 + 4 + 4 = 16.","arr:4x4"],
["Equal Groups & Arrays","There are 5 baskets. Each basket has 4 apples. How many apples are there altogether?","20",["9","16","25"],"4 + 4 + 4 + 4 + 4 = 20.","grp:5x4"],
["Equal Groups & Arrays","Which addition sentence matches 2 equal groups of 9?","9 + 9 = 18",["2 + 9 = 11","9 + 9 + 9 = 27","2 + 2 = 4"],"2 groups of 9 means we add 9 two times: 9 + 9 = 18."],
["Equal Groups & Arrays","An array has 4 rows with 2 in each row. How many are there in all?","8",["6","10","12"],"2 + 2 + 2 + 2 = 8.","arr:4x2"],
["Equal Groups & Arrays","Which addition sentence does NOT show equal groups?","6 + 6 + 6 + 3",["4 + 4 + 4","7 + 7","9 + 9 + 9 + 9"],"The numbers 6, 6, 6 and 3 are not all the same size, so they are not equal groups."],
["Equal Groups & Arrays","An array has 3 rows. Each row has 6 dots. Which sentence adds up the rows?","6 + 6 + 6 = 18",["3 + 6 = 9","6 + 6 = 12","6 + 6 + 6 + 6 = 24"],"There are 3 rows, and each row has 6, so add 6 three times.","arr:3x6"],
["Equal Groups & Arrays","There are 6 bags. Each bag has 2 apples. How many apples are there in all?","12",["8","10","14"],"2 + 2 + 2 + 2 + 2 + 2 = 12.","grp:6x2"]
];

const TOTAL = Q.length;
const $ = id => document.getElementById(id);
let order, idx, score, missed, byTopic;

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

function artHTML(spec){
  if(!spec) return "";
  const [kind,dims]=spec.split(":"); const [r,c]=dims.split("x").map(Number);
  if(kind==="arr"){
    return Array.from({length:r},()=>"🔵".repeat(c)).join("<br>");
  }
  return Array.from({length:r},()=>"("+"🍎".repeat(c)+")").join(" ");
}

function start(){
  order = shuffle(Q.map((_,i)=>i));
  idx=0; score=0; missed=[]; byTopic={};
  $("start").classList.add("hidden"); $("result").classList.add("hidden"); $("quiz").classList.remove("hidden");
  show();
}

function show(){
  const q = Q[order[idx]];
  $("qnum").textContent = "Question "+(idx+1)+" of "+TOTAL;
  $("scoreNow").textContent = "⭐ "+score;
  $("prog").style.width = (idx/TOTAL*100)+"%";
  $("tag").textContent = q[0];
  $("qtext").textContent = q[1];
  const art = $("art");
  if(q[5]){ art.innerHTML = artHTML(q[5]); art.classList.remove("hidden"); } else { art.classList.add("hidden"); }
  const fb=$("fb"); fb.className="fb"; fb.textContent="";
  $("nextWrap").style.display="none";
  const box=$("opts"); box.innerHTML="";
  shuffle([q[2],...q[3]]).forEach(text=>{
    const b=document.createElement("button");
    b.className="opt"; b.textContent=text;
    b.onclick=()=>answer(b,text,q);
    box.appendChild(b);
  });
}

function answer(btn,text,q){
  const ok = text===q[2];
  const t=q[0]; byTopic[t]=byTopic[t]||{right:0,total:0}; byTopic[t].total++;
  document.querySelectorAll(".opt").forEach(b=>{
    b.disabled=true;
    if(b.textContent===q[2]) b.classList.add("correct");
  });
  const fb=$("fb");
  if(ok){ score++; byTopic[t].right++; btn.classList.add("correct"); fb.className="fb good"; fb.textContent="🎉 Correct! "+q[4]; }
  else { btn.classList.add("wrong"); fb.className="fb bad"; fb.textContent="Not quite. The answer is "+q[2]+". "+q[4]; missed.push({q:q[1],a:q[2],e:q[4],mine:text}); }
  $("scoreNow").textContent="⭐ "+score;
  $("nextBtn").textContent = idx===TOTAL-1 ? "See my score 🏆" : "Next ➜";
  $("nextWrap").style.display="block";
}

function next(){
  idx++;
  if(idx>=TOTAL) finish(); else show();
}

function finish(){
  $("quiz").classList.add("hidden"); $("result").classList.remove("hidden");
  $("prog").style.width="100%";
  const pct=Math.round(score/TOTAL*100);
  $("rscore").textContent=score+" / "+TOTAL+"  ("+pct+"%)";
  let stars, title, msg;
  if(pct>=90){stars="⭐⭐⭐⭐⭐";title="Math Superstar! 🏆";msg="Amazing work. You really know your facts!";}
  else if(pct>=75){stars="⭐⭐⭐⭐";title="Great Job! 🎉";msg="You are doing really well. Check the ones you missed below.";}
  else if(pct>=60){stars="⭐⭐⭐";title="Good Effort! 👍";msg="You are getting there. Practise the topics marked below and try again.";}
  else {stars="⭐⭐";title="Keep Practising! 💪";msg="Every try makes you stronger. Read the explanations below and try again.";}
  $("stars").textContent=stars; $("rtitle").textContent=title; $("rmsg").textContent=msg;
  $("topicScores").innerHTML = Object.entries(byTopic).map(([k,v])=>"<li>"+k+": "+v.right+"/"+v.total+"</li>").join("");
  const rv=$("review"); rv.innerHTML="";
  if(missed.length){
    rv.innerHTML="<h2>Questions to look at again 🔍</h2>"+missed.map(m=>
      "<div class='item'><b>"+m.q+"</b>You chose: "+m.mine+" · Right answer: <b style='display:inline'>"+m.a+"</b><br>"+m.e+"</div>").join("");
  } else { rv.innerHTML="<h2>Perfect score! Nothing to review. 🌈</h2>"; }
  window.scrollTo({top:0,behavior:"smooth"});
}

$("startBtn").onclick=start;
$("nextBtn").onclick=next;
$("againBtn").onclick=start;
</script>
</body>
</html>
