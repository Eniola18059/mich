<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grade 4 Word Problems – Questions &amp; Solutions</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1d2433;--muted:#5b657a;--accent:#2f5bea;--ans:#e8f7ee;--ansb:#1f9d55;--warn:#fff4e0;--warnb:#d98200;--line:#e3e6ee}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b1f2a;--text:#eef1f7;--muted:#a3adc2;--accent:#7b9bff;--ans:#16301f;--ansb:#3ecf7a;--warn:#33270f;--warnb:#f0a63a;--line:#2b3140}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.55}
header{padding:28px 20px 12px;max-width:820px;margin:auto}
h1{margin:0 0 6px;font-size:1.7rem}
header p{margin:0;color:var(--muted)}
nav{position:sticky;top:0;background:var(--bg);padding:10px 20px;border-bottom:1px solid var(--line);z-index:5}
nav div{max-width:820px;margin:auto;display:flex;gap:8px;flex-wrap:wrap}
nav button{border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px;border-radius:999px;font-size:.9rem;cursor:pointer}
nav button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
main{max-width:820px;margin:auto;padding:16px 20px 60px}
section{display:none}section.on{display:block}
.intro{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:16px;color:var(--muted)}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.q h3{margin:0 0 6px;font-size:1rem;color:var(--accent)}
.q .text{margin:0 0 10px;font-weight:500}
.steps{margin:0 0 10px;padding-left:20px;color:var(--muted)}
.steps li{margin:3px 0}
.eq{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--bg);padding:2px 6px;border-radius:6px;color:var(--text)}
.ans{background:var(--ans);border-left:5px solid var(--ansb);padding:10px 14px;border-radius:8px;font-weight:700}
.note{background:var(--warn);border-left:5px solid var(--warnb);padding:8px 12px;border-radius:8px;margin-top:10px;font-size:.92rem}
.ctx{font-style:italic}
</style>
</head>
<body>
<header>
<h1>Grade 4 Word Problems</h1>
<p>Multiplication and division · every question with a step-by-step solution and a clearly marked answer</p>
</header>
<nav><div id="tabs"></div></nav>
<main id="main"></main>

<script>
const sheets=[
{t:"🏨 Hotel",intro:"A hotel has 7 floors. The lobby, restaurant and gym are on the ground floor. The guestrooms are on the 1st to 6th floors, so there are <b>6 guest floors</b>.",qs:[
["1","If there are 35 standard rooms on each floor, how many standard rooms are there?",["Guestrooms are on 6 floors (1st to 6th), not 7.","Multiply: <span class='eq'>35 × 6 = 210</span>"],"210 standard rooms","Check: 35 × 6 = 210. (Using 7 floors would count the ground floor, which has no guestrooms.)"],
["2","There are 4 housekeepers on each floor. One room needs one housekeeper. If they share the work equally, how many housekeepers need to clean more rooms than the others?",["Divide the 35 rooms among 4 housekeepers: <span class='eq'>35 ÷ 4 = 8 remainder 3</span>","Each cleans 8 rooms, and 3 rooms are left over.","Those 3 extra rooms go to 3 different housekeepers, so 3 of them clean 9 rooms while 1 cleans 8."],"3 housekeepers","Check: 3 × 9 + 1 × 8 = 27 + 8 = 35 ✓"],
["3","If each standard room can fit 2 guests, what is the maximum number of guests all the standard rooms can accommodate?",["Total standard rooms from Question 1 = 210.","Multiply: <span class='eq'>210 × 2 = 420</span>"],"420 guests","Check: 200 × 2 = 400 and 10 × 2 = 20, so 400 + 20 = 420 ✓"],
["4","There are 18 suites altogether in the hotel. How many suites are on each floor if each floor has the same floorplan?",["Suites are on the 6 guest floors.","Divide: <span class='eq'>18 ÷ 6 = 3</span>"],"3 suites on each floor","This is a division problem (sharing equally), not multiplication. Check: 3 × 6 = 18 ✓"],
["5","Each suite has 3 beds and there is a bedside table beside each side of each bed. How many bedside tables are there in all the suites?",["Each bed has 2 sides, so 2 tables per bed.","Per suite: <span class='eq'>3 × 2 = 6</span> tables","All 18 suites: <span class='eq'>18 × 6 = 108</span>"],"108 bedside tables","Check: 18 suites × 3 beds = 54 beds, and 54 × 2 = 108 ✓"],
["6","Write an equation using “x” and solve it. A standard room costs $250 per night. A couple stayed x nights and the total charge is $750.",["Cost per night × number of nights = total.","Equation: <span class='eq'>250 × x = 750</span>","Solve: <span class='eq'>x = 750 ÷ 250 = 3</span>"],"x = 3 nights","Check: 250 × 3 = 750 ✓"]]},
{t:"🖨️ Printing",intro:"A printing company has <b>6 printing machines</b>.",qs:[
["1","Each printing machine costs $4,500. How much did the company pay for the machines?",["Multiply: <span class='eq'>6 × 4,500 = 27,000</span>"],"$27,000","Check: 6 × 4,000 = 24,000 and 6 × 500 = 3,000, so 27,000 ✓"],
["2","All 6 machines together print 222 pages in a minute. How many pages can each machine print per hour?",["One machine per minute: <span class='eq'>222 ÷ 6 = 37</span> pages","There are 60 minutes in an hour: <span class='eq'>37 × 60 = 2,220</span>"],"2,220 pages per hour","Check: 37 × 6 = 222 ✓ and 37 × 60 = 2,220 ✓"],
["3","A new order has 3,800 pages but one machine is out of order. How many pages does each working machine print if they print the same number?",["Working machines: <span class='eq'>6 − 1 = 5</span>","Divide: <span class='eq'>3,800 ÷ 5 = 760</span>"],"760 pages each","Check: 760 × 5 = 3,800 ✓"],
["4","There are 3 teams of maintenance staff. Each team takes 8-hour shifts and has 4 members. How many maintenance staff are there?",["The 8-hour shift is extra information; it does not change the number of people.","Multiply: <span class='eq'>3 × 4 = 12</span>"],"12 maintenance staff",""],
["5","There are 5 salespersons and 22 clients. Each client deals with one salesperson, and clients are divided as equally as possible. How many salespersons are responsible for 5 clients?",["Divide: <span class='eq'>22 ÷ 5 = 4 remainder 2</span>","Everyone gets 4 clients, and 2 clients are left over.","Those 2 extra clients go to 2 different salespersons, so 2 salespersons have 5 clients and 3 have 4."],"2 salespersons","Check: 2 × 5 + 3 × 4 = 10 + 12 = 22 ✓"],
["6","Write an equation using “x” and solve it. Three orders are done today. Each order involves printing x pages. Total: 9,900 pages.",["Orders × pages per order = total.","Equation: <span class='eq'>3 × x = 9,900</span>","Solve: <span class='eq'>x = 9,900 ÷ 3 = 3,300</span>"],"x = 3,300 pages","Check: 3 × 3,300 = 9,900 ✓"]]},
{t:"🚗 Car Factory",intro:"A car factory has <b>8 assembly lines</b>. Each line makes cars at the same speed.",qs:[
["1","There are 2 supervisors and 12 workers on each assembly line. How many workers are there in total?",["Supervisors are listed separately from workers (Question 5 pays them differently).","Workers: <span class='eq'>12 × 8 = 96</span>"],"96 workers","Extra: including the 16 supervisors (2 × 8), there are 112 people altogether."],
["2","If the factory produces 48 cars in a day, how many cars does each assembly line make each day?",["Divide: <span class='eq'>48 ÷ 8 = 6</span>"],"6 cars per line per day","Check: 6 × 8 = 48 ✓"],
["3","If all the assembly lines operate 12 hours a day, how long does it take one assembly line to produce one car?",["One line makes 6 cars in 12 hours.","Divide: <span class='eq'>12 ÷ 6 = 2</span>"],"2 hours per car","Check: 2 hours × 6 cars = 12 hours ✓"],
["4","The factory pays each supervisor $30 per hour and each worker $80 per day. How much does each supervisor get paid each day?",["The factory runs 12 hours a day (Question 3).","Multiply: <span class='eq'>30 × 12 = 360</span>"],"$360 per day","Check: 30 × 10 = 300 and 30 × 2 = 60, so 360 ✓"],
["5","What is the total daily salary of all the workers?",["Number of workers = 96 (Question 1). Each earns $80 a day.","Multiply: <span class='eq'>96 × 80 = 7,680</span>"],"$7,680 per day","Check: 100 × 80 = 8,000, minus 4 × 80 = 320, gives 7,680 ✓"],
["6","Write an equation using “x” and solve it. The factory received an order for x cars, and the order is done in 18 days.",["The factory makes 48 cars a day.","Equation: <span class='eq'>48 × 18 = x</span> (or x ÷ 48 = 18)","Solve: <span class='eq'>48 × 18 = 864</span>"],"x = 864 cars","Check: 864 ÷ 48 = 18 ✓"]]},
{t:"🏫 School",intro:"In a school there are <b>12 classes</b> and <b>30 teachers</b>.",qs:[
["1","In each class there are 35 students. How many students are there in total?",["Multiply: <span class='eq'>12 × 35 = 420</span>"],"420 students","Check: 10 × 35 = 350 and 2 × 35 = 70, so 420 ✓"],
["2","If the students are divided equally among the teachers, how many students is each teacher responsible for?",["Divide: <span class='eq'>420 ÷ 30 = 14</span>"],"14 students per teacher","Check: 14 × 30 = 420 ✓"],
["3","Most teachers are assigned to a homeroom. The teachers are divided among the classes so each class has an equal number of homeroom teachers. How many homeroom teachers are assigned to each class?",["Divide: <span class='eq'>30 ÷ 12 = 2 remainder 6</span>","Each class gets 2 homeroom teachers (12 × 2 = 24 teachers used)."],"2 homeroom teachers per class",""],
["4","How many teachers are not assigned a homeroom?",["Teachers left over from Question 3: <span class='eq'>30 − 24 = 6</span>"],"6 teachers","Same as the remainder in Question 3."],
["5","On Friday, 5 classes went on a field trip. How many students are left at the school?",["Students on the trip: <span class='eq'>5 × 35 = 175</span>","Students left: <span class='eq'>420 − 175 = 245</span> (or 7 classes × 35 = 245)"],"245 students","Check: 7 × 35 = 245 ✓"],
["6","Write an equation using “x” and solve it. One teacher is needed for every 25 students on a field trip. So x teachers went with the 5 classes.",["Students on the trip = 175.","Equation: <span class='eq'>x × 25 = 175</span> (or 175 ÷ 25 = x)","Solve: <span class='eq'>x = 175 ÷ 25 = 7</span>"],"x = 7 teachers","Check: 7 × 25 = 175 ✓"]]}
];
const tabs=document.getElementById('tabs'),main=document.getElementById('main');
sheets.forEach((s,i)=>{
 const b=document.createElement('button');b.textContent=s.t;b.onclick=()=>show(i);tabs.appendChild(b);
 const sec=document.createElement('section');
 sec.innerHTML='<div class="intro">'+s.intro+'</div>'+s.qs.map(q=>
  '<div class="q"><h3>Question '+q[0]+'</h3><p class="text">'+q[1]+'</p><ol class="steps">'+q[2].map(x=>'<li>'+x+'</li>').join('')+'</ol><div class="ans">Answer: '+q[3]+'</div>'+(q[4]?'<div class="note">'+q[4]+'</div>':'')+'</div>').join('');
 main.appendChild(sec);
});
function show(i){[...tabs.children].forEach((b,j)=>b.classList.toggle('on',i===j));[...main.children].forEach((s,j)=>s.classList.toggle('on',i===j));window.scrollTo(0,0)}
show(0);
</script>
</body>
</html>
