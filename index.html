<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grade 4 Reading Comprehension Quiz</title>
<style>
  :root{
    --bg:#f4f7fb; --card:#ffffff; --ink:#1f2a44; --muted:#5f6b85;
    --brand:#3b6ef5; --brand-d:#2a54c9; --ok:#1e9e5a; --ok-bg:#e6f7ee;
    --bad:#d6453d; --bad-bg:#fdecea; --line:#dfe6f2; --accent:#ffb703;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
  .wrap{max-width:1050px;margin:0 auto;padding:18px 16px 60px}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  header.top h1{font-size:1.25rem;margin:0}
  .pill{background:#e8eefc;color:var(--brand-d);padding:5px 12px;border-radius:999px;font-weight:600;font-size:.85rem;white-space:nowrap}
  .bar{height:10px;background:#e3e9f5;border-radius:999px;overflow:hidden;margin-bottom:18px}
  .bar>div{height:100%;background:linear-gradient(90deg,var(--brand),#7aa2ff);width:0;transition:width .3s}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 2px 10px rgba(31,42,68,.05)}
  .grid{display:grid;grid-template-columns:1.05fr 1fr;gap:18px;align-items:start}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
  .passage{position:sticky;top:12px}
  @media(max-width:820px){.passage{position:static}}
  .passage .tag{display:inline-block;background:#fff4d6;color:#8a5a00;font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:999px;letter-spacing:.04em;text-transform:uppercase}
  .passage h2{margin:10px 0 10px;font-size:1.3rem}
  .passage p{margin:0 0 10px;font-size:1.05rem}
  .qnum{color:var(--muted);font-size:.85rem;font-weight:600;margin-bottom:6px}
  .qtext{font-size:1.15rem;font-weight:700;margin:0 0 16px}
  .opts{display:grid;gap:10px}
  .opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:13px 14px;font-size:1rem;font-family:inherit;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:12px;cursor:pointer;transition:border-color .15s,background .15s}
  .opt:hover:not(:disabled){border-color:var(--brand);background:#f3f7ff}
  .opt .l{flex:0 0 28px;height:28px;border-radius:50%;background:#e8eefc;color:var(--brand-d);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem}
  .opt.correct{border-color:var(--ok);background:var(--ok-bg)}
  .opt.correct .l{background:var(--ok);color:#fff}
  .opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
  .opt.wrong .l{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default}
  .fb{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:.98rem;display:none}
  .fb.show{display:block}
  .fb.ok{background:var(--ok-bg);border:1px solid #bfe8d1}
  .fb.no{background:var(--bad-bg);border:1px solid #f4c6c2}
  .btn{display:inline-block;background:var(--brand);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-size:1rem;font-weight:700;font-family:inherit;cursor:pointer}
  .btn:hover{background:var(--brand-d)}
  .btn.ghost{background:#e8eefc;color:var(--brand-d)}
  .btn.ghost:hover{background:#d9e4fb}
  .actions{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
  .center{text-align:center}
  .hero{padding:34px 22px}
  .hero h2{font-size:1.8rem;margin:0 0 8px}
  .hero p{color:var(--muted);max-width:560px;margin:8px auto}
  .stats{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:18px 0}
  .stat{background:#f1f5fd;border-radius:12px;padding:10px 18px;font-weight:700}
  .stat small{display:block;font-weight:500;color:var(--muted)}
  .score{font-size:3rem;font-weight:800;color:var(--brand)}
  .rows{margin:16px 0;text-align:left;display:grid;gap:8px}
  .row{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;background:#f6f8fd;border-radius:10px}
  .row b.g{color:var(--ok)} .row b.m{color:#c98200} .row b.r{color:var(--bad)}
  .review{text-align:left;margin-top:12px}
  .rv{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:#fff}
  .rv .q{font-weight:700;margin-bottom:6px}
  .rv .y{color:var(--bad)} .rv .c{color:var(--ok);font-weight:600}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>📖 Grade 4 Reading Comprehension</h1>
    <span class="pill" id="counter">Ready</span>
  </header>
  <div class="bar"><div id="bar"></div></div>
  <main id="app"></main>
</div>

<script>
/* Each question: q = question, a = array of options, c = index of the correct option in `a`, e = explanation.
   Options are shuffled every time the quiz is played, so the right answer never sits in a predictable spot. */
const PASSAGES = [
{

   "The angle of the dance shows the other bees which direction to fly. A longer shake means the flowers are farther away. Within minutes, many bees follow the directions and zoom off to collect sweet nectar. Scientists spent many years watching bees before they understood the dance. Today, they know that this tiny insect uses movement almost like a map."

  qs:[
   {q:"What is this passage mostly about?",

   {q:"What does a bee do right after it finds a field of flowers?",
    a:["It flies back to the hive","It performs a dance in the field","It collects nectar from every flower","It waits for the scientists to arrive"],c:0,

{

{
  title:"A Letter to the Mayor", tag:"Opinion letter",
  text:[
   "Dear Mayor Okoye,",

   "Sincerely, Tunde, Grade 4 student"
  ],
  qs:[
   {q:"Why did Tunde write this letter?",
    a:["To convince the mayor to build a community garden","To ask the mayor to clean the school building","To invite the mayor to visit his classroom","To tell the mayor about a new vegetable"],c:0,
    e:"Tunde gives reasons to persuade the mayor to turn the empty lot into a garden."},
   {q:"Which is NOT a reason Tunde gives for the garden?",
    a:["It would bring tourists to the town","It would give families fresh vegetables","It would help students learn about plants","It would make the lot look cleaner and safer"],c:0,
    e:"Tunde never mentions tourists. The other three are his reasons."},
   {q:"What worry does Tunde mention in his letter?",
    a:["That a garden might cost too much","That weeds will grow back too fast","That students will not enjoy gardening","That the lot is too small for plants"],c:0,
    e:"“Some people worry that a garden costs too much.”"},
   {q:"How does Tunde answer that worry?",
    a:["He says seeds are cheap and parents will give tools","He says the school and the town will pay for everything","He says the mayor can sell the vegetables","He says a garden does not need any care"],c:0,
    e:"He explains that seeds are cheap and parents have offered to donate tools."},
   {q:"In the letter, the word “donate” means:",
    a:["give for free to help","sell at a low price","borrow for a short time","keep safe for later"],c:0,
    e:"To donate tools is to give them freely to help the project."}
  ]
},
{
  title:"Ships of the Desert", tag:"Informational",
  text:[
   "Camels are known as “ships of the desert” because they can travel long distances across hot sand. Their bodies are built for dry places. A camel's hump does not store water, as many people think. It stores fat, which the camel can use for energy when food is hard to find.",
   "Camels also have long eyelashes, and they can close their nostrils to keep out blowing sand. Their wide, flat feet spread out so they do not sink into soft ground. A thirsty camel can drink more than 100 litres of water in just a few minutes. This helps it survive many days of travel with little to drink."

  qs:[
   {q:"According to the passage, what does a camel's hump store?",

const LETTERS=["A","B","C","D"];
const total=PASSAGES.reduce((n,p)=>n+p.qs.length,0);
const app=document.getElementById("app");
const bar=document.getElementById("bar");
const counter=document.getElementById("counter");
let flat=[], idx=0, answers=[];

function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function build(){
  flat=[];
  PASSAGES.forEach((p,pi)=>p.qs.forEach((q,qi)=>{
    const opts=shuffle(q.a.map((t,i)=>({t,ok:i===q.c})));
    flat.push({pi,qi,q:q.q,e:q.e,opts});
  }));
  answers=new Array(flat.length).fill(null);
}

function start(){
  build(); idx=0; render();
}

function home(){
  bar.style.width="0"; counter.textContent="Ready";
  app.innerHTML=`<div class="card hero center">
    <div style="font-size:3rem">📚</div>
    <h2>Grade 4 Reading Comprehension</h2>
    <p>Read each passage carefully, then answer the questions about it. You can look back at the passage as many times as you like.</p>
    <div class="stats">
      <div class="stat">${PASSAGES.length}<small>passages</small></div>
      <div class="stat">${total}<small>questions</small></div>
      <div class="stat">4<small>choices each</small></div>
    </div>
    <p>Tip: some answers are not stated directly. Think about what the author means, and use clues from the passage.</p>
    <div class="actions" style="justify-content:center"><button class="btn" id="go">Start the quiz</button></div>
  </div>`;
  document.getElementById("go").onclick=start;
}

function render(){
  const f=flat[idx], p=PASSAGES[f.pi];
  bar.style.width=(idx/flat.length*100)+"%";
  counter.textContent=`Question ${idx+1} of ${flat.length}`;
  const paras=p.text.map(t=>`<p>${esc(t)}</p>`).join("");
  app.innerHTML=`<div class="grid">
    <section class="card passage">
      <span class="tag">Passage ${f.pi+1} of ${PASSAGES.length} · ${esc(p.tag)}</span>
      <h2>${esc(p.title)}</h2>${paras}
    </section>
    <section class="card">
      <div class="qnum">Question ${f.qi+1} of ${p.qs.length} for this passage</div>
      <p class="qtext">${esc(f.q)}</p>
      <div class="opts">${f.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="l">${LETTERS[i]}</span><span>${esc(o.t)}</span></button>`).join("")}</div>
      <div class="fb" id="fb"></div>
      <div class="actions"><button class="btn hidden" id="next">${idx===flat.length-1?"See my results":"Next question"}</button></div>
    </section>
  </div>`;
  const btns=[...app.querySelectorAll(".opt")];
  btns.forEach(b=>b.onclick=()=>choose(+b.dataset.i,btns));
  document.getElementById("next").onclick=()=>{ if(idx===flat.length-1){results();} else {idx++;render();window.scrollTo({top:0,behavior:"smooth"});} };
}

function choose(i,btns){
  const f=flat[idx], ok=f.opts[i].ok;
  answers[idx]=i;
  btns.forEach((b,k)=>{b.disabled=true; if(f.opts[k].ok)b.classList.add("correct");});
  if(!ok)btns[i].classList.add("wrong");
  const fb=document.getElementById("fb");
  fb.className="fb show "+(ok?"ok":"no");
  fb.innerHTML=(ok?"<b>Correct!</b> ":"<b>Not quite.</b> ")+esc(f.e);
  document.getElementById("next").classList.remove("hidden");
}

function results(){
  bar.style.width="100%"; counter.textContent="Finished";
  let score=0; const per=PASSAGES.map(()=>({s:0,n:0}));
  flat.forEach((f,k)=>{const ok=f.opts[answers[k]].ok; per[f.pi].n++; if(ok){score++;per[f.pi].s++;}});
  const pct=Math.round(score/flat.length*100);
  const msg=pct>=90?"Outstanding reading!":pct>=70?"Great job!":pct>=50?"Good effort. Keep practising!":"Keep going. Re-read the passages and try again.";
  const rows=PASSAGES.map((p,i)=>{const r=per[i],pp=r.s/r.n;const cl=pp>=.8?"g":pp>=.5?"m":"r";return `<div class="row"><span>${i+1}. ${esc(p.title)}</span><b class="${cl}">${r.s}/${r.n}</b></div>`;}).join("");
  const wrong=flat.map((f,k)=>({f,k})).filter(x=>!x.f.opts[answers[x.k]].ok);
  const rev=wrong.length?`<h3>Review your mistakes</h3><div class="review">${wrong.map(({f,k})=>`<div class="rv"><div class="q">${esc(PASSAGES[f.pi].title)}: ${esc(f.q)}</div><div class="y">Your answer: ${esc(f.opts[answers[k]].t)}</div><div class="c">Correct answer: ${esc(f.opts.find(o=>o.ok).t)}</div><div>${esc(f.e)}</div></div>`).join("")}</div>`:"<p><b>Perfect score. You got every question right!</b></p>";
  app.innerHTML=`<div class="card center">
    <div class="score">${score} / ${flat.length}</div>
    <h2 style="margin:4px 0">${pct}%: ${msg}</h2>
    <div class="rows">${rows}</div>
    ${rev}
    <div class="actions" style="justify-content:center"><button class="btn" id="again">Try again</button></div>
  </div>`;
  document.getElementById("again").onclick=start;
  window.scrollTo({top:0,behavior:"smooth"});
}
home();
</script>
</body>
</html>
