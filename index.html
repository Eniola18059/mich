<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maths Jungle Adventure</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:'Fredoka','Trebuchet MS','Comic Sans MS',system-ui,sans-serif;background:linear-gradient(180deg,#7fd8ff 0%,#c8f0ff 55%,#b6f08a 55%,#78d65c 100%);background-attachment:fixed;color:#3b2a6b;overflow-x:hidden}
.cloud{position:fixed;font-size:64px;opacity:.9;animation:drift 40s linear infinite;pointer-events:none;z-index:0}
.cloud:nth-child(1){top:6%;left:-10%}
.cloud:nth-child(2){top:18%;left:-30%;animation-duration:55s;font-size:48px}
@keyframes drift{to{transform:translateX(140vw)}}
#app{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:14px 14px 40px}
.screen{display:none}.screen.active{display:block;animation:pop .45s ease}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.card{background:#fff;border-radius:32px;border:5px solid #ffd23f;box-shadow:0 10px 0 #f4a300,0 18px 30px rgba(0,0,0,.18);padding:22px;text-align:center}
h1{font-size:clamp(34px,8vw,56px);margin:6px 0;color:#ff4f9a;text-shadow:3px 3px 0 #ffe0f0;line-height:1.05}
h2{margin:6px 0;color:#7a3cff}
.mascot{font-size:96px;display:inline-block;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px) rotate(4deg)}}
.big-btn{font-family:inherit;font-weight:700;font-size:28px;border:none;border-radius:999px;padding:16px 40px;margin-top:14px;color:#fff;background:linear-gradient(#ff7a3d,#ff4f2b);box-shadow:0 8px 0 #c9381a;cursor:pointer;transition:transform .1s}
.big-btn:active{transform:translateY(6px);box-shadow:0 2px 0 #c9381a}
.big-btn.green{background:linear-gradient(#4cd964,#22b341);box-shadow:0 8px 0 #167a2c}
.big-btn.green:active{box-shadow:0 2px 0 #167a2c}
.hud{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.pill{background:#fff;border-radius:999px;padding:6px 14px;font-weight:700;border:4px solid #ffd23f;white-space:nowrap}
.track{flex:1;height:26px;background:#fff;border-radius:999px;border:4px solid #7a3cff;overflow:hidden;position:relative}
.fill{height:100%;width:0;background:repeating-linear-gradient(45deg,#ff4f9a,#ff4f9a 12px,#ff86bd 12px,#ff86bd 24px);transition:width .5s;border-radius:999px}
.icon-btn{font-size:24px;background:#fff;border:4px solid #ffd23f;border-radius:50%;width:46px;height:46px;cursor:pointer;font-family:inherit}
.world{display:inline-block;background:#7a3cff;color:#fff;padding:4px 16px;border-radius:999px;font-weight:700;font-size:16px;margin-bottom:8px}
.qtext{font-size:clamp(24px,5.5vw,34px);font-weight:700;margin:8px 0}
.visual{font-size:clamp(34px,8vw,52px);letter-spacing:2px;line-height:1.3;min-height:60px;background:#fff8dc;border-radius:22px;padding:10px;margin:10px 0 16px;word-break:break-all}
.visual.small{font-size:clamp(28px,6vw,40px)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{font-family:inherit;font-weight:700;font-size:clamp(24px,6vw,34px);padding:18px 8px;border:none;border-radius:24px;color:#fff;cursor:pointer;box-shadow:0 8px 0 rgba(0,0,0,.25);transition:transform .1s}
.opt:nth-child(1){background:#ff5c8a}.opt:nth-child(2){background:#3db4ff}.opt:nth-child(3){background:#ffa31a}.opt:nth-child(4){background:#8a5cff}
.opt:active{transform:translateY(6px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.opt.right{background:#22c55e!important;animation:jump .6s}
.opt.wrong{background:#9ca3af!important;animation:shake .45s}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@keyframes jump{40%{transform:scale(1.12) rotate(-3deg)}}
.bubble{background:#fff;border:4px solid #7a3cff;border-radius:22px;padding:10px 16px;font-weight:600;font-size:20px;margin:14px auto 0;max-width:520px;min-height:48px;position:relative}
.helper{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px}
.helper .m{font-size:56px}
.stars-row{font-size:34px;margin:8px 0}
.badges{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.badge{font-size:36px;background:#fff8dc;border:3px solid #ffd23f;border-radius:16px;padding:4px 8px}
.badge.locked{filter:grayscale(1);opacity:.35}
.score-big{font-size:64px;font-weight:700;color:#ff4f9a}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.small-note{font-size:15px;opacity:.7;margin-top:12px}
@media(max-width:420px){.opts{gap:10px}.card{padding:14px}}
</style>
</head>
<body>
<div class="cloud">☁️</div><div class="cloud">☁️</div>
<canvas id="confetti"></canvas>
<div id="app">

<!-- START -->
<div id="start" class="screen active">
  <div class="card">
    <div class="mascot">🦁</div>
    <h1>Maths Jungle<br>Adventure!</h1>
    <p style="font-size:22px;font-weight:600">Help Leo the Lion cross 10 jungle worlds!<br>Answer the questions, win ⭐ stars and collect all the badges!</p>
    <div class="badges" id="startBadges"></div>
    <button class="big-btn" id="playBtn">▶ Let's Play!</button>
    <div class="small-note" id="bestNote"></div>
  </div>
</div>

<!-- QUIZ -->
<div id="quiz" class="screen">
  <div class="hud">
    <div class="pill">⭐ <span id="starCount">0</span></div>
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="pill" id="qNum">1/50</div>
    <button class="icon-btn" id="muteBtn" title="Sound">🔊</button>
  </div>
  <div class="card">
    <div class="world" id="worldName"></div>
    <div class="qtext" id="qText"></div>
    <div class="visual" id="visual"></div>
    <button class="icon-btn" id="readBtn" title="Read to me" style="margin-bottom:10px">🗣️</button>
    <div class="opts" id="opts"></div>
    <div class="helper"><div class="m" id="mascotSmall">🦁</div><div class="bubble" id="bubble">Pick the right answer!</div></div>
    <button class="big-btn green" id="nextBtn" style="display:none">Next ➜</button>
  </div>
</div>

<!-- WORLD DONE -->
<div id="worldDone" class="screen">
  <div class="card">
    <div class="mascot">🎉</div>
    <h1 id="wdTitle">World complete!</h1>
    <div class="badges"><div class="badge" id="wdBadge" style="font-size:80px"></div></div>
    <div class="stars-row" id="wdStars"></div>
    <p style="font-size:22px;font-weight:600" id="wdMsg"></p>
    <button class="big-btn green" id="wdNext">Next World ➜</button>
  </div>
</div>

<!-- END -->
<div id="end" class="screen">
  <div class="card">
    <div class="mascot">🏆</div>
    <h1>You did it!</h1>
    <div class="score-big"><span id="finalStars">0</span> / 50 ⭐</div>
    <h2 id="rank"></h2>
    <div class="badges" id="endBadges"></div>
    <p style="font-size:20px;font-weight:600" id="endMsg"></p>
    <button class="big-btn" id="againBtn">🔄 Play Again</button>
  </div>
</div>

</div>

<script>
const R=(e,n)=>e.repeat(n);
const WORLDS=[
 {name:"Counting Cove",badge:"🐢"},{name:"Compare Canyon",badge:"🦜"},{name:"Number Bond Bridge",badge:"🐒"},
 {name:"Add-It-Up Hills",badge:"🐘"},{name:"Take-Away Trail",badge:"🦒"},{name:"Position Peak",badge:"🦓"},
 {name:"Teen Number Treetops",badge:"🐯"},{name:"Big Sum Swamp",badge:"🐊"},{name:"Shape & Length Land",badge:"🦋"},
 {name:"Tens, Time & Graphs",badge:"👑"}
];
// [question, visual, answer, [3 wrong], hint, smallVisual?]
const Q=[
// World 1 - counting to 10
["How many apples are there?",R("🍎",6),"6",["4","5","7"],"Touch each apple and count: 1, 2, 3..."],
["How many fish can you count?",R("🐟",8),"8",["6","7","9"],"Count slowly, one fish at a time!"],
["How many stars are shining?",R("⭐",9),"9",["7","8","10"],"Count in rows to keep track!"],
["What number comes right after 7?","7 ➜ ❓","8",["6","9","10"],"After 7 we say 8!"],
["What number comes right before 5?","❓ ➜ 5","4",["3","6","2"],"Count up: 1, 2, 3, 4, 5. Which one is just before 5?"],
// World 2 - compare
["Which number is greater?","7  or  4","7",["4","3","5"],"Greater means bigger. Which has more?"],
["Which number is smaller?","9  or  6","6",["9","8","10"],"Smaller means less."],
["Which group has more?",R("🍓",3)+"   vs   "+R("🍓",5),"The second group",["The first group","They are the same","Neither"],"Count each group, then compare.",true],
["Which is the biggest number?","2    8    5","8",["2","5","3"],"Find the number that is furthest along when you count."],
["Which number is between 3 and 5?","3  ❓  5","4",["2","6","1"],"Count: 3, ❓, 5"],
// World 3 - number bonds
["3 and what make 5?",R("🟢",3)+R("⚪",2),"2",["1","3","4"],"Count how many more you need to get to 5."],
["4 and 4 make...?",R("🔵",4)+R("🔵",4),"8",["6","7","9"],"Count all the blue dots together."],
["6 and what make 10?",R("🟡",6)+R("⚪",4),"4",["3","5","6"],"How many more to reach 10?"],
["7 is made of 5 and ...?","7 = 5 + ❓","2",["1","3","12"],"5, 6, 7 — how many steps?"],
["10 is made of 3 and ...?","10 = 3 + ❓","7",["6","8","13"],"Count on from 3 to 10."],
// World 4 - addition
["3 + 2 = ?",R("🐥",3)+" ➕ "+R("🐥",2),"5",["4","6","7"],"Count all the chicks together."],
["4 + 5 = ?",R("🍪",4)+" ➕ "+R("🍪",5),"9",["8","10","7"],"Start at 5 and count on 4 more!"],
["6 + 2 = ?",R("🚗",6)+" ➕ "+R("🚗",2),"8",["7","9","4"],"Start at 6, count on 2."],
["5 + 5 = ?",R("✋",1)+" ➕ "+R("✋",1),"10",["5","9","15"],"Two hands, 5 fingers each!"],
["3 + 4 = ?",R("🌸",3)+" ➕ "+R("🌸",4),"7",["6","8","12"],"Count all the flowers."],
// World 5 - subtraction
["5 − 2 = ?",R("🎈",5)+"  pop 2! 💥","3",["2","4","7"],"Take away 2 balloons. How many are left?"],
["8 − 3 = ?",R("🍩",8)+"  eat 3!","5",["4","6","11"],"Count back 3 from 8."],
["9 − 6 = ?",R("🍌",9)+"  eat 6!","3",["2","4","15"],"9 minus 6 — what is left?"],
["10 − 4 = ?",R("⚽",10)+"  lose 4!","6",["5","7","14"],"Count back from 10."],
["7 − 7 = ?",R("🐞",7)+"  all fly away!","0",["1","7","14"],"If all of them go, how many are left?"],
// World 6 - ordinal
["Which animal is 3rd from the left?","🐱🐶🐰🐸🐵","🐰",["🐶","🐸","🐱"],"1st 🐱, 2nd 🐶, 3rd ...?"],
["Which animal is 5th?","🐱🐶🐰🐸🐵","🐵",["🐸","🐰","🐱"],"Count to the 5th one."],
["Which is 4th from the left?","🚗🚌🚲🚀✈️","🚀",["🚲","✈️","🚌"],"Count: 1st, 2nd, 3rd, 4th."],
["Which animal is LAST?","🐱🐶🐰🐸🐵","🐵",["🐱","🐰","🐶"],"Last means at the very end."],
["What comes just after 2nd?","1st → 2nd → ❓","3rd",["1st","4th","5th"],"1st, 2nd, ..."],
// World 7 - numbers to 20
["10 and 4 make...?","🔟 ➕ 4","14",["13","15","104"],"Ten and four ones — say it: fourteen!"],
["What number comes after 19?","19 ➜ ❓","20",["18","21","10"],"After 19 comes twenty!"],
["Which number is greater?","12  or  18","18",["12","11","10"],"Count up: 12 comes before 18."],
["15 is 1 ten and how many ones?","15 = 10 + ❓","5",["1","10","15"],"What is left after the ten?"],
["What number is 1 ten and 8 ones?","🔟 + 8","18",["81","19","17"],"10 and 8 make..."],
// World 8 - add/sub within 20
["10 + 6 = ?","10 ➕ 6","16",["15","17","60"],"Ten and six ones."],
["8 + 7 = ?","8 ➕ 7","15",["14","16","13"],"Make 10 first: 8 + 2 = 10, then 5 more."],
["9 + 5 = ?","9 ➕ 5","14",["13","15","12"],"9 + 1 = 10, then add 4 more."],
["17 − 3 = ?","17 ➖ 3","14",["13","15","20"],"Count back 3 from 17."],
["13 − 4 = ?","13 ➖ 4","9",["8","10","17"],"13 − 3 = 10, then 1 more."],
// World 9 - shapes & length
["Which shape is round like a coin?","🪙","Circle",["Square","Triangle","Rectangle"],"No corners, perfectly round!"],
["How many sides does a triangle have?","🔺","3",["2","4","5"],"Trace around it with your finger."],
["How many sides does a square have?","🟦","4",["3","5","6"],"A square has 4 equal sides."],
["Which is longer?","🚌   or   🚗","The bus",["The car","They are the same","I don't know"],"Look at which one stretches further."],
["Which is shorter?","🌳   or   🌷","The flower",["The tree","They are the same","Neither"],"Shorter means not as tall."],
// World 10 - tens and ones, time, graph
["How many tens and ones are in 23?","23","2 tens 3 ones",["3 tens 2 ones","2 tens 2 ones","1 ten 3 ones"],"The first digit is tens, the second is ones."],
["What number is 3 tens and 5 ones?","🔟🔟🔟 + 5","35",["53","8","30"],"Three tens = 30, then 5 more."],
["What number comes after 29?","29 ➜ ❓","30",["28","20","39"],"After 29 comes thirty!"],
["Which fruit has the MOST?","🍎🍎🍎🍎\n🍌🍌\n🍇🍇🍇","🍎",["🍌","🍇","They are all the same"],"Count each row. Which row is longest?"],
["The short hand points to 3 and the long hand points to 12. What time is it?","🕒","3 o'clock",["12 o'clock","6 o'clock","3:30"],"Short hand tells the hour."]
];

const $=id=>document.getElementById(id);
let idx=0,stars=0,tries=0,locked=false,worldStars=0,perWorld=[],muted=false;
const PRAISE=["Super job! 🌟","Wow, you're a maths star! 🤩","Roar-some! 🦁","Brilliant! 🎉","You got it! 🙌","Fantastic! 🚀","Amazing! 🏅"];
const OOPS=["Oops! Try again, you can do it! 💪","Almost! Have another go! 🌈","Not quite — think again! 🤔"];

// ---------- sound ----------
let ac;
function tone(f,d,type='sine',delay=0,vol=.18){
  if(muted)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.value=f;o.connect(g);g.connect(ac.destination);
    const t=ac.currentTime+delay;
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.start(t);o.stop(t+d);
  }catch(e){}
}
const sfx={
  right(){[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',i*.09))},
  wrong(){tone(220,.3,'sawtooth',0,.1);tone(180,.35,'sawtooth',.15,.1)},
  win(){[523,659,784,659,784,1047,1319].forEach((f,i)=>tone(f,.3,'triangle',i*.12))},
  click(){tone(660,.08,'square',0,.08)}
};

// ---------- confetti ----------
const cv=$('confetti'),cx=cv.getContext('2d');let parts=[],anim=false;
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener('resize',size);
function boom(n=120){
  const cols=['#ff4f9a','#ffd23f','#3db4ff','#22c55e','#8a5cff','#ff7a3d'];
  for(let i=0;i<n;i++)parts.push({x:innerWidth/2,y:innerHeight*.4,vx:(Math.random()-.5)*16,vy:Math.random()*-14-3,s:Math.random()*10+5,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.4,life:100+Math.random()*50});
  if(!anim){anim=true;loop()}
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.r+=p.vr;p.life--;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore()});
  parts=parts.filter(p=>p.life>0&&p.y<cv.height+20);
  if(parts.length)requestAnimationFrame(loop);else{anim=false;cx.clearRect(0,0,cv.width,cv.height)}
}

// ---------- speech ----------
function speak(t){
  if(muted||!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[➕➖➜❓🔟]/g,m=>({'➕':' plus ','➖':' minus ','➜':' then ','❓':' what ','🔟':' ten '}[m])));u.rate=.85;u.pitch=1.2;speechSynthesis.speak(u)}catch(e){}
}

// ---------- helpers ----------
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');scrollTo(0,0)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function renderBadges(el,done){
  el.innerHTML=WORLDS.map((w,i)=>`<div class="badge ${i<done?'':'locked'}" title="${w.name}">${w.badge}</div>`).join('');
}
function best(){try{return +localStorage.getItem('g1maths_best')||0}catch(e){return 0}}
function saveBest(v){try{if(v>best())localStorage.setItem('g1maths_best',v)}catch(e){}}

// ---------- game ----------
function start(){
  idx=0;stars=0;perWorld=[];$('starCount').textContent=0;
  loadQ();show('quiz');
}
function loadQ(){
  const q=Q[idx],w=Math.floor(idx/5);
  tries=0;locked=false;
  $('worldName').textContent=`World ${w+1}: ${WORLDS[w].name}`;
  $('qText').textContent=q[0];
  const v=$('visual');v.innerHTML=q[1].replace(/\n/g,'<br>');
  v.classList.toggle('small',q[1].length>24);
  $('qNum').textContent=`${idx+1}/50`;
  $('fill').style.width=(idx/50*100)+'%';
  $('mascotSmall').textContent=WORLDS[w].badge;
  $('bubble').textContent="Pick the right answer!";
  $('nextBtn').style.display='none';
  const box=$('opts');box.innerHTML='';
  shuffle([q[2],...q[3]]).forEach(o=>{
    const b=document.createElement('button');b.className='opt';b.textContent=o;
    b.onclick=()=>choose(b,o);box.appendChild(b);
  });
  setTimeout(()=>speak(q[0]),300);
}
function choose(btn,val){
  if(locked)return;
  const q=Q[idx];sfx.click();
  if(val===q[2]){
    locked=true;btn.classList.add('right');
    let earned=tries===0?1:0;
    if(earned){stars++;worldStars++}
    $('starCount').textContent=stars;
    $('bubble').textContent=PRAISE[Math.floor(Math.random()*PRAISE.length)]+(earned?" +1 ⭐":"");
    sfx.right();boom(earned?90:40);
    document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
    $('nextBtn').style.display='inline-block';
    $('nextBtn').textContent=(idx%5===4)?'Finish World 🎉':'Next ➜';
  }else{
    tries++;btn.classList.add('wrong');btn.disabled=true;sfx.wrong();
    if(tries>=2){
      $('bubble').textContent="Hint: "+q[4];
    }else{
      $('bubble').textContent=OOPS[Math.floor(Math.random()*OOPS.length)];
    }
    if(tries>=3){
      locked=true;
      document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.textContent===q[2])b.classList.add('right')});
      $('bubble').textContent="The answer is "+q[2]+". You'll get the next one! 💛";
      $('nextBtn').style.display='inline-block';
      $('nextBtn').textContent=(idx%5===4)?'Finish World 🎉':'Next ➜';
    }
  }
}
function next(){
  sfx.click();
  if(idx%5===4){worldComplete();return}
  idx++;loadQ();
}
function worldComplete(){
  const w=Math.floor(idx/5);
  perWorld.push(worldStars);
  $('wdTitle').textContent=`${WORLDS[w].name} complete!`;
  $('wdBadge').textContent=WORLDS[w].badge;
  $('wdStars').textContent='⭐'.repeat(worldStars)+'☆'.repeat(5-worldStars);
  $('wdMsg').textContent=worldStars===5?"PERFECT! You earned the "+WORLDS[w].badge+" badge!":worldStars>=3?"Great work! You earned the "+WORLDS[w].badge+" badge!":"Nice try! You earned the "+WORLDS[w].badge+" badge. Keep going!";
  $('wdNext').textContent=w===9?'See my trophy 🏆':'Next World ➜';
  worldStars=0;
  sfx.win();boom(160);show('worldDone');
}
function afterWorld(){
  sfx.click();
  if(idx>=49){finish();return}
  idx++;loadQ();show('quiz');
}
function finish(){
  $('fill').style.width='100%';
  saveBest(stars);
  $('finalStars').textContent=stars;
  const r=stars>=45?"🌟 Maths Superstar!":stars>=35?"🦁 Jungle Champion!":stars>=25?"🐒 Clever Explorer!":"🐢 Brave Adventurer!";
  $('rank').textContent=r;
  renderBadges($('endBadges'),10);
  $('endMsg').textContent=stars>=45?"Incredible! Leo the Lion is so proud of you!":stars>=30?"Wonderful work! Play again to win even more stars!":"Great effort! Practise again and you'll collect more stars!";
  sfx.win();boom(220);setTimeout(()=>boom(140),700);
  show('end');
}

// ---------- wire up ----------
renderBadges($('startBadges'),0);
const b=best();$('bestNote').textContent=b?`Your best score: ${b} / 50 ⭐`:'';
$('playBtn').onclick=()=>{sfx.click();start()};
$('nextBtn').onclick=next;
$('wdNext').onclick=afterWorld;
$('againBtn').onclick=()=>{sfx.click();$('bestNote').textContent=`Your best score: ${best()} / 50 ⭐`;renderBadges($('startBadges'),0);show('start')};
$('muteBtn').onclick=()=>{muted=!muted;$('muteBtn').textContent=muted?'🔇':'🔊';if(muted&&'speechSynthesis' in window)speechSynthesis.cancel()};
$('readBtn').onclick=()=>{const was=muted;muted=false;speak(Q[idx][0]+'. '+Q[idx][1].replace(/[^\w\s+\-−]/g,' '));muted=was};
</script>
