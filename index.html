<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Greater Than / Less Than / Equal To Quiz</title>
<style>
:root{
  --bg:#f6f7fb; --card:#ffffff; --ink:#1f2430; --muted:#6b7280;
  --brand:#0891b2; --brand-ink:#ffffff; --good:#16a34a; --bad:#dc2626; --line:#e5e7eb;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#14161f;--card:#1d2030;--ink:#e9eaf2;--muted:#9aa0b4;--line:#2b2f42;}
}
:root[data-theme="dark"]{--bg:#14161f;--card:#1d2030;--ink:#e9eaf2;--muted:#9aa0b4;--line:#2b2f42;}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100%;}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 60px;}
h1{font-size:1.3rem;margin:8px 0 2px;}
.sub{color:var(--muted);font-size:.9rem;margin-bottom:16px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.progress{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:18px;}
.bar{height:100%;background:var(--brand);width:0%;transition:width .2s;}
.qnum{color:var(--brand);font-weight:700;font-size:.85rem;margin-bottom:4px;}
.numrow{display:flex;align-items:center;justify-content:center;gap:18px;font-size:2.2rem;font-weight:800;margin:22px 0 26px;}
.blank{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border:2px dashed var(--line);border-radius:12px;font-size:1.6rem;color:var(--muted);}
.opts{display:flex;gap:10px;justify-content:center;}
.opt{flex:1;text-align:center;padding:16px 0;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:1.6rem;font-weight:700;cursor:pointer;}
.opt:hover{border-color:var(--brand);}
.opt.selected{border-color:var(--brand);background:rgba(8,145,178,.08);}
.opt.correct{border-color:var(--good);background:rgba(22,163,74,.12);}
.opt.wrong{border-color:var(--bad);background:rgba(220,38,38,.12);}
.opt:disabled{cursor:default;}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px;}
button.nav{background:var(--brand);color:var(--brand-ink);border:none;padding:11px 18px;border-radius:10px;font-size:.95rem;font-weight:600;cursor:pointer;}
button.nav:disabled{opacity:.4;cursor:default;}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);padding:11px 18px;border-radius:10px;font-size:.9rem;cursor:pointer;}
.feedback{margin-top:10px;font-size:.9rem;min-height:1.2em;text-align:center;}
.feedback.good{color:var(--good);}
.feedback.bad{color:var(--bad);}
.result{text-align:center;}
.score{font-size:2.4rem;font-weight:800;color:var(--brand);margin:6px 0;}
.tag{display:inline-block;background:var(--bg);border:1px solid var(--line);padding:3px 10px;border-radius:999px;font-size:.75rem;color:var(--muted);margin-bottom:10px;}
</style>
</head>
<body>
<div class="wrap">
  <span class="tag">Math • Double-Digit Numbers</span>
  <h1>Greater Than, Less Than &amp; Equal To</h1>
  <div class="sub" id="subtitle">100 questions — pick &gt;, &lt; or =</div>
  <div class="progress"><div class="bar" id="bar"></div></div>
  <div class="card" id="card"></div>
</div>

<script>
// Generate 100 double-digit comparison questions
function genQuestions(n){
  const list = [];
  const seen = new Set();
  let equalCount = 0;
  while(list.length < n){
    let a = Math.floor(Math.random()*90)+10; // 10-99
    let b;
    // about 1 in 6 pairs should be equal
    if(Math.random() < 0.16){
      b = a;
    } else {
      b = Math.floor(Math.random()*90)+10;
    }
    const key = a+'_'+b;
    if(seen.has(key)) continue;
    seen.add(key);
    let answer = a>b ? 0 : (a<b ? 1 : 2);
    if(answer===2) equalCount++;
    list.push({a, b, answer});
  }
  return list;
}

const RAW = genQuestions(100);
const Q = RAW.map(item => ({
  q: `${item.a}     ${item.b}`,
  a: item.a, b: item.b,
  o: [">", "<", "="],
  ans: item.answer
}));

let idx = 0;
let answers = new Array(Q.length).fill(null);
const card = document.getElementById('card');
const bar = document.getElementById('bar');
const subtitle = document.getElementById('subtitle');

function render(){
  if(idx >= Q.length){ renderResult(); return; }
  const item = Q[idx];
  bar.style.width = ((idx)/Q.length*100)+'%';
  subtitle.textContent = `Question ${idx+1} of ${Q.length}`;
  let html = '';
  html += `<div class="qnum">COMPARE THE NUMBERS</div>`;
  html += `<div class="numrow">${item.a}<span class="blank">?</span>${item.b}</div>`;
  html += `<div class="opts">`;
  item.o.forEach((opt,i)=>{
    const sel = answers[idx]===i ? 'selected':'';
    html += `<button class="opt ${sel}" data-i="${i}" onclick="choose(${i})">${opt}</button>`;
  });
  html += `</div>`;
  html += `<div class="feedback" id="fb"></div>`;
  html += `<div class="row">
    <button class="ghost" onclick="prev()" ${idx===0?'disabled':''}>Back</button>
    <button class="nav" id="nextBtn" onclick="next()" ${answers[idx]===null?'disabled':''}>${idx===Q.length-1?'Finish':'Next'}</button>
  </div>`;
  card.innerHTML = html;
  if(answers[idx]!==null) showFeedback(idx, answers[idx]);
}

function choose(i){
  if(answers[idx]!==null) return;
  answers[idx] = i;
  render();
}

function showFeedback(qi, chosen){
  const item = Q[qi];
  const opts = card.querySelectorAll('.opt');
  opts.forEach((el,i)=>{
    el.disabled = true;
    if(i===item.ans) el.classList.add('correct');
    else if(i===chosen) el.classList.add('wrong');
  });
  const fb = document.getElementById('fb');
  if(chosen===item.ans){ fb.textContent = "Correct!"; fb.className='feedback good'; }
  else { fb.textContent = `Not quite — ${item.a} ${item.o[item.ans]} ${item.b} is correct.`; fb.className='feedback bad'; }
}

function next(){ idx++; render(); }
function prev(){ idx--; render(); }

function renderResult(){
  bar.style.width = '100%';
  subtitle.textContent = 'Quiz complete';
  let correct = 0;
  answers.forEach((a,i)=>{ if(a===Q[i].ans) correct++; });
  const pct = Math.round(correct/Q.length*100);
  let msg = pct>=80?"Excellent work!":pct>=60?"Good job — keep practicing!":"Keep practicing, you'll improve!";
  card.innerHTML = `<div class="result">
    <div class="qnum">RESULTS</div>
    <div class="score">${correct} / ${Q.length}</div>
    <div style="color:var(--muted);margin-bottom:10px;">${pct}% correct</div>
    <div style="margin-bottom:18px;">${msg}</div>
    <button class="nav" onclick="restart()">Try Again (new numbers)</button>
  </div>`;
}

function restart(){
  const fresh = genQuestions(100);
  Q.length = 0;
  fresh.forEach(item => Q.push({q:'', a:item.a, b:item.b, o:[">","<","="], ans:item.answer}));
  idx = 0;
  answers = new Array(Q.length).fill(null);
  render();
}

render();
</script>
</body>
</html>
