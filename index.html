<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Word Wizards</title>
<style>
:root{--bg:#fff7e6;--card:#fff;--ink:#2b2d42;--pur:#7b5cff;--grn:#2bb673;--red:#ef5b5b;--yel:#ffc93c;--blu:#3aa0ff}
*{box-sizing:border-box}
body{margin:0;font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;background:linear-gradient(160deg,#fff7e6,#e8f3ff);color:var(--ink);min-height:100vh;display:flex;justify-content:center;padding:16px}
.wrap{width:100%;max-width:680px}
.card{background:var(--card);border-radius:24px;padding:24px;box-shadow:0 8px 24px rgba(40,40,90,.12);margin-top:12px}
h1{font-size:2.2rem;margin:0 0 6px;color:var(--pur)}
h2{margin:0 0 12px}
.hero{text-align:center}
.emoji{font-size:3.5rem}
input[type=text]{font:inherit;padding:12px 16px;border-radius:14px;border:3px solid #d9d4ff;width:100%;max-width:320px;text-align:center;margin:14px 0}
button{font:inherit;cursor:pointer;border:0}
.btn{background:var(--pur);color:#fff;padding:14px 28px;border-radius:16px;font-size:1.1rem;font-weight:bold;box-shadow:0 5px 0 #5a3fd1}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #5a3fd1}
.top{display:flex;justify-content:space-between;font-weight:bold;gap:8px}
.bar{height:14px;background:#e6e6f5;border-radius:99px;overflow:hidden;margin:10px 0 4px}
.bar>div{height:100%;width:0;background:linear-gradient(90deg,var(--blu),var(--pur));transition:width .3s}
.passage{background:#fff4cf;border-left:6px solid var(--yel);padding:12px 16px;border-radius:12px;margin:12px 0;font-size:1.05rem;line-height:1.5}
.q{font-size:1.4rem;font-weight:bold;margin:14px 0}
.opts{display:grid;gap:12px}
.opt{background:#f2efff;border:3px solid #d9d4ff;border-radius:16px;padding:14px 16px;font-size:1.15rem;text-align:left;color:var(--ink)}
.opt:hover:not(:disabled){background:#e5deff}
.opt.right{background:#d6f5e5;border-color:var(--grn)}
.opt.wrong{background:#ffe0e0;border-color:var(--red)}
.fb{margin-top:14px;padding:12px 16px;border-radius:14px;font-size:1.05rem;display:none}
.fb.ok{background:#d6f5e5;display:block}.fb.no{background:#ffe9d6;display:block}
.next{margin-top:16px;text-align:right}
.hide{display:none}
.score{font-size:3rem;font-weight:bold;color:var(--pur);text-align:center}
.review li{margin:10px 0;padding:10px 14px;background:#fff4f4;border-radius:12px}
.review b{color:var(--grn)}
.center{text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div id="start" class="card hero">
    <div class="emoji">📚✨</div>
    <h1>English Word Wizards</h1>
    <p>50 fun questions on words, spelling, sentences and reading.</p>
    <input id="name" type="text" placeholder="Type your name" maxlength="20">
    <div><button class="btn" id="go">Start the quiz!</button></div>
  </div>

  <div id="quiz" class="card hide">
    <div class="top"><span id="who"></span><span id="count"></span><span id="pts"></span></div>
    <div class="bar"><div id="fill"></div></div>
    <div id="passage" class="passage hide"></div>
    <div class="q" id="q"></div>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb"></div>
    <div class="next"><button class="btn hide" id="next">Next ➜</button></div>
  </div>

  <div id="end" class="card hide">
    <div class="center">
      <div class="emoji" id="medal"></div>
      <h2 id="endmsg"></h2>
      <div class="score" id="final"></div>
    </div>
    <div id="reviewBox" class="hide">
      <h3>Let's look at the ones to practise:</h3>
      <ol class="review" id="review"></ol>
    </div>
    <div class="center"><button class="btn" id="again">Play again</button></div>
  </div>
</div>

<script>
const P1="Tom has a red kite. On Saturday he took it to the park. The wind was strong, so the kite flew high above the trees.";
// [question, [correct, wrong, wrong, wrong], explanation, passage?]
const DATA=[
["Which of these words is a noun (a naming word)?",["teacher","eat","slowly","tall"],"A noun names a person, place or thing. 'Teacher' is a person."],
["Which word is the verb in this sentence?\n“The children giggle loudly.”",["giggle","children","loudly","The"],"A verb is a doing word. The children are doing the giggling."],
["Which word is the adjective in this sentence?\n“The fluffy rabbit hopped away.”",["fluffy","rabbit","hopped","away"],"An adjective describes a noun. 'Fluffy' describes the rabbit."],
["Which word tells us HOW the snail moved?\n“The snail crawled slowly.”",["slowly","snail","crawled","The"],"'Slowly' is an adverb. It tells us how the snail crawled."],
["Which word is a doing word (verb)?",["climb","ladder","purple","gently"],"You can climb, so it is a doing word."],
["Which word needs a capital letter because it is a name?",["London","city","river","town"],"London is the name of a place, so it starts with a capital letter."],
["Which word means very, very big?",["enormous","tiny","narrow","brief"],"Enormous means extremely large."],
["Which word is the name of a group of fish?",["school","pack","herd","flock"],"A group of fish is called a school."],
["Which word is a noun?",["happiness","jumped","bravely","soft"],"Happiness is a thing we feel, so it is a noun."],
["Choose the correct word: one fox, two ___.",["foxes","foxs","foxies","foxen"],"Words ending in -x add -es to make them plural."],
["Choose the correct word: one baby, two ___.",["babies","babys","babyes","babis"],"Change the y to i and add -es."],
["Choose the correct word: one child, three ___.",["children","childs","childen","childrens"],"Child is an irregular plural. It becomes children."],
["Choose the correct word: one mouse, two ___.",["mice","mouses","mices","mouse"],"Mouse is an irregular plural. It becomes mice."],
["Choose the correct word: one leaf, many ___.",["leaves","leafs","leafes","leavs"],"Change the f to v and add -es."],
["Choose the correct word:\n“Yesterday I ___ to the shop.”",["went","goed","go","goes"],"Went is the past tense of go."],
["Choose the correct word:\n“She ___ a lovely picture last night.”",["drew","drawed","draw","drawn"],"Drew is the past tense of draw."],
["Choose the correct word:\n“We ___ our lunch before play.”",["ate","eated","eaten","eating"],"Ate is the past tense of eat."],
["Which is the correct past tense of 'jump'?",["jumped","jumpt","jumping","jumps"],"Add -ed to jump to show it already happened."],
["Which sentence is written correctly?",["My brother is called Sam.","my brother is called Sam.","My brother is called sam.","my Brother is called Sam."],"A sentence starts with a capital letter and names need a capital letter too."],
["Which sentence is a question?",["Can we play outside?","We can play outside.","Play outside now.","How lovely it is outside!"],"A question asks something and ends with a question mark."],
["Which sentence is a command?",["Please close the door.","The door is closed.","Is the door closed?","I closed the door."],"A command tells someone to do something."],
["Which sentence uses commas correctly in a list?",["I packed apples, bananas, grapes and pears.","I packed, apples bananas grapes, and pears.","I packed apples bananas, grapes, and, pears.","I packed apples, bananas grapes and, pears."],"Commas go between the items in a list, and 'and' goes before the last one."],
["Which sentence uses the apostrophe correctly?",["I can't find my shoes.","I ca'nt find my shoes.","I cant' find my shoes.","I can't' find my shoes."],"The apostrophe takes the place of the missing letter 'o' in 'cannot'."],
["Which sentence shows that the bone belongs to ONE dog?",["The dog's bone was buried.","The dogs's bone was buried.","The dogs bone' was buried.","The dog bone's was buried."],"Add apostrophe + s to the owner to show it belongs to them."],
["Which word is spelled correctly?",["because","becaus","becuase","becase"],"Remember: Big Elephants Can Always Understand Small Elephants."],
["Which word is spelled correctly?",["friend","freind","frend","friand"],"Friend has 'ie' in it, as in 'a friend to the end'."],
["Which word is spelled correctly?",["people","peeple","peopel","pepole"],"People is a tricky word. It is spelled p-e-o-p-l-e."],
["Which word is spelled correctly?",["beautiful","beutiful","beautifull","butiful"],"Beautiful starts with 'beau' and ends with just one 'l'."],
["Choose the right word:\n“I can ___ the birds singing.”",["hear","here","hair","heer"],"You hear with your ear. Hear has 'ear' inside it."],
["Choose the right word:\n“Put the book over ___.”",["there","their","they're","thare"],"There tells us where something is."],
["Choose the right word:\n“The ___ shone brightly in the sky.”",["sun","son","sum","sunn"],"The sun is the star in the sky. A son is a boy in a family."],
["Choose the right word:\n“The bear has big ___.”",["paws","pause","pores","paus"],"Paws are an animal's feet."],
["Choose the right word:\n“I have ___ pencils on my desk.”",["two","too","to","tow"],"Two is the number 2."],
["Add -ful to the word 'care'. What do you get?",["careful","carefull","carful","carefel"],"When we add -ful, we only use one 'l'."],
["Which word means the opposite of 'happy'?",["unhappy","dishappy","inhappy","nonhappy"],"The prefix un- changes the meaning to the opposite."],
["Add -ly to the word 'quick'. What do you get?",["quickly","quickley","quickily","quicly"],"Just add -ly to the end of quick."],
["Which of these is a compound word (two words joined together)?",["rainbow","rainy","raining","rained"],"Rain + bow = rainbow."],
["How many syllables (beats) are in the word 'elephant'?",["3","2","4","1"],"el-e-phant. Clap it out: 3 beats."],
["Which word rhymes with 'light'?",["kite","late","lit","lick"],"Light and kite end with the same sound: -ite."],
["Which word comes first in alphabetical (ABC) order?",["banana","lemon","mango","orange"],"B comes before L, M and O in the alphabet."],
["Which word means the opposite of 'empty'?",["full","tidy","quiet","dry"],"Full is the opposite of empty."],
["Which word means the same as 'glad'?",["happy","sad","tired","calm"],"Glad and happy are synonyms (they mean the same)."],
["Which one is a complete sentence?",["The birds flew south.","The birds in the tree.","Flying over the hills.","Under the big bridge."],"A complete sentence has a doer and a doing word and makes sense on its own."],
["Choose the best joining word:\n“I wore my coat ___ it was cold.”",["because","but","or","if"],"Because gives the reason why I wore my coat."],
["Choose the best joining word:\n“It was raining, ___ we stayed inside.”",["so","but","or","until"],"So shows what happened as a result of the rain."],
["Which sentence is an exclamation?",["What a huge cake!","Is that a huge cake?","Cut the huge cake.","The cake is huge."],"An exclamation shows strong feeling and ends with an exclamation mark."],
["What colour was Tom's kite?",["red","blue","yellow","green"],"The text says Tom has a red kite.",P1],
["When did Tom take his kite to the park?",["Saturday","Sunday","Friday","Monday"],"The text says he went on Saturday.",P1],
["Why did the kite fly high?",["The wind was strong.","The kite was new.","Tom ran very fast.","The sun was out."],"The text says the wind was strong, so the kite flew high.",P1],
["Which word in the story describes the wind?",["strong","red","high","Saturday"],"'Strong' tells us what kind of wind it was.",P1]
];

const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let qs,i,score,missed,name,locked;

function start(){
  name=$("name").value.trim()||"Superstar";
  qs=shuffle(DATA);i=0;score=0;missed=[];
  $("start").classList.add("hide");$("end").classList.add("hide");$("quiz").classList.remove("hide");
  $("who").textContent="👋 "+name;
  show();
}
function show(){
  locked=false;
  const [q,o,ex,p]=qs[i];
  $("count").textContent=`Question ${i+1} of ${qs.length}`;
  $("pts").textContent=`⭐ ${score}`;
  $("fill").style.width=(i/qs.length*100)+"%";
  const pb=$("passage");
  if(p){pb.textContent="📖 "+p;pb.classList.remove("hide")}else pb.classList.add("hide");
  $("q").innerHTML=q.replace(/\n/g,"<br>");
  const box=$("opts");box.innerHTML="";
  shuffle(o).forEach(t=>{
    const b=document.createElement("button");b.className="opt";b.textContent=t;
    b.onclick=()=>pick(b,t,o[0],ex);box.appendChild(b);
  });
  $("fb").className="fb";$("next").classList.add("hide");
}
function pick(btn,t,right,ex){
  if(locked)return;locked=true;
  document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.textContent===right)b.classList.add("right")});
  const fb=$("fb");
  if(t===right){score++;fb.className="fb ok";fb.textContent="🎉 Brilliant! "+ex}
  else{btn.classList.add("wrong");missed.push([qs[i][0],right,ex]);fb.className="fb no";fb.textContent="Not quite. "+ex}
  $("pts").textContent=`⭐ ${score}`;
  const n=$("next");n.textContent=i===qs.length-1?"See my score ➜":"Next ➜";n.classList.remove("hide");
}
function finish(){
  $("quiz").classList.add("hide");$("end").classList.remove("hide");
  const pct=score/qs.length;
  $("medal").textContent=pct>=.9?"🏆":pct>=.7?"🥇":pct>=.5?"🥈":"🌟";
  $("endmsg").textContent=pct>=.9?`Amazing work, ${name}!`:pct>=.7?`Great job, ${name}!`:pct>=.5?`Good try, ${name}!`:`Keep practising, ${name}!`;
  $("final").textContent=`${score} / ${qs.length}`;
  const rb=$("reviewBox"),rv=$("review");rv.innerHTML="";
  if(missed.length){
    rb.classList.remove("hide");
    missed.forEach(([q,a,ex])=>{const li=document.createElement("li");
      li.innerHTML=`${q.replace(/\n/g," ")}<br>Answer: <b></b><br><small></small>`;
      li.querySelector("b").textContent=a;li.querySelector("small").textContent=ex;rv.appendChild(li)});
  }else rb.classList.add("hide");
}
$("go").onclick=start;
$("name").addEventListener("keydown",e=>{if(e.key==="Enter")start()});
$("next").onclick=()=>{i++;i<qs.length?show():finish()};
$("again").onclick=()=>{$("end").classList.add("hide");$("start").classList.remove("hide")};
</script>
</body>
</html>
