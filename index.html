<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forces Quiz: 50 Questions</title>
<style>
:root{--ink:#14213d;--bg:#e9f1fa;--card:#fff;--line:#c9d8e6;--app:#fb8500;--nor:#118ab2;--fri:#ef476f;--grv:#06a77d;--mag:#7b2cbf}
@media (prefers-color-scheme:dark){:root{--ink:#e8eef6;--bg:#0f1a2b;--card:#182740;--line:#2f4466}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 "Trebuchet MS",Verdana,sans-serif;min-height:100vh}
.wrap{max-width:720px;margin:auto;padding:20px 16px 50px}
h1{font-size:clamp(2rem,6vw,3rem);line-height:1.1;margin:.2em 0}
h2{margin:.2em 0}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:22px;margin:16px 0}
.dots{display:flex;gap:8px;margin:10px 0}.dots i{width:22px;height:22px;border-radius:50%}
button{font:inherit;font-weight:700;cursor:pointer;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:11px 16px}
button:hover:not(:disabled),button:focus-visible{border-color:var(--app);outline:none}
.opt{display:block;width:100%;text-align:left;margin:8px 0}
.go{background:var(--app);color:#14213d;border-color:var(--app);padding:13px 26px;font-size:1.1rem}
.ok{background:#c8f3e3!important;color:#14213d;border-color:var(--grv)!important}
.no{background:#ffd3dc!important;color:#14213d;border-color:var(--fri)!important}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.bar div{height:100%;width:0;background:var(--app);transition:width .3s}
.top{display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px}
.fb{margin:12px 0 0;font-weight:700;min-height:1.6em}
.big{font-size:3.2rem;font-weight:700;margin:0}
.miss{border-left:6px solid var(--fri);padding:6px 14px;margin:10px 0;background:var(--bg);border-radius:0 10px 10px 0}
.hide{display:none}
@media (prefers-reduced-motion:reduce){.bar div{transition:none}}
</style>
</head>
<body>
<div class="wrap">

<div id="start" class="card">
<div class="dots" aria-hidden="true"><i style="background:var(--app)"></i><i style="background:var(--nor)"></i><i style="background:var(--fri)"></i><i style="background:var(--mag)"></i><i style="background:var(--grv)"></i></div>
<h1>Forces Quiz</h1>
<p>50 questions on forces, contact and non-contact forces, applied force, normal force, friction and magnetism.</p>
<p>Pick an answer, read the explanation, then tap Next. Questions come in a new order every time.</p>
<button class="go" id="begin">Start quiz</button>
</div>

<div id="play" class="hide">
<div class="top"><span id="qn">Question 1 of 50</span><span id="sc">Score 0</span></div>
<div class="bar" role="progressbar" aria-label="Progress"><div id="pb"></div></div>
<div class="card">
<h2 id="qt"></h2><div id="ops"></div><div class="fb" id="fb" aria-live="polite"></div>
<button class="go hide" id="nx">Next</button>
</div>
</div>

<div id="end" class="card hide">
<h2>Quiz complete</h2>
<p class="big" id="fin"></p><p id="msg"></p>
<div id="missed"></div>
<button class="go" id="again">Try all 50 again</button>
<button id="redo" class="hide">Retry missed only</button>
</div>

</div>
<script>
// format: question|correct answer|wrong 1|wrong 2|wrong 3|explanation
var RAW=[
"A force is a…|push or a pull|type of light|kind of food|speed|Forces are pushes and pulls.",
"Which unit measures force?|Newton (N)|Metre (m)|Kilogram (kg)|Second (s)|Force is measured in newtons.",
"Which is NOT an effect of a force?|Making an object stop existing|Starting an object moving|Changing an object's shape|Changing an object's direction|Forces change motion or shape. They do not make things disappear.",
"Which tool measures force?|Newton meter (spring balance)|Thermometer|Ruler|Stopwatch|A newton meter stretches a spring to show the force in newtons.",
"Which makes a football speed up?|A kick|Its colour|Its name|Its shadow|A kick is a force, and forces can start or speed up movement.",
"In a force diagram, a longer arrow means…|a stronger force|a weaker force|a slower object|a heavier surface|Arrow length shows how big the force is.",
"In a force diagram, the arrow points…|the way the force acts|towards the north|at the biggest object|upwards always|The arrow shows the direction of the force.",
"On Earth, gravity pulls objects towards…|the centre of the Earth|the clouds|the Moon|the north|Gravity pulls everything down towards the Earth's centre.",
"A contact force…|needs the objects to touch|acts across a gap|only works in space|only works with magnets|Contact forces need the two objects to touch.",
"A non-contact force…|acts across a gap without touching|needs the objects to touch|only works on ice|only works underwater|Non-contact forces work across a distance.",
"Which is a contact force?|Friction|Gravity|Magnetism|Light|Friction needs two surfaces touching.",
"Which is a non-contact force?|Magnetism|Friction|Applied force|Normal force|Magnets work across a gap.",
"Which pair are BOTH non-contact forces?|Gravity and magnetism|Friction and gravity|Normal and applied|Applied and friction|Gravity and magnetism both act without touching.",
"A magnet pulls a paper clip across a small gap. This is a…|non-contact force|contact force|friction force|normal force|There is no touching, so it is non-contact.",
"A girl kicks a ball. The kick is a contact force because…|her foot touches the ball|gravity is involved|a magnet is nearby|the ball is round|The foot touches the ball, so it is a contact force.",
"An applied force is…|a push or pull from something touching the object|the surface pushing back|the force of rubbing|the pull of the Earth|Applied forces come from a person or object pushing or pulling.",
"Pulling a wagon with a rope is an example of…|applied force|normal force|magnetism|gravity|You apply a pulling force through the rope.",
"Which of these is a PULL?|Opening a drawer by its handle|Kicking a ball|Pressing a doorbell|Pushing a trolley|A pull moves an object towards you.",
"If you push a trolley harder, it…|speeds up more|slows down|does not change|stops|A bigger applied force makes a bigger change in motion.",
"Lifting a bag off the floor uses…|an upward applied force|friction only|magnetism|no force|You must apply a force upwards to overcome gravity.",
"Which of these is a PUSH?|Pressing a doorbell|Tugging a rope|Dragging a sack|Pulling a drawer|A push moves an object away from you.",
"The normal force acts…|at 90° to the surface|along the surface|only downwards|in any direction|Normal means perpendicular to the surface.",
"A cup sits on a table. The normal force on the cup…|pushes it up|pulls it down|pushes it sideways|is zero|The table pushes up on the cup.",
"The normal force is exerted by…|the surface|the object on top|a magnet|the air only|The surface pushes back on the object resting on it.",
"A 5 N book rests on a table. The normal force is…|5 N upwards|0 N|10 N|5 N downwards|It balances the 5 N weight, pushing up.",
"Why doesn't a book fall through a table?|The table pushes up with the normal force|There is no gravity|Friction holds it|A magnet holds it|The normal force balances gravity.",
"On a ramp, the normal force acts…|at 90° to the ramp|straight up|along the ramp|straight down|It is always perpendicular to the surface.",
"A book rests on a table. Gravity and the normal force are…|equal and opposite|both zero|gravity bigger|normal bigger|They are balanced, so the book stays still.",
"A box has 20 N pushing right and 20 N pushing left. The forces are…|balanced|unbalanced|zero each|both 40 N|20 − 20 = 0 N net force, so they are balanced.",
"Friction acts…|opposite to the motion|in the same direction as the motion|straight up|in no direction|Friction opposes sliding.",
"Friction happens when…|two surfaces rub or try to slide|two magnets meet|objects are in space|an object is in the air|Friction needs two surfaces in contact.",
"Which surface has the MOST friction?|Sandpaper|Ice|Oil|Glass|Rough surfaces catch more.",
"Which surface has the LEAST friction?|Ice|Carpet|Gravel|Rubber|Ice is very smooth.",
"Which type of friction is usually weakest?|Rolling friction|Static friction|Sliding friction|They are all equal|Wheels make moving much easier.",
"Static friction acts on…|an object that is not moving yet|a rolling ball|a sliding sled|a flying plane|It stops still objects from starting to slide.",
"Which is USEFUL friction?|Bike brakes stopping a wheel|Engine parts wearing out|Heat lost from machines|A slippery floor|Brakes use friction to stop you.",
"Which can reduce friction?|Oil|Sandpaper|Rough carpet|Rubber grips|Oil helps surfaces slide past each other.",
"You rub your hands together and they get warm because of…|friction|magnetism|gravity|normal force|Friction turns movement into heat.",
"A rougher surface gives…|more friction|less friction|no friction|the same friction|Rougher surfaces have bigger bumps that catch.",
"Why do shoes have grooves on the soles?|To increase grip (friction)|To reduce friction|To make them heavier|To change their colour|Grooves help grip the ground.",
"A sled slows down on snow mainly because of…|friction|magnetism|an applied force|the normal force|Friction opposes the sled's motion.",
"Magnets attract objects made of…|iron or steel|wood|plastic|glass|Iron, steel, nickel and cobalt are magnetic.",
"A north pole and a south pole…|attract|repel|do nothing|spin|Opposite poles attract.",
"Two north poles…|repel|attract|stick together|disappear|Same poles repel.",
"A magnet's force is strongest at…|the poles|the middle|everywhere equally|far away|Field lines bunch up at the poles.",
"Magnetic field lines leave the…|north pole|south pole|middle|nowhere|They leave north and enter south.",
"A magnetic field is…|the area around a magnet where its force acts|the inside of a magnet|a kind of metal|a surface|The field is the space where the magnetic force can be felt.",
"Which would a magnet NOT pick up?|A wooden spoon|A steel nail|Iron filings|A steel paper clip|Wood is not magnetic.",
"A compass needle points north because of…|Earth's magnetic field|gravity|friction|wind|The Earth acts like a giant magnet.",
"A box has 30 N applied to the right and 12 N friction to the left. The net force is…|18 N right|42 N right|18 N left|0 N|30 − 12 = 18 N to the right."
];
var Q=RAW.map(function(r){var p=r.split("|");return{q:p[0],a:p[1],o:[p[1],p[2],p[3],p[4]],e:p[5]}});
var $=function(i){return document.getElementById(i)};
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
var set,idx,score,miss,locked;
function show(id){["start","play","end"].forEach(function(x){$(x).classList.toggle("hide",x!=id)})}
function begin(list){set=shuf(list);idx=0;score=0;miss=[];show("play");ask()}
function ask(){var q=set[idx];locked=false;
$("qn").textContent="Question "+(idx+1)+" of "+set.length;$("sc").textContent="Score "+score;$("pb").style.width=(idx/set.length*100)+"%";
$("qt").textContent=q.q;$("fb").textContent="";$("nx").classList.add("hide");$("ops").innerHTML="";
shuf(q.o).forEach(function(t){var b=document.createElement("button");b.className="opt";b.textContent=t;
b.onclick=function(){if(locked)return;locked=true;var all=$("ops").children;
for(var i=0;i<all.length;i++){if(all[i].textContent==q.a)all[i].classList.add("ok")}
if(t==q.a){score++;$("fb").textContent="Correct! "+q.e}else{b.classList.add("no");miss.push(q);$("fb").textContent="Not quite. "+q.e}
$("sc").textContent="Score "+score;$("nx").textContent=idx==set.length-1?"See results":"Next";$("nx").classList.remove("hide");$("nx").focus()};
$("ops").appendChild(b)})}
$("nx").onclick=function(){idx++;idx<set.length?ask():finish()};
function finish(){$("pb").style.width="100%";show("end");var n=set.length;
$("fin").textContent=score+" / "+n;
var p=score/n;$("msg").textContent=p==1?"Perfect! You are a force master!":p>=.8?"Excellent work!":p>=.6?"Good job. A little more practice and you will have it.":"Keep going. Read the lessons again and retry.";
var m=$("missed");m.innerHTML="";
if(miss.length){var h=document.createElement("h3");h.textContent="Questions to review ("+miss.length+")";m.appendChild(h);
miss.forEach(function(q){var d=document.createElement("div");d.className="miss";d.innerHTML="<b></b><br><span></span>";d.firstChild.textContent=q.q;d.lastChild.textContent="Answer: "+q.a+". "+q.e;m.appendChild(d)})}
$("redo").classList.toggle("hide",!miss.length)}
$("begin").onclick=$("again").onclick=function(){begin(Q)};
$("redo").onclick=function(){begin(miss.slice())};
</script>
</body>
</html>
