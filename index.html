<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rhyme Time Quiz</title>
<style>
  :root{
    --bg1:#ffe9a8; --bg2:#ffc3d9; --ink:#2b2d42; --card:#ffffff;
    --blue:#4cc9f0; --green:#52c41a; --red:#ff5d73; --purple:#7b5cff; --orange:#ff9f1c;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; font-family:"Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
    color:var(--ink); background:linear-gradient(160deg,var(--bg1),var(--bg2));
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  .card{
    width:100%; max-width:640px; background:var(--card); border-radius:28px;
    padding:28px 24px; box-shadow:0 14px 0 rgba(123,92,255,.18),0 20px 40px rgba(0,0,0,.12);
    text-align:center;
  }
  h1{margin:6px 0 4px; font-size:2.2rem; color:var(--purple)}
  p.sub{margin:0 0 18px; font-size:1.1rem}
  .big-emoji{font-size:4rem; line-height:1}
  button{font:inherit; cursor:pointer; border:none}
  .btn{
    background:var(--purple); color:#fff; font-size:1.4rem; font-weight:700;
    padding:14px 34px; border-radius:50px; box-shadow:0 6px 0 #5238c9;
    transition:transform .08s, box-shadow .08s;
  }
  .btn:active{transform:translateY(4px); box-shadow:0 2px 0 #5238c9}
  .btn.alt{background:var(--orange); box-shadow:0 6px 0 #cc7f00}
  .btn.alt:active{box-shadow:0 2px 0 #cc7f00}
  .top{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; font-weight:700}
  .bar{flex:1; height:16px; background:#eee; border-radius:20px; overflow:hidden}
  .bar > div{height:100%; width:0; background:linear-gradient(90deg,var(--blue),var(--purple)); transition:width .3s}
  .score{background:#fff4cc; padding:4px 12px; border-radius:20px; white-space:nowrap}
  .prompt{font-size:1.35rem; margin:14px 0 6px; font-weight:700}
  .word{
    display:inline-flex; align-items:center; gap:12px; margin:6px 0 16px;
    font-size:3rem; font-weight:800; color:var(--purple);
    background:#efeaff; padding:6px 22px; border-radius:24px;
  }
  .sentence{font-size:1.9rem; font-weight:800; color:var(--purple); background:#efeaff; padding:14px 18px; border-radius:24px; margin:8px 0 16px}
  .speak{
    background:var(--blue); color:#fff; width:48px; height:48px; border-radius:50%;
    font-size:1.5rem; box-shadow:0 4px 0 #2a9bc0;
  }
  .speak:active{transform:translateY(3px); box-shadow:0 1px 0 #2a9bc0}
  .opts{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .opt{
    background:#fff; border:4px solid #d9d4ff; border-radius:20px; padding:16px 8px;
    font-size:1.8rem; font-weight:800; color:var(--ink); transition:transform .08s, background .15s, border-color .15s;
  }
  .opt:hover:not(:disabled){transform:scale(1.04); border-color:var(--purple)}
  .opt.right{background:#d8f7c4; border-color:var(--green)}
  .opt.wrong{background:#ffd9de; border-color:var(--red)}
  .opt:disabled{cursor:default}
  .fb{min-height:64px; margin-top:16px; font-size:1.2rem; font-weight:700}
  .fb .good{color:#2f8f00} .fb .bad{color:#d62839}
  .fb small{display:block; font-weight:400; font-size:1.05rem; margin-top:4px; color:var(--ink)}
  .stars{font-size:2.6rem; letter-spacing:4px; margin:8px 0}
  .review{text-align:left; margin:16px 0; max-height:220px; overflow:auto; background:#faf8ff; border-radius:16px; padding:10px 16px}
  .review li{margin:6px 0}
  .hidden{display:none}
  @keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
  .pop{animation:pop .35s}
  @media (max-width:420px){ .word{font-size:2.4rem} .opt{font-size:1.5rem} }
</style>
</head>
<body>
<div class="card" id="app">

  <section id="start">
    <div class="big-emoji">🎵🐱🎩</div>
    <h1>Rhyme Time!</h1>
    <p class="sub">Words that rhyme sound the same at the end.<br>Like <b>cat</b> and <b>hat</b>!</p>
    <p class="sub">50 questions. Tap the 🔊 button to hear a word.</p>
    <button class="btn" id="startBtn">Let's Play!</button>
  </section>

  <section id="quiz" class="hidden">
    <div class="top">
      <span id="qnum">1 / 50</span>
      <div class="bar"><div id="barFill"></div></div>
      <span class="score">⭐ <span id="scoreNum">0</span></span>
    </div>
    <div class="prompt" id="prompt"></div>
    <div id="stage"></div>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb"></div>
    <button class="btn hidden" id="nextBtn">Next ➜</button>
  </section>

  <section id="end" class="hidden">
    <div class="big-emoji" id="endEmoji">🏆</div>
    <h1 id="endTitle">Great job!</h1>
    <div class="stars" id="stars"></div>
    <p class="sub" id="endScore"></p>
    <div id="reviewWrap" class="hidden">
      <p class="sub"><b>Let's practise these again:</b></p>
      <ul class="review" id="reviewList"></ul>
    </div>
    <button class="btn alt hidden" id="retryMissed">Try the ones I missed</button>
    <button class="btn" id="again">Play again</button>
  </section>

</div>

<script>
/* ---------- Question bank (50) ----------
   r   = "Which word rhymes with ___?"  (w = word, a = answer, x = 3 plausible wrong choices)
   odd = "Which word does NOT rhyme?"   (o = 4 words, a = the odd one, g = the rhyming group)
   fill= finish the rhyme               (s = sentence, a = answer, x = wrong choices, w = word it rhymes with)
   Wrong choices are deliberate near-misses: same first letter, same vowel letter,
   look-alike spelling, or a different ending sound.
*/
const Q = [
 {t:'r',w:'cat',a:'hat',x:['cap','cot','cut']},
 {t:'r',w:'dog',a:'log',x:['dig','dot','door']},
 {t:'r',w:'sun',a:'fun',x:['sum','sand','sin']},
 {t:'r',w:'pen',a:'hen',x:['pan','pin','pet']},
 {t:'r',w:'bed',a:'red',x:['bad','bud','bee']},
 {t:'r',w:'hop',a:'top',x:['hip','hope','hot']},
 {t:'r',w:'big',a:'pig',x:['bag','bug','bit']},
 {t:'r',w:'bug',a:'rug',x:['bag','big','bun']},
 {t:'r',w:'man',a:'fan',x:['men','mat','map']},
 {t:'r',w:'cake',a:'lake',x:['cook','cape','kick']},
 {t:'r',w:'bike',a:'hike',x:['back','bite','book']},
 {t:'r',w:'tree',a:'knee',x:['bell','tray','tip']},
 {t:'r',w:'moon',a:'spoon',x:['mean','moan','moss']},
 {t:'r',w:'star',a:'car',x:['stir','sun','stop']},
 {t:'r',w:'night',a:'light',x:['nine','knit','note']},
 {t:'r',w:'rain',a:'train',x:['run','ran','rail']},
 {t:'r',w:'boat',a:'coat',x:['bat','boot','bolt']},
 {t:'r',w:'book',a:'look',x:['back','boot','bike']},
 {t:'r',w:'fish',a:'dish',x:['fist','fresh','fin']},
 {t:'r',w:'ball',a:'wall',x:['bell','bull','bat']},
 {t:'r',w:'frog',a:'fog',x:['fig','free','from']},
 {t:'r',w:'snow',a:'toe',x:['now','sun','snap']},
 {t:'r',w:'house',a:'mouse',x:['horse','hose','hut']},
 {t:'r',w:'king',a:'ring',x:['kick','kind','kit']},
 {t:'r',w:'clock',a:'sock',x:['cluck','clap','cook']},
 {t:'r',w:'duck',a:'truck',x:['deck','dock','dark']},
 {t:'r',w:'boy',a:'toy',x:['bus','boat','bay']},
 {t:'r',w:'bell',a:'shell',x:['ball','bill','bed']},
 {t:'r',w:'sing',a:'wing',x:['sang','song','sink']},
 {t:'r',w:'hill',a:'mill',x:['hall','hell','hid']},
 {t:'r',w:'nest',a:'best',x:['neck','net','next']},
 {t:'r',w:'gate',a:'late',x:['got','goat','gift']},
 {t:'r',w:'pie',a:'sky',x:['pea','pin','pit']},
 {t:'r',w:'blue',a:'glue',x:['blow','bleed','black']},
 {t:'r',w:'hand',a:'sand',x:['hard','hunt','hen']},
 {t:'r',w:'jump',a:'bump',x:['jam','jug','junk']},
 {t:'r',w:'mop',a:'shop',x:['map','mud','mope']},
 {t:'r',w:'six',a:'mix',x:['sit','sad','sick']},
 {t:'r',w:'pear',a:'bear',x:['peel','pet','peer']},
 {t:'r',w:'cold',a:'gold',x:['cool','cord','call']},

 {t:'odd',o:['ten','pen','hen','tin'],a:'tin',g:'ten, pen, hen'},
 {t:'odd',o:['cake','lake','snake','cook'],a:'cook',g:'cake, lake, snake'},
 {t:'odd',o:['bug','rug','hug','bag'],a:'bag',g:'bug, rug, hug'},
 {t:'odd',o:['ring','king','wing','rang'],a:'rang',g:'ring, king, wing'},
 {t:'odd',o:['fox','box','socks','fix'],a:'fix',g:'fox, box, socks'},

 {t:'fill',s:'The cat sat on the ___.',w:'cat',a:'mat',x:['map','mug','mop']},
 {t:'fill',s:'I see a bee up in the ___.',w:'bee',a:'tree',x:['bush','sky','tray']},
 {t:'fill',s:'A frog sat on a ___.',w:'frog',a:'log',x:['leaf','lake','lid']},
 {t:'fill',s:'I can hop, hop, hop, and then I ___.',w:'hop',a:'stop',x:['skip','step','stand']},
 {t:'fill',s:'I hear the rain, I see the ___.',w:'rain',a:'train',x:['rail','road','bus']}
];

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };
function say(text){
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.rate=.8; u.lang='en-CA'; speechSynthesis.speak(u);}catch(e){}
}
const CHEERS = ['Great job!','Awesome!','You got it!','Super!','Brilliant!','Well done!','Yes!'];

let list=[], idx=0, score=0, missed=[], locked=false;

function show(id){ ['start','quiz','end'].forEach(s=>$(s).classList.toggle('hidden', s!==id)); }

function begin(questions){
  list = questions; idx=0; score=0; missed=[];
  show('quiz'); render();
}

function render(){
  locked=false;
  const q=list[idx];
  $('qnum').textContent = (idx+1)+' / '+list.length;
  $('barFill').style.width = (idx/list.length*100)+'%';
  $('scoreNum').textContent = score;
  $('fb').innerHTML=''; $('nextBtn').classList.add('hidden');

  let choices;
  if(q.t==='r'){
    $('prompt').textContent='Which word rhymes with…';
    $('stage').innerHTML = `<div class="word"><span>${q.w}</span><button class="speak" aria-label="Hear the word">🔊</button></div>`;
    choices = shuffle([q.a,...q.x]);
  } else if(q.t==='odd'){
    $('prompt').textContent='Three words rhyme. Which one does NOT rhyme?';
    $('stage').innerHTML = `<div class="big-emoji">🕵️</div>`;
    choices = shuffle(q.o);
  } else {
    $('prompt').textContent='Finish the rhyme!';
    $('stage').innerHTML = `<div class="sentence">${q.s.replace('___','<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>')}<br><button class="speak" aria-label="Hear it">🔊</button></div>`;
    choices = shuffle([q.a,...q.x]);
  }
  const sp = $('stage').querySelector('.speak');
  if(sp) sp.onclick = ()=> say(q.t==='fill' ? q.s.replace('___','blank') : q.w);

  $('opts').innerHTML='';
  choices.forEach(c=>{
    const b=document.createElement('button');
    b.className='opt'; b.textContent=c;
    b.onclick=()=>answer(b,c);
    $('opts').appendChild(b);
  });
}

function explain(q){
  if(q.t==='r')  return `<b>${q.w}</b> and <b>${q.a}</b> end with the same sound.`;
  if(q.t==='odd')return `<b>${q.g}</b> rhyme. <b>${q.a}</b> does not.`;
  return `<b>${q.w}</b> and <b>${q.a}</b> rhyme.`;
}

function answer(btn,choice){
  if(locked) return; locked=true;
  const q=list[idx];
  const ok = choice===q.a;
  [...$('opts').children].forEach(b=>{
    b.disabled=true;
    if(b.textContent===q.a) b.classList.add('right');
  });
  if(ok){
    score++; $('scoreNum').textContent=score;
    btn.classList.add('pop');
    $('fb').innerHTML = `<span class="good">🎉 ${CHEERS[Math.floor(Math.random()*CHEERS.length)]}</span><small>${explain(q)}</small>`;
  } else {
    btn.classList.add('wrong');
    missed.push(q);
    $('fb').innerHTML = `<span class="bad">Not quite. Good try!</span><small>The answer is <b>${q.a}</b>. ${explain(q)}</small>`;
  }
  $('nextBtn').textContent = idx===list.length-1 ? 'See my score ➜' : 'Next ➜';
  $('nextBtn').classList.remove('hidden');
}

function next(){
  idx++;
  if(idx>=list.length) return finish();
  render();
}

function finish(){
  $('barFill').style.width='100%';
  show('end');
  const pct = score/list.length;
  const starCount = pct>=.9?3 : pct>=.7?2 : pct>=.4?1 : 0;
  $('stars').textContent = '⭐'.repeat(starCount) + '☆'.repeat(3-starCount);
  $('endEmoji').textContent = pct>=.9?'🏆':pct>=.7?'🎉':'💪';
  $('endTitle').textContent = pct>=.9?'Rhyme Champion!':pct>=.7?'Great job!':'Keep practising!';
  $('endScore').textContent = `You got ${score} out of ${list.length} right.`;
  const has = missed.length>0;
  $('reviewWrap').classList.toggle('hidden', !has);
  $('retryMissed').classList.toggle('hidden', !has);
  $('reviewList').innerHTML = missed.map(q=>{
    const label = q.t==='r' ? `${q.w} → <b>${q.a}</b>` : q.t==='odd' ? `Odd one out: <b>${q.a}</b>` : `${q.s.replace('___','<b>'+q.a+'</b>')}`;
    return `<li>${label}</li>`;
  }).join('');
}

$('startBtn').onclick = ()=> begin(shuffle(Q));
$('nextBtn').onclick = next;
$('again').onclick = ()=> begin(shuffle(Q));
$('retryMissed').onclick = ()=> begin(shuffle(missed));
</script>
</body>
</html>
