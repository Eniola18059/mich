<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math Practice Quiz</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eaf4ff;color:#1b2a3a;display:flex;justify-content:center;padding:16px}
  .card{background:#fff;width:100%;max-width:560px;border-radius:16px;padding:24px;box-shadow:0 4px 16px rgba(0,0,0,.1)}
  h1{margin:0 0 8px;font-size:26px;color:#1a6fd1}
  p{font-size:18px;line-height:1.4}
  .bar{height:10px;background:#dbe7f5;border-radius:6px;overflow:hidden;margin:8px 0 18px}
  .bar div{height:100%;background:#1a6fd1;width:0;transition:width .3s}
  .count{font-size:15px;color:#5a6b7d}
  .q{font-size:22px;font-weight:bold;line-height:1.35;margin:0 0 18px}
  .opt{display:block;width:100%;text-align:left;font-size:20px;padding:14px 16px;margin:10px 0;border:2px solid #b9cde6;background:#f7fbff;border-radius:12px;cursor:pointer;color:#1b2a3a}
  .opt:hover:not(:disabled){background:#e3f0ff}
  .opt.right{background:#c9f2d3;border-color:#2e9e4f}
  .opt.wrong{background:#ffd5d5;border-color:#d33}
  .msg{font-size:18px;min-height:26px;margin:12px 0 0;font-weight:bold}
  .btn{font-size:20px;padding:12px 28px;margin-top:14px;border:0;border-radius:12px;background:#1a6fd1;color:#fff;cursor:pointer}
  .score{font-size:44px;font-weight:bold;color:#1a6fd1;margin:10px 0}
  .miss{font-size:16px;border-top:1px solid #dbe7f5;padding:8px 0}
  .hide{display:none}
</style>
</head>
<body>
<div class="card">
  <div id="start">
    <h1>Math Practice Quiz</h1>
    <p>50 questions. Tap the answer you think is right. You will see right away if you got it.</p>
    <button class="btn" onclick="begin()">Start</button>
  </div>

  <div id="quiz" class="hide">
    <div class="count" id="count"></div>
    <div class="bar"><div id="fill"></div></div>
    <p class="q" id="question"></p>
    <div id="options"></div>
    <div class="msg" id="msg"></div>
    <button class="btn hide" id="next" onclick="next()">Next</button>
  </div>

  <div id="end" class="hide">
    <h1>All done!</h1>
    <div class="score" id="score"></div>
    <p id="comment"></p>
    <div id="missed"></div>
    <button class="btn" onclick="begin()">Try again</button>
  </div>
</div>

<script>
// Each item: [question, correct answer, [three wrong answers that are common mistakes]]
const Q = [
 // Value of a digit
 ["What is the value of the 7 in 4,732?", "700", ["7","70","7,000"]],
 ["What is the value of the 5 in 5,208?", "5,000", ["500","50","5"]],
 ["What is the value of the 9 in 29,461?", "9,000", ["90,000","900","90"]],
 ["What is the value of the 4 in 1,409,019?", "400,000", ["4,000,000","40,000","4,000"]],
 ["In 86,569,700, what is the value of the 6 in the millions place?", "6,000,000", ["600,000","60,000","60,000,000"]],
 ["What is the value of the 4 in the ten thousands place of 44,000?", "40,000", ["4,000","400,000","400"]],
 ["Which shows the value of the 8 in 8,150?", "8 × 1,000", ["8 × 100","8 × 10,000","8 × 10"]],
 ["Which shows the value of the 2 in 52,300?", "2 × 1,000", ["2 × 10,000","2 × 100","2 × 100,000"]],
 ["Which digit is in the hundreds place of 6,148?", "1", ["6","4","8"]],
 ["Which digit is in the ten thousands place of 73,254?", "7", ["3","2","5"]],

 // How many times greater
 ["In 3,366, the value of the 3 in the thousands place is how many times greater than the value of the 3 in the hundreds place?", "10", ["100","1,000","1"]],
 ["In 5,500, the 5 in the thousands place is how many times greater than the 5 in the hundreds place?", "10", ["100","1","1,000"]],
 ["In 22,000, the 2 in the ten thousands place is how many times greater than the 2 in the thousands place?", "10", ["100","2","1,000"]],
 ["In 4,400, the value of the 4 in the hundreds place is ___ the value of the 4 in the thousands place.", "1/10 of", ["1/100 of","10 times","1/1,000 of"]],
 ["In 44,000, the value of the 4 in the thousands place is ___ the value of the 4 in the ten thousands place.", "1/10 of", ["10 times","1/100 of","100 times"]],
 ["In 770, the value of the 7 in the tens place is ___ the value of the 7 in the hundreds place.", "1/10 of", ["10 times","1/100 of","the same as"]],

 // Decimals
 ["What is the value of the 2 in 7.25?", "0.2", ["0.02","2.0","20"]],
 ["What is the value of the 9 in 32.95?", "0.9", ["0.09","9","90"]],
 ["What is the value of the 2 in 0.12?", "0.02", ["0.2","2","0.002"]],
 ["What is the value of the 3 in 32.95?", "30", ["3","0.3","300"]],
 ["What is the value of the 5 in 7.25?", "0.05", ["0.5","5","0.005"]],
 ["Which number is the least?", "0.021", ["0.12","0.1","0.2"]],
 ["Which number is the greatest?", "7.5", ["7.25","7.052","7.2"]],

 // Comparing and ordering
 ["Which is the greatest number?", "530,267", ["528,159","512,838","512,550"]],
 ["Which is the least number?", "512,550", ["512,838","528,159","530,267"]],
 ["Atlanta 512,550, Mesa 528,159, Fresno 530,267, Sacramento 512,838. Which lists the cities from least to greatest population?", "Atlanta, Sacramento, Mesa, Fresno", ["Sacramento, Atlanta, Mesa, Fresno","Atlanta, Sacramento, Fresno, Mesa","Mesa, Sacramento, Fresno, Atlanta"]],
 ["Egypt 86,569,700, Turkey 76,667,864, Vietnam 89,708,900, Germany 80,716,000, Ethiopia 86,613,986. Which lists the countries from greatest to least population?", "Vietnam, Ethiopia, Egypt, Germany, Turkey", ["Vietnam, Egypt, Ethiopia, Germany, Turkey","Vietnam, Ethiopia, Egypt, Turkey, Germany","Vietnam, Ethiopia, Germany, Egypt, Turkey"]],
 ["Egypt 86,569,700, Turkey 76,667,864, Vietnam 89,708,900, Germany 80,716,000, Ethiopia 86,613,986. Which country has the greatest population?", "Vietnam", ["Ethiopia","Egypt","Germany"]],
 ["Egypt 86,569,700, Turkey 76,667,864, Vietnam 89,708,900, Germany 80,716,000, Ethiopia 86,613,986. Which country has the least population?", "Turkey", ["Germany","Egypt","Ethiopia"]],
 ["Which number is greater than 86,569,700?", "86,613,986", ["86,499,999","86,559,700","85,999,999"]],

 // Multiplication word problems
 ["A truck carries 140 crates. A bigger truck carries 10 times as many. How many crates does the bigger truck carry?", "1,400", ["14,000","150","1,040"]],
 ["A quarry makes 100 tons of gravel each month. How many tons in 12 months?", "1,200", ["120","12,000","10,200"]],
 ["A bakery truck carries 250 boxes. Another truck carries 10 times as many. How many boxes is that?", "2,500", ["260","25,000","2,050"]],
 ["A farm picks 300 mangoes a day. How many mangoes in 10 days?", "3,000", ["30,000","310","300"]],
 ["What is 12 × 100?", "1,200", ["120","12,000","112"]],
 ["Each airline ticket costs $1,042. How much for 4 tickets?", "$4,168", ["$4,208","$4,068","$4,046"]],
 ["What is 5 × 1,230?", "6,150", ["6,050","5,150","6,510"]],
 ["What is 3 × 2,015?", "6,045", ["6,015","6,405","5,045"]],
 ["A school buys 6 boxes with 125 pencils in each box. How many pencils?", "750", ["650","756","7,500"]],
 ["What is 7 × 1,100?", "7,700", ["770","7,100","77,000"]],
 ["What is 8 × 1,500?", "12,000", ["1,200","8,500","120,000"]],

 // Money
 ["Marcus buys a gaming system for $149.99 and 2 controllers for $19.79 each. What is the total cost?", "$189.57", ["$169.78","$319.77","$179.87"]],
 ["A pen costs $2.50. How much do 4 pens cost?", "$10.00", ["$6.50","$100.00","$9.50"]],
 ["Ben buys a bag for $12.45 and a cap for $8.30. What is the total?", "$20.75", ["$21.75","$4.15","$20.15"]],
 ["Lisa has $50.00 and spends $32.60. How much is left?", "$17.40", ["$18.40","$82.60","$17.60"]],
 ["A game costs $24.99. Two batteries cost $3.50 each. What is the total?", "$31.99", ["$28.49","$30.99","$35.49"]],
 ["One notebook costs $1.25. How much do 3 notebooks cost?", "$3.75", ["$3.25","$4.25","$37.50"]],
 ["A family buys 3 tickets at $1,215 each. What is the total?", "$3,645", ["$3,615","$3,045","$3,745"]],

 // Mixed
 ["A library has 44,000 books. The 4 in the ten thousands place is worth ___ times the 4 in the thousands place.", "10", ["100","1,000","4"]],
 ["Which digit is in the ten thousands place of 1,409,019?", "0", ["4","9","1"]]
];

let order = [], i = 0, score = 0, missed = [], answered = false;

function shuffle(a){
  a = a.slice();
  for(let k=a.length-1;k>0;k--){
    const j=Math.floor(Math.random()*(k+1));
    [a[k],a[j]]=[a[j],a[k]];
  }
  return a;
}
function $(id){return document.getElementById(id)}

function begin(){
  i = 0; score = 0; missed = [];
  $("start").classList.add("hide");
  $("end").classList.add("hide");
  $("quiz").classList.remove("hide");
  show();
}

function show(){
  answered = false;
  const [q, right, wrongs] = Q[i];
  $("count").textContent = "Question " + (i+1) + " of " + Q.length;
  $("fill").style.width = (i / Q.length * 100) + "%";
  $("question").textContent = q;
  $("msg").textContent = "";
  $("next").classList.add("hide");
  const box = $("options");
  box.innerHTML = "";
  // Options are shuffled every time, so the right answer is never in a fixed spot
  shuffle([right, ...wrongs]).forEach(text => {
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = text;
    b.onclick = () => pick(b, text);
    box.appendChild(b);
  });
}

function pick(btn, text){
  if(answered) return;
  answered = true;
  const [q, right] = Q[i];
  document.querySelectorAll(".opt").forEach(b => {
    b.disabled = true;
    if(b.textContent === right) b.classList.add("right");
  });
  if(text === right){
    score++;
    $("msg").textContent = "✅ Correct!";
  } else {
    btn.classList.add("wrong");
    $("msg").textContent = "❌ Not quite. The answer is " + right + ".";
    missed.push({q, right, yours: text});
  }
  $("next").textContent = (i === Q.length-1) ? "See my score" : "Next";
  $("next").classList.remove("hide");
}

function next(){
  i++;
  if(i >= Q.length){ finish(); } else { show(); }
}

function finish(){
  $("quiz").classList.add("hide");
  $("end").classList.remove("hide");
  $("score").textContent = score + " / " + Q.length;
  const pct = score / Q.length;
  $("comment").textContent = pct >= .9 ? "Excellent work!" : pct >= .7 ? "Good job! Check the ones you missed." : "Keep practising. Look at the ones you missed and try again.";
  const m = $("missed");
  m.innerHTML = missed.length ? "<p><b>Questions to review:</b></p>" : "";
  missed.forEach(x => {
    const d = document.createElement("div");
    d.className = "miss";
    d.textContent = x.q + " → Correct answer: " + x.right + " (you chose " + x.yours + ")";
    m.appendChild(d);
  });
}
</script>
</body>
</html>
