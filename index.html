<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Michelle's Grade 6 English Quiz — Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF7F0; --card:#FFFFFF; --ink:#2B2420; --muted:#7A6F63; --line:#E3D9C9;
  --plum:#6A3B5A; --plum-ink:#FFFFFF; --gold:#C79A3B; --good:#3E7A4F; --good-bg:#E4F1E4;
  --bad:#B3453D; --bad-bg:#FBE7E3; --shadow:#D9CBB3;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1E1A17; --card:#2A2420; --ink:#F3ECE1; --muted:#B7AA98; --line:#463C33;
    --plum:#C084AC; --plum-ink:#241221; --gold:#E0B85B; --good:#78C68C; --good-bg:#26382B;
    --bad:#E58C84; --bad-bg:#3E2422; --shadow:#141110;
  }
}
:root[data-theme="dark"]{
  --bg:#1E1A17; --card:#2A2420; --ink:#F3ECE1; --muted:#B7AA98; --line:#463C33;
  --plum:#C084AC; --plum-ink:#241221; --gold:#E0B85B; --good:#78C68C; --good-bg:#26382B;
  --bad:#E58C84; --bad-bg:#3E2422; --shadow:#141110;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Karla","Segoe UI",system-ui,sans-serif;
  font-size:17px; line-height:1.5; min-height:100vh;
}
.wrap{max-width:680px; margin:0 auto; padding:20px 16px 48px}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:4px solid var(--gold); outline-offset:3px}
h1,h2,.serif{font-family:"Fraunces","Georgia",serif}

.top{display:flex; justify-content:space-between; align-items:center; gap:12px; font-weight:600; font-size:15px}
.top .score{background:var(--card); border:1px solid var(--line); border-radius:999px; padding:4px 14px}
.track{height:8px; background:var(--card); border:1px solid var(--line); border-radius:999px; margin:10px 0 20px; overflow:hidden}
.fill{height:100%; background:var(--plum); border-radius:999px; transition:width .35s ease}

.card{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:26px 24px; box-shadow:0 5px 0 var(--shadow)}
.chip{display:inline-block; background:var(--gold); color:#2B2420; font-weight:700; font-size:13px; letter-spacing:.02em; padding:3px 13px; border-radius:999px}
.diff{display:inline-block; background:var(--plum); color:#fff; font-weight:700; font-size:12px; letter-spacing:.03em; padding:3px 11px; border-radius:999px; margin-left:6px}
.q{font-family:"Fraunces",serif; font-weight:600; font-size:clamp(20px,4.2vw,26px); line-height:1.3; margin:14px 0 18px}

.passage{background:var(--bg); border:1px solid var(--line); border-left:4px solid var(--plum); border-radius:10px; padding:16px 18px; margin-bottom:18px}
.passage h3{margin:0 0 8px; font-size:18px}
.passage p{margin:0 0 10px; font-size:16px; color:var(--ink)}
.passage p:last-child{margin-bottom:0}

.opts{display:grid; gap:10px}
.opt{
  display:flex; align-items:center; gap:12px; text-align:left;
  background:var(--card); border:2px solid var(--line); border-radius:12px;
  padding:12px 15px; font-size:17px; min-height:52px;
}
.opt:hover:not(:disabled){border-color:var(--plum)}
.key{flex:none; width:28px; height:28px; border-radius:50%; background:var(--bg); border:1px solid var(--line); display:grid; place-items:center; font-size:14px; color:var(--muted); font-weight:700}
.opt:disabled{cursor:default}
.opt.right{background:var(--good-bg); border-color:var(--good)}
.opt.wrong{background:var(--bad-bg); border-color:var(--bad)}
.opt.dim{opacity:.5}
.mark{margin-left:auto; font-size:20px}

.fb{margin-top:16px; border-radius:12px; padding:13px 15px; font-size:16px}
.fb.good{background:var(--good-bg); border:1px solid var(--good)}
.fb.bad{background:var(--bad-bg); border:1px solid var(--bad)}
.fb strong{display:block; font-size:17px; margin-bottom:3px}
.fb span{color:var(--muted)}

.btn{
  display:inline-block; background:var(--plum); color:var(--plum-ink); border:0; border-radius:12px;
  padding:12px 24px; font-size:17px; font-weight:600; box-shadow:0 4px 0 rgba(0,0,0,.18);
}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.ghost{background:var(--card); color:var(--ink); border:2px solid var(--line); box-shadow:0 3px 0 var(--shadow)}
.actions{margin-top:20px; display:flex; gap:12px; flex-wrap:wrap}

h1{font-size:clamp(30px,7.5vw,42px); line-height:1.1; margin:0 0 10px; font-weight:700}
.lead{color:var(--muted); font-size:17px; margin:0 0 18px}
.topics{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 20px; padding:0; list-style:none}
.topics li{background:var(--bg); border:1px solid var(--line); border-radius:999px; padding:3px 13px; font-size:14px; color:var(--muted)}
.toggle{display:flex; align-items:center; gap:10px; margin:0 0 4px; font-size:16px}
.toggle input{width:22px; height:22px; accent-color:var(--plum)}
.big{font-family:"Fraunces",serif; font-size:clamp(52px,14vw,84px); font-weight:700; line-height:1; margin:4px 0}
.big small{font-size:.35em; color:var(--muted); font-weight:500; font-family:"Karla",sans-serif}
.verdict{font-size:20px; font-weight:600; margin:0 0 4px}
h3.section{font-size:19px; margin:26px 0 10px; font-family:"Fraunces",serif}
.bars{display:grid; gap:9px}
.bar{display:grid; grid-template-columns:150px 1fr 50px; gap:10px; align-items:center; font-size:14px}
@media (max-width:480px){ .bar{grid-template-columns:100px 1fr 40px; font-size:13px} }
.bar .bg{height:10px; background:var(--bg); border:1px solid var(--line); border-radius:999px; overflow:hidden}
.bar .bg i{display:block; height:100%; background:var(--good)}
.bar b{text-align:right}
.missed{display:grid; gap:9px}
.miss{background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px 14px; font-size:15px}
.miss b{color:var(--good)}
.miss em{font-style:normal; color:var(--bad)}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>
<main class="wrap" id="app"></main>

<script>
/* ---------- Reading passage (harder: denser vocabulary, figurative language, no easy lookups) ---------- */
const PASSAGE_TITLE = "The Cartographer's Error";
const PASSAGE = [
  "For three generations, the Okafor family had produced the finest maps in the province, each one a small miracle of patience and ink. So when eleven-year-old Dara discovered a discrepancy on her grandfather's most celebrated chart \u2014 a river that curved west on the parchment but, according to every traveller she'd questioned, actually bent east \u2014 she was reluctant to say anything at all. Doubting a map that hung in the guild hall felt uncomfortably close to doubting her grandfather himself.",
  "She spent a fortnight gathering evidence instead of accusations: sketches from merchants who had forded the river, tide tables borrowed from the harbour master, even a faded letter her grandfather had written decades earlier, in which he confessed that the eastern crossing had been \u201cimpassable with mud\u201d during the season he'd surveyed it. Reading between the lines, Dara realised he must have guessed at the river's true course rather than walking it himself.",
  "When she finally laid her findings before the guild, she expected reprimand, not applause. Instead, the eldest cartographer studied her notes for a long moment and admitted that maps were never truths carved in stone \u2014 only the best guesses of whoever held the pen, waiting patiently to be corrected. Dara's revision was pinned beside the original that same afternoon, not to replace her grandfather's legacy, but to extend it.",
  "It was her uncle, watching from the doorway, who put it best: \u201cHumility isn't pretending you might be wrong. It's being willing to find out.\u201d Dara didn't fully understand what he meant until years later, when she caught herself, quill in hand, hesitating over a coastline that didn't look quite right either."
];

/* ---------- Questions (60, harder) ---------- */
const Q = (t, q, a, w, e, p) => ({ t, q, a, w, e, p: !!p });

const QUESTIONS = [
  // Comprehension — inference and interpretation (10)
  Q("Comprehension", "Why was Dara initially reluctant to point out the error on the map?", "Correcting the map felt like questioning her grandfather's authority", ["She was certain the merchants were lying", "She did not understand how maps were made", "She was forbidden from entering the guild hall"], "The passage says doubting the map \u201cfelt uncomfortably close to doubting her grandfather himself.\u201d", true),
  Q("Comprehension", "What can you infer about why the grandfather's original map was wrong?", "He likely guessed at the river's course instead of surveying it firsthand", ["He deliberately drew the river incorrectly", "The river's course had recently changed", "He copied the error from an older map"], "His letter said the crossing was \u201cimpassable with mud,\u201d and Dara \u201crealised he must have guessed... rather than walking it himself.\u201d", true),
  Q("Comprehension", "What kind of evidence did Dara gather, based on the passage?", "Eyewitness accounts, tide records, and a personal letter", ["Only her own observations of the river", "Official guild court testimony", "New surveying equipment readings"], "She collected \u201csketches from merchants,\u201d \u201ctide tables,\u201d and \u201ca faded letter\u201d \u2014 no mention of new equipment or a court process.", true),
  Q("Comprehension", "What does the phrase \u201creading between the lines\u201d suggest about how Dara reached her conclusion?", "She understood something the letter implied, not something it stated directly", ["She misread the letter and reached the wrong conclusion", "The letter directly stated the river's true course", "She ignored the letter entirely"], "\u201cReading between the lines\u201d means inferring meaning beyond the literal words \u2014 the letter never says he guessed; she deduced it.", true),
  Q("Comprehension", "How did Dara's expectation of the guild's reaction differ from what actually happened?", "She expected reprimand, but received acceptance and respect", ["She expected praise, but was punished instead", "She expected indifference, and received exactly that", "She expected the map to be destroyed, but it was preserved unchanged"], "\u201cShe expected reprimand, not applause,\u201d yet the eldest cartographer respected her work and pinned her revision beside the original.", true),
  Q("Comprehension", "What does the eldest cartographer's comment about maps suggest is the guild's underlying attitude toward their own work?", "Their maps are their best current understanding, always open to correction", ["Their maps are considered permanently accurate once published", "Errors in maps should never be publicly acknowledged", "Only senior cartographers are allowed to correct maps"], "He says maps are \u201cnever truths carved in stone \u2014 only the best guesses... waiting patiently to be corrected.\u201d", true),
  Q("Comprehension", "Why was Dara's revision pinned beside the original map rather than replacing it?", "To build on her grandfather's legacy rather than erase it", ["Because the guild could not decide which version was correct", "Because her grandfather demanded both versions be kept", "Because replacing old maps was against guild rules"], "The text explicitly says it was done \u201cnot to replace her grandfather's legacy, but to extend it.\u201d", true),
  Q("Comprehension", "What does the uncle mean by \u201cHumility isn't pretending you might be wrong. It's being willing to find out\u201d?", "True humility means actively investigating the truth, not just claiming uncertainty", ["Humble people should always assume they are wrong", "It is disrespectful to question people who might be wrong", "Only experts are allowed to be humble"], "The uncle contrasts passive self-doubt (\u201cpretending\u201d) with the active effort Dara made (\u201cbeing willing to find out\u201d) through her research.", true),
  Q("Comprehension", "What does the final paragraph, about Dara hesitating over a coastline years later, suggest?", "She had internalised her uncle's lesson and now questions her own work with the same care", ["She had become as overconfident as her grandfather once was", "She regretted correcting her grandfather's map", "She had given up cartography for another profession"], "The closing image mirrors her earlier care and doubt, showing she carries the lesson about willingness to \u201cfind out\u201d into her own work.", true),
  Q("Comprehension", "Which best describes the overall theme of the passage?", "Respecting a legacy can include improving on it, not just preserving it unchanged", ["Younger people are always more accurate than their elders", "Family traditions should never be questioned", "Maps are more reliable than eyewitness accounts"], "Dara's respectful, evidence-based correction \u2014 extending rather than erasing her grandfather's work \u2014 is the passage's central idea.", true),

  // Vocabulary — harder words, nuance, connotation (10)
  Q("Vocabulary", "Which word most nearly means \u201ctenacious\u201d?", "Persistent", ["Careless","Timid","Forgetful"], "\u201cTenacious\u201d describes someone who holds firmly to a course of action; \u201cpersistent\u201d is the closest match."),
  Q("Vocabulary", "Which sentence uses \u201cambiguous\u201d correctly?", "The instructions were ambiguous, so we weren't sure which door to use.", ["The instructions were ambiguous, so we understood them at once.","The room was ambiguous with bright light.","She ran at an ambiguous speed."], "\u201cAmbiguous\u201d means open to more than one interpretation, which matches confusion over which door to use."),
  Q("Vocabulary", "Choose the word closest in meaning to \u201cfutile\u201d.", "Pointless", ["Successful","Dangerous","Expensive"], "\u201cFutile\u201d describes an effort that is incapable of producing a useful result \u2014 essentially pointless."),
  Q("Vocabulary", "Which word best completes the sentence? \u201cHer ___ remarks made it clear she disagreed, even though she never said so directly.\u201d", "Cryptic", ["Blunt","Obvious","Loud"], "\u201cCryptic\u201d means mysterious or indirect in meaning, which fits remarks that imply disagreement without stating it."),
  Q("Vocabulary", "What does \u201cbenevolent\u201d mean?", "Kind and generous", ["Angry and impatient","Confused and lost","Proud and boastful"], "\u201cBenevolent\u201d describes a well-meaning, kindly disposition."),
  Q("Vocabulary", "Which word is closest in meaning to \u201cmeticulous\u201d?", "Careful", ["Careless","Hurried","Lazy"], "\u201cMeticulous\u201d describes extreme carefulness and attention to detail."),
  Q("Vocabulary", "In the sentence \u201cThe committee's decision was final and irrevocable,\u201d what does \u201cirrevocable\u201d mean?", "Unable to be changed or undone", ["Easily reversed", "Still being discussed", "Made by mistake"], "\u201cIrrevocable\u201d means not able to be revoked, altered, or undone."),
  Q("Vocabulary", "Which word means the opposite of \u201cconceal\u201d?", "Reveal", ["Protect","Store","Wrap"], "\u201cConceal\u201d means to hide something; \u201creveal\u201d is its direct opposite."),
  Q("Vocabulary", "\u201cThe explorer's account of the journey was so vivid that readers felt they had travelled with her.\u201d What does \u201cvivid\u201d suggest about the writing?", "It created strong, clear mental images", ["It was confusing and hard to follow", "It was extremely short", "It avoided describing any details"], "\u201cVivid\u201d describes writing or description that is strikingly realistic and detailed, producing clear images in the reader's mind."),
  Q("Vocabulary", "Which word best fits: \u201cDespite the criticism, she remained ___ in her belief that the plan would work.\u201d", "Resolute", ["Indifferent","Uncertain","Apologetic"], "\u201cResolute\u201d means firm and unwavering, matching someone who remains determined despite criticism."),

  // Grammar — more advanced usage (8)
  Q("Grammar", "Which sentence uses \u201cwho\u201d or \u201cwhom\u201d correctly?", "To whom should I address this letter?", ["To who should I address this letter?","Who should I address this letter to whom?","Whom is responsible for this?"], "\u201cWhom\u201d is used as the object of a preposition (\u201cto whom\u201d); \u201cwho\u201d is reserved for the subject of a clause."),
  Q("Grammar", "Which sentence correctly uses the subjunctive mood?", "If I were taller, I could reach the shelf.", ["If I was taller, I could reach the shelf.","If I am taller, I could reach the shelf.","If I be taller, I could reach the shelf."], "The subjunctive mood uses \u201cwere\u201d (not \u201cwas\u201d) for hypothetical or unreal situations, as in \u201cIf I were...\u201d"),
  Q("Grammar", "Choose the correctly punctuated sentence using \u201clie\u201d or \u201clay\u201d.", "I need to lie down for a while.", ["I need to lay down for a while.","I need to lied down for a while.","I need to laying down for a while."], "\u201cLie\u201d means to recline (I lie, I lay, I have lain); \u201clay\u201d means to place something down and needs an object."),
  Q("Grammar", "Which sentence correctly uses a collective noun with subject-verb agreement?", "The jury is deliberating its verdict.", ["The jury are deliberating its verdict.","The jury is deliberating their verdict.","The jury were is deliberating its verdict."], "\u201cJury\u201d is treated as a single unit acting together, so it takes the singular verb \u201cis\u201d and pronoun \u201cits.\u201d"),
  Q("Grammar", "Which sentence is written in the passive voice?", "The bridge was designed by a team of engineers.", ["A team of engineers designed the bridge.","The engineers are designing the bridge.","The team will design a new bridge."], "In passive voice, the subject receives the action rather than performing it \u2014 here, \u201cthe bridge\u201d receives the action \u201cwas designed.\u201d"),
  Q("Grammar", "Which sentence uses \u201cfewer\u201d or \u201cless\u201d correctly?", "There were fewer students in class today.", ["There were less students in class today.","There was fewer students in class today.","There were fewer of student in class today."], "\u201cFewer\u201d is used for countable nouns like \u201cstudents\u201d; \u201cless\u201d is used for uncountable quantities."),
  Q("Grammar", "Which sentence correctly uses a gerund as the subject?", "Swimming every morning improved her stamina.", ["Swim every morning improved her stamina.","To swimming every morning improved her stamina.","Swum every morning improved her stamina."], "A gerund is the \u2013ing form of a verb used as a noun; \u201cSwimming\u201d correctly acts as the sentence's subject."),
  Q("Grammar", "Which sentence correctly matches an indefinite pronoun with its verb?", "Everybody in the class has finished the assignment.", ["Everybody in the class have finished the assignment.","Everybody in the class finish the assignment.","Everybody in the class are finishing the assignment."], "Indefinite pronouns like \u201ceverybody\u201d are singular, so they take singular verbs such as \u201chas.\u201d"),

  // Punctuation — advanced (8)
  Q("Punctuation", "Which sentence correctly uses a semicolon?", "The rain had stopped; the streets still glistened with puddles.", ["The rain had stopped, the streets still glistened with puddles.","The rain had stopped; and the streets still glistened.","The rain; had stopped the streets still glistened."], "A semicolon can join two closely related independent clauses without a conjunction."),
  Q("Punctuation", "Which sentence correctly punctuates a quotation within a quotation?", "She said, \u201cMy teacher told me, \u2018Practice makes progress,\u2019 and I believe her.\u201d", ["She said, \u201cMy teacher told me, \u201cPractice makes progress,\u201d and I believe her.\u201d","She said \u201cMy teacher told me, 'Practice makes progress, and I believe her.\u201d","She said, My teacher told me, \u2018Practice makes progress,\u2019 and I believe her."], "A quotation inside another quotation uses single quotation marks, nested inside the double quotation marks."),
  Q("Punctuation", "Which sentence correctly uses a comma to avoid a comma splice?", "The storm knocked out the power, so we lit candles.", ["The storm knocked out the power, we lit candles.","The storm knocked out the power we lit candles.","The storm, knocked out the power, so we lit candles."], "Joining two independent clauses with only a comma creates a comma splice; adding the conjunction \u201cso\u201d after the comma fixes it."),
  Q("Punctuation", "Which sentence uses parentheses correctly?", "The recipe (which serves six) takes about an hour to prepare.", ["The recipe, (which serves six) takes about an hour to prepare.","The recipe which serves six, takes about (an hour) to prepare.","The recipe (which serves six, takes about an hour) to prepare."], "Parentheses enclose the complete extra information \u2014 \u201cwhich serves six\u201d \u2014 without breaking the rest of the sentence."),
  Q("Punctuation", "Which sentence correctly uses a hyphen in a compound adjective?", "It was a well-known fact among the villagers.", ["It was a well known fact among the villagers.","It was a well-known-fact among the villagers.","It was a well known-fact among the villagers."], "When two words work together as a single adjective before a noun, they are joined with a hyphen: \u201cwell-known.\u201d"),
  Q("Punctuation", "Which sentence correctly uses an em dash?", "The answer \u2014 though no one expected it \u2014 changed everything.", ["The answer, though no one expected it \u2014 changed everything.","The answer \u2014 though no one expected it, changed everything.","The answer though \u2014 no one expected it \u2014 changed everything."], "A pair of em dashes sets off an interrupting phrase, matching the structure at both ends of the inserted idea."),
  Q("Punctuation", "Which sentence uses an apostrophe correctly to show joint possession?", "Maria and Josh's project won first prize.", ["Maria's and Josh's project won first prize.","Marias and Josh's project won first prize.","Maria and Joshs' project won first prize."], "When two people share ownership of one thing, the apostrophe goes only on the last name: \u201cMaria and Josh's.\u201d"),
  Q("Punctuation", "Which sentence is correctly punctuated with an introductory dependent clause?", "Although she was exhausted, she finished the race.", ["Although she was exhausted she finished the race.","Although, she was exhausted, she finished the race.","She finished, the race although she was exhausted."], "A comma follows an introductory dependent clause before the main clause begins."),

  // Figurative language & literary devices (6)
  Q("Figurative language", "\u201cThe city never sleeps.\u201d This is an example of…", "Personification", ["Simile","Onomatopoeia","Hyperbole"], "Giving the city the human trait of sleeping (or not sleeping) is personification."),
  Q("Figurative language", "Which literary device is used in \u201cJumbo shrimp\u201d?", "Oxymoron", ["Simile","Alliteration","Metaphor"], "An oxymoron combines two contradictory terms; \u201cjumbo\u201d (large) and \u201cshrimp\u201d (small) contradict each other."),
  Q("Figurative language", "A story ends with a character who spent years building a fireproof house, only to have it flooded. This outcome is an example of…", "Situational irony", ["Foreshadowing","Simile","Onomatopoeia"], "Situational irony occurs when the actual outcome is the opposite of what was expected \u2014 fireproofing does not protect against flooding."),
  Q("Figurative language", "\u201cHer laughter was a symphony that lifted the whole room.\u201d This sentence is an example of…", "Metaphor", ["Simile","Onomatopoeia","Alliteration"], "This compares laughter directly to a symphony without using \u201clike\u201d or \u201cas,\u201d making it a metaphor."),
  Q("Figurative language", "What is the effect of an idiom such as \u201cit's raining cats and dogs\u201d?", "It expresses an idea in a way that isn't meant to be taken literally", ["It gives exact, literal weather information", "It uses a made-up sound word", "It repeats the same starting letter"], "Idioms carry a figurative meaning that differs from the literal words used."),
  Q("Figurative language", "\u201cThe old clock in the hallway groaned with every tick.\u201d Which two devices work together in this sentence?", "Personification and onomatopoeia", ["Simile and hyperbole","Alliteration and metaphor","Irony and simile"], "\u201cGroaned\u201d gives the clock a human trait (personification), while \u201ctick\u201d imitates a sound (onomatopoeia)."),

  // Sentence structure — advanced (5)
  Q("Sentence structure", "Which sentence is a compound-complex sentence?", "Although it was raining, we went for a walk, and we still had a great time.", ["We went for a walk in the rain.","Although it was raining, we went for a walk.","We went for a walk, and we had a great time."], "A compound-complex sentence has at least two independent clauses and one dependent clause \u2014 here, \u201cAlthough it was raining\u201d (dependent) plus two joined independent clauses."),
  Q("Sentence structure", "Which sentence contains a misplaced modifier?", "Running late for school, the bus pulled away just as Amir arrived.", ["Amir arrived just as the bus, running late, pulled away.","Running late for school, Amir arrived just as the bus pulled away.","The bus pulled away just as Amir, running late for school, arrived."], "As written, the phrase \u201cRunning late for school\u201d appears to describe the bus rather than Amir, which is a misplaced modifier."),
  Q("Sentence structure", "Which sentence corrects a dangling modifier?", "Having finished her homework, Priya turned on the television.", ["Having finished her homework, the television was turned on.","The television was turned on, having finished her homework.","Turning on the television, homework was finished by Priya."], "The modifier \u201cHaving finished her homework\u201d must be followed immediately by the person who finished it \u2014 Priya, not the television."),
  Q("Sentence structure", "Which sentence uses parallel structure correctly?", "She enjoys hiking, swimming, and biking.", ["She enjoys hiking, swimming, and to bike.","She enjoys to hike, swimming, and biking.","She enjoys hiking, to swim, and biking."], "Parallel structure requires items in a list to share the same grammatical form \u2014 here, all three end in \u201c-ing.\u201d"),
  Q("Sentence structure", "Which sentence avoids a run-on by using a subordinating conjunction correctly?", "Because the bridge was closed, traffic backed up for miles.", ["The bridge was closed traffic backed up for miles.","The bridge was closed, traffic backed up for miles.","Traffic backed up for miles, the bridge was closed."], "\u201cBecause\u201d turns the first clause into a dependent clause, correctly linking it to the independent clause that follows the comma."),

  // Spelling — harder words (5)
  Q("Spelling", "Which word is spelled correctly?", "Conscientious", ["Consciencious","Conscienteous","Consciencous"], "\u201cConscientious\u201d follows the pattern of \u201cscience\u201d plus the \u201c-tious\u201d ending."),
  Q("Spelling", "Which word is spelled correctly?", "Rhythm", ["Rythm","Rhythem","Rhithm"], "\u201cRhythm\u201d is often remembered as having no vowels except \u201cy,\u201d spelled r-h-y-t-h-m."),
  Q("Spelling", "Which word is spelled correctly?", "Embarrass", ["Embarass","Emberrass","Embarras"], "\u201cEmbarrass\u201d has a double r and a double s."),
  Q("Spelling", "Which word is spelled correctly?", "Occurrence", ["Occurence","Occurrance","Ocurrence"], "\u201cOccurrence\u201d has a double c and a double r."),
  Q("Spelling", "Which word is spelled correctly?", "Privilege", ["Priviledge","Privelege","Privilage"], "\u201cPrivilege\u201d has no \u201cd\u201d and ends in \u201c-lege,\u201d not \u201c-ledge.\u201d")
];

/* ---------- Helpers ---------- */
const app = document.getElementById("app");
const TOTAL = QUESTIONS.length;
const LETTERS = ["A", "B", "C", "D"];
let order = [], pos = 0, score = 0, log = [], locked = false;

function shuffle(a){
  const b = a.slice();
  for (let i = b.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ---------- Screens ---------- */
function showStart(){
  const topics = [...new Set(QUESTIONS.map(q => q.t))];
  app.innerHTML = `
    <section class="card">
      <h1>Michelle's Grade 6 English Quiz <span class="diff">CHALLENGE</span></h1>
      <p class="lead">${TOTAL} tougher questions, including a denser story and ten inference-based comprehension questions about it. Read closely \u2014 some answers aren't stated directly.</p>
      <ul class="topics">${topics.map(t => `<li>${esc(t)}</li>`).join("")}</ul>
      <label class="toggle"><input type="checkbox" id="mix" checked> Mix up the question order</label>
      <div class="actions"><button class="btn" id="go">Start quiz</button></div>
    </section>`;
  document.getElementById("go").onclick = () => {
    const mix = document.getElementById("mix").checked;
    begin(QUESTIONS.map((_, i) => i), mix);
  };
  document.getElementById("go").focus();
}

function begin(indexes, mix){
  order = mix ? shuffle(indexes) : indexes.slice();
  pos = 0; score = 0; log = [];
  showQuestion();
}

function showQuestion(){
  locked = false;
  const q = QUESTIONS[order[pos]];
  const opts = shuffle([q.a, ...q.w]);
  const pct = (pos / order.length) * 100;
  const passageHTML = q.p ? `
    <div class="passage">
      <h3 class="serif">${esc(PASSAGE_TITLE)}</h3>
      ${PASSAGE.map(p => `<p>${p}</p>`).join("")}
    </div>` : "";
  app.innerHTML = `
    <div class="top"><div>Question ${pos + 1} of ${order.length}</div><div class="score">Score: ${score}</div></div>
    <div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="${order.length}" aria-valuenow="${pos}">
      <div class="fill" style="width:${pct}%"></div>
    </div>
    <section class="card">
      <span class="chip">${esc(q.t)}</span>
      ${passageHTML}
      <h2 class="q">${esc(q.q)}</h2>
      <div class="opts" id="opts">
        ${opts.map((o, i) => `<button class="opt" data-v="${esc(o)}"><span class="key">${LETTERS[i]}</span><span>${esc(o)}</span><span class="mark" aria-hidden="true"></span></button>`).join("")}
      </div>
      <div id="fb" aria-live="polite"></div>
      <div class="actions" id="act"></div>
    </section>`;
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => choose(b, q));
  window.scrollTo({ top: 0 });
}

function choose(btn, q){
  if (locked) return;
  locked = true;
  const picked = btn.dataset.v;
  const ok = picked === q.a;
  if (ok) score++;
  log.push({ i: order[pos], ok, picked });

  document.querySelectorAll(".opt").forEach(b => {
    b.disabled = true;
    const mark = b.querySelector(".mark");
    if (b.dataset.v === q.a){ b.classList.add("right"); mark.textContent = "✓"; }
    else if (b === btn){ b.classList.add("wrong"); mark.textContent = "✗"; }
    else b.classList.add("dim");
  });

  document.getElementById("fb").innerHTML = ok
    ? `<div class="fb good"><strong>Correct!</strong><span>${esc(q.e)}</span></div>`
    : `<div class="fb bad"><strong>Not quite. The answer is ${esc(q.a)}.</strong><span>${esc(q.e)}</span></div>`;

  const last = pos === order.length - 1;
  document.getElementById("act").innerHTML = `<button class="btn" id="next">${last ? "See my results" : "Next question"}</button>`;
  const next = document.getElementById("next");
  next.onclick = () => { if (last) showResults(); else { pos++; showQuestion(); } };
  next.focus();
}

function showResults(){
  const n = order.length;
  const pct = Math.round((score / n) * 100);
  const verdict =
    pct >= 90 ? "Exceptional, Michelle! That's a mastery-level score on a genuinely hard quiz." :
    pct >= 70 ? "Strong work, Michelle! This set was tough, and you handled it well." :
    pct >= 50 ? "Solid effort, Michelle. This challenge set trips up a lot of readers \u2014 review and try again." :
                "This was the hard version, Michelle \u2014 don't worry. Review the explanations below and give it another go.";

  const byTopic = {};
  log.forEach(l => {
    const t = QUESTIONS[l.i].t;
    byTopic[t] = byTopic[t] || { right: 0, total: 0 };
    byTopic[t].total++;
    if (l.ok) byTopic[t].right++;
  });
  const bars = Object.entries(byTopic).map(([t, v]) => {
    const p = Math.round((v.right / v.total) * 100);
    return `<div class="bar"><span>${esc(t)}</span><div class="bg"><i style="width:${p}%"></i></div><b>${v.right}/${v.total}</b></div>`;
  }).join("");

  const missed = log.filter(l => !l.ok);
  const missedHTML = missed.length ? `
    <h3 class="section">Questions to review</h3>
    <div class="missed">
      ${missed.map(l => {
        const q = QUESTIONS[l.i];
        return `<div class="miss">${esc(q.q)}<br>You said <em>${esc(l.picked)}</em>. Answer: <b>${esc(q.a)}</b></div>`;
      }).join("")}
    </div>` : "";

  app.innerHTML = `
    <section class="card">
      <p class="verdict">${verdict}</p>
      <div class="big">${score}<small> / ${n}</small></div>
      <h3 class="section">How Michelle did by topic</h3>
      <div class="bars">${bars}</div>
      ${missedHTML}
      <div class="actions">
        <button class="btn" id="again">Try again</button>
        ${missed.length ? `<button class="btn ghost" id="redo">Practise missed questions</button>` : ""}
      </div>
    </section>`;
  document.getElementById("again").onclick = () => begin(QUESTIONS.map((_, i) => i), true);
  const redo = document.getElementById("redo");
  if (redo) redo.onclick = () => begin(missed.map(l => l.i), true);
  window.scrollTo({ top: 0 });
}

/* Keyboard: press A–D or 1–4 to answer */
document.addEventListener("keydown", e => {
  if (locked || e.ctrlKey || e.metaKey || e.altKey) return;
  const opts = document.querySelectorAll(".opt");
  if (!opts.length) return;
  const k = e.key.toLowerCase();
  let idx = "abcd".indexOf(k);
  if (idx < 0) idx = "1234".indexOf(k);
  if (idx >= 0 && opts[idx]) opts[idx].click();
});

showStart();
</script>
</body>
</html>
